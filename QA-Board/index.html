<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Board</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e2e6eb;
  --accent: #2f6fde; --accent-soft: #e8f0fd; --warn: #c2410c; --warn-soft: #fff1e8;
  --ok: #15803d; --ok-soft: #e9f7ee; --gray-soft: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a; --card: #1b2028; --text: #e6e9ee; --muted: #9aa5b4; --line: #2b323d;
    --accent: #7aa7ff; --accent-soft: #1f2d47; --warn: #ff9a62; --warn-soft: #3a2418;
    --ok: #5fd08a; --ok-soft: #173326; --gray-soft: #262c36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
header h1 { margin: 0 0 4px; font-size: 1.6rem; }
header p { margin: 0; color: var(--muted); font-size: .92rem; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.35rem; }
.stat span { color: var(--muted); font-size: .8rem; }
.controls { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  display: grid; gap: 10px; position: sticky; top: 0; z-index: 2; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row label.lbl { color: var(--muted); font-size: .8rem; min-width: 56px; }
input[type=search], select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; }
input[type=search] { flex: 1; min-width: 0; }
.chip { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
.count { color: var(--muted); font-size: .88rem; margin: 14px 2px 8px; }
.list { display: grid; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.card.closed { opacity: .5; }
.company { color: var(--muted); font-size: .85rem; }
.title { font-weight: 600; color: var(--text); text-decoration: none; }
.title:hover { color: var(--accent); text-decoration: underline; }
.tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: .78rem; padding: 2px 8px; border-radius: 6px; background: var(--gray-soft); color: var(--muted); }
.tag.g-entry { background: var(--ok-soft); color: var(--ok); }
.tag.g-agency { background: var(--accent-soft); color: var(--accent); }
.badge { align-self: start; font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  white-space: nowrap; background: var(--gray-soft); color: var(--muted); }
.badge.soon { background: var(--warn-soft); color: var(--warn); }
.reg { grid-column: 1 / -1; color: var(--muted); font-size: .78rem; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .controls { position: static; }
}
</style>
</head>

<div class="wrap">

  <section class="stats" id="stats"></section>

  <p class="count" id="count"></p>
  <section class="list" id="list"></section>

</div>

  b.onclick = () => { onClick(); b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); render(); };

}

platform.onchange = e => { state.platform = e.target.value; render(); };

    [DATA.filter(d => d.group === "entry").length, "신입·경력무관 (직접 채용)"],
    [open.filter(d => d.deadline && dday(d.deadline) <= 7).length, "7일 안에 마감"],

  document.getElementById("stats").innerHTML =

        <span class="tag">${esc(d.loc)}</span><span class="tag">${esc(d.platform)}</span>
      </div>
      <div class="reg">등록 ${d.registered.slice(5).replace("-", "/")}</div>
    </article>`;
  }).join("") : `<p class="empty">조건에 맞는 공고가 없습니다.</p>`;
}
stats(); render();
</script>
</body>
</html>
