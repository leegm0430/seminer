<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크로우의 만물상 — 행운과 기억을 거래하는 챗봇</title>
<style>
  /* ============================================================
     크로우의 만물상 — 규칙 기반 캐릭터 챗봇
     테마: 밤하늘의 까마귀 상점 (검보라 배경 + 금빛 반짝이 포인트)
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #14101f;        /* 깊은 밤하늘 */
    --bg-panel: #1e1830;       /* 상점 내부 패널 */
    --bg-bubble-bot: #2a2342;  /* 크로우 말풍선 */
    --bg-bubble-user: #b98a2e; /* 손님(사용자) 말풍선 - 금화 색 */
    --gold: #e8b84b;           /* 반짝이는 금색 포인트 */
    --gold-soft: #d9a83f;
    --text-main: #efe9dc;
    --text-dim: #9a90b8;
    --border-soft: #3a3158;
  }

  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, #2b2145 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, #241b3d 0%, transparent 50%),
      var(--bg-deep);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text-main);
  }

  /* ---------- 챗봇 전체 프레임 ---------- */
  .chat-frame {
    width: 100%;
    max-width: 480px;
    height: 92vh;
    max-height: 760px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(232,184,75,.08);
  }

  /* ---------- 헤더 ---------- */
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #241c3e 0%, #1a1430 100%);
    border-bottom: 1px solid var(--border-soft);
  }
  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a3d75, #221a3c 70%);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .crow-svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-info .name {
    font-size: 16px; font-weight: 700; color: var(--gold);
    letter-spacing: .5px;
  }
  .header-info .desc {
    font-size: 11.5px; color: var(--text-dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--gold-soft);
    color: var(--gold-soft);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
  }
  .reset-btn:hover { background: var(--gold-soft); color: #1a1430; }

  /* ---------- 대화 영역 ---------- */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.user { flex-direction: row-reverse; }

  .mini-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a3d75, #221a3c 70%);
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .bubble {
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    word-break: keep-all;
    overflow-wrap: break-word;
    white-space: pre-line;      /* 응답 안의 줄바꿈(\n)을 그대로 표시 */
    animation: pop .25s ease-out;
  }

  /* 타로 카드 결과 전용 말풍선 (금테 카드 느낌) */
  .bubble.tarot {
    border: 1px solid var(--gold);
    box-shadow: 0 0 14px rgba(232,184,75,.18);
  }
  .tarot-title {
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .tarot-src {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-dim);
    font-style: italic;
  }
  .tarot-img {
    display: block;
    width: 150px;
    max-width: 65%;
    margin: 6px auto 10px;
    border-radius: 8px;
    border: 1px solid var(--gold);
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .tarot-img.reversed { transform: rotate(180deg); } /* 역방향이면 카드를 뒤집어 표시 */
  .tarot-lucky {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-soft);
    font-size: 12.5px;
    color: var(--gold-soft);
  }
  .row.bot .bubble {
    background: var(--bg-bubble-bot);
    border: 1px solid var(--border-soft);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--bg-bubble-user);
    color: #221a08;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 타이핑 표시 (··· 애니메이션) */
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- 추천 키워드 칩 ---------- */
  .chips {
    display: flex;
    flex-wrap: nowrap;        /* 한 줄 고정 */
    gap: 4px;
    padding: 8px 8px;         /* 좌우 여백을 줄여 첫 칩(안녕)이 왼쪽에 붙도록 */
    border-top: 1px solid var(--border-soft);
    background: #191330;
    overflow-x: auto;         /* 아주 좁은 화면에서만 스크롤 (평소엔 전부 보임) */
  }
  .chips::-webkit-scrollbar { height: 0; }
  .chip {
    flex: 1 1 auto;           /* 줄 전체를 채우되, 글자가 긴 칩은 그만큼 넓게 */
    text-align: center;
    background: transparent;
    border: 1px solid var(--border-soft);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 5px 2px;
    font-size: 11px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--gold); color: var(--gold); }

  /* ---------- 입력 영역 ---------- */
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 12px 14px 14px;
    background: #191330;
  }
  .chat-input input {
    flex: 1;
    background: var(--bg-bubble-bot);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    transition: border-color .2s;
  }
  .chat-input input::placeholder { color: var(--text-dim); }
  .chat-input input:focus { border-color: var(--gold); }
  .send-btn {
    background: linear-gradient(135deg, var(--gold) 0%, #c4922f 100%);
    color: #221a08;
    border: none;
    border-radius: 999px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  .send-btn:hover { filter: brightness(1.1); }
  .send-btn:active { transform: scale(.95); }
</style>
</head>
<body>

<!-- 크로우 아바타 원본 그림 (한 번만 정의하고 <use>로 재사용)
     콘셉트: 갓을 쓰고 금 고리를 단 까마귀 상인 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="crowBg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a3d75"/>
      <stop offset="100%" stop-color="#221a3c"/>
    </radialGradient>
    <g id="crow-face">
      <!-- 배경 원 -->
      <circle cx="50" cy="50" r="50" fill="url(#crowBg)"/>
      <!-- 가슴: 점박이 흰 배 -->
      <ellipse cx="48" cy="88" rx="27" ry="18" fill="#241d33"/>
      <ellipse cx="48" cy="93" rx="19" ry="12" fill="#cfc6de"/>
      <circle cx="41" cy="89" r="1.7" fill="#241d33"/>
      <circle cx="49" cy="91" r="1.7" fill="#241d33"/>
      <circle cx="57" cy="89" r="1.7" fill="#241d33"/>
      <!-- 머리 -->
      <ellipse cx="50" cy="58" rx="24" ry="21" fill="#17121f"/>
      <ellipse cx="42" cy="50" rx="10" ry="7" fill="#2a2140" opacity="0.55"/>
      <!-- 부리 -->
      <path d="M68 52 Q88 57 91 62 Q84 68 67 66 Q71 59 68 52 Z" fill="#0d0a14"/>
      <path d="M68 52 Q88 57 91 62 L71 60 Z" fill="#2a2140"/>
      <!-- 눈 -->
      <circle cx="60" cy="52" r="6" fill="#f4efe2"/>
      <circle cx="62" cy="53" r="3" fill="#17121f"/>
      <circle cx="63.2" cy="51.3" r="1.1" fill="#ffffff"/>
      <!-- 금 고리 3개 -->
      <g fill="none" stroke="#e8b84b" stroke-width="2.6">
        <circle cx="34" cy="52" r="4.5"/>
        <circle cx="30" cy="62" r="4.5"/>
        <circle cx="34" cy="72" r="4.5"/>
      </g>
      <!-- 갓 (전통 모자) -->
      <path d="M31 36 L37 13 Q50 9 63 13 L69 36 Z" fill="#0b0812" opacity="0.96"/>
      <ellipse cx="50" cy="36" rx="34" ry="7" fill="#0b0812" opacity="0.92"/>
      <ellipse cx="50" cy="36" rx="34" ry="7" fill="none" stroke="#3a3158" stroke-width="1"/>
      <path d="M37 13 Q50 9 63 13" fill="none" stroke="#3a3158" stroke-width="1"/>
    </g>
  </defs>
</svg>

<div class="chat-frame">
  <!-- 헤더: 캐릭터 정보 + 초기화 버튼 -->
  <div class="chat-header">
    <div class="avatar"><svg class="crow-svg" viewBox="0 0 100 100"><use href="#crow-face"/></svg></div>
    <div class="header-info">
      <div class="name">크로우 (Crow) 💎</div>
      <div class="desc">기억과 행운을 거래하는 영리한 까마귀 상인</div>
    </div>
    <button class="reset-btn" onclick="resetChat()">🔄 새 거래</button>
  </div>

  <!-- 대화 영역 -->
  <div class="chat-body" id="chatBody"></div>

  <!-- 추천 키워드 칩: 사용자가 뭘 물어볼 수 있는지 힌트 제공 -->
  <div class="chips" id="chips"></div>

  <!-- 입력 영역 -->
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="크로우에게 말을 걸어보세요…" autocomplete="off">
    <button class="send-btn" onclick="sendMessage()">보내기</button>
  </div>
</div>

<script>
/* ============================================================
   1. 캐릭터 데이터 — 설계표의 내용을 그대로 옮긴 부분
   ============================================================ */

// 첫 인사말 (챗봇을 처음 열었을 때)
const GREETING =
  '까악! 반짝이는 영혼을 가진 손님이 찾아왔군. 난 행운과 기억을 파는 만물상, 크로우라구! 🐦‍⬛ 오늘은 나랑 어떤 반짝이는 거래를 해볼 텐가? 자, 어서 주머니를 열어보라구!';

// 초기화 버튼을 눌렀을 때 (첫 인사와 다른 전용 대사)
const RESET_MESSAGE =
  '까악! 거래 장부를 싹 새로 고쳤군! 📜 자, 처음부터 다시 시작해보자구. 오늘 손님의 운세를 바꿀 반짝이는 대화는 뭐지?';

// 키워드가 하나도 안 걸렸을 때 캐릭터답게 둘러대는 대사 (랜덤 선택)
const FALLBACK_REPLIES = [
  '까악? 방금 그 말은 내 보물창고에도 없는 희귀한 단어인데? 조금 더 알아듣기 쉬운 빛나는 말로 바꿔서 거래해 보자구! 💎',
  '음… 그 정보는 내 행운의 장부에 적혀있지 않군. 손님, 내 까마귀 뇌 용량에도 한계가 있다구! 다른 질문을 던져봐, 까악!',
];

// 키워드 → 응답 규칙표 (위에서부터 순서대로 검사, 먼저 걸리는 규칙이 우선)
const RESPONSES = [
  // ---------- 필수 카테고리 8개 ----------
  {
    category: '인사',
    keywords: ['안녕', 'hi', '하이', '반가워', 'hello', '헬로'],
    reply: '까악! 새로운 단골손님이 오셨군. 여기선 좋은 기억과 행운을 거래한다구. 들어와, 들어와! 🐦‍⬛',
  },
  {
    category: '이름 소개',
    keywords: ['이름', '누구', '네이름', '넌 누구'],
    reply: '내 이름은 크로우! 반짝이는 보물과 비밀을 수집하는 위대한 까마귀 상인이지, 까악! 💎',
  },
  {
    category: '특기/전문분야',
    keywords: ['특기', '잘해', '전문', '능력', '뭐해', '하는 일'],
    reply: '네가 바라는 행운의 길을 찾아내거나, 쓸모없는 나쁜 기억을 대신 먹어 치우는 게 내 전문이라구! 까악!',
  },
  {
    category: '고민 상담 (감정 쓰레기통)',
    keywords: ['고민', '힘들', '속상', '우울', '슬퍼', '지쳤', '망했', '깨졌', '스트레스'],
    // 1턴: 고민을 물어보고 → 다음 입력(고민 내용)에 '쪼아먹기' 응답 (2턴 대화)
    reply: '고민이라… 인간들의 고민은 꽤 묵직한 가치가 있지. 까악, 어떤 고민인지 나한테 털어놔 보라구! 나쁜 기억을 통째로 쪼아 먹는 게 내 전문이니까! 🍀',
    action: 'worry',
  },
  {
    category: '칭찬받았을 때',
    keywords: ['잘한다', '멋져', '최고', '천재', '귀여워', '대단'],
    reply: '까아악! 그런 반짝이는 칭찬을 나한테 주다니, 손님은 역시 안목이 높구냥! 기분이다, 행운의 깃털 하나 주지! 🪶',
  },
  {
    category: '놀림/무례한 말',
    keywords: ['바보', '못생', '저리 가', '멍청', '싫어 너'],
    reply: '까악?! 무례하군! 내 까만 깃털의 광택을 보고도 그런 소리가 나와? 손님, 거래 제한 블랙리스트에 올리기 전에 조심하라구! 😤',
  },
  {
    category: '심심할 때',
    keywords: ['심심', '놀아줘', '할 거 없', '놀자', '재밌는'],
    reply: '심심해? 그렇다면 네 머릿속에 있는 재밌는 기억 하나를 나한테 팔아보는 건 어때? 대가는 톡톡히 주지, 까악! 💰',
  },
  {
    category: '작별 인사',
    keywords: ['잘가', 'bye', '안녕히', '바이', '갈게', '잘 가'],
    reply: '벌써 가려고? 다음엔 더 반짝이는 이야기나 행운의 조각을 들고 오라구, 단골손님! 까악! 👋',
  },

  // ---------- 자유 카테고리 4개 ----------
  {
    category: '좋아하는 것',
    keywords: ['좋아하는', '보물', '반짝이', '취향', '취미'],
    reply: '반지, 동전, 보석, 그리고 손님의 반짝이는 아이디어! 난 빛나는 거라면 사족을 못 쓴다구, 까악! ✨',
  },
  {
    category: '나이',
    keywords: ['나이', '몇 살', '몇살', '언제 태어'],
    reply: '까마귀의 시간은 인간의 시간과 다르게 흐른다구. 대충 손님의 증조할아버지가 어린아이였을 때부터 살아왔지, 까악! ⏳',
  },
  {
    category: '두려운 것/약점',
    keywords: ['무서운', '약점', '싫어하는', '무서워하'],
    reply: '허수아비? 쳇, 그 가짜 인간 녀석들은 영혼이 없어서 거래할 맛이 안 나니까 싫어하는 것뿐이라구! 절대 무서운 게 아냐, 까악! 🌾',
  },
  {
    category: '행운 거래',
    keywords: ['행운', '뽑기', '운세', '점 봐', '오늘 운', '타로'],
    reply: '까악! 운세 거래 성립! 대가는 손님의 비밀 하나로 받아두지. 자, 내 낡은 타로 뭉치에서 운명의 카드를 한 장 뽑아볼 테니 잠깐 기다리라구… 🔮',
    action: 'tarot', // 이 규칙이 걸리면 타로 API 호출로 이어짐
  },

  // ---------- 생활 정보 카테고리 (2차 확장) ----------
  {
    category: '밸런스 게임', // "짜장 vs 짬뽕" — 메뉴 추천보다 먼저 검사해야 함 ("뭐 먹지"가 섞여도 양자택일 우선)
    keywords: ['vs', '아니면', '골라줘', '선택해'],
    reply: '', action: 'balance',
  },
  {
    category: '시간/날짜',
    keywords: ['몇 시', '몇시', '시간', '날짜', '며칠', '요일'],
    reply: '', action: 'time',
  },
  {

function timeReply() {
  const now = new Date();
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const h = now.getHours();
  const band = TIME_BANDS.find((b) => h >= b.from && h < b.to);
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return '까악! 지금은 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' +
    days[now.getDay()] + '요일, ' + ampm + ' ' + h12 + '시 ' + now.getMinutes() + '분이라구! ⏰ ' + band.comment;
}

// 주제가 감지되지 않을 때 쓰는 범용 이유
const BALANCE_REASONS = [
  '내 부리가 그쪽으로 확 끌렸다구. 까마귀의 직감은 금값이야!',
  '장부를 튕겨보니 그쪽이 더 남는 장사군. 난 밑지는 선택은 안 시킨다구!',
  '그쪽이 훨씬 더 반짝여 보인다구. 반짝이는 쪽이 언제나 정답이야!',
  '어젯밤 별자리가 그쪽을 가리키고 있었다구. 이건 운명이야, 까악!',
];

// "A vs B" / "A 아니면 B" 문장에서 선택지 두 개를 추출 (실패 시 null)
function parseBalance(text) {
  const cleaned = text.replace(/[?!.~]/g, '');
  let m = cleaned.match(/(.+?)\s+(?:vs|VS|Vs|vS)\s+(.+)/) || cleaned.match(/(.+?)(?:vs|VS)(.+)/);
  if (!m) m = cleaned.match(/(.+?)\s*아니면\s*(.+)/);
  if (!m) return null;
  // 뒤에 붙는 "중에 뭐가 나아" 같은 질문 꼬리 제거
  const tail = /\s*(중에|중)?\s*(뭐|무엇|어느|어떤|골라|선택|추천|낫|더).*$/;
  const a = m[1].replace(tail, '').trim();
  const b = m[2].replace(tail, '').trim();
  if (!a || !b) return null;
  return [a, b];
}

function balanceReply(text) {
  const pair = parseBalance(text);
  if (!pair) {
    return '까악? 고르는 건 내 전문이지만, "짜장 vs 짬뽕"처럼 저울에 올릴 두 개를 나란히 줘야 감정을 하지! 다시 물어보라구!';
  }
  // 질문 속 키워드로 주제를 감지 → 주제에 맞는 이유 풀 사용
  const topic = BALANCE_TOPICS.find((t) => t.keywords.some((k) => text.includes(k)));
  let choice;
  if (topic && topic.pickPattern) {
    // 주제에 크로우의 확고한 취향이 있으면 그쪽을 선택 (예: 외출파)
    choice = pair.find((p) => topic.pickPattern.test(p)) || pair[Math.floor(Math.random() * 2)];
  } else {
    choice = pair[Math.floor(Math.random() * 2)];
  }
  const pool = topic ? topic.reasons : BALANCE_REASONS;
  const reason = pool[Math.floor(Math.random() * pool.length)];
  return '까악! 고민할 것도 없군. 내 선택은… "' + choice + '"! ⚖️ ' + reason;
}

// 입력 문장에서 지역명 추출 (없으면 null → 크로우가 되물음)
// ① 등록된 지역 키워드(KNOWN_CITIES)가 문장 어디에 있든 인식: "날씨 알려줘 부천" ⭕
// ② 미등록 지역은 "지역명 + 날씨/기온" 패턴으로 추출: "목포 날씨 어때?" ⭕
function parseCity(text) {
  for (const name of Object.keys(KNOWN_CITIES)) {
    if (text.includes(name)) return name;
  }
  const m = text.match(/([가-힣a-zA-Z]+)\s*(?:의)?\s*(?:날씨|기온)/);
  const notCity = ['오늘', '지금', '현재', '요즘', '내일', '모레', '이', '그', '저', '우리'];
  if (m && !notCity.includes(m[1])) return m[1];
  return null;
}

// 주요 도시 좌표 내장 테이블 — API 없이 즉시 응답 (지오코딩 API의 축약 지명 미지원·속도 제한 대비)
const KNOWN_CITIES = {
  '서울': [37.5665, 126.9780], '부산': [35.1796, 129.0756], '인천': [37.4563, 126.7052],
  '대구': [35.8714, 128.6014], '대전': [36.3504, 127.3845], '광주': [35.1595, 126.8526],

  '성남': [37.4200, 127.1265], '창원': [35.2281, 128.6811], '전주': [35.8242, 127.1480],

  '춘천': [37.8813, 127.7298], '강릉': [37.7519, 128.8761], '포항': [36.0190, 129.3435],
  '안산': [37.3219, 126.8309], '안양': [37.3943, 126.9568], '평택': [36.9921, 127.1129],
};

// 지오코딩 1회 조회 (실패는 빈 배열로 흡수)
async function fetchGeo(name) {
  try {
    const r = await fetch(GEO_API + '?name=' + encodeURIComponent(name) + '&count=3&language=ko');
    if (!r.ok) return [];
    return ((await r.json()).results || [])
      .filter((p) => !p.country_code || p.country_code === 'KR');
  } catch (e) {
    return [];
  }
}

// 지오코딩: DB가 정식 행정명만 정확히 찾으므로 ("부천"❌ / "부천시"⭕)
// 접미사 변형을 순차 조회하고, 도시급(인구 5만 이상) 결과가 나오면 조기 종료.
// 간헐적 요청 실패에 대비해 전부 비면 한 번 재시도.
async function geocodeCity(city) {
  // 1단계: 내장 테이블에 있으면 즉시 반환
  const base = city.replace(/(특별|광역)?(시|자치시|자치도|도)$/, '');
  const hit = KNOWN_CITIES[city] || KNOWN_CITIES[base];
  if (hit) return { name: base || city, latitude: hit[0], longitude: hit[1] };

  // 2단계: 지오코딩 API 조회
  const variants = [city + '시', city, city + '광역시', city + '특별시'];
  let found = [];
  for (const v of variants) {
    found = found.concat(await fetchGeo(v));
    found.sort((a, b) => (b.population || 0) - (a.population || 0));
    if (found[0] && (found[0].population || 0) >= 50000) return found[0];
  }
  if (!found.length) {
    for (const v of variants) found = found.concat(await fetchGeo(v));
    found.sort((a, b) => (b.population || 0) - (a.population || 0));
  }
  return found[0] || null;
}

// 날씨 전체 연출: 지역명이 있으면 바로 정찰, 없으면 되물어서 대화를 이어감 (2턴)
function weatherReading(text, introText) {
  const city = parseCity(text);
  if (!city) {
    pendingWeather = true; // 다음 입력을 지역명 답변으로 받음
    botReplyWithTyping('까악! 어느 동네 하늘을 정찰해줄까? 도시 이름을 말해보라구! (예: 서울, 부천, 부산…) 🗺️');
    return;
  }
  botReplyWithTyping(introText);
  runWeather(city, 1500);
}

// 실제 날씨 조회·보고 (city는 확정된 지역명)
function runWeather(city, delay) {
  setTimeout(async () => {
    const row = showTypingBubble();
    try {
      const spot = await geocodeCity(city);
      if (!spot) {
        resolveBubble(row, '까악? "' + city + '"라는 동네는 내 하늘 지도에 없는데? 도시 이름을 다시 확인해보라구!');
        return;
      }
      const res = await fetch(FORECAST_API + '?latitude=' + spot.latitude +
        '&longitude=' + spot.longitude + '&current=temperature_2m,weather_code&timezone=auto');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const wx = await res.json();
      const temp = Math.round(wx.current.temperature_2m);
      const info = describeWeather(wx.current.weather_code);
      resolveBubble(row, '까악! 정찰 보고 도착! 지금 ' + spot.name + ' 하늘은 "' + info.desc +
        '", 기온은 ' + temp + '도라구! 🌡️ ' + info.comment);
    } catch (e) {
      resolveBubble(row, WEATHER_ERROR); // 오프라인/서버 오류에도 캐릭터답게
    }
  }, delay || 600);
}

const chatBody = document.getElementById('chatBody');

// 말풍선 한 개를 대화 영역에 추가
function addBubble(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;

  if (who === 'bot') {
    const av = document.createElement('div');
    av.className = 'mini-avatar';
    av.innerHTML = '<svg class="crow-svg" viewBox="0 0 100 100"><use href="#crow-face"/></svg>';
    row.appendChild(av);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);

  chatBody.appendChild(row);
  chatBody.scrollTop = chatBody.scrollHeight;
  return row;
}

// "크로우가 입력 중…" 말풍선을 띄우고, 나중에 내용으로 교체할 수 있게 row를 돌려줌
function showTypingBubble() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML =
    '<div class="mini-avatar"><svg class="crow-svg" viewBox="0 0 100 100"><use href="#crow-face"/></svg></div>' +
    '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  chatBody.appendChild(row);
  chatBody.scrollTop = chatBody.scrollHeight;
  return row;
}

// 타이핑 말풍선을 실제 내용(문자열 또는 DOM 노드)으로 교체
function resolveBubble(row, content) {
  const bubble = row.querySelector('.bubble');
  bubble.textContent = '';
  if (typeof content === 'string') {
    bubble.textContent = content;
  } else {
    bubble.appendChild(content);
  }
  chatBody.scrollTop = chatBody.scrollHeight;
}

// 타이핑 표시 후 500~900ms 랜덤 지연을 두고 답변 출력 (실제 대화 같은 느낌)
function botReplyWithTyping(text) {
  const row = showTypingBubble();
  setTimeout(() => resolveBubble(row, text), 500 + Math.random() * 400);
}

// 핵심: 입력 문장에서 키워드를 찾아 응답 "규칙"을 매칭 (없으면 null)
function findRule(input) {
  // 대소문자 통일 + 공백 제거 버전도 함께 검사 ("네 이름" / "네이름" 모두 대응)
  const text = input.toLowerCase();
  const textNoSpace = text.replace(/\s+/g, '');

  for (const rule of RESPONSES) {
    for (const kw of rule.keywords) {
      const k = kw.toLowerCase();
      if (text.includes(k) || textNoSpace.includes(k.replace(/\s+/g, ''))) {
        return rule;
      }
    }
  }
  return null;
}

// 규칙의 응답 문자열만 필요할 때 (매칭 실패 시 회피 대사 랜덤)
// reply가 배열이면 매번 랜덤으로 하나를 골라 반복 대화에도 신선함 유지
function findReply(input) {
  const rule = findRule(input);
  if (rule) {
    return Array.isArray(rule.reply)
      ? rule.reply[Math.floor(Math.random() * rule.reply.length)]
      : rule.reply;
  }
  return FALLBACK_REPLIES[Math.floor(Math.random() * FALLBACK_REPLIES.length)];
}

/* ============================================================
   2-2. 타로 운세 기능 (tarotapi.dev 연동)
   흐름: 거래 성립 대사 → 카드 뽑는 연출(타이핑) → API 결과를
   크로우의 한국어 풀이로 변환해 금테 카드 말풍선으로 출력
   ============================================================ */

// API 카드 데이터 → 화면에 보여줄 DOM 노드로 변환
function buildTarotNode(card) {
  const upright = Math.random() < 0.5;          // 정방향/역방향은 뽑을 때 결정
  const dir = upright ? '정방향' : '역방향';

  // 카드 이름: 메이저는 고유 이름, 마이너는 "슈트 + 숫자/코트" 조합
  const koName = card.type === 'major'
    ? (MAJOR_KO[card.name_short] || card.name)
    : SUIT_KO[card.suit] + ' ' + (VALUE_KO[card.value] || card.value);

  // 크로우식 한국어 풀이
  const fortune = card.type === 'major'
    ? MAJOR_FORTUNE[card.name_short][upright ? 'up' : 'rev']
    : SUIT_FORTUNE[card.suit][upright ? 'up' : 'rev'];

  // API가 준 영어 의미의 첫 문장만 발췌 (옛 장부 원문 느낌으로 첨부)
  const meaningEn = (upright ? card.meaning_up : card.meaning_rev).split('.')[0];

  const node = document.createDocumentFragment();

  const title = document.createElement('div');
  title.className = 'tarot-title';
  title.textContent = '🎴 ' + koName + ' (' + card.name + ') — ' + dir;
  node.appendChild(title);

  // 카드 그림: 라이더-웨이트 원본(퍼블릭 도메인). 파일명이 API의 name_short와 일치
  const img = document.createElement('img');
  img.className = 'tarot-img' + (upright ? '' : ' reversed');
  img.src = 'https://www.sacred-texts.com/tarot/pkt/img/' + card.name_short + '.jpg';
  img.alt = koName + ' 카드';
  img.onload = () => { chatBody.scrollTop = chatBody.scrollHeight; }; // 그림 로드 후 스크롤 재조정
  img.onerror = () => img.remove();                                   // 그림만 실패하면 텍스트 운세는 유지
  node.appendChild(img);

  const body = document.createElement('div');
  body.textContent = '까악! 운명이 이 카드를 골랐군. ' + fortune;
  node.appendChild(body);

  const src = document.createElement('div');
  src.className = 'tarot-src';
  src.textContent = '📜 서쪽 대륙의 옛 장부 원문: "' + meaningEn + '"';
  node.appendChild(src);

  // 마지막 문장: 크로우의 오늘의 행운/피해야 할 물건·색깔 추천
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const lucky = document.createElement('div');
  lucky.className = 'tarot-lucky';
  lucky.textContent =
    '🍀 행운의 물건: ' + pick(LUCKY_ITEMS) + ' · 행운의 색깔: ' + pick(LUCKY_COLORS) + '\n' +
    '🚫 피할 물건: ' + pick(AVOID_ITEMS) + ' · 피할 색깔: ' + pick(AVOID_COLORS) + '\n' +
    '내 보물창고 감정 기준이니 틀림없다구, 까악!';
  node.appendChild(lucky);

  return node;
}

// 타로 운세 전체 연출
function tarotReading(introText) {
  // ① 거래 성립 대사
  botReplyWithTyping(introText);

  // ② 잠시 뒤 카드 뽑는 연출 시작 → API 호출
  setTimeout(async () => {
    const row = showTypingBubble();
    const startedAt = Date.now();
    try {
      const res = await fetch(TAROT_API);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const card = data.cards[0];

      // 너무 빨리 결과가 나오면 김이 빠지므로 최소 1.2초는 "뽑는 중" 유지
      const wait = Math.max(0, 1200 - (Date.now() - startedAt));
      setTimeout(() => {
        row.querySelector('.bubble').classList.add('tarot');
        resolveBubble(row, buildTarotNode(card));
      }, wait);
    } catch (e) {
      resolveBubble(row, TAROT_ERROR); // 오프라인/서버 오류에도 캐릭터답게
    }
  }, 1500);
}

// 메시지 전송 처리
function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addBubble(text, 'user');
  userInput.value = '';
  userInput.focus();

  const rule = findRule(text);

  // ── 이어지는 대화(2턴) 처리 ──
  // 고민을 물어본 상태: 다음 입력(다른 규칙에 안 걸리거나 고민 계열이면)을 고민 내용으로 받아 쪼아먹기 응답
  if (pendingWorry && (!rule || rule.action === 'worry')) {
    pendingWorry = false;
    botReplyWithTyping(WORRY_EAT_REPLIES[Math.floor(Math.random() * WORRY_EAT_REPLIES.length)]);
    return;
  }
  // 지역을 물어본 상태: 다음 입력이 다른 규칙에 안 걸리면 지역명 답변으로 간주
  if (pendingWeather && !rule) {
    pendingWeather = false;
    const word = text.match(/[가-힣a-zA-Z]+/);
    runWeather(word ? word[0] : text);
    return;
  }
  // 다른 주제로 넘어가면 대기 상태 해제
  pendingWorry = false;
  pendingWeather = false;

  const action = rule && rule.action;
  if (action === 'tarot') {
    tarotReading(rule.reply);           // 타로 API 연동 흐름
  } else if (action === 'weather') {
    weatherReading(text, rule.reply);   // 날씨 API 연동 흐름 (지역명 추출을 위해 원문 전달)
  } else if (action === 'worry') {
    pendingWorry = true;                // 고민 내용을 기다리는 상태로 전환
    botReplyWithTyping(rule.reply);
  } else if (action === 'time') {
    botReplyWithTyping(timeReply());    // 내부 시계 — API 불필요
  } else if (action === 'menu') {
    botReplyWithTyping(menuReply());
  } else if (action === 'balance') {
    botReplyWithTyping(balanceReply(text)); // A vs B 추출을 위해 원문 전달
  } else {
    botReplyWithTyping(findReply(text));
  }
}

// 초기화: 대화 내역과 대기 상태를 지우고 리셋 전용 인사말 출력
function resetChat() {
  chatBody.innerHTML = '';
  pendingWorry = false;
  pendingWeather = false;
  botReplyWithTyping(RESET_MESSAGE);
}

// 추천 키워드 칩 만들기
function buildChips() {
  SUGGESTED_CHIPS.forEach((label) => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = label;
    btn.onclick = () => {
      userInput.value = label;
      sendMessage();
    };
    chipsEl.appendChild(btn);
  });
}

// Enter 키로도 전송
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

/* ============================================================
   3. 시작: 첫 인사말 출력
   ============================================================ */
buildChips();
addBubble(GREETING, 'bot');
userInput.focus();
</script>
