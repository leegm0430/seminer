 과정에 걸친) 모니터링과제어, 분석, 설계, 구현, 실행, 완료 순으로 제시되며 실제로는 중첩·반복적으로 수행될 수 있다. 나머지 선지는 순서가 뒤바뀌어 있다."},{"id":"new-ch1_2-16-16","chapter":1,"difficulty":"medium","question":"테스트 설계 활동의 대표적인 산출물(테스트웨어)은?","options":["테스트계획서","테스트케이스","테스트완료보고서","테스트진행보고서"],"answer":1,"explanation":"테스트설계 활동에서는 테스트조건을 구체화해 테스트케이스와 테스트데이터를 만든다. 테스트계획서는 계획 활동, 테스트완료보고서는 완료 활동, 테스트진행보고서는 모니터링과제어 활동의 산출물이다."},{"id":"new-ch1_2-17-17","chapter":1,"difficulty":"medium","question":"다음 중 테스트 프로세스에 영향을 미치는 정황(맥락) 요인으로 언급되지 않는 것은?","options":["이해관계자","비즈니스 도메인","기술적 요인","테스터 개인의 취미 활동"],"answer":3,"explanation":"정황 요인에는 이해관계자, 팀원, 비즈니스 도메인, 기술적 요인, 프로젝트 제약, 조직적 요인(및 SDLC·도구)이 포함된다. 테스터 개인의 취미는 실러버스에서 언급되는 정황 요인이 아니다."},{"id":"new-ch1_2-18-18","chapter":1,"difficulty":"medium","question":"요구사항이 변경되었을 때 어떤 테스트케이스를 다시 실행해야 하는지 빠르게 파악할 수 있었던 것은 무엇 덕분인가?","options":["테스트완료 기준","테스트제어","추적성 — 요구사항과 테스트케이스 간 연결을 통한 변경영향 파악","확증편향"],"answer":2,"explanation":"추적성은 테스트베이시스와 테스트웨어 간 연결을 유지해 변경이 미치는 영향을 파악할 수 있게 해준다. 이는 추적성의 핵심 가치 중 하나다."},{"id":"new-ch1_2-19-19","chapter":1,"difficulty":"medium","question":"A는 테스트 전략을 수립하고 자원을 배분하며 진행상황을 모니터링한다. B는 테스트케이스를 설계·실행하고 결함을 기록한다. A와 B는 각각 어떤 역할에 해당하는가?","options":["A = 테스트관리 역할, B = 테스팅 역할","A = 테스팅 역할, B = 테스트관리 역할","둘 다 테스팅 역할이다","둘 다 테스트관리 역할이다"],"answer":0,"explanation":"테스트관리 역할은 프로세스, 팀, 리더십에 대한 책임을 지며(전략·자원·모니터링), 테스팅 역할은 분석·설계·구현·실행이라는 기술적 책임을 진다."},{"id":"new-ch1_2-20-20","chapter":1,"difficulty":"medium","question":"ISTQB가 제시하는 테스터의 핵심 역량에 포함되지 않는 것은?","options":["테스팅 지식","분석적·비판적·창의적 사고","도메인 지식","코딩 경력 10년 이상이라는 경력 요건"],"answer":3,"explanation":"핵심 역량은 테스팅 지식, 철저함·신중함·호기심, 의사소통·팀플레이 능력, 분석적·비판적·창의적 사고, 기술 지식, 도메인 지식이다. 특정 연차의 코딩 경력은 실러버스에서 요구하는 역량이 아니다."},{"id":"new-ch1_2-21-21","chapter":1,"difficulty":"medium","question":"개발자가 자신이 작성한 코드를 테스트하면서 \"이 부분은 당연히 문제 없을 것\"이라고 판단해 관련 테스트케이스를 아예 설계하지 않았다. 이 현상을 설명하는 개념은?","options":["살충제 패러독스","확증편향 — 자신의 기존 신념(코드가 옳다는 믿음)을 뒷받침하는 정보만 취하려는 경향","결함부재궤변","근본원인분석"],"answer":1,"explanation":"확증편향은 자신의 기존 판단이나 신념을 확인시켜주는 방향으로만 행동하는 인지적 편향이다. 저자 본인이 자기 코드를 테스트할 때 특히 강하게 나타날 수 있다."},{"id":"new-ch1_2-22-22","chapter":1,"difficulty":"medium","question":"전체 팀 접근법(Whole team approach)에 대한 설명으로 옳은 것은?","options":["익스트림 프로그래밍(XP)에서 유래했으며, 별도의 테스트팀 없이 모든 팀원이 품질에 대한 책임을 공유한다","반드시 조직 외부의 독립적인 테스터로만 팀을 구성해야 한다는 접근법이다","테스터가 모든 기술적 책임을 단독으로 지는 접근법이다","QA와 테스팅을 완전히 분리하여 운영하는 접근법이다"],"answer":0,"explanation":"전체 팀 접근법은 XP에서 시작되었으며, 개발자를 포함한 모든 팀원이 품질에 책임을 지고 co-location 등을 통해 협업하는 방식이다. 독립적 외부 테스터나 완전한 역할 분리와는 반대되는 개념이다."},{"id":"new-ch1_2-23-23","chapter":1,"difficulty":"hard","question":"결제 시스템에서 장애가 발생했다. 개발자가 원인을 분석해 소스코드 결함을 수정했다. 이후 테스터가 (1) 원래 실패했던 테스트케이스를 재실행해 결함이 실제로 해결됐는지 확인하고, (2) 수정이 정상 동작 중이던 할인 쿠폰 기능에 영향을 주지 않았는지도 점검했다. 다음 중 각 활동과 그 활동이 속하는 범주를 모두 옳게 짝지은 것은?","options":["원인분석·수정 = 디버깅(개발활동), (1) = 확인테스팅, (2) = 리그레션테스팅","원인분석·수정 = 확인테스팅, (1) = 디버깅, (2) = 밸리데이션","(1)과 (2) 모두 디버깅에 해당하며 테스팅 활동이 아니다","원인분석·수정 = 베리피케이션, (1) = 리그레션테스팅, (2) = 확인테스팅"],"answer":0,"explanation":"결함의 원인을 찾아 수정하는 것은 디버깅으로 개발 활동에 속한다. 수정 후 원래 실패했던 케이스를 재실행하는 것은 확인테스팅, 관련 없는 다른 기능에 부정적 영향이 없는지 확인하는 것은 리그레션테스팅이다. B, C, D는 각 용어를 잘못 짝지었다."},{"id":"new-ch1_2-24-24","chapter":1,"difficulty":"hard","question":"팀이 결제 오류(장애)의 근본원인이 \"코드리뷰 체크리스트 누락\"이라는 프로세스상의 결함임을 발견하고, 향후 모든 PR(코드 변경)에 체크리스트를 필수화하는 정책을 도입했다. 이 대응에 대한 가장 정확한 설명은?","options":["결함을 직접 찾아 수정했으므로 테스팅에 해당한다","밸리데이션에 해당하며 QA와는 무관하다","근본원인분석을 바탕으로 프로세스를 개선한 예방적 조치이므로 QA(프로세스지향)에 해당한다","확인테스팅에 해당하며 리그레션테스팅과 동일한 활동이다"],"answer":2,"explanation":"근본원인을 규명한 뒤 향후 유사 결함의 재발을 막기 위해 프로세스(리뷰 체크리스트)를 개선하는 것은 예방적·프로세스지향적 접근으로 QA의 성격을 갖는다. 실제 제품의 결함을 찾아 고치는 교정적 활동인 테스팅과는 구분된다."},{"id":"new-ch1_2-25-25","chapter":1,"difficulty":"hard","question":"다음 세 상황에 해당하는 테스팅 원리를 순서대로 올바르게 짝지은 것은?\n(가) 모바일 앱의 로그인·결제·알림 기능의 모든 조합을 테스트하려면 사실상 무한한 케이스가 필요해, 우선순위를 정해 테스트 범위를 좁혔다.\n(나) 특정 모듈에서 전체 결함의 대부분이 몰려서 발견되었다.\n(다) 요구사항이 모두 충족되었음이 확인되었지만, 실제 사용자는 여전히 불만족스러워했다.","options":["(가) 원리2 (나) 원리4 (다) 원리7","(가) 원리1 (나) 원리5 (다) 원리6","(가) 원리3 (나) 원리2 (다) 원리1","(가) 원리6 (나) 원리7 (다) 원리4"],"answer":0,"explanation":"(가)는 완벽한 테스팅 불가능·리스크기반 우선순위화(원리2), (나)는 결함 집중(원리4), (다)는 결함부재궤변(원리7)에 해당한다. 나머지 선지는 원리를 잘못 대응시켰다."},{"id":"new-ch1_2-26-26","chapter":1,"difficulty":"hard","question":"회귀테스트를 매 스프린트마다 자동화된 스위트로 반복 실행하는 팀이, 실행 비용이 낮다는 이유로 계속 실행하면서도 별도로 탐색적 테스트와 신규 테스트케이스를 정기적으로 추가하고 있다. 이 접근을 살충제 패러독스 관점에서 가장 정확히 설명한 것은?","options":["자동화된 테스트는 살충제 패러독스의 영향을 전혀 받지 않으므로 신규 케이스 추가는 불필요한 낭비다","자동화된 회귀테스트는 낮은 비용으로 반복 실행할 가치가 있어 유지하되, 새로운 유형의 결함을 놓치지 않으려면 테스트케이스를 정기적으로 검토·추가해야 한다","살충제 패러독스는 수동 테스트에만 적용되는 개념이므로 이 상황과는 무관하다","회귀테스트를 자동화하면 테스트케이스를 갱신할 필요가 완전히 사라진다"],"answer":1,"explanation":"동일한 테스트를 반복하면 새로운 결함 발견 효과가 줄어드는 것이 살충제 패러독스이며, 자동화된 회귀테스트는 예외적으로 낮은 비용으로 반복 가능해 유지할 가치가 있지만, 새로운 결함까지 잡으려면 여전히 테스트케이스의 정기적 리뷰·추가가 필요하다."},{"id":"new-ch1_2-27-27","chapter":1,"difficulty":"hard","question":"한 회사가 자사 제품의 인수테스트를 외부 전문 테스트 인증기관에 의뢰했다. 이 기관 소속 테스터가 설계한 테스트가 갖는 독립성 수준과, 그 수준에서 나타날 수 있는 잠재적 단점을 옳게 짝지은 것은?","options":["일정 수준의 독립성 — 협업이 매우 원활해짐","높은 독립성(조직 내 별도 테스트팀) — 병목으로 비난받을 일이 없음","매우 높은 독립성(조직 외부) — 개발팀과의 협업이 어려워지고 맥락 정보 접근이 제한될 수 있음","독립성 없음 — 저자가 직접 테스트하므로 편향 문제가 없음"],"answer":2,"explanation":"조직 외부의 인증기관에 의뢰하는 것은 가장 높은 수준인 매우 높은 독립성에 해당한다. 이 수준은 인지적 편향 차이로 결함 발견에 유리하지만, 협업이 어려워지거나 병목·비난의 대상이 될 수 있다는 단점도 함께 따른다."},{"id":"new-ch1_2-28-28","chapter":1,"difficulty":"hard","question":"개발자 본인이 작성한 코드를 스스로 테스트할 때 확증편향으로 인해 특정 결함을 놓칠 위험이 크다는 점을 팀이 우려하여, 같은 팀 내 다른 개발자에게 테스트 설계를 맡기기로 했다. 이때의 독립성 수준과 기대 효과를 옳게 설명한 것은?","options":["독립성 없음 상태이며, 효과는 기대할 수 없다","일정 수준의 독립성(같은 팀 동료)이며, 저자와는 다른 인지적 편향을 가진 사람이 설계함으로써 추가적인 결함 발견 가능성이 높아진다","매우 높은 독립성이며, 조직 외부 시각을 확보하는 효과가 있다","높은 독립성이며, 반드시 협업 저해라는 부작용이 발생한다"],"answer":1,"explanation":"저자가 아닌 같은 팀의 다른 사람이 테스트를 설계하는 것은 일정 수준의 독립성에 해당한다. 저자와 다른 인지적 편향을 가진 사람이 테스트를 설계함으로써 저자가 놓친 가정이나 결함을 발견할 가능성이 높아진다."},{"id":"new-ch1_2-29-29","chapter":1,"difficulty":"hard","question":"다음 중 테스트 활동과 그 산출물(테스트웨어)의 연결이 모두 옳은 것은?","options":["테스트분석 — 테스트조건 / 테스트설계 — 테스트케이스 / 테스트완료 — 테스트완료보고서","테스트계획 — 테스트케이스 / 테스트실행 — 테스트계획서 / 테스트완료 — 테스트조건","테스트설계 — 테스트진행보고서 / 테스트분석 — 테스트결과 / 테스트실행 — 테스트조건","테스트모니터링과제어 — 테스트케이스 / 테스트구현 — 테스트조건 / 테스트실행 — 테스트계획서"],"answer":0,"explanation":"테스트분석에서는 테스트조건을, 테스트설계에서는 테스트케이스를, 테스트완료에서는 테스트완료(요약)보고서를 산출한다. 나머지 선지는 활동과 산출물이 서로 뒤바뀌어 있다."},{"id":"new-ch1_2-30-30","chapter":1,"difficulty":"hard","question":"규제가 엄격한 금융 도메인 프로젝트에서 감사(audit) 대응을 위해 요구사항–테스트케이스–결함 간 연결을 철저히 관리하기로 했다. 이 결정에 영향을 미친 정황 요인과, 이 결정으로 얻을 수 있는 추적성의 가치를 옳게 짝지은 것은?","options":["정황 요인 = 기술적 요인, 가치 = 커버리지 평가만 가능","정황 요인 = 비즈니스 도메인(규제산업), 가치 = 감사 용이성 확보","정황 요인 = 팀원의 취미, 가치 = 자동화 범위 확대","정황 요인 = 프로젝트 제약, 가치 = 결함 집중 파악"],"answer":1,"explanation":"규제가 엄격한 금융 도메인이라는 특성은 정황 요인 중 비즈니스 도메인에 해당하며, 추적성을 철저히 관리하면 감사 대응이 용이해지는 가치를 얻을 수 있다."},{"id":"new-ch1_2-31-31","chapter":1,"difficulty":"hard","question":"테스트 관리자가 \"이번 릴리즈는 리스크가 높으니 외부 독립 테스트팀에 인수테스트를 맡기자\"고 결정했고, 실제 테스트케이스 설계·실행은 외부팀 테스터들이 수행했다. 각 활동이 속하는 역할과 독립성 수준을 옳게 설명한 것은?","options":["결정 = 테스트관리 역할, 설계·실행 = 테스팅 역할이며 수행 주체는 매우 높은 독립성(조직 외부)을 가진다","결정 = 테스팅 역할, 설계·실행 = 테스트관리 역할이며 독립성 수준은 없음이다","모든 활동이 테스트관리 역할이며 독립성과는 무관하다","모든 활동이 테스팅 역할이며 독립성 수준은 일정 수준이다"],"answer":0,"explanation":"리스크를 판단하고 외부 위탁을 결정하는 것은 테스트관리 역할, 실제 테스트를 설계·실행하는 것은 테스팅 역할이다. 조직 외부의 독립 테스트팀이 수행하므로 독립성 수준은 매우 높음에 해당한다."},{"id":"new-ch1_2-32-32","chapter":1,"difficulty":"hard","question":"한 팀이 명세서에 정의된 모든 기능을 정확히 구현했음을 베리피케이션으로 확인했지만, 밸리데이션 단계에서 실제 사용자가 \"기대와 다르다\"는 피드백을 주었다. 이 상황이 가장 잘 보여주는 원리는?","options":["원리3 — 조기 테스팅이 시간과 비용을 절약한다","원리5 — 살충제 패러독스","원리7 — 결함부재궤변, 명세 충족만으로는 사용자 기대를 만족시키지 못할 수 있다","원리4 — 결함 집중"],"answer":2,"explanation":"베리피케이션(명세 충족)을 통과했더라도 실제 사용자 기대를 충족하지 못할 수 있다는 것이 원리7의 핵심이며, 이는 밸리데이션이 별도로 필요한 이유이기도 하다."},{"id":"new-ch1_2-33-33","chapter":1,"difficulty":"hard","question":"반복적으로 유사한 결함이 여러 릴리즈에서 재발하자, 팀이 근본원인분석을 통해 \"요구사항 검토 프로세스 부재\"를 원인으로 지목하고 리뷰 프로세스를 신설했다. 한편 이번 릴리즈에 이미 존재하는 결함은 테스터가 찾아 수정을 요청했다. 두 활동을 옳게 설명한 것은?","options":["프로세스 신설 = QA(예방적·프로세스지향), 결함 발견·수정요청 = 테스팅(교정적·제품지향)","프로세스 신설 = 테스팅, 결함 발견·수정요청 = QA","두 활동 모두 QA에 해당한다","두 활동 모두 테스팅에 해당하며 QA는 존재하지 않는다"],"answer":0,"explanation":"근본원인분석 결과를 바탕으로 재발 방지를 위한 프로세스를 신설하는 것은 예방적 QA 활동이며, 이미 존재하는 결함을 직접 찾아 수정 요청하는 것은 교정적 테스팅 활동이다."},{"id":"new-ch1_2-34-34","chapter":1,"difficulty":"hard","question":"과거 릴리즈 데이터를 분석해 특정 모듈에 결함이 몰렸던 이력을 참고하여, 이번 스프린트에 그 모듈에 테스트 리소스를 집중 배정했다. 이 접근이 반영하는 두 원리를 옳게 짝지은 것은?","options":["원리1(결함 존재를 밝히는 활동) + 원리3(조기 테스팅)","원리2(완벽한 테스팅은 불가능하므로 리스크기반 우선순위화) + 원리4(결함 집중)","원리5(살충제 패러독스) + 원리6(정황 의존적)","원리7(결함부재궤변) + 원리1"],"answer":1,"explanation":"모든 것을 테스트할 수 없어 우선순위를 정한다는 점은 원리2, 과거 결함이 특정 모듈에 몰렸다는 이력을 활용하는 것은 원리4(결함 집중)와 연결된다. 이 두 원리가 결합되어 리스크기반 테스트 자원 배분의 근거가 된다."},{"id":"new-ch1_2-35-35","chapter":1,"difficulty":"hard","question":"다음 중 유효한 테스트 목적으로만 이루어진 조합은?","options":["리스크 완화, 의사결정에 필요한 정보 제공, 규제 준수 확인","수정되지 않은 모든 결함의 제거를 증명, 밸리데이션, 커버리지 보장","시스템에 결함이 전혀 없음을 증명, 품질에 대한 자신감 획득, 베리피케이션","모든 입력 조합을 검증, 근본원인의 완전한 제거를 증명, 규제 준수 확인"],"answer":0,"explanation":"리스크 완화, 의사결정 정보 제공, 규제 준수는 모두 유효한 테스트 목적이다. B, C, D에는 \"결함이 전혀 없음을 증명\", \"모든 입력 조합 검증\", \"결함 제거를 증명\"과 같이 실현 불가능하거나 유효하지 않은 목적이 섞여 있다."},{"id":"new-ch1_2-36-36","chapter":1,"difficulty":"hard","question":"\"개발자가 결함의 근본원인을 찾아 코드를 수정하는 행위\" 자체는 테스팅 활동에 포함되는가?","options":["포함된다 — 디버깅은 테스트 실행 활동의 일부이기 때문이다","포함되지 않는다 — 디버깅은 개발 활동이며, 수정 후 확인테스팅이 비로소 테스팅 활동에 해당한다","포함된다 — 결함 수정은 테스트완료 활동에 속하기 때문이다","포함되지 않는다 — 디버깅은 QA 활동으로 분류되기 때문이다"],"answer":1,"explanation":"결함의 원인을 찾아 수정하는 디버깅은 개발 활동으로 분류되며 테스팅 활동에 포함되지 않는다. 수정 이후 이를 확인하는 확인테스팅부터가 테스팅 활동이다. QA로 분류하는 D 역시 부정확하다."},{"id":"new-ch1_2-37-37","chapter":1,"difficulty":"hard","question":"다음 설명에 해당하는 테스트 프로세스 활동을 순서대로 짝지은 것은?\n(1) 테스트 목표와 접근법을 정하고 필요한 자원을 산정한다.\n(2) 테스트조건을 식별하기 위해 테스트베이시스를 분석한다.\n(3) 계획 대비 실제 진행상황을 비교하고 필요시 시정조치를 취한다.","options":["(1) 분석 (2) 설계 (3) 실행","(1) 설계 (2) 계획 (3) 구현","(1) 계획 (2) 분석 (3) 모니터링과제어","(1) 구현 (2) 실행 (3) 완료"],"answer":2,"explanation":"목표·접근법 수립과 자원 산정은 테스트계획, 테스트베이시스 분석과 테스트조건 식별은 테스트분석, 진행상황 비교와 시정조치는 테스트모니터링과제어 활동에 해당한다."},{"id":"new-ch1_2-38-38","chapter":1,"difficulty":"hard","question":"스타트업이 애자일 방식으로 전체 팀 접근법을 도입해 별도 테스트팀 없이 개발자가 테스팅 역할도 겸하고 있다. 이 방식을 대규모 규제 산업 프로젝트에도 항상 그대로 적용해야 하는가?","options":["그렇다 — 전체 팀 접근법은 모든 정황에서 동일하게 적용되어야 한다","그렇다 — 독립성은 어떤 프로젝트에서도 불필요하기 때문이다","아니다 — 테스팅은 정황 의존적이므로 규제 수준, 리스크, 도메인 등에 맞춰 접근법(독립성 확보 여부 포함)을 조정해야 한다","아니다 — 전체 팀 접근법은 애자일에서만 정의상 유효하고 다른 어떤 프로젝트에도 적용할 수 없다"],"answer":2,"explanation":"테스팅은 정황 의존적이므로(원리6), 팀 구성이나 독립성 확보 방식도 프로젝트의 리스크·규제 수준·도메인에 따라 달라져야 한다. 특정 접근법을 모든 상황에 무조건 적용하는 것은 부적절하다."},{"id":"new-ch1_2-39-39","chapter":1,"difficulty":"hard","question":"다음 네 가지 상황을 독립성 수준이 낮은 것부터 높은 순으로 올바르게 나열한 것은?\n(가) 작성자 본인이 직접 테스트를 설계한다\n(나) 같은 팀의 다른 동료가 테스트를 설계한다\n(다) 조직 내 별도의 독립 테스트팀이 테스트를 설계한다\n(라) 조직 외부의 인증기관이 테스트를 설계한다","options":["(가) → (나) → (다) → (라)","(라) → (다) → (나) → (가)","(나) → (가) → (라) → (다)","(다) → (나) → (가) → (라)"],"answer":0,"explanation":"독립성 수준은 없음(저자 직접) → 일정 수준(같은 팀 동료) → 높음(조직 내 별도팀) → 매우 높음(조직 외부)의 순서로 증가한다. (가)-(나)-(다)-(라) 순이 이에 정확히 대응한다."},{"id":"new-ch1_2-40-40","chapter":1,"difficulty":"hard","question":"테스트관리자가 경영진에게 \"요구사항 대비 테스트 커버리지가 92%\"라고 보고할 수 있었던 근거와, 이것이 해당하는 추적성의 가치를 옳게 설명한 것은?","options":["근거 = 확증편향 최소화, 가치 = 결함 집중 파악","근거 = 독립성 수준 관리, 가치 = 살충제 패러독스 방지","근거 = 테스트제어 활동, 가치 = 근본원인분석","근거 = 요구사항과 테스트케이스 간 연결(추적성) 관리, 가치 = 커버리지 평가 및 이해관계자와의 소통"],"answer":3,"explanation":"요구사항과 테스트케이스를 연결해 관리하면 테스트베이시스 대비 커버리지를 정량적으로 평가할 수 있고, 이를 경영진 등 이해관계자에게 이해하기 쉽게 전달할 수 있다. 이는 추적성의 대표적 가치다."},{"id":"new-ch1_2-41-41","chapter":1,"difficulty":"hard","question":"원리1(결함 존재를 밝히는 활동)과 원리7(결함부재궤변)의 차이를 가장 정확히 설명한 것은?","options":["두 원리는 사실상 동일한 내용을 다른 말로 표현한 것에 불과하다","원리1은 \"테스트로 결함이 없음을 증명할 수 없다\"는 테스트의 한계를, 원리7은 \"요구사항을 모두 충족해도 사용자 기대를 충족하지 못할 수 있다\"는 밸리데이션의 필요성을 강조한다","원리1은 밸리데이션에 관한 것이고, 원리7은 베리피케이션에 관한 것이다","원리1은 정황 의존성을, 원리7은 결함 집중을 다룬다"],"answer":1,"explanation":"원리1은 테스트 활동 자체의 근본적 한계(결함 없음을 증명 불가)를 말하는 반면, 원리7은 요구사항 충족(베리피케이션 통과)만으로는 사용자의 실제 기대(밸리데이션)를 만족시키지 못할 수 있다는 별개의 관점을 다룬다."},{"id":"new-ch1_2-42-42","chapter":1,"difficulty":"hard","question":"외부 독립 테스트팀 도입 후 결함 발견율은 늘었으나, 개발팀과의 협업이 어려워지고 일정이 지연되면 독립 테스트팀이 비난받는 일이 잦아졌다. 이 상황이 보여주는 독립성의 특성으로 옳은 것은?","options":["독립성은 장점만 있고 단점은 존재하지 않는다","독립성 수준이 낮을수록 이런 문제가 발생한다","독립성은 인지적 편향 차이로 결함 발견에 유리하다는 장점이 있지만, 협업 저해와 병목·비난의 대상이 되는 단점도 함께 따른다","이 현상은 확증편향과 무관하며 살충제 패러독스로만 설명된다"],"answer":2,"explanation":"독립성이 높아질수록 저자와 다른 시각에서 결함을 발견할 가능성은 커지지만, 동시에 협업이 어려워지거나 지연의 책임을 독립 테스트팀이 떠안는 등의 단점도 동반될 수 있다."},{"id":"new-ch1_2-43-43","chapter":1,"difficulty":"hard","question":"개발자가 API 응답시간 제한값을 잘못 계산(사람의 실수)하여 코드에 타임아웃 값이 잘못 설정되었고, 트래픽이 몰리는 특정 시간대에만 응답지연이 실제로 발생했다. 조사 결과 \"산출 공식에 대한 팀의 이해 부족\"이 근본적인 배경으로 밝혀졌다. 이 시나리오에서 오류·결함·장애·근본원인을 모두 옳게 대응시킨 것은?","options":["오류=응답지연, 결함=이해부족, 장애=타임아웃값 오설정, 근본원인=잘못된 계산","오류=제한값을 잘못 계산한 행위, 결함=코드에 남은 잘못된 타임아웃 값, 장애=특정 시간대의 응답지연, 근본원인=산출 공식에 대한 팀의 이해 부족","오류=산출 공식에 대한 이해 부족, 결함=응답지연, 장애=잘못된 계산, 근본원인=타임아웃 값","네 용어는 이 시나리오에서 구분할 수 없다"],"answer":1,"explanation":"사람의 실수(제한값을 잘못 계산)가 오류이고, 그 결과 코드에 남은 잘못된 값이 결함이며, 실행 중 실제로 나타난 응답지연이 장애다. 그리고 그 배경에 있는 \"이해 부족\"이 근본원인분석을 통해 밝혀진 근본원인이다."},{"id":"new-ch1_2-44-44","chapter":2,"difficulty":"medium","question":"다음 중 순차적(sequential) SDLC 모델에 해당하는 것은?","options":["V-모델","스크럼과 같은 반복적·점진적 개발 방식","프로토타이핑","나선형(스파이럴) 모델"],"answer":0,"explanation":"V-모델은 폭포수와 함께 대표적인 순차적 SDLC 모델이다. 스크럼, 프로토타이핑, 나선형 모델은 반복적 또는 점진적 모델에 해당한다."},{"id":"new-ch1_2-45-45","chapter":2,"difficulty":"medium","question":"SDLC가 테스팅에 미치는 영향으로 실러버스에서 언급되지 않는 것은?","options":["테스트 활동의 범위와 시기","테스트 문서의 상세화 정도","테스트 자동화의 범위","테스터 개인의 급여 수준"],"answer":3,"explanation":"SDLC는 테스트 활동의 범위·시기, 문서 상세화, 기법 선택, 자동화 범위, 테스터의 역할에 영향을 미친다. 테스터의 급여 수준은 실러버스에서 언급되는 영향 요인이 아니다."},{"id":"new-ch1_2-46-46","chapter":2,"difficulty":"medium","question":"한 팀이 요구사항 문서가 작성되는 즉시 테스터를 리뷰에 참여시켜 결함을 조기에 찾아낸다. 이는 어떤 좋은 테스팅 프랙티스에 해당하는가?","options":["각 테스트레벨마다 별개의 목표를 설정하는 프랙티스","개발 활동에 상응하는 테스트 활동을 대응시키는 프랙티스","작업산출물이 만들어지는 즉시 테스터가 리뷰에 참여하는 프랙티스","자동화 범위를 확대하는 프랙티스"],"answer":2,"explanation":"실러버스가 제시하는 좋은 테스팅 프랙티스 중 하나는 테스터가 작업산출물이 나오는 즉시 리뷰에 참여하는 것이다."},{"id":"new-ch1_2-47-47","chapter":2,"difficulty":"medium","question":"팀이 \"사용자가 장바구니에 상품을 담으면(Given), 결제 버튼을 누를 때(When), 총액이 계산되어야 한다(Then)\"는 형식으로 자연어 테스트를 작성한다. 이 접근법은?","options":["TDD","BDD","ATDD","리그레션테스팅"],"answer":1,"explanation":"Given/When/Then 형식의 자연어로 원하는 동작을 표현하는 것은 BDD(행위주도개발)의 특징이다. TDD는 테스트를 먼저 작성하고 최소 코드→리팩토링을 반복하는 방식이며, ATDD는 인수조건에서 테스트를 도출하는 방식이다."},{"id":"new-ch1_2-48-48","chapter":2,"difficulty":"medium","question":"DevOps 환경에서 테스팅의 이점으로 언급되지 않는 것은?","options":["빠른 피드백","파이프라인 구축에 별도의 노력이 필요 없다는 점","비기능 특성에 대한 가시성 향상","시프트레프트 실현"],"answer":1,"explanation":"DevOps의 이점으로는 빠른 피드백, 시프트레프트, 안정적 환경, 비기능 가시성, 자동화 등이 언급된다. 반대로 파이프라인 구축과 도구 유지보수가 필요하다는 점은 이점이 아니라 리스크로 언급된다."},{"id":"new-ch1_2-49-49","chapter":2,"difficulty":"medium","question":"코드를 작성하기 전에 인수조건을 기반으로 테스트케이스를 먼저 작성하는 것은 시프트레프트의 어떤 프랙티스에 해당하는가?","options":["코드 작성 전 테스트 작성","명세 리뷰","CI를 통한 자동화된 컴포넌트테스트","정적분석"],"answer":0,"explanation":"코드 작성 전에 테스트를 먼저 작성하는 것은 시프트레프트의 대표적 프랙티스 중 하나이며 ATDD·TDD 등과도 연결된다."},{"id":"new-ch1_2-50-50","chapter":2,"difficulty":"medium","question":"개발자가 결제모듈의 함수 하나를 격리된 환경에서 화이트박스 기법으로 테스트했다. 이는 어떤 테스트레벨에 해당하는가?","options":["시스템테스팅","컴포넌트테스팅","시스템통합테스팅","인수테스팅"],"answer":1,"explanation":"개별 컴포넌트(함수·모듈 단위)를 격리된 환경에서 테스트하는 것은 컴포넌트테스팅(단위테스팅)이며, 흔히 개발자가 화이트박스 기법으로 수행한다."},{"id":"new-ch1_2-51-51","chapter":2,"difficulty":"medium","question":"신제품을 실제 고객사 현장에서, 고객사 담당자가 실제 업무 데이터를 사용해 개발사의 통제 없이 직접 검증했다. 이는 어떤 인수테스팅 유형인가?","options":["알파테스팅","운영인수테스팅","베타테스팅","계약 및 규제 인수테스팅"],"answer":2,"explanation":"베타테스팅은 고객사(또는 잠재고객)의 실제 장소에서 실제 데이터·조건으로, 개발사의 통제 없이 수행된다. 알파테스팅은 개발사 사이트에서 시뮬레이션된 환경에서 이루어진다는 점에서 다르다."},{"id":"new-ch1_2-52-52","chapter":2,"difficulty":"medium","question":"결함 수정 후, 그 결함이 재현되던 테스트케이스만을 다시 실행하여 수정 여부를 확인했다. 이는 무엇에 해당하는가?","options":["리그레션테스팅","시스템통합테스팅","알파테스팅","확인테스팅"],"answer":3,"explanation":"실패했던 테스트케이스를 재실행해 결함이 실제로 해결되었는지 확인하는 것은 확인테스팅이다. 리그레션테스팅은 관련 없는 다른 기능에 부정적 영향이 없는지 확인하는 것으로 이 시나리오와는 다르다."},{"id":"new-ch1_2-53-53","chapter":2,"difficulty":"hard","question":"신용카드 유효성 검증 함수의 모든 분기(branch)를 실행하는지 확인하기 위해, 코드 내부 구조를 분석해 테스트케이스를 설계했다. 이 활동에 해당하는 테스트레벨과 테스트유형을 모두 옳게 짝지은 것은?","options":["테스트레벨 = 컴포넌트테스팅, 테스트유형 = 화이트박스테스팅(구조기반)","테스트레벨 = 시스템테스팅, 테스트유형 = 블랙박스테스팅","테스트레벨 = 인수테스팅, 테스트유형 = 기능테스팅","테스트레벨 = 시스템통합테스팅, 테스트유형 = 비기능테스팅"],"answer":0,"explanation":"개별 함수 단위의 코드 구조(분기 커버리지)를 기반으로 설계하는 것은 컴포넌트테스팅 레벨의 화이트박스(구조기반) 테스팅이다. 명세가 아닌 내부 구조를 근거로 했으므로 블랙박스가 아니다."},{"id":"new-ch1_2-54-54","chapter":2,"difficulty":"hard","question":"다음 네 가지 인수테스팅 활동을 유형과 옳게 짝지은 것은?\n(1) 금융감독 규정 준수 여부를 점검한다\n(2) 실제 업무 사용자 그룹이 업무 적합성을 확인한다\n(3) 운영팀이 백업·복구 절차를 점검한다\n(4) 개발사 사이트에서 잠재고객이 시뮬레이션 환경에서 시연 테스트를 한다","options":["(1) UAT (2) 운영인수 (3) 계약및규제인수 (4) 베타","(1) 알파 (2) 계약및규제인수 (3) UAT (4) 운영인수","(1) 계약및규제인수 (2) UAT (3) 운영인수 (4) 알파","(1) 운영인수 (2) 알파 (3) 베타 (4) UAT"],"answer":2,"explanation":"규정·법규 준수 점검은 계약및규제인수, 실제 사용자의 업무 적합성 확인은 UAT, 백업·복구 등 운영 측면 점검은 운영인수테스팅, 개발사 사이트에서 시뮬레이션 환경에 진행하는 시연은 알파테스팅에 해당한다."},{"id":"new-ch1_2-55-55","chapter":2,"difficulty":"hard","question":"테스터가 로그인 화면의 명세서만 보고(코드는 보지 않고) 응답시간이 2초 이내인지 측정했다. 이 테스트를 기능/비기능, 블랙박스/화이트박스 관점에서 각각 옳게 분류한 것은?","options":["기능테스팅 + 화이트박스테스팅","비기능테스팅(수행효율성) + 블랙박스테스팅(명세기반)","기능테스팅 + 블랙박스테스팅","비기능테스팅 + 화이트박스테스팅"],"answer":1,"explanation":"응답시간과 같은 성능 특성(ISO25010의 수행효율성)을 측정하는 것은 비기능테스팅이며, 코드가 아닌 명세만을 근거로 했으므로 블랙박스(명세기반) 테스팅에 해당한다."},{"id":"new-ch1_2-56-56","chapter":2,"difficulty":"hard","question":"나선형(반복적) 모델로 진행되는 프로젝트에서, 각 반복 주기마다 해당 반복에 맞는 테스트 목표를 별도로 설정해 실행하고 있다. 이는 좋은 테스팅 프랙티스 중 무엇을 반영하며, 순차적 모델과 비교했을 때 테스트 문서화에는 어떤 경향이 예상되는가?","options":["\"각 테스트레벨(반복)마다 별개의 목표를 설정한다\"는 프랙티스를 반영하며, 반복적 모델은 순차적 모델에 비해 문서 상세화가 상대적으로 유동적·경량화되는 경향이 있다","\"결함 집중\" 원리를 반영하며, 문서화는 순차적 모델과 완전히 동일하게 유지된다","\"리스크 완화\" 목적을 반영하며, 문서화는 반드시 더 방대해진다","좋은 테스팅 프랙티스와는 무관하며, SDLC는 문서화 수준에 영향을 주지 않는다"],"answer":0,"explanation":"반복마다 목표를 별도로 설정하는 것은 좋은 테스팅 프랙티스 중 하나이며, SDLC 모델은 문서 상세화 정도에도 영향을 미친다. 반복적 모델은 일반적으로 순차적 모델보다 유동적이고 경량화된 문서화 경향을 보인다."},{"id":"new-ch1_2-57-57","chapter":2,"difficulty":"hard","question":"개발자가 기능 코드를 작성하기 전 실패하는 단위 테스트를 먼저 작성하고, 이후 테스트를 통과할 최소한의 코드를 작성한 뒤 리팩토링한다. 이 방식이 어떤 테스트우선접근법이며, 시프트레프트의 어떤 프랙티스와 직접 연결되는가?","options":["BDD이며, 정적분석 프랙티스와 연결된다","ATDD이며, CI 기반 자동화된 컴포넌트테스트와 연결된다","TDD이며, \"코드 작성 전 테스트 작성\"이라는 시프트레프트 프랙티스와 직접 연결된다","리그레션테스팅이며, 명세 리뷰 프랙티스와 연결된다"],"answer":2,"explanation":"테스트 먼저 작성 → 최소 코드 작성 → 리팩토링의 순환은 TDD의 정의이며, 이는 시프트레프트의 \"코드 작성 전 테스트 작성\" 프랙티스를 직접 실현하는 사례다."},{"id":"new-ch1_2-58-58","chapter":2,"difficulty":"hard","question":"운영 중인 시스템의 데이터베이스를 새 버전으로 마이그레이션하기 전, 팀이 먼저 영향받는 범위를 분석한 뒤 회귀테스트 범위를 정했다. 이 상황에서 유지보수 테스팅의 계기와 선행 활동을 옳게 짝지은 것은?","options":["계기 = 수정(결함 수정), 선행활동 = 근본원인분석","계기 = 운영환경의 업그레이드·마이그레이션, 선행활동 = 영향도분석","계기 = 단종(시스템 폐기), 선행활동 = 데이터 복원테스팅","계기 = 수정, 선행활동 = 확증편향 점검"],"answer":1,"explanation":"운영환경(DB)의 업그레이드·마이그레이션은 유지보수 테스팅의 대표적 계기 중 하나이며, 이런 변경에 앞서 영향받는 범위를 파악하는 영향도분석이 선행되어야 한다."},{"id":"new-ch1_2-59-59","chapter":2,"difficulty":"hard","question":"심각한 보안 취약점이 발견되어 긴급 핫픽스를 당일 배포했다. 배포 후 (1) 해당 취약점이 실제로 막혔는지 재확인하고 (2) 관련 없는 다른 보안 모듈에 영향이 없는지도 점검했다. 이 상황을 옳게 설명한 것은?","options":["계획된 유지보수 릴리즈이며, (1) 리그레션테스팅 (2) 확인테스팅","계획된 유지보수 릴리즈이며, (1)과 (2) 모두 디버깅에 해당","계획안된(비계획) 유지보수 릴리즈이며, (1) 확인테스팅 (2) 리그레션테스팅","유지보수 테스팅에는 해당하지 않으며 일반 시스템테스팅에 불과하다"],"answer":2,"explanation":"긴급 핫픽스는 계획안된(비계획) 유지보수 릴리즈에 해당한다. 수정된 취약점이 실제로 막혔는지 확인하는 것은 확인테스팅, 다른 모듈에 부정적 영향이 없는지 확인하는 것은 리그레션테스팅이다."},{"id":"new-ch1_2-60-60","chapter":2,"difficulty":"hard","question":"오래된 레거시 시스템을 폐기하며 과거 10년치 데이터를 아카이브 스토리지로 이전했다. 이후 감사 대응을 위해 해당 아카이브 데이터를 실제로 복원할 수 있는지 테스트했다. 이는 유지보수 테스팅의 어떤 계기에 해당하며 어떤 성격의 테스트가 수행되었는가?","options":["계기 = 수정, 성격 = 확인테스팅","계기 = 단종(retirement), 성격 = 데이터 보관·복원 테스팅","계기 = 운영환경 업그레이드, 성격 = 리그레션테스팅","계기 = 단종, 성격 = 알파테스팅"],"answer":1,"explanation":"시스템의 단종(retirement)은 유지보수 테스팅의 계기 중 하나이며, 이때는 데이터를 장기간 보관하고 필요시 복원할 수 있는지 확인하는 데이터 보관·복원 테스팅이 수행된다."},{"id":"new-ch1_2-61-61","chapter":2,"difficulty":"hard","question":"한 조직이 CI/CD 파이프라인을 구축해 매 커밋마다 컴포넌트테스트와 정적분석을 자동 실행하고, 인수조건 기반 테스트를 개발 전에 작성하며, 짧은 주기로 배포한다. 이 조직의 관행에 대한 설명으로 옳지 않은 것은?","options":["CI 기반 자동 컴포넌트테스트 실행은 시프트레프트 프랙티스에 해당한다","인수조건에서 테스트를 도출해 개발 전에 작성하는 것은 ATDD 방식이 활용되고 있음을 보여준다","이러한 DevOps 환경은 파이프라인 구축과 도구 유지보수 부담이 전혀 없다는 것이 장점이다","짧은 배포주기와 CI 자동화는 빠른 피드백이라는 DevOps의 이점과 관련이 있다"],"answer":2,"explanation":"DevOps 환경에서 파이프라인 구축과 도구 유지보수는 오히려 부담해야 할 리스크로 언급되며, \"부담이 전혀 없다\"는 설명은 옳지 않다. 나머지 A, B, D는 각각 시프트레프트, ATDD, DevOps의 이점에 대한 올바른 설명이다."},{"id":"new-ch5_6-1-62","chapter":5,"difficulty":"medium","question":"다음 중 '완료조건(Exit Criteria)'에 해당하는 항목으로 가장 적절한 것은?","options":["테스트에 필요한 자원(인력, 환경)이 확보되었는가","테스트 대상 소프트웨어의 초기 품질이 테스트를 시작하기에 충분한가","계획된 커버리지 수준에 도달했고 미해결 결함 수가 합의된 기준 이하인가","테스트웨어(테스트케이스, 테스트데이터)가 준비되었는가"],"answer":2,"explanation":"A, B, D는 모두 테스트를 '시작'하기 위한 조건인 시작조건(Entry Criteria)에 해당한다. C(커버리지 수준, 미해결 결함 수, 결함밀도 등)는 완료조건(Exit Criteria)의 대표적인 요소이다."},{"id":"new-ch5_6-2-63","chapter":5,"difficulty":"medium","question":"다음 사례 중 '제품리스크'로 분류하는 것이 가장 적절한 것은?","options":["외주 개발업체가 계약된 납기를 지키지 못할 가능성이 있다","핵심 테스트 자동화 엔지니어가 이직할 가능성이 있다","소프트웨어가 대량 동시접속 상황에서 응답시간이 기준치를 초과할 가능성이 있다","요구사항 변경으로 일정이 지연될 가능성이 있다"],"answer":2,"explanation":"A, B, D는 조직·인력·일정 등 프로젝트 수행과 관련된 프로젝트리스크이다. C는 소프트웨어 자체의 성능 품질특성과 관련되므로 제품리스크에 해당한다."},{"id":"new-ch5_6-3-64","chapter":5,"difficulty":"medium","question":"테스트피라미드에 대한 설명으로 옳지 않은 것은?","options":["아래층으로 갈수록 테스트 대상의 범위가 작고 격리 수준이 높다","아래층으로 갈수록 실행 속도가 빠르고 테스트 개수가 많다","위층으로 갈수록 테스트 세분화 수준은 낮아지고 실행시간은 길어진다","아래층으로 갈수록 테스트 개수가 줄어들고 실행시간이 길어진다"],"answer":3,"explanation":"테스트피라미드는 아래층(단위테스트 등)으로 갈수록 테스트 개수가 많고 실행시간이 짧으며 세분화 수준이 높다. D는 이를 반대로 설명하고 있어 옳지 않다."},{"id":"new-ch5_6-4-65","chapter":5,"difficulty":"medium","question":"테스팅사분면에서 '기술 지향적이며 팀을 지원하는' Q1 영역에 해당하는 테스트 활동은?","options":["사용성테스트","컴포넌트 및 컴포넌트통합테스트(자동화하여 CI에서 실행)","사용자인수테스트(UAT)","부하 및 성능테스트"],"answer":1,"explanation":"Q1(기술+팀지원)은 컴포넌트/컴포넌트통합테스트처럼 자동화되어 CI 파이프라인에서 실행되는 기술 중심 테스트가 해당된다. A, C는 Q3(비즈니스+제품평가), D는 Q4(기술+제품평가)에 속한다."},{"id":"new-ch5_6-5-66","chapter":5,"difficulty":"medium","question":"스모크테스트와 비기능테스트(성능, 보안 등)가 주로 위치하는 테스팅사분면 영역은?","options":["Q1(기술+팀지원)","Q2(비즈니스+팀지원)","Q3(비즈니스+제품평가)","Q4(기술+제품평가)"],"answer":3,"explanation":"Q4는 기술 지향적이면서 제품을 평가하는 영역으로 스모크테스트, 비기능테스트 등이 해당하며 자동화 비중이 높다."},{"id":"new-ch5_6-6-67","chapter":5,"difficulty":"medium","question":"결함보고서를 작성하는 목적으로 실러버스에서 제시하는 것이 아닌 것은?","options":["발견된 문제에 대해 해결에 필요한 정보를 이해관계자에게 제공한다","제품 품질을 추적하는 수단을 제공한다","프로젝트 예산을 자동으로 재산정한다","프로세스 개선을 위한 아이디어를 제공한다"],"answer":2,"explanation":"결함보고서의 목적은 문제해결정보 제공, 품질추적수단, 프로세스개선 아이디어 제공이며, 예산 자동 재산정은 결함보고서의 목적이 아니다."},{"id":"new-ch5_6-7-68","chapter":5,"difficulty":"medium","question":"다음 중 결함보고서에 일반적으로 포함되는 항목이 아닌 것은?","options":["결함의 심각도(Severity)와 우선순위(Priority)","결함 발견 절차 및 재현에 필요한 정보(로그, 스크린샷 등)","테스터의 개인 성과평가 점수","결함의 고유 식별자"],"answer":2,"explanation":"결함보고서에는 심각도, 우선순위, 재현정보, 고유식별자 등이 포함되나 테스터 개인 성과평가 점수는 포함 항목이 아니다."},{"id":"new-ch5_6-8-69","chapter":5,"difficulty":"medium","question":"결함의 생명주기에서 사용되는 상태(status) 값으로 실러버스에서 언급되지 않는 것은?","options":["확인테스트 대기(Awaiting confirmation test)","재오픈(Reopened)","승인완료(Approved for release)","거부(Rejected)"],"answer":2,"explanation":"실러버스에 제시된 결함 상태에는 신규, 연기, 중복, 수정대기, 확인테스트대기, 재오픈, 완료, 거부가 있으며 '승인완료'는 해당 목록에 없다."},{"id":"new-ch5_6-9-70","chapter":5,"difficulty":"medium","question":"'리스크 식별'과 '리스크 평가' 활동은 리스크관리의 어느 단계에 속하는가?","options":["리스크제어","리스크분석","리스크모니터링","리스크완화"],"answer":1,"explanation":"리스크분석은 리스크식별과 리스크평가로 구성되며, 리스크제어는 리스크완화와 리스크모니터링으로 구성된다."},{"id":"new-ch5_6-10-71","chapter":5,"difficulty":"medium","question":"식별된 리스크에 대해 취해진 조치의 효과를 지속적으로 확인하는 활동은?","options":["리스크식별","리스크평가","리스크완화","리스크모니터링"],"answer":3,"explanation":"리스크모니터링은 리스크제어 조치(완화)의 효과를 확인하는 활동이다."},{"id":"new-ch5_6-11-72","chapter":5,"difficulty":"medium","question":"이미 계획된 테스트에 더해, 아직 다루지 않은 커버리지 항목을 채우기 위해 추가 테스트케이스를 설계하여 우선순위를 정하는 기법은?","options":["리스크기반 우선순위지정","커버리지기반 우선순위지정","요구사항기반 우선순위지정","랜덤 우선순위지정"],"answer":1,"explanation":"커버리지기반 우선순위지정은 목표 커버리지에 도달하기 위해 추가 테스트케이스 작성을 포함하는 기법이다."},{"id":"new-ch5_6-12-73","chapter":5,"difficulty":"medium","question":"애자일 프로젝트에서 사용자스토리가 스프린트 백로그에 포함되기 전에 충족해야 하는 조건들을 정의한 것은?","options":["완료의 정의(Definition of Done)","준비의 정의(Definition of Ready)","테스트완료보고서","테스트계획서"],"answer":1,"explanation":"준비의정의(DoR)는 스토리가 착수되기 위한 조건이며, 완료의정의(DoD)는 작업이 완료되었다고 간주되기 위한 조건이다."},{"id":"new-ch5_6-13-74","chapter":5,"difficulty":"medium","question":"테스트계획서(Test Plan)에 일반적으로 포함되는 내용이 아닌 것은?","options":["정황(context), 가정 및 제약사항","이해관계자 및 의사소통 방법","리스크목록과 테스트접근법","개발자 개인별 코딩 스타일 가이드"],"answer":3,"explanation":"테스트계획서에는 정황, 가정/제약, 이해관계자, 의사소통, 리스크목록, 테스트접근법, 예산·일정 등이 포함되며 코딩 스타일 가이드는 해당하지 않는다."},{"id":"new-ch5_6-14-75","chapter":5,"difficulty":"medium","question":"반복(iteration) 계획 수립 시 테스터가 기여하는 활동으로 가장 적절한 것은?","options":["최종 사용자 교육자료 작성","리스크분석 참여, 노력 추정, 백로그 항목의 테스트가능성 판단","하드웨어 조달 계약 체결","마케팅 전략 수립"],"answer":1,"explanation":"테스터는 릴리스/반복계획 수립 시 리스크분석 참여, 테스트 노력 추정, 테스트가능성 판단 등에 기여한다."},{"id":"new-ch5_6-15-76","chapter":5,"difficulty":"medium","question":"프로젝트의 주요 마일스톤(예: 릴리스 시점)에 테스트 활동을 요약, 평가하고 계획 대비 편차 및 교훈을 정리하여 작성하는 문서는?","options":["테스트진행상황보고서","테스트완료보고서","결함보고서","테스트계획서"],"answer":1,"explanation":"테스트완료보고서는 마일스톤 시점에 작성되며 요약, 평가, 계획 대비 편차, 교훈 등을 포함한다. 테스트진행상황보고서는 정기적으로 작성된다."},{"id":"new-ch5_6-16-77","chapter":5,"difficulty":"medium","question":"다음 중 테스트 모니터링에 사용되는 테스트메트릭의 범주로 실러버스에서 제시하지 않는 것은?","options":["프로젝트 진행상황","제품 품질","팀원 개인 급여","커버리지"],"answer":2,"explanation":"테스트메트릭 범주는 프로젝트진행상황, 테스트진행상황, 제품품질, 결함, 리스크, 커버리지, 비용이며 개인 급여는 해당하지 않는다."},{"id":"new-ch5_6-17-78","chapter":5,"difficulty":"medium","question":"'베이스라인(Baseline)'에 대한 설명으로 가장 적절한 것은?","options":["아무나 임의로 수정할 수 있는 임시 작업본이다","공식적으로 승인된 후에는 정식 변경제어 프로세스를 통해서만 수정할 수 있다","테스트 완료 후 자동으로 삭제된다","리스크수준이 가장 낮은 형상항목만을 의미한다"],"answer":1,"explanation":"베이스라인은 승인 이후 정식 변경제어 프로세스로만 수정 가능하며, 이전 베이스라인으로 복귀 시 테스트 결과가 재현 가능해야 한다."},{"id":"new-ch5_6-18-79","chapter":5,"difficulty":"medium","question":"테스트 진행상황을 전달하는 의사소통 방법으로 실러버스에서 제시하는 것이 아닌 것은?","options":["대화","대시보드","공식 보고서","코드 리팩토링"],"answer":3,"explanation":"의사소통 방법에는 대화, 대시보드, 전자채널, 공식보고서 등이 있으며 코드 리팩토링은 의사소통 방법이 아니다."},{"id":"new-ch5_6-19-80","chapter":5,"difficulty":"medium","question":"여러 전문가가 독립적으로 추정치를 제시한 후, 결과를 논의하고 이를 바탕으로 재추정하는 과정을 반복하는 추정 기법은?","options":["비율기반추정","외삽법","와이드밴드델파이","3점추정"],"answer":2,"explanation":"와이드밴드델파이는 전문가들이 독립적으로 추정한 후 논의와 재추정을 반복하는 기법이며, 애자일에서는 플래닝포커로 변형되어 사용된다."},{"id":"new-ch5_6-20-81","chapter":5,"difficulty":"medium","question":"리스크수준(Risk Level)을 결정하는 두 가지 요소로 옳은 것은?","options":["발생가능성과 발견가능성","발생가능성과 영향","심각도와 우선순위","예산과 일정"],"answer":1,"explanation":"리스크수준은 리스크가 발생할 가능성(likelihood)과 발생했을 때의 영향(impact)의 조합으로 결정된다."},{"id":"new-ch5_6-21-82","chapter":5,"difficulty":"medium","question":"제품리스크분석 결과가 테스트 계획 수립에 미치는 영향으로 가장 적절한 것은?","options":["테스트 범위, 레벨, 기법, 노력, 우선순위를 결정하는 데 활용된다","개발자의 급여를 결정하는 데 활용된다","마케팅 문구를 결정하는 데 활용된다","사무실 좌석 배치를 결정하는 데 활용된다"],"answer":0,"explanation":"제품리스크분석은 SDLC 초기에 시작되어 테스트 범위, 레벨, 기법, 노력, 우선순위 결정에 활용된다."},{"id":"new-ch5_6-22-83","chapter":5,"difficulty":"medium","question":"기능테스트와 인수조건 확인처럼 '비즈니스 지향적이며 팀을 지원하는' 테스트가 위치하는 테스팅사분면 영역은?","options":["Q1","Q2","Q3","Q4"],"answer":1,"explanation":"Q2(비즈니스+팀지원)에는 기능테스트, 인수조건 확인 등이 해당한다."},{"id":"new-ch5_6-23-84","chapter":5,"difficulty":"medium","question":"결함보고서의 '정황(Context)' 항목에 포함되어야 할 정보로 가장 적절한 것은?","options":["결함이 발생한 테스트케이스, 테스트활동, SDLC 단계 등에 대한 정보","테스터의 이전 근무 경력","회사의 연간 매출","경쟁사 제품 정보"],"answer":0,"explanation":"정황 항목에는 결함이 발견된 테스트케이스, 테스트활동, SDLC 단계 등의 정보가 포함된다."},{"id":"new-ch5_6-24-85","chapter":5,"difficulty":"medium","question":"다음 중 테스트 '시작조건(Entry Criteria)'에 해당하는 것으로 가장 적절한 것은?","options":["계획된 테스트 커버리지 수준 달성 여부","테스트에 필요한 자원과 테스트웨어의 가용성, 테스트 대상의 초기 품질","미해결 결함의 개수가 기준치 이하인지 여부","결함 밀도가 목표치에 도달했는지 여부"],"answer":1,"explanation":"A, C, D는 완료조건에 해당하며, B(자원가용성, 테스트웨어가용성, 초기품질)는 시작조건의 대표 요소이다."},{"id":"new-ch5_6-25-86","chapter":5,"difficulty":"hard","question":"어떤 작업에 대해 전문가들이 낙관적 추정치 4M/H, 최빈 추정치 10M/H, 비관적 추정치 16M/H를 제시했다. 3점추정 공식을 사용할 때 최종 추정치(E)는?","options":["8M/H","9M/H","10M/H","11M/H"],"answer":2,"explanation":"E=(a+4m+b)/6=(4+4×10+16)/6=(4+40+16)/6=60/6=10. 검산: 60/6=10, 정확히 나누어떨어짐. 정답 C."},{"id":"new-ch5_6-26-87","chapter":5,"difficulty":"hard","question":"어떤 작업의 3점추정 값이 낙관적 3M/H, 최빈 6M/H, 비관적 15M/H일 때, 이 추정치의 표준편차(SD)는?","options":["1M/H","1.5M/H","2M/H","2.5M/H"],"answer":2,"explanation":"SD=(b-a)/6=(15-3)/6=12/6=2. (참고로 E=(3+24+15)/6=42/6=7이지만 문제는 SD를 묻는다.) 검산: 12/6=2. 정답 C."},{"id":"new-ch5_6-27-88","chapter":5,"difficulty":"hard","question":"어떤 작업에 대해 낙관적 추정치 a=5M/H, 최빈 추정치 m=8M/H이며, 3점추정 공식으로 계산한 최종 추정치가 E=9M/H로 나왔다. 이때 비관적 추정치 b는?","options":["14M/H","15M/H","16M/H","17M/H"],"answer":3,"explanation":"E=(a+4m+b)/6 → 9×6=54=5+32+b → b=54-37=17. 검산: (5+32+17)/6=54/6=9 (E와 일치). 정답 D."},{"id":"new-ch5_6-28-89","chapter":5,"difficulty":"hard","question":"두 작업 X, Y에 대해 3점추정을 수행했다. 작업X: a=2, m=5, b=8. 작업Y: a=1, m=6, b=13. 두 작업 중 추정치의 불확실성(표준편차)이 더 큰 작업은?","options":["작업X","작업Y","두 작업의 표준편차는 같다","주어진 정보로는 판단할 수 없다"],"answer":1,"explanation":"작업X의 SD=(8-2)/6=1, 작업Y의 SD=(13-1)/6=2. Y의 표준편차가 더 크므로 추정 불확실성이 더 크다. 정답 B."},{"id":"new-ch5_6-29-90","chapter":5,"difficulty":"hard","question":"과거 프로젝트들의 데이터를 분석한 결과 개발노력과 테스트노력의 비율은 5:3이었다. 새 프로젝트의 개발노력이 750MD로 추정될 때, 비율기반추정법에 따른 테스트노력은?","options":["350MD","400MD","450MD","500MD"],"answer":2,"explanation":"테스트노력=750×(3/5)=450. 검산: 450:750=3:5로 원 비율과 일치. 정답 C."},{"id":"new-ch5_6-30-91","chapter":5,"difficulty":"hard","question":"과거 프로젝트에서 테스트노력과 개발노력의 비율이 2:7이었다. 새 프로젝트의 테스트노력이 240MD로 추정될 때, 비율기반추정법에 따른 개발노력은?","options":["680MD","720MD","780MD","840MD"],"answer":3,"explanation":"개발노력=240×(7/2)=840. 검산: 240:840=2:7로 원 비율과 일치. 정답 D."},{"id":"new-ch5_6-31-92","chapter":5,"difficulty":"hard","question":"과거 프로젝트 데이터에서 개발:테스트:프로젝트관리 노력의 비율이 6:3:1이었다. 새 프로젝트의 총 예산이 $500,000이고 이 비율을 그대로 적용한다면, 테스트에 배정되는 예산은?","options":["$100,000","$125,000","$150,000","$175,000"],"answer":2,"explanation":"전체 비율의 합은 6+3+1=10. 1비율당 금액=500,000/10=50,000. 테스트=3×50,000=150,000. 검산: 300,000(개발)+150,000(테스트)+50,000(관리)=500,000. 정답 C."},{"id":"new-ch5_6-32-93","chapter":5,"difficulty":"hard","question":"외삽법 공식 E(n)=(3×A(n-1)+A(n-2))/4를 사용한다. 1차 반복의 실제 결함 발견 수 A(1)=8건/일, 2차 반복의 실제 결함 발견 수 A(2)=12건/일일 때, 3차 반복의 추정치 E(3)은?","options":["9건/일","10건/일","11건/일","12건/일"],"answer":2,"explanation":"E(3)=(3×A(2)+A(1))/4=(3×12+8)/4=(36+8)/4=44/4=11. 검산: 44÷4=11, 나누어떨어짐. 정답 C."},{"id":"new-ch5_6-33-94","chapter":5,"difficulty":"hard","question":"동일한 외삽법 공식을 사용한다. 2차 반복 실제값 A(2)=15건/일, 3차 반복 실제값 A(3)=20건/일일 때, 4차 반복 추정치 E(4)는?","options":["17.5건/일","18건/일","18.75건/일","19.5건/일"],"answer":2,"explanation":"E(4)=(3×A(3)+A(2))/4=(3×20+15)/4=(60+15)/4=75/4=18.75. 검산: 18.75×4=75. 정답 C."},{"id":"new-ch5_6-34-95","chapter":5,"difficulty":"hard","question":"동일한 외삽법 공식을 사용하여 계산한 3차 반복 추정치가 E(3)=13건/일이었고, 2차 반복 실제값이 A(2)=14건/일로 확인되었다. 이때 1차 반복 실제값 A(1)은?","options":["8건/일","9건/일","10건/일","11건/일"],"answer":2,"explanation":"E(3)=(3×A(2)+A(1))/4 → 13×4=52=3×14+A(1)=42+A(1) → A(1)=52-42=10. 검산: (3×14+10)/4=(42+10)/4=52/4=13 (E(3)과 일치). 정답 C."},{"id":"new-ch5_6-35-96","chapter":5,"difficulty":"hard","question":"어떤 리스크의 리스크수준이 $5,000으로 평가되었고, 발생가능성이 25%로 추정되었다. 이 리스크가 실제로 발생했을 때 예상되는 영향(비용)은?","options":["$15,000","$18,000","$20,000","$25,000"],"answer":2,"explanation":"리스크수준=발생가능성×영향 → 영향=리스크수준/발생가능성=5,000/0.25=20,000. 검산: 0.25×20,000=5,000. 정답 C."},{"id":"new-ch5_6-36-97","chapter":5,"difficulty":"hard","question":"어떤 리스크의 발생가능성이 30%이고, 발생 시 예상 영향이 $40,000이다. 이 리스크의 리스크수준은?","options":["$10,000","$12,000","$13,000","$14,000"],"answer":1,"explanation":"리스크수준=발생가능성×영향=0.30×40,000=12,000. 검산: 12,000/0.30=40,000 (영향과 일치). 정답 B."},{"id":"new-ch5_6-37-98","chapter":5,"difficulty":"hard","question":"리스크A는 발생가능성 40%, 영향 $10,000이며, 리스크B는 발생가능성 20%, 영향 $25,000이다. 제한된 테스트 리소스로 두 리스크 중 하나를 먼저 다루어야 한다면, 리스크수준이 더 높아 우선적으로 테스트해야 하는 리스크는?","options":["리스크A","리스크B","두 리스크의 수준이 동일하다","주어진 정보로는 판단할 수 없다"],"answer":1,"explanation":"리스크A 수준=0.40×10,000=4,000. 리스크B 수준=0.20×25,000=5,000. 리스크B의 수준이 더 높으므로 우선적으로 테스트되어야 한다. 정답 B."},{"id":"new-ch5_6-38-99","chapter":5,"difficulty":"hard","question":"다음 세 리스크의 발생가능성과 영향이 다음과 같다. 리스크1: 발생가능성 50%, 영향 $8,000. 리스크2: 발생가능성 20%, 영향 $30,000. 리스크3: 발생가능성 70%, 영향 $5,000. 리스크기반테스팅 관점에서 테스트 우선순위를 가장 높게 두어야 할 리스크는?","options":["리스크1","리스크2","리스크3","세 리스크 모두 동일하다"],"answer":1,"explanation":"리스크1 수준=0.5×8,000=4,000. 리스크2 수준=0.2×30,000=6,000. 리스크3 수준=0.7×5,000=3,500. 리스크2의 수준(6,000)이 가장 높으므로 우선순위가 가장 높다. 정답 B."},{"id":"new-ch5_6-39-100","chapter":5,"difficulty":"hard","question":"다음 세 리스크의 리스크수준을 계산하여 높은 순서대로 나열하시오. 리스크1: 발생가능성 60%, 영향 $6,000. 리스크2: 발생가능성 35%, 영향 $12,000. 리스크3: 발생가능성 15%, 영향 $40,000.","options":["리스크1 > 리스크2 > 리스크3","리스크2 > 리스크1 > 리스크3","리스크3 > 리스크2 > 리스크1","리스크3 > 리스크1 > 리스크2"],"answer":2,"explanation":"리스크1=0.6×6,000=3,600. 리스크2=0.35×12,000=4,200. 리스크3=0.15×40,000=6,000. 내림차순: 리스크3(6,000)>리스크2(4,200)>리스크1(3,600). 정답 C."},{"id":"new-ch5_6-40-101","chapter":5,"difficulty":"hard","question":"프로젝트 진행 중 핵심 개발자가 퇴사할 가능성이 있는 리스크가 식별되어, 프로젝트관리자가 미리 백업 인력을 교육시키는 조치를 실행하였다. 이 조치는 리스크제어의 어느 활동에 해당하는가?","options":["리스크식별","리스크평가","리스크완화","리스크모니터링"],"answer":2,"explanation":"리스크완화는 식별된 리스크에 대응하기 위해 실제 조치를 실행하는 활동이며, 이후 그 효과를 확인하는 것이 리스크모니터링이다. 백업 인력 교육은 완화 조치이므로 정답 C."},{"id":"new-ch5_6-41-102","chapter":5,"difficulty":"hard","question":"테스터가 다음과 같이 결함보고서를 작성했다: 고유식별자, 제목, 작성일/작성자, 테스트환경, 기대결과와 실제결과, 심각도, 우선순위, 상태를 기록했으나 \"로그인이 실패했다\"라고만 적고 재현 절차나 로그, 스크린샷은 첨부하지 않았다. 이 결함보고서에서 누락된 필수 항목은?","options":["우선순위","발견 절차 및 재현에 필요한 정보(재현 스텝, 로그 등)","참조사항","상태"],"answer":1,"explanation":"시나리오에서 우선순위, 상태 등은 이미 기록되어 있으나, 재현 절차 및 재현정보(스텝, 로그, 스크린샷)가 누락되었다. 정답 B."},{"id":"new-ch5_6-42-103","chapter":5,"difficulty":"hard","question":"어떤 회사가 신규 기능에 대해 다음 테스트를 계획했다: (1)CI 파이프라인에서 자동화된 컴포넌트테스트, (2)실사용자 대상 사용성테스트, (3)인수기준 확인을 위한 기능테스트, (4)부하 및 성능테스트. 이 중 테스팅사분면의 Q3(비즈니스 주도+제품평가) 영역에 해당하는 것은?","options":["(1)","(2)","(3)","(4)"],"answer":1,"explanation":"Q3(비즈니스+제품평가)에는 탐색적테스트, 사용성테스트, UAT 등이 해당한다. (1)은 Q1, (3)은 Q2, (4)는 Q4에 해당한다. 정답 B."},{"id":"new-ch5_6-43-104","chapter":5,"difficulty":"hard","question":"테스트 환경 서버가 아직 준비되지 않았고 테스트 데이터도 없는 상태에서 계획된 테스트 시작일이 도래했다. 테스트팀이 취해야 할 가장 적절한 대응은?","options":["시작조건을 무시하고 즉시 테스트를 실행한다","이해관계자와 논의하여 시작조건이 충족될 때까지 테스트 시작을 보류하거나 관련 사항을 에스컬레이션한다","완료조건을 낮춰서 문제를 해결한다","리스크분석을 처음부터 다시 수행한다"],"answer":1,"explanation":"시작조건(자원가용성, 테스트웨어가용성 등)이 충족되지 않았다면, 이를 이해관계자와 논의하고 필요시 에스컬레이션하는 것이 테스트제어의 적절한 대응이다. 정답 B."},{"id":"new-ch5_6-44-105","chapter":5,"difficulty":"hard","question":"결함이 재현되지 않아 조사한 결과, 테스터가 승인된 베이스라인이 아닌 최신 미승인 코드로 테스트를 수행했음이 밝혀졌다. 이 문제와 가장 관련 있는 형상관리 원칙은?","options":["베이스라인은 공식 변경제어 프로세스로만 수정되어야 하며, 이전 버전으로 복귀 시 테스트 결과가 재현 가능해야 한다","결함보고서에는 참조사항이 포함되어야 한다","테스트계획서에는 의사소통 방법이 명시되어야 한다","리스크수준은 발생가능성과 영향으로 결정된다"],"answer":0,"explanation":"형상관리에서는 승인된 베이스라인만을 기준으로 테스트를 수행해야 결과의 재현성이 보장된다. 미승인 코드 사용은 이 원칙을 위반한 사례이다. 정답 A."},{"id":"new-ch5_6-45-106","chapter":5,"difficulty":"hard","question":"팀이 요구사항 명세서에 명시된 우선순위(고/중/저)에 따라 테스트케이스 실행 순서를 정했다. 이는 어떤 우선순위지정 기법에 해당하는가?","options":["리스크기반 우선순위지정","커버리지기반 우선순위지정","요구사항기반 우선순위지정","랜덤 우선순위지정"],"answer":2,"explanation":"요구사항 자체에 명시된 우선순위를 그대로 테스트 실행 순서에 반영하는 것은 요구사항기반 우선순위지정에 해당한다. 정답 C."},{"id":"new-ch5_6-46-107","chapter":5,"difficulty":"hard","question":"팀이 사용자스토리를 스프린트 백로그에 포함시키기 전에 \"명확한 인수기준이 정의되어 있는가\"를 체크리스트로 확인하였다. 이는 무엇에 해당하는가?","options":["완료의정의(Definition of Done)","준비의정의(Definition of Ready)","테스트완료보고서","형상 베이스라인"],"answer":1,"explanation":"스토리를 스프린트에 착수하기 전 충족해야 할 조건을 확인하는 것은 준비의정의(DoR)에 해당한다. 정답 B."},{"id":"new-ch5_6-47-108","chapter":5,"difficulty":"hard","question":"반복적인 테스트 모니터링 결과, 결함밀도가 계획 대비 급격히 증가하는 추세가 관찰되었다. 이때 테스트관리자가 취해야 할 조치로 가장 적절한 테스트제어(Test Control) 활동은?","options":["테스트 우선순위를 재조정하고 추가 리소스 투입 등 대응조치를 결정한다","즉시 프로젝트를 종료한다","결함보고서 양식을 변경한다","형상관리 도구를 교체한다"],"answer":0,"explanation":"테스트제어는 모니터링 결과를 바탕으로 우선순위 재조정, 자원 재배분 등 대응 지침을 제공하는 활동이다. B, C, D는 상황에 맞는 적절한 대응이 아니다. 정답 A."},{"id":"new-ch5_6-48-109","chapter":6,"difficulty":"medium","question":"다음 중 '정적테스팅도구'의 주요 목적으로 가장 적절한 것은?","options":["요구사항, 테스트케이스, 결함, 형상관리를 통합적으로 지원한다","코드를 실행하지 않고 리뷰 및 정적분석을 지원하여 결함을 찾는다","테스트 실행 결과와 커버리지를 측정한다","CI/CD 파이프라인의 배포 과정을 관리한다"],"answer":1,"explanation":"정적테스팅도구는 코드를 실행하지 않고 리뷰나 정적분석을 통해 결함을 찾는 것을 지원한다. A는 테스트관리도구, C는 테스트실행 및 커버리지도구, D는 데브옵스도구에 대한 설명이다. 정답 B."},{"id":"new-ch5_6-49-110","chapter":6,"difficulty":"medium","question":"가상머신과 컨테이너를 활용하여 테스트 환경을 신속하게 구성하고 배포를 표준화하는 데 사용되는 도구는 어떤 유형에 속하는가?","options":["협업도구","확장성 및 배포 표준화 도구","정적테스팅도구","테스트설계 및 구현 도구"],"answer":1,"explanation":"VM과 컨테이너를 이용해 환경 구성을 신속화하고 배포를 표준화하는 도구는 '확장성 및 배포 표준화 도구'에 해당한다. 정답 B."},{"id":"new-ch5_6-50-111","chapter":6,"difficulty":"hard","question":"한 팀이 무료 오픈소스 테스트자동화 프레임워크를 도입했다. 6개월 후 해당 오픈소스 프로젝트의 커뮤니티 개발이 중단되어 버그 수정이나 업데이트를 받을 수 없게 되었고, 팀이 자체적으로 프레임워크를 유지보수해야 하는 상황에 놓였다. 이 사례가 보여주는 테스트 자동화의 리스크는?","options":["비현실적인 기대","공급업체 종속성(vendor lock-in)","오픈소스 도구에 대한 지원 중단","플랫폼 비호환성"],"answer":2,"explanation":"상용 공급업체에 종속되는 것이 아니라 무료로 사용하던 오픈소스 커뮤니티의 지원이 끊긴 상황이므로, '오픈소스 도구 지원 중단' 리스크에 해당한다. B(공급업체 종속성)는 상용 벤더에 대한 의존 문제로 이 사례와는 구분된다. 정답 C."},{"id":"new-ch3_4_missing-1-112","chapter":3,"difficulty":"medium","question":"정적 테스팅이 조직에 제공하는 가치로 옳지 않은 것은?","options":["소프트웨어 개발 생명주기 초기에 결함을 식별하여 수정 비용을 절감할 수 있다.","동적 테스팅으로는 찾기 어려운 결함(예: 미선언 변수, 도달 불가능한 코드)을 발견할 수 있다.","이해관계자들이 산출물에 대한 공통된 이해를 형성하는 데 도움을 준다.","실제 운영 환경에서 소프트웨어를 실행했을 때 나타나는 응답 시간 저하를 직접 측정할 수 있다."],"answer":3,"explanation":"정적테스팅은 소프트웨어를 실행하지 않으므로 실행 중에만 나타나는 성능(응답시간) 문제는 동적테스팅으로 측정해야 한다. A, B, C는 실러버스에 명시된 정적 테스팅의 가치이다."},{"id":"new-ch3_4_missing-2-113","chapter":3,"difficulty":"medium","question":"정적테스팅과 동적테스팅에 대한 설명으로 옳은 것은?","options":["정적테스팅은 실행 가능한 산출물에만 적용할 수 있다.","동적테스팅은 요구사항 명세서와 같이 읽을 수 있는 모든 산출물에 적용 가능하다.","정적테스팅은 결함을 실행 없이 직접 식별하지만, 동적테스팅은 장애(failure)가 발생한 후 이를 분석하여 결함을 찾아낸다.","정적테스팅과 동적테스팅은 발견할 수 있는 결함의 종류가 완전히 동일하다."],"answer":2,"explanation":"정적테스팅은 결함을 직접 식별하고, 동적테스팅은 실패를 관찰한 뒤 추가 분석으로 결함을 찾는다. 정적테스팅은 비실행 산출물에도 적용 가능하므로 A는 반대이며, 동적테스팅은 실행 가능한 산출물에만 적용되므로 B도 틀렸다. 발견 결함 종류도 서로 다르므로 D도 틀렸다."},{"id":"new-ch3_4_missing-3-114","chapter":3,"difficulty":"medium","question":"다음 리뷰 유형에 대한 설명 중 옳은 것은?","options":["비공식 리뷰는 정의된 프로세스를 기반으로 진행되며 반드시 회의록을 작성해야 한다.","워크쓰루에서는 산출물의 저자가 리뷰를 주도하며, 참가자의 개별 준비 단계는 선택적으로 수행될 수 있다.","기술 리뷰는 저자가 반드시 리뷰 리더 역할을 수행해야 한다.","인스펙션은 4가지 리뷰 유형 중 가장 비공식적인 형태로, 메트릭을 수집하지 않는다."],"answer":1,"explanation":"워크쓰루는 저자가 세션을 주도하며 참가자의 개별 준비는 선택적이다. 비공식 리뷰는 정의된 프로세스가 없으므로 A는 틀렸다. 기술 리뷰는 기술 자격을 갖춘 리뷰어들이 참여하되 중재자가 리더 역할을 수행하므로 C도 틀렸다. 인스펙션은 가장 공식적인 유형으로 메트릭을 수집하므로 D도 틀렸다."},{"id":"new-ch3_4_missing-4-115","chapter":3,"difficulty":"medium","question":"다음 중 공식 리뷰에서 각 역할의 책임에 대한 설명으로 옳은 것은?","options":["관리자(Manager)는 리뷰 대상 산출물의 결함을 식별하는 역할을 수행한다.","중재자(Moderator)는 리뷰 세션을 진행하고 참가자들이 안전하고 효과적으로 협력할 수 있는 환경을 조성한다.","서기(Scribe)는 산출물을 작성한 사람으로, 이상사항에 대해 답변할 책임이 있다.","리뷰 리더는 이상사항을 문서화하고 기록하는 역할을 담당한다."],"answer":1,"explanation":"중재자는 리뷰 회의를 진행하고 효과적 협력을 위한 환경을 만드는 역할을 한다. 관리자는 자원 제공·일정 결정, 저자는 산출물 작성자로서 이상사항에 답변할 책임이 있으며, 서기는 이상사항을 기록하는 역할이다(리뷰 리더 아님). A, C, D는 역할이 뒤바뀌어 제시되었다."},{"id":"new-ch3_4_missing-5-116","chapter":3,"difficulty":"medium","question":"정적 테스팅(리뷰 또는 정적 분석)을 통해 비교적 쉽게 발견할 수 있는 결함으로 가장 거리가 먼 것은?","options":["요구사항 명세서에 존재하는 모호하거나 상충되는 요구사항","소스 코드 내 선언되었지만 사용되지 않는 변수","다중 사용자가 동시에 접속했을 때만 발생하는 경쟁 상태(race condition)로 인한 응답 지연","설계 문서와 실제 구현 간 인터페이스 명세 불일치"],"answer":2,"explanation":"경쟁 상태로 인한 응답 지연은 실제 실행(동시 접속) 중에만 관찰되는 동적 결함으로 정적 테스팅으로는 찾기 어렵다. 나머지는 실러버스에 명시된 정적 테스팅으로 쉽게 찾는 결함 유형(요구사항 결함, 코딩 결함, 인터페이스 명세 불일치)에 해당한다."},{"id":"new-ch3_4_missing-6-117","chapter":3,"difficulty":"medium","question":"ISTQB 실러버스에서 정의하는 공식 리뷰 프로세스의 단계 순서로 옳은 것은?","options":["착수 → 계획 → 개별 리뷰 → 논의 및 분석 → 수정 및 보고","계획 → 착수 → 개별 리뷰 → 논의 및 분석 → 수정 및 보고","계획 → 개별 리뷰 → 착수 → 논의 및 분석 → 수정 및 보고","계획 → 착수 → 논의 및 분석 → 개별 리뷰 → 수정 및 보고"],"answer":1,"explanation":"리뷰 프로세스는 계획(목적·범위·완료조건 정의) → 착수(준비 상태 확인, 목표 공유) → 개별 리뷰(각자 이상사항 식별) → 논의 및 분석(결함 여부 판단) → 수정 및 보고(결함 수정 및 결과 보고) 순으로 진행된다."},{"id":"new-ch3_4_missing-7-118","chapter":3,"difficulty":"hard","question":"A팀은 신규 기능의 화면 설계서를 작성한 후, 정해진 체크리스트나 회의 없이 옆자리 동료에게 캐주얼하게 화면을 보여주고 의견을 구하려고 한다. 이 상황에 가장 적합한 리뷰 유형은?","options":["인스펙션","기술 리뷰","워크쓰루","비공식 리뷰"],"answer":3,"explanation":"정의된 프로세스 없이 동료 간에 캐주얼하게 진행되는 리뷰는 비공식 리뷰에 해당한다. 인스펙션과 기술 리뷰는 문서화된 프로세스와 역할이 요구되며, 워크쓰루는 저자가 주도하는 세션 형태로 이 상황과는 다르다."},{"id":"new-ch3_4_missing-8-119","chapter":3,"difficulty":"hard","question":"항공기 제어 소프트웨어의 요구사항 명세서를 검토하면서, 조직은 정해진 입/출구 기준을 만족해야 하고 체크리스트와 역할 기반 검토, 결함 검출 메트릭 수집을 요구하고 있다. 이 문서를 작성한 저자가 리뷰 세션에서 맡을 수 없는 역할로 짝지어진 것은?","options":["리뷰어, 저자","리뷰 리더, 서기","관리자, 리뷰어","중재자, 관리자"],"answer":1,"explanation":"이 시나리오는 가장 공식적인 리뷰 유형인 인스펙션에 해당한다(정해진 입/출구 기준, 체크리스트, 메트릭 수집). 인스펙션에서 저자는 리뷰 리더나 서기 역할을 수행할 수 없다."},{"id":"new-ch3_4_missing-9-120","chapter":3,"difficulty":"hard","question":"시니어 개발자들로 구성된 그룹이, 관리자의 참여 없이 문서화된 결함 검출 프로세스를 따라 아키텍처 설계 문서의 기술적 타당성에 집중하여 검토를 진행하려고 한다. 가장 적절한 리뷰 유형은?","options":["비공식 리뷰","워크쓰루","기술 리뷰","인스펙션"],"answer":2,"explanation":"문서화된 결함 검출 프로세스를 사용하면서 관리자 참여 없이 동료 전문가 중심으로 진행되는 것은 기술 리뷰의 전형적 특징이다. 워크쓰루는 저자 주도이고, 인스펙션은 더 엄격한 역할·메트릭·입출구 기준을 요구한다."},{"id":"new-ch3_4_missing-10-121","chapter":3,"difficulty":"hard","question":"신입 개발자 교육을 위해, 산출물 저자가 직접 팀원들에게 시나리오 기반으로 문서를 설명하며 다양한 관점의 이해와 의견 수렴을 목적으로 세션을 진행하려 한다. 참가자들의 사전 개별 준비는 필수가 아니다. 이 상황에 해당하는 리뷰 유형은?","options":["인스펙션","기술 리뷰","워크쓰루","비공식 리뷰"],"answer":2,"explanation":"저자가 주도하여 시나리오나 드라이런 방식으로 진행하고 참가자의 개별 준비가 선택적인 것은 워크쓰루의 특징이다."},{"id":"new-ch3_4_missing-11-122","chapter":3,"difficulty":"hard","question":"한 조직에서 대규모 요구사항 명세서(500페이지) 전체를 한 번에 리뷰하도록 지시했고, 일정 압박으로 리뷰어들에게 별도의 준비 시간이 주어지지 않았으며, 관리층은 리뷰보다 개발 진척을 우선시하라고 강조했다. 이 리뷰가 실패할 가능성이 높은 이유로, 실러버스가 제시하는 '성공적인 리뷰의 요소'와 가장 관련이 적은 것은?","options":["산출물을 작은 단위로 나누어 리뷰하지 않았다.","리뷰어들에게 충분한 준비 시간이 제공되지 않았다.","관리층이 적절한 리뷰 프로세스를 지원하지 않았다.","리뷰에 사용할 정적 분석 도구의 라이선스 비용이 지나치게 높았다."],"answer":3,"explanation":"실러버스가 제시하는 성공적인 리뷰의 요소는 작은 단위로 나누어 검토, 준비 시간 확보, 관리층의 지원 등을 포함한다. 정적 분석 도구의 라이선스 비용은 이 시나리오나 실러버스의 성공 요소 목록과 직접 관련이 없다."},{"id":"new-ch3_4_missing-12-123","chapter":4,"difficulty":"medium","question":"테스트 기법의 유형에 대한 설명으로 옳은 것은?","options":["화이트박스 기법은 테스트베이시스로 요구사항 명세서만을 사용하며 소스 코드 구조는 고려하지 않는다.","블랙박스 기법은 소프트웨어의 내부 구조나 구현에 대한 지식 없이 명세를 기반으로 테스트 케이스를 도출한다.","경험기반 기법은 반드시 코드 커버리지 측정 도구를 사용해야 성립한다.","블랙박스 기법과 화이트박스 기법은 테스트 대상 소프트웨어의 내부 구조에 대한 지식을 동일한 수준으로 요구한다."],"answer":1,"explanation":"블랙박스 기법은 구현에 대한 지식 없이 명세 기반으로 테스트를 설계한다. 화이트박스 기법은 소스 코드·구조 지식을 기반으로 하므로 A는 틀렸고, 경험기반 기법은 커버리지 도구 사용을 필수로 하지 않으므로 C도 틀렸다."},{"id":"new-ch3_4_missing-13-124","chapter":4,"difficulty":"medium","question":"경험기반 테스트 기법에 대한 설명으로 가장 적절한 것은?","options":["테스터나 개발자의 지식과 경험을 활용하여 테스트 케이스를 설계하는 기법이다.","요구사항 명세서에 기술된 입력값과 출력값 간의 매핑을 표 형태로 정리하여 테스트를 설계하는 기법이다.","소스 코드의 모든 실행 가능한 구문을 최소 한 번 실행하는 것을 목표로 한다.","소프트웨어의 상태와 상태 간 전이를 다이어그램으로 표현하여 테스트를 설계하는 기법이다."],"answer":0,"explanation":"경험기반 기법은 과거 결함 이력, 유사 애플리케이션 경험 등을 활용한다. B는 결정테이블, C는 구문테스팅, D는 상태전이테스팅에 대한 설명이다."},{"id":"new-ch3_4_missing-14-125","chapter":4,"difficulty":"medium","question":"동등분할(Equivalence Partitioning) 기법에 대한 설명으로 옳지 않은 것은?","options":["동일한 분할에 속한 값들은 동일한 방식으로 처리될 것으로 예상되므로, 하나의 분할에서는 하나의 값만 테스트해도 충분하다.","분할은 유효 분할과 비유효 분할로 나뉠 수 있다.","하나의 입력 조건에 대해 정의된 분할들은 서로 겹칠 수 있으며, 이 경우 더 정밀한 테스트가 가능하다.","동등분할은 입력 데이터뿐 아니라 출력 데이터, 내부 값, 시간 관련 값에도 적용할 수 있다."],"answer":2,"explanation":"동등분할에서 분할은 서로 겹치지 않아야 하며, 모든 값은 정확히 하나의 분할에만 속해야 한다. 겹치는 분할을 허용한다는 설명은 옳지 않다."},{"id":"new-ch3_4_missing-15-126","chapter":4,"difficulty":"medium","question":"어떤 시스템이 \"회원 등급\"으로 신규/일반/우수/VIP 4가지 값을 입력받아 처리한다. 이 4개 값 각각에 대해 테스트 케이스를 하나씩 설계하여 최소 1회 실행하는 커버리지 기준은?","options":["결정테이블 커버리지","이치초이스(one-value) 커버리지","2-value 경계값 커버리지","모든 전이 커버리지"],"answer":1,"explanation":"입력 변수가 가질 수 있는 각 분할을 조합을 고려하지 않고 각각 최소 1회 테스트하는 것은 이치초이스 커버리지에 대한 설명이다."},{"id":"new-ch3_4_missing-16-127","chapter":4,"difficulty":"medium","question":"경계값 분석(BVA) 기법에 대한 설명으로 옳은 것은?","options":["경계값 분석은 분할 내의 모든 값에 동일하게 적용되며, 분할의 정렬 여부와 관계없이 사용할 수 있다.","경계값 분석은 정렬된(ordered) 분할에서 최솟값과 최댓값에 해당하는 경계에 적용된다.","3-value 경계값 분석은 2-value 경계값 분석보다 항상 더 적은 수의 테스트 케이스를 필요로 한다.","경계값 분석은 동등분할과 무관하게 독립적으로 사용해야 하며 함께 사용할 수 없다."],"answer":1,"explanation":"경계값 분석은 정렬된 분할에서 경계에 인접한 값을 테스트한다. 3-value BVA는 경계값 양쪽 이웃값까지 포함하므로 2-value보다 테스트 케이스 수가 더 많거나 같아 C는 틀렸고, 경계값 분석은 통상 동등분할과 함께 사용되므로 D도 틀렸다."},{"id":"new-ch3_4_missing-17-128","chapter":4,"difficulty":"medium","question":"입력값의 유효 범위가 1 이상 50 이하인 정수 필드에 대해 2-value 경계값 분석을 3-value 경계값 분석과 비교했을 때의 특징으로 옳은 것은?","options":["2-value 경계값 분석은 경계값과 그에 인접한 값 하나만 고려하므로, 3-value보다 덜 엄격한 테스트를 수행한다.","2-value 경계값 분석과 3-value 경계값 분석은 항상 동일한 개수의 테스트 케이스를 만들어낸다.","2-value 경계값 분석은 경계값의 양쪽 이웃 값을 모두 포함하므로 3-value보다 더 엄격하다.","3-value 경계값 분석은 경계값만 테스트하고 인접값은 고려하지 않는다."],"answer":0,"explanation":"2-value BVA는 경계값과 가장 가까운 인접 분할의 값 하나를 고려하는 반면, 3-value BVA는 경계값과 양쪽 이웃값을 모두 포함하여 더 엄격한 테스트를 수행한다."},{"id":"new-ch3_4_missing-18-129","chapter":4,"difficulty":"medium","question":"결정테이블 테스팅에 대한 설명으로 옳지 않은 것은?","options":["조건(condition)의 개수가 증가할수록 가능한 조합의 열(column) 수는 기하급수적으로 증가할 수 있다.","제한 입력 결정테이블에서는 조건의 값으로 참/거짓과 같은 불리언 값만 사용된다.","논리적으로 실현 불가능한 조합에 해당하는 열은 테이블에서 삭제할 수 있다.","결정테이블 커버리지는 실행된 구문 수를 총 실행 가능한 구문 수로 나눈 값으로 계산한다."],"answer":3,"explanation":"결정테이블 커버리지는 (실행된 조합의 열 수)/(실행 가능한 총 조합의 열 수)×100%로 계산한다. 구문 수를 이용한 계산은 구문 커버리지에 대한 설명이다."},{"id":"new-ch3_4_missing-19-130","chapter":4,"difficulty":"medium","question":"결정테이블 테스팅에서 \"확장 입력(extended entry)\" 결정테이블에 대한 설명으로 가장 적절한 것은?","options":["조건의 값으로 참/거짓 외에 복수의 이산적인 값을 사용할 수 있다.","반드시 모든 조건 조합을 하나도 빠짐없이 테스트해야 하며 조합을 줄일 수 없다.","조건의 값은 항상 불리언(참/거짓) 값으로만 제한된다.","상태전이 다이어그램을 표 형태로 변환한 것을 의미한다."],"answer":0,"explanation":"확장 입력 결정테이블은 조건에 불리언 값이 아닌 여러 이산적 값을 허용한다. 불리언 값만 사용하는 것은 제한 입력 결정테이블에 대한 설명이며, 실현 불가능한 조합은 삭제 가능하므로 B는 틀렸다."},{"id":"new-ch3_4_missing-20-131","chapter":4,"difficulty":"medium","question":"다음 중 결정테이블 테스팅을 적용하기에 가장 적합한 상황은?","options":["여러 개의 독립적인 조건들이 다양한 논리적 조합으로 결합되어 서로 다른 결과(action)를 만들어내는 비즈니스 규칙을 검증해야 하는 경우","시스템이 시간의 흐름에 따라 순차적으로 여러 화면을 이동하는 흐름을 검증해야 하는 경우","하나의 입력 필드가 받아들이는 값의 범위를 유효/비유효 구간으로 나누어 검증해야 하는 경우","소스 코드의 모든 실행 경로를 논리적 분기 단위로 검증해야 하는 경우"],"answer":0,"explanation":"결정테이블 테스팅은 여러 조건의 조합에 따라 서로 다른 결과가 발생하는 비즈니스 규칙 검증에 적합하다. B는 상태전이테스팅, C는 동등분할/경계값분석, D는 분기테스팅에 적합하다."},{"id":"new-ch3_4_missing-21-132","chapter":4,"difficulty":"medium","question":"상태전이테스팅의 3가지 커버리지 기준에 대한 설명으로 옳지 않은 것은?","options":["모든 상태 커버리지는 정의된 모든 상태를 최소 한 번씩 거치는 것을 목표로 하며, 세 기준 중 가장 약한 커버리지이다.","유효 전이 커버리지(0-스위치 커버리지)는 실무에서 가장 널리 사용되는 커버리지 기준이다.","모든 전이 커버리지는 유효한 전이뿐 아니라 비유효한 전이까지 포함하여 검증하므로 세 기준 중 가장 강력하다.","유효 전이 커버리지 100%를 달성해도 모든 상태 커버리지가 100%가 된다는 보장은 없다."],"answer":3,"explanation":"유효 전이 커버리지 100%를 달성하면 다이어그램상의 모든 상태를 최소 한 번은 거치게 되므로 모든 상태 커버리지도 자동으로 100% 달성된다. 따라서 D의 설명은 옳지 않다."},{"id":"new-ch3_4_missing-22-133","chapter":4,"difficulty":"medium","question":"상태전이테스팅에서 비유효한 전이(invalid transition)를 테스트할 때, 하나의 테스트 케이스에 비유효 전이를 오직 하나만 포함시켜야 하는 이유로 가장 적절한 것은?","options":["테스트 케이스 작성 시간을 최소화하기 위해서","여러 개의 비유효 전이를 한 테스트 케이스에 포함시키면 한 결함이 다른 결함을 가려서(결함 마스킹) 이후 결함을 발견하지 못할 위험이 있기 때문에","상태전이 다이어그램의 상태 수를 줄이기 위해서","결정테이블의 조합 수를 줄이기 위해서"],"answer":1,"explanation":"여러 비유효 전이를 하나의 테스트 케이스에 포함시키면, 앞선 비유효 전이로 인한 결함이 뒤이은 비유효 전이 검증을 방해하는 결함 마스킹이 발생할 수 있다. 이를 방지하기 위해 테스트 케이스당 비유효 전이는 하나만 포함한다."},{"id":"new-ch3_4_missing-23-134","chapter":4,"difficulty":"medium","question":"상태전이테스팅에서 사용하는 산출물에 대한 설명으로 옳은 것은?","options":["상태 테이블에서 유효하지 않은 전이에 해당하는 셀은 일반적으로 비워둔다.","상태 다이어그램은 반드시 프로그램 소스 코드로부터만 도출할 수 있다.","상태전이테스팅은 오직 임베디드 소프트웨어에만 적용 가능하다.","상태 테이블은 상태 다이어그램보다 표현할 수 있는 정보가 항상 더 적다."],"answer":0,"explanation":"상태 테이블에서는 각 상태와 이벤트의 조합에 대해 가능한 전이를 표시하며, 유효하지 않은 전이는 빈 셀로 남겨둔다. 상태전이테스팅은 임베디드 소프트웨어뿐 아니라 메뉴 기반 애플리케이션 등 다양한 분야에 적용 가능하다."},{"id":"new-ch3_4_missing-24-135","chapter":4,"difficulty":"medium","question":"구문 커버리지(statement coverage)에 대한 설명으로 옳지 않은 것은?","options":["구문 커버리지는 (실행된 구문 수)/(총 실행 가능한 구문 수)×100%로 계산한다.","구문 커버리지 100%를 달성하면 프로그램 내 모든 결정(decision) 논리의 각 결과를 테스트했다고 보장할 수 있다.","구문 커버리지 100%를 달성하더라도 특정 데이터 값 조합에서만 발생하는 결함은 발견하지 못할 수 있다.","구문 커버리지는 화이트박스 테스트 기법 중 하나이다."],"answer":1,"explanation":"구문 커버리지 100%를 달성해도 조건문의 모든 분기를 다 실행했다는 보장은 없으며, 이는 분기 커버리지의 역할이다. 데이터 종속적 결함을 놓칠 수 있다는 한계도 있다."},{"id":"new-ch3_4_missing-25-136","chapter":4,"difficulty":"medium","question":"다음 중 구문 커버리지를 측정하는 목적으로 가장 적절한 것은?","options":["소스 코드 내에서 실제로 실행된 구문의 비율을 파악하여, 전혀 실행되지 않은 코드(예: 도달 불가능한 코드)를 식별하는 데 도움을 준다.","요구사항 명세서에 정의된 모든 기능이 구현되었는지 확인한다.","결정테이블의 모든 조합이 실현 가능한지 확인한다.","상태전이 다이어그램의 모든 상태가 정의되어 있는지 확인한다."],"answer":0,"explanation":"구문 커버리지는 실행 가능한 구문 중 실제로 테스트에 의해 실행된 구문의 비율을 나타내는 화이트박스 커버리지 척도이다."},{"id":"new-ch3_4_missing-26-137","chapter":4,"difficulty":"medium","question":"분기 커버리지(branch coverage)에 대한 설명으로 옳은 것은?","options":["분기 커버리지는 결정문(decision)의 각 결과(true/false 등)가 최소 한 번씩 실행되었는지를 측정한다.","분기 커버리지 100%를 달성해도 구문 커버리지가 100%라는 보장은 없다.","분기 커버리지는 블랙박스 테스트 기법에 속한다.","분기 커버리지는 결정테이블의 조합 수를 기준으로 계산된다."],"answer":0,"explanation":"분기 커버리지는 각 결정의 가능한 결과를 얼마나 실행했는지 측정한다. 분기 커버리지 100%를 달성하면 구문 커버리지도 자동으로 100%가 되므로 B는 틀렸고, 분기 커버리지는 화이트박스 기법이므로 C도 틀렸다."},{"id":"new-ch3_4_missing-27-138","chapter":4,"difficulty":"medium","question":"어떤 함수에 if-else 조건문이 하나 포함되어 있다. 테스터가 if 조건이 참(true)이 되는 입력값 하나만으로 테스트를 수행했을 때, 다음 설명 중 옳은 것은?","options":["이 테스트만으로 분기 커버리지 100%와 구문 커버리지 100%를 모두 달성할 수 있다.","else 분기가 실행되지 않았으므로 분기 커버리지 100%를 달성하지 못했으며, else 블록 내 구문도 실행되지 않아 구문 커버리지도 100%가 아니다.","if 분기만 실행해도 구문 커버리지는 항상 100%가 된다.","분기 커버리지는 else 블록의 존재 여부와 관계없이 100%로 간주된다."],"answer":1,"explanation":"if 조건이 참이 되는 경로만 테스트하면 else 분기는 실행되지 않으므로 분기 커버리지가 100% 미달이며, else 블록 안 구문도 실행되지 않으므로 구문 커버리지도 100%에 도달하지 못한다."},{"id":"new-ch3_4_missing-28-139","chapter":4,"difficulty":"medium","question":"화이트박스 테스트 기법의 가치(value)에 대한 설명으로 옳은 것은?","options":["화이트박스 기법은 명세서가 모호하거나 불완전하더라도, 실제 코드의 전체 구현 내용을 고려하기 때문에 결함을 비교적 쉽게 감지할 수 있다.","화이트박스 기법은 요구사항 명세서에 정의되었지만 코드에 누락된 기능을 항상 정확하게 식별해낸다.","화이트박스 기법만으로 소프트웨어의 모든 기능적 요구사항 충족 여부를 확인할 수 있다.","화이트박스 기법은 블랙박스 기법과 달리 테스트베이시스가 필요하지 않다."],"answer":0,"explanation":"화이트박스 기법은 코드 구현 전체를 고려하므로 명세가 불명확해도 결함을 발견하기 쉽지만, 명세에 있으나 구현되지 않은 기능은 코드에 존재하지 않으므로 식별하지 못할 수 있어 B는 틀렸다."},{"id":"new-ch3_4_missing-29-140","chapter":4,"difficulty":"medium","question":"블랙박스 기법만을 사용하여 테스트를 설계하고 실행한 팀에 대한 설명으로 옳은 것은?","options":["이 팀은 실행된 코드의 실제 커버리지(예: 구문 커버리지)가 어느 정도인지 별도의 화이트박스 기반 측정 없이도 정확히 알 수 있다.","이 팀은 명세에 정의된 기능적 요구사항에 대한 테스트는 수행할 수 있지만, 실제 코드 커버리지 수준은 별도로 측정하지 않는 한 알 수 없다.","블랙박스 기법만으로는 어떠한 결함도 발견할 수 없다.","블랙박스 기법은 화이트박스 기법과 달리 테스트베이시스가 요구사항 명세서로 한정된다."],"answer":1,"explanation":"블랙박스 기법은 구현 내부를 고려하지 않으므로, 실제 코드가 얼마나 실행되었는지는 블랙박스 테스트 결과만으로는 알 수 없으며 별도의 화이트박스 기반 측정이 필요하다."},{"id":"new-ch3_4_missing-30-141","chapter":4,"difficulty":"medium","question":"오류 추정(error guessing) 기법에 대한 설명으로 가장 적절한 것은?","options":["과거에 발생했던 결함, 개발자가 흔히 저지르는 실수, 유사한 애플리케이션에서 발생했던 장애 유형에 대한 지식을 활용하여 결함이 있을 만한 부분을 예측하고 테스트를 설계하는 기법이다.","요구사항 명세서의 입력 조건을 유효/비유효 분할로 나누어 테스트 케이스를 설계하는 기법이다.","설계 단계에서 도출한 상태 다이어그램을 기반으로 상태 전이를 검증하는 기법이다.","반드시 정형화된 체크리스트를 사용해야만 성립하는 기법이다."],"answer":0,"explanation":"오류 추정은 테스터·개발자의 경험과 지식을 활용해 결함이 있을 만한 곳을 예측하는 경험기반 기법이다. B는 동등분할, C는 상태전이테스팅에 대한 설명이다."},{"id":"new-ch3_4_missing-31-142","chapter":4,"difficulty":"medium","question":"'결함 공격(fault attack)'에 대한 설명으로 가장 적절한 것은?","options":["발생 가능성이 높은 결함과 장애의 유형을 목록화하여, 이를 체계적으로 테스트 설계에 활용하는 오류 추정의 한 형태이다.","소프트웨어의 보안 취약점만을 대상으로 하는 침투 테스트 기법이다.","상태전이 다이어그램에서 비유효한 전이만을 모아 공격적으로 테스트하는 기법이다.","결정테이블에서 실현 불가능한 조합만을 골라 테스트하는 기법이다."],"answer":0,"explanation":"결함 공격은 발생 가능성이 높은 결함·장애 유형의 목록(카탈로그)을 만들어 이를 근거로 테스트를 설계하는 오류 추정 기법의 하나이다."},{"id":"new-ch3_4_missing-32-143","chapter":4,"difficulty":"medium","question":"탐색적 테스팅(exploratory testing)에 대한 설명으로 옳지 않은 것은?","options":["테스트 설계, 실행, 결과 평가를 동시에 수행하면서 학습한 내용을 활용해 새로운 테스트를 만들어 나간다.","요구사항 명세가 부족하거나 시간적 압박이 큰 상황에서 특히 유용하게 활용될 수 있다.","세션 기반 테스팅에서는 테스트 차터(charter)를 기반으로 정해진 시간 동안 테스트를 수행하고 세션 시트에 결과를 기록한다.","탐색적 테스팅은 사전에 모든 테스트 케이스를 상세하게 문서화한 뒤 이를 그대로 실행하는 방식으로 진행된다."],"answer":3,"explanation":"탐색적 테스팅은 사전에 모든 테스트 케이스를 상세히 문서화하는 방식이 아니라, 테스트를 수행하며 얻은 정보를 바탕으로 설계·실행·평가를 동시에 진행하는 기법이다."},{"id":"new-ch3_4_missing-33-144","chapter":4,"difficulty":"medium","question":"다음 중 탐색적 테스팅이 특히 효과적으로 활용될 수 있는 상황으로 가장 적절한 것은?","options":["상세한 요구사항 명세서와 충분한 테스트 설계 시간이 확보되어 있어, 결정테이블을 사용한 정밀한 조합 테스트가 필요한 경우","요구사항 문서가 거의 없고 일정이 촉박하여 테스터의 경험과 직관을 즉시 활용한 테스트가 필요한 경우","안전이 중요한 시스템에서 규제 기관이 요구하는 완전한 테스트 문서화가 필수적인 경우","반복적으로 동일한 절차를 실행하는 회귀 테스트를 자동화해야 하는 경우"],"answer":1,"explanation":"탐색적 테스팅은 명세가 부족하거나 시간이 촉박한 상황에서 테스터의 지식과 경험을 즉시 활용할 수 있어 유용하다."},{"id":"new-ch3_4_missing-34-145","chapter":4,"difficulty":"medium","question":"체크리스트 기반 테스팅(checklist-based testing)에 대한 설명으로 옳지 않은 것은?","options":["테스터는 경험을 바탕으로 만들어진 체크리스트의 항목에 따라 테스트를 설계하고 수행한다.","체크리스트는 소프트웨어나 조직의 변화에 맞추어 정기적으로 업데이트되어야 한다.","지나치게 일반적이거나 도구로 자동 확인이 가능한 항목도 체크리스트 항목으로 포함하는 것이 바람직하다.","체크리스트는 테스터가 여러 테스트 대상에 대해 반복적으로 고려해야 할 공통적인 관점을 제공한다."],"answer":2,"explanation":"지나치게 일반적이거나 자동으로 쉽게 확인 가능한 항목은 체크리스트 항목으로 부적합하다. 체크리스트는 실제 테스트 설계에 의미 있는, 경험에 기반한 항목으로 구성되어야 한다."},{"id":"new-ch3_4_missing-35-146","chapter":4,"difficulty":"medium","question":"오류 추정, 탐색적 테스팅, 체크리스트 기반 테스팅의 공통점으로 가장 적절한 것은?","options":["세 기법 모두 테스터나 개발자의 지식과 경험을 활용하는 경험기반 테스트 기법이다.","세 기법 모두 반드시 결정테이블을 우선적으로 작성해야 적용할 수 있다.","세 기법 모두 소스 코드의 구조적 커버리지를 직접 측정하는 것을 목표로 한다.","세 기법 모두 사용자 스토리의 3C(카드, 대화, 확인)를 전제로 해야만 사용할 수 있다."],"answer":0,"explanation":"오류 추정, 탐색적 테스팅, 체크리스트 기반 테스팅은 모두 실러버스 4.4절에서 다루는 경험기반 테스트 기법으로, 테스터의 지식과 경험을 핵심 자원으로 활용한다는 공통점이 있다."},{"id":"new-ch3_4_missing-36-147","chapter":4,"difficulty":"medium","question":"사용자 스토리의 '3C'에 대한 설명으로 옳은 것은?","options":["Card(카드), Confirmation(확인), Coverage(커버리지)","Card(카드), Conversation(대화), Confirmation(확인)","Collaboration(협업), Conversation(대화), Coverage(커버리지)","Card(카드), Collaboration(협업), Coverage(커버리지)"],"answer":1,"explanation":"사용자 스토리의 3C는 Card(스토리를 간략히 기술한 카드), Conversation(이해관계자 간의 대화), Confirmation(인수조건을 통한 확인)을 의미한다."},{"id":"new-ch3_4_missing-37-148","chapter":4,"difficulty":"medium","question":"다음 중 INVEST 기준을 위반한 사용자 스토리의 특징으로 가장 적절한 것은?","options":["다른 스토리와 협상 가능하도록 세부 구현 방식을 열어둔 채로 작성되었다.","한 스프린트 내에서 완료하기 어려울 정도로 방대한 범위를 포함하고 있어 작게(Small) 쪼개지지 않았다.","완료 여부를 확인할 수 있는 인수조건이 명확하게 포함되어 있다.","다른 스토리에 대한 의존성 없이 독립적으로 개발 및 테스트가 가능하다."],"answer":1,"explanation":"INVEST의 S(Small)는 스토리가 한 반복 내에서 완료할 수 있을 만큼 충분히 작아야 함을 의미한다. 스토리가 지나치게 방대하여 한 스프린트 내 완료가 어렵다면 Small 기준 위반이다. 나머지 보기는 INVEST 기준(협상 가능, 테스트 가능, 독립적)을 충족하는 바람직한 특징이다."},{"id":"new-ch3_4_missing-38-149","chapter":4,"difficulty":"medium","question":"ATDD(Acceptance Test-Driven Development)에 대한 설명으로 옳지 않은 것은?","options":["ATDD는 일반적으로 명세 워크숍(specification workshop)과 인수 테스트 케이스 작성의 두 단계로 이루어진다.","인수 테스트 케이스는 반드시 개발자 단독으로 작성해야 하며, 테스터나 다른 팀원은 참여할 수 없다.","인수조건은 시나리오 기반(Given/When/Then) 방식이나 규칙 기반(입출력 매핑 표) 방식으로 작성할 수 있다.","일반적으로 긍정적인 테스트를 먼저 작성한 후, 비유효 조건에 대한 테스트, 그리고 비기능적 테스트 순으로 작성한다."],"answer":1,"explanation":"인수 테스트 케이스는 팀 전체 또는 테스터가 작성할 수 있으며, 개발자 단독으로만 작성해야 한다는 제약은 실러버스에 없다. 나머지 설명(2단계 프로세스, 인수조건 작성법, 테스트 작성 순서)은 실러버스 4.5절 내용과 일치한다."},{"id":"new-ch3_4_missing-39-150","chapter":4,"difficulty":"hard","question":"어느 온라인 강의 수강 시스템은 다음 5개 상태와 7개의 유효 전이(valid transition)를 가진다.\n\n[상태] 미시작(NS), 수강중(IP), 일시정지(PA), 완료(CO), 인증서발급(CT)\n\n[유효 전이 목록]\n①NS→IP(강의 시작) ②IP→PA(일시정지) ③PA→IP(재개) ④IP→CO(전체 진도 완료) ⑤CO→CT(퀴즈 통과) ⑥CO→IP(재수강 신청) ⑦PA→NS(수강 취소)\n\n테스터가 다음 두 개의 테스트 케이스를 설계하여 실행했다.\n- TC1: NS→IP→PA→IP→CO→CT\n- TC2: NS→IP→PA→NS\n\n이 두 테스트 케이스만으로 달성되는 유효 전이 커버리지(0-스위치 커버리지)와, 아직 테스트되지 않은 유효 전이로 옳게 짝지어진 것은?","options":["100%이며, 모든 유효 전이가 테스트되었다.","약 85.7%(6/7)이며, \"완료 상태에서 재수강 신청으로 수강중 상태로 돌아가는 전이(⑥ CO→IP)\"가 테스트되지 않았다.","약 71.4%(5/7)이며, \"일시정지 상태에서 수강 취소로 미시작 상태로 돌아가는 전이(⑦ PA→NS)\"가 테스트되지 않았다.","약 85.7%(6/7)이며, \"미시작 상태에서 수강중 상태로 가는 전이(① NS→IP)\"가 테스트되지 않았다."],"answer":1,"explanation":"전체 유효 전이는 ①~⑦로 총 7개이다. TC1(NS→IP→PA→IP→CO→CT)이 실제로 지나가는 전이: NS→IP(①), IP→PA(②), PA→IP(③), IP→CO(④), CO→CT(⑤) → {①,②,③,④,⑤}. TC2(NS→IP→PA→NS)가 실제로 지나가는 전이: NS→IP(①, 중복), IP→PA(②, 중복), PA→NS(⑦) → {①,②,⑦}. 두 테스트 케이스가 커버하는 전이의 합집합: {①,②,③,④,⑤,⑦} = 6개. 전체 7개 중 6개를 커버했으므로 유효 전이 커버리지 = 6/7 × 100% ≈ 85.7%. 커버되지 않은 전이는 ⑥ CO→IP(재수강 신청)이다. TC1, TC2 어디에서도 완료(CO) 상태에서 다시 수강중(IP) 상태로 돌아가는 경로를 실행하지 않았기 때문이다. 따라서 정답은 B이다. ---"},{"id":"new-ch4_hard_40to66-40-151","chapter":4,"difficulty":"hard","question":"상태전이 테스팅에서 비유효 전이(invalid transition)를 테스트할 때 결함 마스킹(defect masking)을 방지하기 위해 권장되는 원칙은?","options":["하나의 테스트 케이스에 가능한 한 많은 비유효 전이를 포함시켜 효율을 높인다.","하나의 테스트 케이스에는 하나의 비유효 전이만 포함시킨다.","비유효 전이는 테스트할 필요가 없다.","비유효 전이는 반드시 유효 전이와 함께 같은 테스트 케이스에서 테스트해야 한다."],"answer":1,"explanation":"여러 비유효 전이를 한 테스트 케이스에 몰아넣으면 한 결함이 다른 결함을 가려(마스킹) 발견을 놓칠 수 있으므로, 비유효 전이는 테스트 케이스당 1개만 포함해야 한다."},{"id":"new-ch4_hard_40to66-41-152","chapter":4,"difficulty":"hard","question":"입력변수 A(분할 3개: A1,A2,A3)와 입력변수 B(분할 2개: B1,B2)가 있는 시스템에서 이치초이스 커버리지 100%를 달성하기 위해 필요한 \"최소\" 테스트 케이스 수는? (단, 조합은 고려하지 않으며 한 테스트 케이스는 A와 B 각각 하나의 분할값을 가진다)","options":["6개 (모든 조합)","5개 (총 분할 수)","3개 (더 많은 분할을 가진 변수의 분할 수)","2개 (변수의 개수)"],"answer":2,"explanation":"(A1,B1),(A2,B2),(A3,B1) 3개의 테스트 케이스로 A1,A2,A3,B1,B2 5개 분할을 모두 커버할 수 있다. A가 3개 분할을 가지므로 최소 3개의 테스트 케이스가 필요하며, 더 적게는 불가능하다."},{"id":"new-ch4_hard_40to66-42-153","chapter":4,"difficulty":"hard","question":"테스터가 명세 기반(블랙박스) 테스트 케이스만으로 테스트를 완료한 후 커버리지 도구로 확인해보니 특정 예외처리 코드 블록이 한 번도 실행되지 않았음을 발견했다. 이런 상황에 대한 가장 적절한 설명은?","options":["블랙박스 테스팅만으로는 실제 달성된 코드 커버리지 수준을 알 수 없으므로, 화이트박스 기법을 통해 추가 테스트 케이스를 설계해야 한다.","이는 명세 자체가 잘못되었다는 것을 의미하므로 화이트박스 테스트는 무의미하다.","블랙박스 테스트만으로 모든 코드 경로가 항상 커버되므로 이 상황은 발생할 수 없다.","예외처리 코드는 테스트 대상에서 제외해도 무방하다."],"answer":0,"explanation":"블랙박스 테스팅만으로는 실제 코드 커버리지를 알 수 없다는 점이 화이트박스 기법의 가치이다."},{"id":"new-ch4_hard_40to66-43-154","chapter":4,"difficulty":"hard","question":"다음 사용자 스토리 중 INVEST 기준을 위반하는 사례로 가장 적절한 것은? \"이 스토리는 다른 5개의 스토리가 먼저 완료되어야만 개발을 시작할 수 있고, 그 스토리들의 구현 방식에 따라 내용이 계속 바뀐다.\"","options":["Small(작음) 위반","Independent(독립적) 위반","Negotiable(협상가능) 위반","Estimable(추정가능) 위반"],"answer":1,"explanation":"다른 스토리에 강하게 의존하고 그에 따라 내용이 변하는 것은 독립성(Independent) 위반의 전형적 사례이다."},{"id":"new-ch4_hard_40to66-44-155","chapter":4,"difficulty":"hard","question":"\"회원 등급이 VIP이면서 동시에 신규가입 3일 이내\"라는 조건과 \"VIP 등급은 가입 후 1년 이상 유지된 회원에게만 부여된다\"는 비즈니스 규칙이 있는 시스템의 결정테이블을 설계할 때, 이 두 조건의 조합에 대해 가장 적절한 처리는?","options":["반드시 별도의 테스트 케이스로 실행해야 하는 유효한 규칙이다.","비즈니스 규칙상 실현 불가능한 조합이므로 결정테이블에서 해당 열을 삭제할 수 있다.","결정테이블 기법에서는 실현 불가능한 조합이라는 개념 자체가 존재하지 않는다.","이 조합은 반드시 비유효분할로 처리해서 경계값 분석으로 다뤄야 한다."],"answer":1,"explanation":"VIP는 가입 1년 이상이어야 하므로 \"VIP이면서 가입 3일 이내\"는 실현 불가능한 조합이며, 이런 열은 삭제할 수 있다."},{"id":"new-ch4_hard_40to66-45-156","chapter":4,"difficulty":"hard","question":"한 시스템의 동작이 \"현재 상태\"와 \"과거에 어떤 이벤트가 발생했는지\"에 따라 달라지며, 동일한 입력이라도 시스템이 놓인 상태에 따라 전혀 다른 결과를 낸다. 이 시스템을 테스트하기에 가장 적합한 블랙박스 기법은?","options":["동등분할","결정테이블 테스팅","상태전이 테스팅","경계값 분석"],"answer":2,"explanation":"이전 이벤트에 의해 동작이 달라지는 시스템은 상태전이 테스팅에 가장 적합하다."},{"id":"new-ch4_hard_40to66-46-157","chapter":4,"difficulty":"hard","question":"한 팀이 ATDD를 적용하면서 다음과 같이 진행했다: \"① 개발자 혼자 인수조건을 작성한다 → ② 인수조건에 대해 팀 전체(비즈니스 담당자, 개발자, 테스터)가 논의하는 명세 워크숍을 진행한다 → ③ 코드를 구현한다.\" 이 진행 방식에서 ISTQB 실러버스가 설명하는 ATDD 접근법과 가장 어긋나는 부분은?","options":["명세 워크숍을 진행한 것 자체가 잘못이다.","인수조건은 팀 전체의 논의(명세 워크숍)를 통해 먼저 도출되어야 하는데, 개발자 혼자 먼저 작성한 후 논의가 이루어졌다.","코드 구현은 테스트 케이스 작성보다 먼저 이루어져서는 안 되며 이 팀은 이를 지켰으므로 문제가 없다.","ATDD는 애초에 인수조건이라는 개념을 사용하지 않는다."],"answer":1,"explanation":"ATDD의 1단계는 팀 전체가 참여하는 명세 워크숍을 통해 인수조건을 도출하는 것이며, 개발자 혼자 먼저 작성하는 것은 순서가 어긋난다."},{"id":"new-ch4_hard_40to66-47-158","chapter":4,"difficulty":"hard","question":"어떤 코드에 대해 분기 커버리지가 100%라는 것이 확인되었다. 이 코드의 구문 커버리지에 대해 옳게 추론한 것은?","options":["구문 커버리지는 반드시 100%보다 낮다.","구문 커버리지는 반드시 100%이다.","구문 커버리지는 알 수 없으며 별도로 측정해야 한다.","구문 커버리지와 분기 커버리지는 서로 무관하므로 추론이 불가능하다."],"answer":1,"explanation":"분기 커버리지 100%는 구문 커버리지 100%를 자동으로 포함한다."},{"id":"new-ch4_hard_40to66-48-159","chapter":4,"difficulty":"hard","question":"신규 프로젝트로 요구사항 명세서가 아직 작성되지 않았고 일정이 매우 촉박한 상황에서, 테스터가 애플리케이션을 직접 사용해보며 배운 내용을 바탕으로 다음 테스트를 실시간으로 설계하고 실행하려 한다. 이런 상황에 가장 적합한 기법은?","options":["결정테이블 테스팅","상태전이 테스팅","탐색적 테스팅","경계값 분석"],"answer":2,"explanation":"명세 부족·시간 압박 상황에서는 탐색적 테스팅이 특히 유용하다."},{"id":"new-ch4_hard_40to66-49-160","chapter":4,"difficulty":"hard","question":"한 온라인 쇼핑몰의 할인 정책은 다음과 같이 4개의 유효분할로 구성된다: 주문수량 0~9개(할인없음), 10~49개(5%할인), 50~99개(10%할인), 100개 이상(15%할인). 테스터가 준비한 테스트 케이스의 주문 수량이 각각 3, 25, 25, 70일 때, 동등분할 커버리지는?","options":["25%","50%","75%","100%"],"answer":2,"explanation":"총 분할은 4개. 3→[0~9] 커버, 25→[10~49] 커버(중복), 70→[50~99] 커버. [100이상]은 미커버. 커버된 분할=3개. 커버리지=3/4×100%=75%."},{"id":"new-ch4_hard_40to66-50-161","chapter":4,"difficulty":"hard","question":"한 회원 등급 시스템은 누적 포인트에 따라 5개의 유효분할로 나뉜다: Bronze(0~999), Silver(1000~2999), Gold(3000~5999), Platinum(6000~9999), Diamond(10000이상). 테스터가 준비한 5개의 테스트 케이스의 포인트 값이 500, 4500, 4500, 12000, 12000일 때, 동등분할 커버리지는?","options":["40%","60%","80%","100%"],"answer":1,"explanation":"총 분할 5개. 500→Bronze, 4500→Gold(중복), 12000→Diamond(중복). 커버된 분할={Bronze,Gold,Diamond}=3개. 커버리지=3/5×100%=60%."},{"id":"new-ch4_hard_40to66-51-162","chapter":4,"difficulty":"hard","question":"로그인 폼에는 아이디(유효분할 1개, 비유효분할 1개)와 비밀번호(유효분할 1개, 비유효분할 1개), 총 2개의 입력변수가 존재한다. 테스터가 (유효아이디, 유효비밀번호), (비유효아이디, 유효비밀번호) 두 개의 테스트 케이스만 실행했다면, 이치초이스 커버리지는? (총 분할은 4개: 아이디유효, 아이디비유효, 비밀번호유효, 비밀번호비유효)","options":["25%","50%","75%","100%"],"answer":2,"explanation":"TC1은 \"아이디유효\",\"비밀번호유효\"를 커버. TC2는 \"아이디비유효\",\"비밀번호유효\"(중복)를 커버. 커버된 분할={아이디유효, 아이디비유효, 비밀번호유효}=3개. \"비밀번호비유효\"는 미커버. 커버리지=3/4×100%=75%."},{"id":"new-ch4_hard_40to66-52-163","chapter":4,"difficulty":"hard","question":"한 포인트 적립 시스템은 5개의 인접한 유효분할로 구성된다: P1[0~99], P2[100~299], P3[300~599], P4[600~999], P5[1000~1500]. 2-value 경계값 분석에서 각 분할은 최솟값과 최댓값 2개씩의 경계값을 가지므로 총 경계값은 10개이다(0,99,100,299,300,599,600,999,1000,1500). 테스터가 준비한 테스트 케이스의 포인트 값이 0, 99, 500, 999, 999, 1500일 때, 2-value 경계값 커버리지는?","options":["20%","40%","60%","80%"],"answer":1,"explanation":"경계값 집합(10개) 중 0,99,999(중복),1500이 커버되고 500은 P3의 중간값으로 경계값이 아니다. 커버된 경계값={0,99,999,1500}=4개. 커버리지=4/10×100%=40%."},{"id":"new-ch4_hard_40to66-53-164","chapter":4,"difficulty":"hard","question":"회원가입 시스템의 나이 입력 필드는 18세부터 65세까지만 유효하다. 2-value 경계값 분석에서는 최솟값-1, 최솟값, 최댓값, 최댓값+1의 4개 값(17,18,65,66)을 경계값으로 사용한다. 테스터가 준비한 테스트 케이스의 나이 값이 17, 18, 66일 때, 2-value 경계값 커버리지는?","options":["25%","50%","75%","100%"],"answer":2,"explanation":"총 경계값 4개 중 17,18,66은 커버되지만 65(최댓값)는 미커버. 커버리지=3/4×100%=75%."},{"id":"new-ch4_hard_40to66-54-165","chapter":4,"difficulty":"hard","question":"한 신용점수 등급 시스템은 5개의 인접한 유효분할로 구성된다: Poor[300~579], Fair[580~669], Good[670~739], VeryGood[740~799], Exceptional[800~850]. 2-value 경계값 분석의 총 경계값은 각 분할의 최솟값·최댓값을 합한 10개이다(300,579,580,669,670,739,740,799,800,850). 테스터가 준비한 테스트케이스의 점수 값이 300, 579, 580, 669, 800, 850일 때, 2-value 경계값 커버리지는?","options":["40%","50%","60%","70%"],"answer":2,"explanation":"총 경계값 10개 중 300,579,580,669,800,850의 6개가 커버되고 670,739,740,799는 미커버. 커버리지=6/10×100%=60%."},{"id":"new-ch4_hard_40to66-55-166","chapter":4,"difficulty":"hard","question":"한 쿠폰 시스템에서 1회 사용 가능한 쿠폰 수량은 1장부터 20장까지 유효하다. 3-value 경계값 분석에서는 최솟값-1, 최솟값, 최솟값+1, 최댓값-1, 최댓값, 최댓값+1의 6개 값(0,1,2,19,20,21)을 경계값으로 사용한다. 테스터가 준비한 테스트 케이스의 값이 0, 2, 20일 때, 3-value 경계값 커버리지는?","options":["33.3%","50%","66.7%","83.3%"],"answer":1,"explanation":"총 경계값 6개 중 0,2,20이 커버되고 1,19,21은 미커버. 커버리지=3/6×100%=50%."},{"id":"new-ch4_hard_40to66-56-167","chapter":4,"difficulty":"hard","question":"한 창고 관리 시스템에서 입고 가능한 재고 수량은 5개부터 50개까지 유효하다. 3-value 경계값 분석의 경계값은 최솟값-1, 최솟값, 최솟값+1, 최댓값-1, 최댓값, 최댓값+1의 6개 값(4,5,6,49,50,51)이다. 테스터가 준비한 테스트 케이스의 값이 4, 5, 6, 49, 51일 때, 3-value 경계값 커버리지는?","options":["50%","66.7%","83.3%","100%"],"answer":2,"explanation":"총 경계값 6개 중 4,5,6,49,51이 커버되고 50(최댓값)이 미커버. 커버리지=5/6×100%≈83.3%."},{"id":"new-ch4_hard_40to66-57-168","chapter":4,"difficulty":"hard","question":"한 온라인 쇼핑몰의 할인 시스템은 3개의 불리언 조건(VIP회원여부, 쿠폰보유여부, 첫구매여부)으로 구성된 제한 입력 결정테이블을 사용하며, 실현 불가능한 조합은 없다. 이 경우 결정테이블은 2³=8개의 규칙(열)을 갖는다. 테스트 팀이 이 중 5개의 규칙만 커버하는 테스트 케이스를 설계했다면, 결정테이블 커버리지는?","options":["50%","62.5%","75%","87.5%"],"answer":1,"explanation":"총 규칙 8개 중 5개 커버. 커버리지=5/8×100%=62.5%."},{"id":"new-ch4_hard_40to66-58-169","chapter":4,"difficulty":"hard","question":"한 항공권 예약 시스템은 4개의 불리언 조건(좌석업그레이드가능여부, 마일리지사용여부, 성수기여부, 취소불가운임여부)으로 결정테이블을 구성한다. 이론상 2⁴=16개의 조합이 가능하지만, 이 중 2개 조합은 비즈니스 규칙상 실현 불가능하여 결정테이블에서 제외되었다. 테스터가 7개의 실행 가능한 규칙을 커버하는 테스트 케이스를 설계했다면, 결정테이블 커버리지는?","options":["43.75%","46.7%","50%","53.3%"],"answer":2,"explanation":"실행 가능한 총 규칙 수=16-2=14개. 커버된 규칙=7개. 커버리지=7/14×100%=50%."},{"id":"new-ch4_hard_40to66-59-170","chapter":4,"difficulty":"hard","question":"한 보험금 청구 자동승인 시스템은 3개의 불리언 조건(사고증빙서류제출여부, 청구금액100만원이하여부, 무사고기간3년이상여부)으로 구성된 결정테이블을 사용하며, 실현 불가능한 조합은 없다. 테스터가 6개의 규칙을 커버하는 테스트 케이스를 작성했다면, 결정테이블 커버리지는?","options":["62.5%","66.7%","75%","80%"],"answer":2,"explanation":"총 규칙 2³=8개 중 6개 커버. 커버리지=6/8×100%=75%."},{"id":"new-ch4_hard_40to66-60-171","chapter":4,"difficulty":"hard","question":"한 쇼핑몰의 주문 처리 상태다이어그램은 다음과 같은 유효 전이로 구성된다: ORDER_PLACED --결제성공--> PAID --배송시작--> SHIPPED --배송완료--> DELIVERED, 그리고 ORDER_PLACED --결제실패--> PAYMENT_FAILED --주문취소--> CANCELLED. (두 경로는 서로 다시 합쳐지지 않는다) 초기 상태 ORDER_PLACED에서 시작하여 100% 유효전이 커버리지를 달성하기 위한 최소 테스트 케이스 수는?","options":["1개","2개","3개","5개"],"answer":1,"explanation":"두 경로가 ORDER_PLACED에서 분기된 후 다시 합쳐지지 않으므로 각 경로마다 별도의 테스트 케이스가 필요하다. 최소 2개."},{"id":"new-ch4_hard_40to66-61-172","chapter":4,"difficulty":"hard","question":"한 고객지원 티켓 시스템의 상태다이어그램은 초기 상태 TICKET_CREATED에서 다음과 같이 서로 합쳐지지 않는 3개의 경로로 분기된다: ① TICKET_CREATED --일반접수--> ASSIGNED --처리완료--> CLOSED, ② TICKET_CREATED --긴급접수--> URGENT_ASSIGNED --즉시처리--> CLOSED, ③ TICKET_CREATED --스팸판정--> SPAM_REJECTED. 100% 유효전이 커버리지를 달성하기 위한 최소 테스트 케이스 수는?","options":["2개","3개","4개","5개"],"answer":1,"explanation":"TICKET_CREATED에서 3개의 독립된 경로로 분기되므로 각각 별도의 테스트 케이스가 필요하다. 최소 3개."},{"id":"new-ch4_hard_40to66-62-173","chapter":4,"difficulty":"hard","question":"한 대출심사 시스템의 상태다이어그램은 초기 상태 APPLICATION_RECEIVED에서 다음과 같이 분기된다: ① --신용점수낮음--> AUTO_REJECTED, ② --신용점수높음--> FAST_TRACK_APPROVED, ③ --신용점수보통--> MANUAL_REVIEW --심사승인--> LOAN_APPROVED, ④ MANUAL_REVIEW --심사반려--> LOAN_DENIED. 100% 유효전이 커버리지를 달성하기 위한 최소 테스트 케이스 수는?","options":["2개","3개","4개","6개"],"answer":2,"explanation":"종단 상태(리프)는 AUTO_REJECTED, FAST_TRACK_APPROVED, LOAN_APPROVED, LOAN_DENIED의 4곳이며 서로 다시 합쳐지지 않으므로 최소 4개의 테스트 케이스가 필요하다."},{"id":"new-ch4_hard_40to66-63-174","chapter":4,"difficulty":"hard","question":"한 신호등 제어 시스템의 상태다이어그램에는 총 6개의 상태(RED, RED_YELLOW, GREEN, YELLOW, FLASHING, OFF)가 존재한다. 테스터가 준비한 3개의 테스트 케이스를 실행한 결과, 중복을 제외하고 총 5개의 서로 다른 상태를 통과했다면, 모든 상태 커버리지(all states coverage)는?","options":["60%","66.7%","75%","83.3%"],"answer":3,"explanation":"모든 상태 커버리지=(방문 상태 수)/(전체 상태 수)×100%=5/6×100%≈83.3%."},{"id":"new-ch4_hard_40to66-64-175","chapter":4,"difficulty":"hard","question":"한 도어락 시스템은 3개의 상태(LOCKED, UNLOCKED, ALARM)를 가지며, 다음과 같은 4개의 유효 전이로 구성된다: LOCKED--올바른비밀번호-->UNLOCKED, UNLOCKED--잠금버튼-->LOCKED, LOCKED--문열림시도-->ALARM, ALARM--관리자해제-->LOCKED. (모든 상태의 진입·진출 전이 수가 같아, 초기 상태 LOCKED에서 시작하는 하나의 연속된 경로로 4개의 유효 전이를 모두 한 번씩 커버할 수 있다.) 이 시스템에는 추가로 2개의 비유효 전이(정의되지 않은 이벤트 입력)도 존재한다. 결함 마스킹을 방지하기 위해 각 비유효 전이는 서로 다른 테스트 케이스에서 각각 하나씩만 테스트해야 한다고 할 때, 모든 전이 커버리지 100%를 달성하기 위한 최소 테스트 케이스 수는?","options":["2개","3개","4개","6개"],"answer":1,"explanation":"유효 전이 4개는 LOCKED→UNLOCKED→LOCKED→ALARM→LOCKED의 연속된 1개 경로로 모두 커버 가능(1개). 비유효 전이 2개는 결함 마스킹 방지를 위해 각각 별도의 테스트 케이스가 필요(2개). 최소 테스트 케이스 수=1+2=3개."},{"id":"new-ch4_hard_40to66-65-176","chapter":4,"difficulty":"hard","question":"다음은 회원 등급을 계산하는 의사코드이다.\n```\n1: count = count + 1\n2: result = \"in progress\"\n3: if score >= 90:\n4:     result = \"A\"\n5: elif score >= 80:\n6:     result = \"B\"\n7: elif score >= 70:\n8:     result = \"C\"\n9: else:\n10:    result = \"F\"\n11: print(result)\n12: return result\n```\n실행 가능한 구문은 {1,2,4,6,8,10,11,12} 총 8개이다(조건문 라인 자체는 별도의 구문으로 세지 않음). 테스터가 score=95, score=65, score=85의 3개 테스트 케이스를 실행했다. 이때 구문 커버리지는?","options":["62.5%","75%","87.5%","100%"],"answer":2,"explanation":"score=95→{1,2,4,11,12}, score=65→{1,2,10,11,12}, score=85→{1,2,6,11,12} 실행. 합집합={1,2,4,6,10,11,12}=7개. 70~79 구간에서만 실행되는 8라인(result=\"C\")은 어떤 테스트케이스에서도 실행되지 않았다. 커버리지=7/8×100%=87.5%."},{"id":"new-ch4_hard_40to66-66-177","chapter":4,"difficulty":"hard","question":"다음은 배송비를 계산하는 의사코드이다.\n```\n1: fee = 5000\n2: if weight > 10:\n3:     fee = fee + 3000\n4: if isMember:\n5:     fee = fee - 1000\n6: return fee\n```\n이 코드는 서로 독립된 2개의 if문으로 구성되어 총 4개의 분기(weight>10 참/거짓, isMember 참/거짓)를 갖는다. 테스터가 준비한 2개의 테스트 케이스는 각각 (weight=15, isMember=true), (weight=20, isMember=true)이다. 이때 분기 커버리지는?","options":["25%","50%","75%","100%"],"answer":1,"explanation":"두 테스트 케이스 모두 weight>10이 참, isMember도 참이므로 \"weight>10-참\"과 \"isMember-참\" 2개 분기만 실행된다. \"weight>10-거짓\", \"isMember-거짓\"은 미실행. 커버리지=2/4×100%=50%. (참고: 이 두 테스트 케이스만으로 구문 커버리지는 이미 100%에 도달하므로, 분기 커버리지가 구문 커버리지보다 더 엄격한 기준임을 보여주는 사례이다.)"}];
const CSTS_BANK = [{"id":"csts-exercise-24-1-1","part":"exercise","chapter":0,"qtype":"mc","dupKey":"소프트웨어테스트에관한설명중에서올바른것은무엇인가?","question":"소프트웨어 테스트에 관한 설명 중에서 올바른 것은 무엇인가?","options":["프로그램의 오류를 발견하고 결함을 제거함으로써 프로그램의 품질을 높이는 활동이다.","테스트는 프로그램에 결함이 존재하지 않음을 보여 주기 위한 목적으로 수행한다.","타당하지 않고 예상하지 못한 경우들에 대해서는 테스트를 수행하지 않아도 된다.","프로그램을 가장 잘 이해하는 개발자가 직접 테스트를 수행하는 것이 효과적이다."],"explanation":"② 테스트를 통하여 결함이 없음을 보여 주는 것은 현실적으로 불가능하다. ③ 타당하지 않고 예상하지 못한 경우에 대한 테스트를 반드시 수행해야 한다. ④ 개발자가 아닌 다른 테스터가 테스트를 수행하는 것이 효과적이다.","explSource":"book","answer":0},{"id":"csts-exercise-24-2-2","part":"exercise","chapter":0,"qtype":"mc","dupKey":"완벽한소프트웨어테스트는불가능하다.다음중그이유를가장잘설명한것은?","question":"완벽한 소프트웨어 테스트는 불가능하다. 다음 중 그 이유를 가장 잘 설명한 것은?","options":["테스트 조직이 작아 할당할 수 있는 테스터가 적기 때문이다.","테스트 지식이 부족하고 테스트 전략과 계획의 완성도가 낮기 때문이다.","개발 일정 대신 테스트 일정을 줄여 결과적으로 충분한 테스트 일정을 확보하지 못하기 때문이다.","무한 입력값, 무한 시간, 코드 내 무한 경로 등을 모두 고려해 테스트할 수 없기 때문이다."],"explanation":"완벽한 테스트는 불가능하며, 이는 소프트웨어의 무한 입력값, 실행 시점의 무한 타이밍, 소프트웨어 코드 내 무한 경로 등을 모두 고려해 테스트할 수 없기 때문이다.","explSource":"book","answer":3},{"id":"csts-exercise-24-3-3","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중에서품질보증,테스트,V&V의관계를가장잘표현하고있는것은?※A<B는A의개념보다B가더광범위한용어임을의미한다.A=B는A와B가동일한범위를가짐을의미한","question":"다음 중에서 품질 보증, 테스트, V&V의 관계를 가장 잘 표현하고 있는 것은?\n※ A < B는 A의 개념보다 B가 더 광범위한 용어임을 의미한다. A = B는 A와 B가 동일한 범위를 가짐을 의미한다.","options":["테스트 > V&V = 품질 보증","V&V = 테스트 < 품질 보증","테스트 < V&V < 품질 보증","V&V < 테스트 < 품질 보증"],"explanation":"테스트보다 V&V가 광범위 하고, V&V보다 품질 보증이 광범위하다.","explSource":"book","answer":2},{"id":"csts-exercise-25-4-4","part":"exercise","chapter":1,"qtype":"mc","dupKey":"테스팅과디버깅에대한설명으로올바르지않은것은무엇인가?","question":"테스팅과 디버깅에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["테스팅의 목적은 알려지지 않은 결함을 발견하는 것이다.","테스팅은 외부 개입을 배제하고, 시스템 내부관련자가 수행하는 것이다.","디버깅은 이미 알고 있는 오류를 수정하는 것이다.","디버깅의 주요 작업은 오류의 위치를 파악하고 이를 적절히 수정하는 것이다."],"explanation":"테스팅의 목적은 알려지지 않은 결함을 발견하고자 하는 활동이고, 디버깅은 이미 알고 있는 오류를 수정하는 활동으로 주로 오류의 위치를 찾고 이를 수정하는 작업이 이루어진다.","explSource":"book","answer":1},{"id":"csts-exercise-25-5-5","part":"exercise","chapter":1,"qtype":"mc","dupKey":"다음은무엇에대한설명인가?테스트가테스트요구사항을얼마큼만족하는지나타내는용어로\"테스팅정도에대한양적평가\"를결정하는것이다.이를근거로테스트를얼마나더해야할지","question":"다음은 무엇에 대한 설명인가?\n테스트가 테스트 요구사항을 얼마큼 만족하는지 나타내는 용어로 \"테스팅 정도에 대한 양적 평가\"를 결정하는 것이다. 이를 근거로 테스트를 얼마나 더 해야 할지 멈추어야 할지 결정할 수 있다.","options":["테스트 효율성","테스트 조건","테스트 케이스 실패율","테스트 커버리지"],"explanation":"테스트 커버리지에 대한 설명이다.","explSource":"book","answer":3},{"id":"csts-exercise-25-6-6","part":"exercise","chapter":1,"qtype":"mc","dupKey":"다음중결함(Defect)에대한설명으로올바른것은무엇인가?","question":"다음 중 결함(Defect)에 대한 설명으로 올바른 것은 무엇인가?","options":["에러(Error)에 의해 발생되며 장애(Failure)의 원인이 될 수 있다.","결함이 실행되면 반드시 프로그램의 장애(failure)가 발생된다.","프로그램의 실행 결과와 예상 결과와의 차이를 의미한다.","사용자의 요구사항을 잘못 파악하거나 이해할 때 발생하는 실수를 말한다."],"explanation":"① 결함은 에러에 의해서 발생하며, 장애의 원인이 될 수 있다. ② 결함이 실행된다고 반드시 장애가 발생하는 것은 아니다. ③ 장애에 대한 설명이다. ④ 에러에 대한 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-25-7-7","part":"exercise","chapter":1,"qtype":"ox","dupKey":"소프트웨어테스트에서결함은프로그램의모든부분에걸쳐균일하게분포되어있다는특성을이용하여테스트하는것이효과적이다.","question":"소프트웨어 테스트에서 결함은 프로그램의 모든 부분에 걸쳐 균일하게 분포되어 있다는 특성을 이용하여 테스트하는 것이 효과적이다.","options":["O (맞다)","X (틀리다)"],"explanation":"프로그램 결함은 일부분의 모듈에 집중되어 나타난다.","explSource":"book","answer":1},{"id":"csts-exercise-26-8-8","part":"exercise","chapter":0,"qtype":"short","dupKey":"다음설명은어떤용어에대한설명인지기재하시오.-에러의타입을식별(FaultIdentification)하고,에러를수정(FaultCorrection)하는작","question":"다음 설명은 어떤 용어에 대한 설명인지 기재하시오.\n- 에러의 타입을 식별(Fault Identification)하고, 에러를 수정(Fault Correction)하는 작업이다.\n- 에러의 정확한 위치를 파악(Fault Location)하는 작업이다.\n- 시스템 내부 관련자가 수행한다.","options":[],"explanation":"결함의 타입 식별(Fault Identification), 위치 파악(Fault Location), 수정(Fault Correction)의 세 작업을 함께 수행하는 활동은 디버깅(Debugging)이다. 테스팅은 결함의 존재를 드러내는 활동이고, 디버깅은 드러난 결함의 원인을 찾아 제거하는 활동이라는 점에서 구분된다. 테스팅은 외부 테스터도 수행할 수 있으나 디버깅은 코드를 이해하는 시스템 내부 관련자(개발자)가 수행한다는 설명도 이 구분의 핵심 근거이다.","explSource":"authored","answerText":"디버깅(Debugging)"},{"id":"csts-exercise-26-9-9","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중소프트웨어테스트활동에대한설명으로올바른것은무엇인가?","question":"다음 중 소프트웨어 테스트 활동에 대한 설명으로 올바른 것은 무엇인가?","options":["결함의 위치를 파악하고 제거하는 것을 목적으로 한다.","결함 검출 및 제거를 목표로 하나, 소프트웨어 품질 개선을 목표로 하지 않는다.","정해진 요구사항을 만족하는지 확인하고, 주어진 표준 등을 준수하는지 검증하는 활동이다.","남아 있는 결함이 장애를 일으키지 않음의 증명을 통해 소프트웨어의 품질을 보증하는 활동이다."],"explanation":"① 디버깅에 대한 설명 ② 테스트의 목적은 결함 검출, 품질 평가, 프로세스 개선과 소프트웨어 품질 개선이라고 볼 수 있다. ④ 남아 있는 결함이 장애를 일으키지 않음을 증명할 수 없다.","explSource":"book","answer":2},{"id":"csts-exercise-26-10-10","part":"exercise","chapter":0,"qtype":"short","dupKey":"소프트웨어개발단계중어느시점에발견된결함의수정비용이가장클것으로예상되는지다음보기에서찾아쓰시오.보기:요구사항정의,운영및유지보수,분석,설계,구현,단위테스","question":"소프트웨어 개발 단계 중 어느 시점에 발견된 결함의 수정 비용이 가장 클 것으로 예상되는지 다음 보기에서 찾아 쓰시오.\n보기: 요구사항 정의, 운영 및 유지보수, 분석, 설계, 구현, 단위 테스트, 통합 테스트, 시스템 테스트, 사용자 승인 테스트","options":[],"explanation":"결함 수정 비용은 결함이 유입된 시점과 발견된 시점의 간격이 클수록 기하급수적으로 증가하므로, 개발 생명주기의 가장 뒤쪽인 운영 및 유지보수 단계에서 발견된 결함의 수정 비용이 가장 크다. 이 단계에서는 코드 수정뿐 아니라 영향 분석, 회귀 테스트, 재배포, 사용자 피해 보상까지 수반되기 때문이다. 반대로 요구사항 정의나 분석·설계 단계에서 발견하면 문서 수정만으로 해결되므로 비용이 가장 적으며, 이것이 조기 테스팅(Early Testing) 원리의 근거이다.","explSource":"authored","answerText":"운영 및 유지보수"},{"id":"csts-exercise-40-1-11","part":"exercise","chapter":0,"qtype":"ox","dupKey":"명세기반테스트와구조기반테스트방법은대표적인정적테스트방법이다.","question":"명세 기반 테스트와 구조 기반 테스트 방법은 대표적인 정적 테스트 방법이다.","options":["O (맞다)","X (틀리다)"],"explanation":"명세 기반 방법과 구조 기반 방법은 동적 테스트 방법이다.","explSource":"book","answer":1},{"id":"csts-exercise-40-2-12","part":"exercise","chapter":0,"qtype":"mc","dupKey":"정적테스트에대한설명으로타당하지않은것은무엇인가?","question":"정적 테스트에 대한 설명으로 타당하지 않은 것은 무엇인가?","options":["동적 테스트 방법에서 검출하기 힘든 오류를 찾아낸다.","개발 초기에 오류를 찾아내어 품질을 향상시킨다.","프로그램 개발단계에서 산출되는 결과물에서 결함을 찾아낸다.","코드 분석을 기반으로 프로그램을 실행하여 오류를 찾아낸다."],"explanation":"④ 프로그램을 실행하는 방법은 동적 테스트이다.","explSource":"book","answer":3},{"id":"csts-exercise-40-3-13","part":"exercise","chapter":0,"qtype":"ox","dupKey":"명세기반테스트는특성상시스템및인수테스트단계에서만수행한다.","question":"명세기반 테스트는 특성상 시스템 및 인수 테스트 단계에서만 수행한다.","options":["O (맞다)","X (틀리다)"],"explanation":"명세 기반 테스트는 대상 시스템의 명세 정보를 얻을 수 있는 한, 적용 대상에 제한이 없으며 컴포넌트 테스트, 통합 테스트, 시스템 테스트 및 인수 테스트 전 과정에 걸쳐 사용될 수 있다.","explSource":"book","answer":1},{"id":"csts-exercise-40-4-14","part":"exercise","chapter":0,"qtype":"ox","dupKey":"오류추정은특정소프트웨어에대해테스터의직관과경험을활용하여어떤유형의결함이발생할것을예측하여테스트하는방법이다.","question":"오류 추정은 특정 소프트웨어에 대해 테스터의 직관과 경험을 활용하여 어떤 유형의 결함이 발생할 것을 예측하여 테스트하는 방법이다.","options":["O (맞다)","X (틀리다)"],"explanation":"오류 추정에 대한 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-40-5-15","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중탐색적테스팅에대한설명으로가장거리가먼것은?","question":"다음 중 탐색적 테스팅에 대한 설명으로 가장 거리가 먼 것은?","options":["세션 기반 테스팅을 사용하여 테스트를 구조화한다.","테스트 케이스를 먼저 디자인하지 않는다.","애자일 개발 방법에 적합하지 않다.","다른 테스트 기법의 사용을 포함할 수 있다."],"explanation":"③ 탐색한 테스팅은 애자일 방법을 사용하는 웹 응용 시스템의 테스트에 적합한 방법이다.","explSource":"book","answer":2},{"id":"csts-exercise-41-6-16","part":"exercise","chapter":2,"qtype":"mc","dupKey":"다음설명중에서모델기반테스트와거리가가장먼것은?","question":"다음 설명 중에서 모델 기반 테스트와 거리가 가장 먼 것은?","options":["개발 단계 산출물에 존재할 수 있는 결함을 검출할 수 있다는 이점도 있다.","장애가 발생하였을 때 큰 비용이 유발되는 자동차, 의료 등 안전 필수 소프트웨어를 대상으로 수행되고 있다.","모델을 바탕으로 테스트 계획을 수립하고, 테스트 케이스, 테스트 절차, 테스트 입력 및 예상 결과 등을 결정한다.","기존의 테스팅에서 이용하던 의사결정표, 순서도 등은 모델이 아니다."],"explanation":"모델 기반 테스트 대상의 동작에 대한 상세한 모델링에는 의사결정표, UML 상태 다이어그램, UML 액티비티 다이어그램을 비롯한 정형적 표현법을 사용할 수 있다.","explSource":"book","answer":3},{"id":"csts-exercise-41-7-17","part":"exercise","chapter":2,"qtype":"short","dupKey":"테스트대상의동작에대한정형적명세를바탕으로테스트케이스및테스트절차를자동으로생성하는방식으로수행되는테스팅을무엇이라고하는가?","question":"테스트 대상의 동작에 대한 정형적 명세를 바탕으로 테스트 케이스 및 테스트 절차를 자동으로 생성하는 방식으로 수행되는 테스팅을 무엇이라고 하는가?","options":[],"explanation":"모델 기반 테스트는 테스트 절차를 수행할 수 있는 정보가 자동으로 추출될 수 있을 정도로 정형화되고 상세한 모델을 바탕으로 하여, 테스트 계획을 수립하고, 테스트 케이스, 테스트 절차, 테스트 입력 및 예상 결과 등을 결정한다.","explSource":"book","answerText":"모델 기반 테스팅"},{"id":"csts-exercise-41-8-18","part":"exercise","chapter":2,"qtype":"ox","dupKey":"테스트스텁작성비용이많이드는경우에는상향식통합테스트를수행하면좋다.","question":"테스트 스텁 작성 비용이 많이 드는 경우에는 상향식 통합 테스트를 수행하면 좋다.","options":["O (맞다)","X (틀리다)"],"explanation":"하위에 있는 모듈들을 먼저 통합하기 때문에 스텁을 작성할 필요가 없다.","explSource":"book","answer":0},{"id":"csts-exercise-41-9-19","part":"exercise","chapter":2,"qtype":"mc","dupKey":"다음테스트종류중,분류기준이다른하나는무엇인가?","question":"다음 테스트 종류 중, 분류 기준이 다른 하나는 무엇인가?","options":["성능 테스트 (Performance Test)","시스템 테스트 (System Test)","보안성 테스트 (Security Test)","신뢰성 테스트 (Reliability Test)"],"explanation":"시스템 테스트는 단위, 통합, 시스템과 같이 테스트 레벨(단계)에 의한 구분이고, 나머지는 테스트 특성(유형)에 따른 구분임","explSource":"book","answer":1},{"id":"csts-exercise-42-10-20","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음괄호안에들어갈가장알맞은방법은무엇인가?ISO/IEC/IEEE29119에서는테스트방법을()기반테스트,명세기반테스트,구조기반테스트로분류한다.","question":"다음 괄호 안에 들어갈 가장 알맞은 방법은 무엇인가?\nISO/IEC/IEEE 29119에서는 테스트 방법을 (        ) 기반 테스트, 명세 기반 테스트, 구조 기반 테스트로 분류한다.","options":["경험","키워드","요구사항","시나리오"],"explanation":"(해당 페이지에 해설 및 정답 띠가 촬영되지 않음 - ISO/IEC/IEEE 29119의 테스트 방법 분류는 명세 기반, 구조 기반, 경험 기반이다.)","explSource":"book","answer":0},{"id":"csts-exercise-64-1-21","part":"exercise","chapter":0,"qtype":"mc","dupKey":"소프트웨어개발단계별테스트에대한설명으로올바른것은?","question":"소프트웨어 개발 단계별 테스트에 대한 설명으로 올바른 것은?","options":["단위 테스트: 모듈을 통합하는 과정에 사용되는 인터페이스를 대상으로 상호 작용이 올바르게 이루어지는지 검증하는 테스트","통합 테스트: 개발 시스템이 인수 조건을 만족하는지 검증하는 테스트","시스템 테스트: 시스템이 요구사항에 맞게 개발되었는지 기능 및 비기능 측면을 확인하는 테스트","인수 테스트: 하나의 소프트웨어 단위가 정상적으로 기능을 수행하는지 여부를 확인하는 테스트"],"explanation":"① 통합테스트에 대한 설명이다. ② 인수테스트에 대한 설명이다. ④ 단위테스트에 대한 설명이다.","explSource":"book","answer":2},{"id":"csts-exercise-64-2-22","part":"exercise","chapter":0,"qtype":"mc","dupKey":"상향식통합테스트에대한설명으로가장올바른것은?","question":"상향식 통합 테스트에 대한 설명으로 가장 올바른 것은?","options":["많은 수의 테스트 스텁이 필요하다.","설계 오류를 빨리 발견할 수 있다.","하위 컴포넌트가 충분하게 테스트 된다.","빅뱅 통합 방식의 하나이다."],"explanation":"①, ② 하향식 통합 테스트에 대한 설명이다. ③ 구조도의 하위 계층에 있는 모듈들을 먼저 테스트하므로 하위 모듈들은 충분하게 테스트 된다. ④ 상향식 통합테스트는 점진적 통합테스트 방식의 하나이다.","explSource":"book","answer":2},{"id":"csts-exercise-64-3-23","part":"exercise","chapter":0,"qtype":"ox","dupKey":"FIRST원칙은통합테스트를잘수행하기위한원칙이다.","question":"FIRST 원칙은 통합 테스트를 잘 수행하기 위한 원칙이다.","options":["O (맞다)","X (틀리다)
