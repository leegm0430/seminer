<!-- ISTQB CTFL + CSTS 통합 문제 출제 프로그램: 단일 파일 HTML 퀴즈 앱 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB · CSTS 문제은행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0F1923;
    --bg-elev:#16222E;
    --bg-elev2:#1C2B38;
    --secondary:#00D4FF;
    --accent:#FF6B35;
    --text:#EAF2F7;
    --text-dim:#8DA0AE;
    --border:#26384A;
    --ok:#3DDC84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    min-height:100vh;line-height:1.6;
  }
  #app{max-width:960px;margin:0 auto;padding:24px 20px 80px;}

  /* 헤더 */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 4px 20px;border-bottom:1px solid var(--border);margin-bottom:22px;
    flex-wrap:wrap;gap:10px;
  }
  .brand-chapter{font-size:14px;font-weight:300;color:var(--accent);letter-spacing:.02em;}
  .brand-title{font-size:26px;font-weight:700;margin:4px 0 2px;}
  .brand-sub{font-size:14px;color:var(--text-dim);font-weight:400;}
  .top-right{text-align:right;font-size:13px;color:var(--text-dim);}
  .badge-count{display:inline-block;background:var(--bg-elev2);border:1px solid var(--border);
    border-radius:20px;padding:4px 12px;font-size:13px;color:var(--secondary);font-weight:600;margin-top:4px;}

  /* 시험 선택 탭 */
  .exam-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .exam-tab{
    flex:1;min-width:220px;text-align:left;padding:14px 18px;border-radius:12px;cursor:pointer;
    border:1px solid var(--border);background:var(--bg-elev);transition:border-color .15s,background .15s;
  }
  .exam-tab:hover{border-color:var(--secondary);}
  .exam-tab.active{border-color:var(--secondary);background:rgba(0,212,255,.08);}
  .exam-tab .et-name{font-size:17px;font-weight:700;}
  .exam-tab .et-desc{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .exam-tab.active .et-name{color:var(--secondary);}

  /* 홈 모드 카드 */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;
    padding:22px 20px;cursor:pointer;transition:border-color .15s, transform .15s;
    display:flex;flex-direction:column;gap:8px;min-height:150px;
  }
  .mode-card:hover{border-color:var(--secondary);transform:translateY(-2px);}
  .mode-card .icon{font-size:30px;}
  .mode-card h3{margin:0;font-size:20px;font-weight:700;}
  .mode-card p{margin:0;font-size:14px;color:var(--text-dim);flex:1;}
  .mode-card .tag{align-self:flex-start;font-size:12px;font-weight:600;color:#06222b;
    background:var(--secondary);padding:3px 10px;border-radius:20px;}
  .mode-card .tag.accent{background:var(--accent);color:#2b0f00;}

  .notice-box{
    margin-top:22px;background:var(--bg-elev);border:1px dashed var(--border);border-radius:10px;
    padding:14px 16px;font-size:13px;color:var(--text-dim);
  }
  .notice-box b{color:var(--secondary);}
  .icon-strip{display:flex;gap:14px;justify-content:center;margin-top:28px;font-size:26px;opacity:.5;flex-wrap:wrap;}

  /* 공통 */
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .btn{
    font-family:inherit;font-size:15px;font-weight:600;padding:11px 20px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg-elev2);color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--secondary);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--secondary);color:#06222b;border-color:var(--secondary);}
  .btn-primary:hover{background:#33dcff;}
  .btn-accent{background:var(--accent);color:#2b0f00;border-color:var(--accent);}
  .btn-accent:hover{background:#ff8256;}
  .btn-sm{font-size:13px;padding:7px 13px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .link-back{cursor:pointer;color:var(--text-dim);font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
  .link-back:hover{color:var(--secondary);}
  h2.screen-title{font-size:22px;margin:0 0 4px;font-weight:700;}
  p.screen-sub{margin:0 0 18px;color:var(--text-dim);font-size:14px;}
  h3{font-size:17px;}

  /* 필터 */
  .filter-group{margin-bottom:18px;}
  .filter-label{font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.04em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elev2);
    font-size:13px;cursor:pointer;user-select:none;color:var(--text-dim);
  }
  .chip.active{border-color:var(--secondary);color:var(--secondary);background:rgba(0,212,255,.08);}
  .count-select select{
    background:var(--bg-elev2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;font-family:inherit;font-size:14px;
  }
  .avail-note{font-size:13px;color:var(--text-dim);margin-top:10px;}
  .avail-note b{color:var(--secondary);}

  /* 퀴즈 */
  .progress-bar-wrap{background:var(--bg-elev2);border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px;}
  .progress-bar-fill{background:var(--secondary);height:100%;transition:width .2s;}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .quiz-meta .left{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-dim);flex-wrap:wrap;}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.02em;}
  .badge-ch{background:var(--bg-elev2);border:1px solid var(--border);color:var(--secondary);}
  .badge-diff-easy{background:rgba(0,212,255,.12);color:var(--secondary);}
  .badge-diff-medium{background:rgba(141,160,174,.18);color:#c7d3db;}
  .badge-diff-hard{background:rgba(255,107,53,.14);color:var(--accent);}
  .badge-type{background:rgba(255,107,53,.14);color:var(--accent);}
  .timer{font-size:15px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .timer.warn{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .question-text{font-size:18.5px;font-weight:600;margin:14px 0 18px;white-space:pre-wrap;word-break:break-word;}
  .question-text pre{
    background:#0a1319;border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    overflow-x:auto;font-size:14px;color:#b9e6f5;white-space:pre;font-family:'SFMono-Regular',Consolas,monospace;
    font-weight:400;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg-elev2);cursor:pointer;font-size:15px;
    transition:border-color .12s, background .12s;
  }
  .option:hover{border-color:var(--secondary);}
  .option .opt-letter{
    width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--text-dim);
  }
  .option.selected{border-color:var(--secondary);background:rgba(0,212,255,.08);}
  .option.selected .opt-letter{background:var(--secondary);color:#06222b;border-color:var(--secondary);}
  .option.correct{border-color:var(--ok);background:rgba(61,220,132,.1);}
  .option.correct .opt-letter{background:var(--ok);color:#04270f;border-color:var(--ok);}
  .option.wrong{border-color:var(--accent);background:rgba(255,107,53,.1);}
  .option.wrong .opt-letter{background:var(--accent);color:#2b0f00;border-color:var(--accent);}
  .option.ox{justify-content:flex-start;font-size:17px;font-weight:600;}

  .short-input{
    width:100%;padding:13px 16px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-elev2);color:var(--text);font-family:inherit;font-size:16px;
  }
  .short-input:focus{outline:none;border-color:var(--secondary);}
  .short-hint{font-size:12.5px;color:var(--text-dim);margin-top:8px;}

  .explanation-box{
    margin-top:18px;padding:16px 18px;border-radius:10px;background:var(--bg-elev2);
    border-left:3px solid var(--secondary);font-size:14px;color:var(--text-dim);
  }
  .explanation-box.wrong-border{border-left-color:var(--accent);}
  .explanation-box b{color:var(--text);}
  .answer-line{color:var(--ok);font-weight:600;margin:4px 0 8px;}
  .result-tag{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:8px;}
  .result-tag.ok{background:rgba(61,220,132,.15);color:var(--ok);}
  .result-tag.no{background:rgba(255,107,53,.15);color:var(--accent);}

  /* 결과 */
  .score-hero{text-align:center;padding:24px 10px 8px;}
  .score-num{font-size:50px;font-weight:800;color:var(--secondary);line-height:1.1;}
  .score-num.fail{color:var(--accent);}
  .score-label{font-size:14px;color:var(--text-dim);margin-top:6px;}
  .pass-pill{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;padding:6px 18px;border-radius:20px;}
  .pass-pill.pass{background:rgba(61,220,132,.15);color:var(--ok);}
  .pass-pill.fail{background:rgba(255,107,53,.15);color:var(--accent);}

  table.stat-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;}
  table.stat-table th,table.stat-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  table.stat-table th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .bar-cell{display:flex;align-items:center;gap:8px;}
  .bar-track{flex:1;height:6px;background:var(--bg-elev2);border-radius:4px;overflow:hidden;min-width:60px;}
  .bar-fill{height:100%;background:var(--secondary);}

  .review-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:10px;background:var(--bg-elev2);}
  .review-item .rq{font-size:14px;font-weight:600;margin-bottom:6px;white-space:pre-wrap;}
  .review-item .rq pre{font-size:13px;background:#0a1319;padding:10px;border-radius:6px;overflow-x:auto;font-weight:400;}
  .review-item .ra{font-size:13px;color:var(--text-dim);margin:2px 0;}
  .review-item .ra.wrong-line{color:var(--accent);}
  .review-item .ra.correct-line{color:var(--ok);}
  .badges{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  details.review-details summary{cursor:pointer;font-size:13px;color:var(--secondary);margin-top:6px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state .icon{font-size:40px;margin-bottom:10px;}
  .notebook-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:10px;background:var(--bg-elev2);
  }
  .notebook-item .nq{font-size:14px;flex:1;white-space:pre-wrap;}
  .remove-x{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 8px;}
  .remove-x:hover{color:var(--accent);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);margin-top:6px;}
  footer.foot{margin-top:50px;text-align:center;font-size:12px;color:var(--text-dim);opacity:.6;}

  /* 공부 모드 */
  .study-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .study-tab{
    padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev2);
    font-size:14px;font-weight:600;color:var(--text-dim);cursor:pointer;
  }
  .study-tab:hover{border-color:var(--secondary);}
  .study-tab.active{border-color:var(--secondary);color:var(--secondary);background:rgba(0,212,255,.08);}
  .search-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .search-input{
    flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-elev2);color:var(--text);font-family:inherit;font-size:15px;
  }
  .search-input:focus{outline:none;border-color:var(--secondary);}
  .result-count{font-size:13px;color:var(--text-dim);}

  .study-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:var(--bg-elev2);}
  .study-card .sq{font-size:15.5px;font-weight:600;margin:8px 0 10px;white-space:pre-wrap;word-break:break-word;}
  .study-card .sq pre, .study-card .sx pre{
    background:#0a1319;border:1px solid var(--border);border-radius:8px;padding:11px 13px;overflow-x:auto;
    font-size:13px;color:#b9e6f5;white-space:pre;font-family:'SFMono-Regular',Consolas,monospace;font-weight:400;
  }
  .study-opt{font-size:14px;padding:6px 10px;border-radius:7px;margin:3px 0;color:var(--text-dim);}
  .study-opt.is-answer{background:rgba(61,220,132,.12);color:var(--text);font-weight:600;}
  .study-answer{margin-top:10px;font-size:14px;color:var(--ok);font-weight:600;}
  .study-expl{margin-top:8px;font-size:14px;color:var(--text-dim);border-left:3px solid var(--secondary);padding-left:12px;}
  .study-expl b{color:var(--text);}
  .src-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--border);color:var(--text-dim);}
  .hidden-answer{filter:blur(5px);transition:filter .15s;cursor:pointer;}
  .hidden-answer:hover{filter:none;}

  .term-card{border:1px solid var(--border);border-radius:12px;padding:15px 17px;margin-bottom:10px;background:var(--bg-elev2);}
  .term-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px;}
  .term-name{font-size:17px;font-weight:700;color:var(--secondary);}
  .term-en{font-size:13px;color:var(--text-dim);}
  .term-def{font-size:14.5px;}
  .term-note{margin-top:8px;font-size:13px;color:var(--accent);}
  .formula-block{
    background:#0a1319;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:8px 0;
    font-size:14px;color:#b9e6f5;white-space:pre-wrap;font-family:'SFMono-Regular',Consolas,monospace;
  }
  .f-label{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:10px;}
  .f-body{font-size:14px;white-space:pre-wrap;}
  .more-btn-wrap{text-align:center;margin-top:14px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== 문제은행 데이터 (임베드) ===================== */
const ISTQB_BANK = [{"id":"easy-A1","chapter":1,"difficulty":"easy","question":"다음 설명 중 유효한 테스트 목적인 것은?","options":["테스트 중인 시스템에 수정되지 않은 결함이 없음을 증명하기 위해","운영 환경에 구현한 시스템에 오류가 없음을 증명하기 위해","테스트 대상의 리스크 수준을 낮추고, 품질 수준에 대한 자신감을 얻기 위해","테스트하지 않은 입력 조합이 없는지 확인하기 위해"],"answer":2,"explanation":"테스팅은 결함과 장애를 찾아 리스크 수준을 낮추고 품질에 대한 신뢰를 높이는 것이 목적이다. A·D는 \"결함이 없음을 증명\"하거나 \"모든 입력 조합 확인\"이 불가능하다는 테스팅 원리(완벽한 테스팅 불가)에 위배되고, B는 운영 환경 무결함 증명이 불가능하다는 원리에 위배된다."},{"id":"easy-A2","chapter":1,"difficulty":"easy","question":"다음 중 테스트 활동이 성공에 기여하는 예를 나타내는 옵션은?","options":["소프트웨어 개발 수명주기의 다양한 활동에 테스터가 참여함으로써 작업 산출물의 결함 식별을 지원한다","개발자가 코드를 개발하는 동안 테스터가 방해하지 않도록 애씀으로써 개발자가 더 좋은 코드를 작성할 수 있게 한다","최종 사용자와 협업하는 테스터는 단위 통합 및 시스템 테스팅 중 작성하는 결함 보고서의 품질을 높인다","자격증을 보유한 테스터가 자격증이 없는 테스터보다 훨씬 좋은 테스트 케이스를 작성할 것이다"],"answer":0,"explanation":"SDLC 초기부터 테스터가 참여하면 설계 결정을 더 잘 이해하고 결함을 조기에 발견할 수 있다. B·C·D는 근거 없는 잘못된 진술이다."},{"id":"easy-A3","chapter":1,"difficulty":"easy","question":"당신은 새로운 시스템을 점진적으로 개발하고 있는 팀의 테스터이다. 여러 번의 반복주기가 진행되는 동안 리그레션 테스트 케이스가 바뀌지 않았고, 새로운 리그레션 결함도 식별되지 않았음을 확인했다. 팀의 관리자는 기뻐하고 있지만, 당신은 그렇지 못하다. 당신이 걱정하고 있는 것을 설명하는 테스팅의 원리는?","options":["테스트 효과는 줄어든다","결함 부재의 논리는 궤변이다","결함은 집중된다","완벽한 테스팅은 불가능하다"],"answer":0,"explanation":"동일한 테스트를 계속 반복하면 결국 새로운 결함을 더 이상 찾지 못하게 된다는 \"살충제 패러독스(테스트 효과 감소)\" 원리를 설명한다."},{"id":"easy-A4","chapter":1,"difficulty":"easy","question":"당신은 배달 주문 모바일 애플리케이션을 개발하는 팀에서 일하고 있다. 팀은 현재 반복 주기에서 결제 기능을 구현하기로 결정했다.\n다음 중 테스트 분석 활동은?","options":["결제 서비스와의 통합을 테스트하는 데 8 M/D가 소요될 것으로 예상하는 행위","한 건의 주문에 여러 명이 각자 결제를 할 수 있는지 팀이 테스트해야 한다고 결정하는 행위","경계값 분석으로 최소 결제 금액 처리를 확인하는 테스트 케이스에 필요한 테스트 데이터를 도출하는 행위","신용카드 결제를 확인하는 테스트 케이스를 실행한 후, 실제 결과와 기대 결과의 차이를 분석해서 결함을 보고하는 행위"],"answer":1,"explanation":"테스트 컨디션을 정의하는 것은 테스트 분석 활동이다. A는 테스트 계획, C는 테스트 설계, D는 테스트 실행 단계에 해당한다."},{"id":"easy-A5","chapter":1,"difficulty":"easy","question":"다음 예시 중 테스트 프로세스에 중대한 영향을 미치는 요소를 고르시오.\ni. 소프트웨어 개발 수명주기(SDLC)\nii. 이전 프로젝트에서 식별한 결함 수\niii. 식별한 제품 리스크\niv. 체계적인 화이트 박스 테스팅을 강제하는 새로운 규제\nv. 테스트 환경 설정","options":["i, ii","i, iii, iv","ii, iv, v","iii, v"],"answer":1,"explanation":"SDLC, 식별된 제품 리스크, 규제 요구사항(i, iii, iv)이 테스트 프로세스에 중대한 영향을 준다."},{"id":"easy-A6","chapter":1,"difficulty":"easy","question":"다음 중 주로 테스팅 역할을 하는 사람이 수행하는 작업 두 가지는?","options":["테스트 환경 구성","제품 백로그 유지보수","새로운 요구사항을 위한 해결방안 설계","테스트 계획 생성","테스트 베이시스 분석"],"answer":[0,4],"explanation":"테스트 환경 구성과 테스트 베이시스 분석은 테스터가 수행한다."},{"id":"easy-A7","chapter":1,"difficulty":"easy","question":"다음 예시 중 테스터에게 가장 중요한 역량(skills)은?\ni. 도메인 지식 보유\nii. 제품 비전 수립 능력\niii. 좋은 팀 구성원 되기\niv. 팀이 수행하는 일의 계획 및 구성 능력\nv. 비판적 사고","options":["ii, iv","i, iii, v","i, ii, v","iii, iv"],"answer":1,"explanation":"도메인 지식, 팀워크, 비판적 사고(i, iii, v)가 테스터의 핵심 역량이다."},{"id":"easy-A8","chapter":1,"difficulty":"easy","question":"다음 중 전체 팀 접근법(Whole team approach)이 테스터와 비즈니스 담당자 간의 상호 작용에서 어떻게 나타나는지에 대한 올바른 예제인 것은?","options":["비즈니스 담당자가 테스트 자동화 접근법을 결정한다","테스터가 비즈니스 담당자의 테스트 전략 결정을 지원한다","비즈니스 담당자는 전체 팀 접근법의 구성원이 아니다","테스터가 비즈니스 담당자의 적절한 인수 테스트 작성을 지원한다"],"answer":3,"explanation":"테스터가 비즈니스 담당자와 긴밀히 협력해 적절한 인수 테스트 작성을 지원하는 것이 전체 팀 접근법의 대표적 예이다."},{"id":"easy-A9","chapter":2,"difficulty":"easy","question":"\"모든 소프트웨어 개발 수명주기(SDLC) 활동에는 그에 상응하는 테스트 활동이 있다.\" 이 규칙은 어떤 소프트웨어 개발 수명주기 모델에 적용되는가?","options":["순차적 개발 모델에만","반복적 개발 모델에만","반복적, 점진적 개발 모델에만","순차적, 점진적, 반복적 개발 모델에"],"answer":3,"explanation":"이 규칙(V모델의 원리)은 특정 모델에 국한되지 않고 모든 SDLC 모델에 공통으로 적용된다."},{"id":"easy-A10","chapter":2,"difficulty":"easy","question":"다음 중 인수 테스트 주도 개발(ATDD) 접근법을 가장 잘 설명한 것은?","options":["인수 테스트 주도 개발에서는 일반적으로 인수 조건을 given/when/then 형식으로 작성한다","인수 테스트 주도 개발에서는 테스트 케이스가 주로 단위 테스팅 수준에서 작성되며 코드 지향적이다","인수 테스트 주도 개발에서는 관련 소프트웨어 개발을 주도하기 위해 인수 조건을 기반으로 테스트를 작성한다","인수 테스트 주도 개발에서는 테스트가 소프트웨어의 기대 동작을 기반으로 하므로 팀원들이 이를 더 쉽게 이해할 수 있다"],"answer":2,"explanation":"given/when/then 형식은 BDD, 코드 지향적 단위 테스트는 TDD에 대한 설명이다."},{"id":"easy-A11","chapter":2,"difficulty":"easy","question":"다음 중 시프트 레프트 접근법(shift-left approach)의 사례가 아닌 것은?","options":["이해관계자가 공식적으로 승인하기 전에 사용자 요구사항 검토","관련 코드가 작성되기 전에 연관된 단위 테스트 작성","컴포넌트 테스팅을 하는 동안 컴포넌트에 대한 성능 테스트 실행","형상 관리 프로세스를 구축하기 전에 테스트 스크립트 작성"],"answer":3,"explanation":"테스트 스크립트는 형상 관리 대상이므로, 형상 관리 프로세스가 구축되기 전에 작성하는 것은 시프트 레프트 사례가 아니다."},{"id":"easy-A12","chapter":2,"difficulty":"easy","question":"관리자가 각 릴리스 주기가 끝날 때 회고(retrospectives)를 주최하도록 설득하기 위한 주장 중 가장 적절한 것은?","options":["최근 회고의 인기가 매우 높으며 프로세스에 회고를 추가하면 고객이 좋아할 것이다","회고를 수행하지 않으면 최종 사용자 대표가 제품에 대한 즉각적인 피드백을 제공할 수 없기 때문에 회고를 수행하는 것이 조직의 비용 절감에 도움이 될 것이다","회고 과정에서 조직의 프로세스 약점을 식별해서 지속적인 프로세스 개선 과정에서 수행해야 할 작업 목록으로 사용할 수 있다","회고는 조직의 지속적인 발전에 중요한 용기와 존중 등 다섯 가지 가치가 발현될 수 있도록 한다"],"answer":2,"explanation":"회고는 팀 내부 프로세스의 약점을 식별해 개선 작업 목록으로 활용하는 데 목적이 있다."},{"id":"easy-A13","chapter":2,"difficulty":"easy","question":"장애 유형과 테스트 레벨을 올바르게 연결한 것은?\n1. 사용자의 비즈니스 요구와 다른 시스템 동작으로 인한 장애\n2. 컴포넌트 간 통신 실패로 인한 장애\n3. 코드 내 논리로 인한 장애\n4. 올바르게 구현되지 않은 비즈니스 규칙으로 인한 장애\nA. 단위 테스팅 B. 단위 통합 테스팅 C. 시스템 테스팅 D. 인수 테스팅","options":["1D, 2B, 3A, 4C","1D, 2B, 3C, 4A","1B, 2A, 3D, 4C","1C, 2B, 3A, 4D"],"answer":0,"explanation":"인수 테스팅의 테스트 베이시스는 사용자 비즈니스 요구(1D), 컴포넌트 간 통신은 단위 통합 테스팅(2B), 코드 내 논리 장애는 단위 테스팅(3A), 비즈니스 규칙은 시스템 테스팅(4C)이다."},{"id":"easy-A14","chapter":2,"difficulty":"easy","question":"당신은 세 가지 인수 조건 AC1, AC2, AC3을 사용해 사용자 스토리를 테스트하고 있다. AC1은 테스트 케이스 TC1로, AC2는 TC2로, AC3은 TC3으로 커버한다. 첫 번째 실행: TC1(1)실패, TC2(2)합격, TC3(3)실패. 두 번째 실행: TC1(4)합격, TC2(5)실패, TC3(6)실패. 세 번째 실행: TC1(7)합격, TC2(8)합격, TC3(9)합격.\n다음 중 리그레션 테스트로 수행된 테스트는?","options":["4, 7, 8, 9","5, 7","4, 6, 8, 9","5, 6"],"answer":1,"explanation":"TC2가 첫 실행(2)에서 합격했다가 두 번째 실행(5)에서 실패했으므로 (5)는 리그레션 테스트다. TC1이 두 번째(4)에서 합격 후 세 번째(7)에서도 재확인됐으므로 (7)도 리그레션 테스트다."},{"id":"easy-A15","chapter":3,"difficulty":"easy","question":"다음 중 정적 테스팅의 이점이 아닌 것은?","options":["소프트웨어 수명 주기(SDLC) 후반에 결함을 더 많이 식별하므로 결함 관리 비용이 적게 든다","일반적으로 정적 테스팅 중 식별한 결함을 수정하는 것이 동적 테스팅 중 식별한 결함을 수정하는 것보다 비용이 훨씬 적게 든다","동적 테스팅만으로는 식별하지 못할 수 있는 코딩 결함을 식별할 수 있다","요구사항과의 차이 및 요구사항 내 불일치를 식별할 수 있다"],"answer":0,"explanation":"정적 테스팅의 이점은 SDLC 초반에 결함을 조기에 찾아 비용을 줄이는 것이다."},{"id":"easy-A16","chapter":3,"difficulty":"easy","question":"다음 중 피드백을 조기에 자주 받았을 때의 이점인 것은?","options":["향후 프로젝트를 위해 테스트 프로세스를 개선할 수 있다","고객이 합의된 리스크에 따라 요구사항의 우선순위를 정하도록 한다","변경 사항의 품질을 측정할 수 있다","요구사항에 대한 오해를 피하는 데 도움이 된다"],"answer":3,"explanation":"조기·잦은 피드백은 요구사항 오해를 방지하는 데 도움을 준다."},{"id":"easy-A17","chapter":3,"difficulty":"easy","question":"조직에서 수행하고 있는 리뷰가 다음과 같은 특징을 가지고 있다: 서기 역할을 하는 사람이 있다, 주요 목적은 품질을 평가하는 것이다, 작업 산출물 작성자가 회의를 주도한다, 개별 준비 단계가 있다, 리뷰 보고서를 작성한다.\n다음 중 사용하고 있는 리뷰 유형일 가능성이 가장 높은 것은?","options":["비공식 리뷰(Informal review)","워크쓰루(Walkthrough)","기술 리뷰(Technical review)","인스펙션(Inspection)"],"answer":1,"explanation":"작업 산출물 작성자가 회의를 주도하는 것은 워크쓰루의 특징이다."},{"id":"easy-A18","chapter":3,"difficulty":"easy","question":"다음 중 성공적인 리뷰에 기여하는 요소가 아닌 것은?","options":["참가자는 리뷰에 필요한 적절한 시간을 할애해야 한다","필요한 노력의 부담을 줄이기 위해 규모가 큰 작업 산출물을 작은 단위로 나눈다","참가자는 지루함, 분노, 다른 참가자에 대한 적대감으로 비칠 수 있는 행동을 삼가야 한다","식별한 장애를 인정, 환영하고 객관적으로 처리해야 한다"],"answer":3,"explanation":"리뷰는 정적 테스팅이므로 실행 중 발생하는 \"장애\"가 아니라 \"결함\"을 찾는다."},{"id":"easy-A19","chapter":4,"difficulty":"easy","question":"다음 중 경험 기반(experience-based) 테스트 기법의 특징은?","options":["테스트 케이스는 상세 설계 정보를 기반으로 작성한다","인터페이스 코드에서 테스트하는 항목은 커버리지를 측정하는 데 사용한다","이 테스트 기법은 소프트웨어 및 비즈니스 도메인에 대한 테스터의 지식에 크게 의존한다","테스트 케이스는 요구사항과의 차이를 식별하기 위해 사용한다"],"answer":2,"explanation":"경험 기반 기법은 테스터의 지식과 경험에 크게 의존한다."},{"id":"easy-A20","chapter":4,"difficulty":"easy","question":"검색 옵션이 2개뿐인 단순한 아파트 검색 기능을 테스트하고 있다. (층: 지상층/1층/2층 이상, 정원: 정원 없음/작은 정원/큰 정원) 지상 층 아파트에는 정원이 있고, 더 높은 층은 정원이 없다는 규칙을 위반한 검색은 허용하지 않는다.\n100% 유효한 동등분할 커버리지를 달성하기 위한 최소 테스트 케이스 수는?","options":["3","4","5","6"],"answer":1,"explanation":"TC1: 지상층·작은정원, TC2: 지상층·큰정원, TC3: 1층·정원없음, TC4: 2층이상·정원없음 총 4개가 필요하다."},{"id":"easy-A21","chapter":4,"difficulty":"easy","question":"학생의 최종 성적을 계산하는 시스템을 테스트하고 있다. (등급 경계: 0~50 탈락, 51~60 보통, 61~70 만족, 71~80 좋음, 81~90 매우 좋음, 91~100 우수)\n테스트 케이스로 달성한 최종 점수(91, 50, 81, 60, 70, 80)에 대한 두 개 선택 경계값 분석(2-value BVA) 커버리지는?","options":["50%","60%","33.3%","100%"],"answer":0,"explanation":"경계값은 0,50,51,60,61,70,71,80,81,90,91,100 총 12개이며, 제시된 값은 6개만 커버하므로 50%다."},{"id":"easy-A22","chapter":4,"difficulty":"easy","question":"자전거 대여점의 고객 관리 시스템: 누구나 자전거를 빌릴 수 있고 회원은 20% 할인을 받으나 반납기한을 어긴 경우 할인이 적용되지 않는다. 15회 대여 후 회원은 티셔츠를 선물로 받는다.\n결정테이블의 조건 중 불가능한 상황인 것은?","options":["R4","R2","R6","R8"],"answer":3,"explanation":"R8은 비회원이면서 15회 대여한 경우인데, 티셔츠는 회원 전용 혜택이라 모순이다."},{"id":"easy-A23","chapter":4,"difficulty":"easy","question":"상태 전이 다이어그램(INIT→test→DEBUG MODE→done→OFF, INIT→run→IN OPERATION, DEBUG MODE→error→IN OPERATION, IN OPERATION→pause→ON HOLD→resume→IN OPERATION, ON HOLD→done→OFF)으로 수명주기를 모델링한 시스템.\n100% 유효 전이 커버리지를 달성하기 위한 최소 테스트 케이스 수는?","options":["4","2","7","3"],"answer":3,"explanation":"test/error 전이와 두 개의 done 전이가 하나의 테스트 케이스로 동시에 커버되지 않아 최소 3개가 필요하다."},{"id":"easy-A24","chapter":4,"difficulty":"easy","question":"100% 구문 커버리지를 달성했다. 이것은 무엇을 의미하는가?","options":["코드 중 결함을 가지고 있는 각 명령어가 최소 한번은 실행됐다","더 많은 테스트 케이스를 가진 테스트 스위트는 100% 구문 커버리지를 달성하게 될 것이다","코드에 있는 모든 경로가 한번 이상 실행됐다","입력값의 모든 조합이 적어도 한번은 테스트됐다"],"answer":0,"explanation":"100% 구문 커버리지는 결함이 있는 구문을 포함해 모든 구문이 최소 한 번 실행됐음을 의미한다."},{"id":"easy-A25","chapter":4,"difficulty":"easy","question":"다음 중 화이트박스 테스팅에 대한 설명으로 옳지 않은 것은?","options":["화이트박스 테스팅을 진행하는 동안 전체 소프트웨어 구현을 고려하게 된다","화이트박스 커버리지 측정지표는 코드 커버리지를 늘리기 위해 추가로 필요한 테스트를 식별하는 데 도움이 될 수 있다","화이트박스 테스트 기법은 정적 테스팅에 사용할 수 있다","화이트박스 테스팅은 구현된 사항이 요구사항과 어떤 차이가 있는지 식별하는 데 도움이 될 수 있다"],"answer":3,"explanation":"화이트박스 기법은 코드 구조 기반이라 요구사항 대비 구현 누락 식별에는 취약하다."},{"id":"easy-A26","chapter":4,"difficulty":"easy","question":"다음 중 오류 추정(Error guessing)의 개념을 가장 잘 설명한 것은?","options":["오류 추정은 과거 식별한 결함과 개발자가 일반적으로 하는 실수에 대해 테스터가 가진 지식과 경험을 활용한다","오류 추정은 테스터의 개인적인 개발 경험과 개발자로서 했던 실수에 대한 경험을 활용한다","오류 추정을 위해서는 테스터가 테스트하는 대상의 사용자라고 상상하고 사용자가 겪을 수 있는 오류를 추정해야 한다","오류 추정을 위해서는 개발자가 할만한 실수를 파악하기 위해 개발 과정을 빠르게 직접 따라해 봐야 한다"],"answer":0,"explanation":"오류 추정의 핵심은 과거 결함과 개발자 실수에 대한 지식·경험 활용이다."},{"id":"easy-A27","chapter":4,"difficulty":"easy","question":"프로젝트에서 출시가 지연되고 테스트가 늦게 시작되었지만 매우 상세한 도메인 지식과 우수한 분석 기술을 보유하고 있다. 요구사항 전체 목록이 아직 공유되지 않았지만, 관리자는 테스트 결과를 일부라도 보여달라고 한다.\n이 상황에 가장 적합한 테스트 기법은?","options":["체크리스트 기반 테스팅","오류 추정","탐색적 테스팅","분기 테스팅"],"answer":2,"explanation":"명세와 시간이 부족한 상황에서는 탐색적 테스팅이 가장 유용하다."},{"id":"easy-A28","chapter":4,"difficulty":"easy","question":"다음 중 인수 조건을 문서화하는 방법을 가장 잘 설명한 것은?","options":["이해관계자의 실제 요구사항을 판단하기 위해 회고를 수행한다","예제 테스트 컨디션을 설명하기 위해 given/when/then 형식을 사용해 작성한다","오해를 줄이기 위해 구두로 의사소통을 한다","리스크 기반 테스팅이 이루어질 수 있도록 리스크를 테스트 계획서에 기록한다"],"answer":1,"explanation":"given/when/then 형식은 인수 조건을 문서화하는 표준적인 방법이다."},{"id":"easy-A29","chapter":4,"difficulty":"easy","question":"사용자 스토리: 편집자로서 문서가 게시되기 전에 내용을 리뷰해 문법이 정확한지 확인하려고 한다. 인수 조건: 편집자 로그인, 문서 조회, 페이지 편집, 마크업 메모 추가, 변경 사항 저장, 역할 변경 가능.\n다음 중 이 사용자 스토리에 대한 인수 테스트 주도 개발(ATDD) 테스트의 예로 가장 적절한 것은?","options":["편집자가 페이지 내용을 편집한 후 문서를 저장할 수 있는지 확인하는 테스트","문서 소유자가 로그인하여 문서를 업데이트할 수 있는지 확인하는 테스트","편집자가 편집된 문서의 게시 일정을 예약할 수 있는지 확인하는 테스트","편집자가 업데이트를 위해 다른 편집자를 지정할 수 있는지 확인하는 테스트"],"answer":0,"explanation":"이 테스트는 인수 조건에 명시된 \"페이지 편집\"과 \"변경 사항 저장\"을 직접 커버한다."},{"id":"easy-A30","chapter":5,"difficulty":"easy","question":"다음 중 테스터가 반복주기 및 릴리스 계획에 기여하는 방법을 올바르게 설명한 것은?","options":["테스터는 개발할 사용자 스토리의 우선순위를 결정한다","테스터는 테스트할 시스템의 기능적 측면에만 집중한다","테스터는 사용자 스토리에 대한 구체적인 리스크 식별 및 평가 과정에 참여한다","테스터는 릴리스 계획 단계에서 조기 테스트 설계를 통한 고품질 소프트웨어의 출시를 보장한다"],"answer":2,"explanation":"테스터는 사용자 스토리에 대한 리스크 식별·평가에 참여함으로써 가치를 제공한다."},{"id":"easy-A31","chapter":5,"difficulty":"easy","question":"다음 중 시스템 테스팅 완료 기준이 될 수 있는 두 가지는?","options":["테스트 환경 준비 상황","테스터가 테스트 대상에 로그인할 수 있는지 여부","예상 결함 밀도 도달","given/when/then 형식으로의 요구사항 변환","리그레션 테스트 자동화"],"answer":[2,4],"explanation":"C(결함 밀도 도달)와 E(리그레션 자동화)가 완료 조건이고, 나머지는 시작 조건이다."},{"id":"easy-A32","chapter":5,"difficulty":"easy","question":"3점 추정 기법 사용: 가장 낙관적 2M/H, 가장 유력한 11M/H, 가장 비관적 14M/H.\n최종 추정치는?","options":["9M/H","14M/H","11M/H","10M/H"],"answer":3,"explanation":"(2+4*11+14)/6=60/6=10M/H."},{"id":"easy-A33","chapter":5,"difficulty":"easy","question":"음식점 검색 앱: TC001 음식종류선택(우선순위3, 종속없음), TC002 음식점선택(우선순위2, 종속TC001), TC003 경로획득(우선순위1, 종속TC002), TC004 식당에전화하기(우선순위2, 종속TC002), TC005 예약하기(우선순위3, 종속TC002).\n다음 중 세 번째로 실행할 테스트 케이스는?","options":["TC003","TC005","TC002","TC001"],"answer":0,"explanation":"TC001(1번째)→TC002(2번째)→TC003(3번째, 우선순위가 가장 높음)."},{"id":"easy-A34","chapter":5,"difficulty":"easy","question":"다음 중 테스트 유형과 애자일 테스팅 사분면이 올바르게 짝지어진 것은? 1.사용성테스팅 2.단위테스팅 3.기능테스팅 4.신뢰성테스팅. A.1사분면(기술,팀지원) B.2사분면(비즈니스,팀지원) C.3사분면(비즈니스,제품평가) D.4사분면(기술,제품평가)","options":["1C, 2A, 3B, 4D","1D, 2A, 3C, 4B","1C, 2B, 3D, 4A","1D, 2B, 3C, 4A"],"answer":0,"explanation":"사용성테스팅=3사분면(1-C), 단위테스팅=1사분면(2-A), 기능테스팅=2사분면(3-B), 신뢰성테스팅=4사분면(4-D)."},{"id":"easy-A35","chapter":5,"difficulty":"easy","question":"리스크: 보고서 생성에 너무 많은 시간이 걸림, 발생가능성 중간·영향도 높음. 대응방법: 시스템 테스팅 중 독립 테스트팀이 성능 효율성 테스팅 수행, 알파·베타 테스팅 수행.\n다음 중 대응 방법으로 제안된 것은?","options":["리스크 수용","비상 대책","리스크 완화","리스크 전가"],"answer":2,"explanation":"테스팅을 통한 대응은 리스크 완화에 해당한다."},{"id":"easy-A36","chapter":5,"difficulty":"easy","question":"다음 중 주어진 반복주기에서 완료된 작업량과 남은 총 작업량을 보여주기 위해 애자일 팀이 사용할 수 있는 작업 산출물은?","options":["인수 조건","결함 보고서","테스트 완료 보고서","번다운(Burndown) 차트"],"answer":3,"explanation":"번다운 차트는 남은 작업량을 매일 시각적으로 보여주는 작업 산출물이다."},{"id":"easy-A37","chapter":5,"difficulty":"easy","question":"새로운 요구사항에 맞게 자동화된 테스트 스크립트를 업데이트해야 한다. 다음 중 테스트 저장소에 새로운 버전의 테스트 스크립트를 생성하도록 하는 프로세스는?","options":["추적성 관리","유지보수 테스팅","형상 관리","요구공학"],"answer":2,"explanation":"테스트 스크립트도 형상 관리 대상이므로 버전 관리를 통해 새 버전을 저장소에 생성하는 것은 형상 관리이다."},{"id":"easy-A38","chapter":5,"difficulty":"easy","question":"개발자로부터 이상 현상이 재현 불가능하다는 결함 보고서를 받았다. (애플리케이션 멈춤, 특정 값 입력 시 멈추고 다른 계정으로도 재현되나 오류 메시지는 없고 로그에 치명적 오류 알림 포함)\n이 테스트 보고서에서 누락된 중요한 정보는?","options":["기대 결과와 실제 결과","참고자료 및 결함 상태","테스트 환경 및 테스트 항목","우선순위 및 심각도"],"answer":2,"explanation":"어떤 테스트 환경과 버전에서 발생했는지 정보가 빠져 있어 재현이 어렵다."},{"id":"easy-A39","chapter":6,"difficulty":"easy","question":"다음 중 데이터 준비 도구가 지원하는 테스트 활동은?","options":["테스트 모니터링과 테스트 제어","테스트 분석과 설계","테스트 설계와 테스트 구현","테스트 완료"],"answer":2,"explanation":"데이터 준비 도구는 테스트 구현 활동(테스트 데이터 생성)에 해당한다."},{"id":"easy-A40","chapter":6,"difficulty":"easy","question":"다음 중 테스트 자동화 수행에 따른 잠재적 리스크를 올바르게 식별한 항목은?","options":["운용 과정에서 알 수 없는 리그레션이 발생할 수 있다","테스트웨어를 유지하기 위한 충분한 노력이 할당되지 않을 수 있다","테스트 도구 및 관련 테스트웨어를 충분히 신뢰할 수 없다","수동 테스팅에 할당된 시간이 줄어들 수 있다"],"answer":1,"explanation":"테스트 자동화의 실제 리스크는 테스트웨어 유지보수에 충분한 공수가 배정되지 않는 것이다."},{"id":"easy-AA1","chapter":1,"difficulty":"easy","question":"출시할 새로운 시스템의 장애 원인을 분석하고 수정하는 작업이 주어졌다. 다음 중 어떤 활동을 하고 있는 것인가?","options":["디버깅","소프트웨어 테스팅","요구사항 도출","결함 관리"],"answer":0,"explanation":"장애 원인을 찾고 분석해서 제거하는 과정은 디버깅이다."},{"id":"easy-AA2","chapter":1,"difficulty":"easy","question":"많은 소프트웨어 조직에서 테스트 부서를 품질 보증(QA) 부서라고 한다. 이 설명이 맞는지, 이유는?","options":["맞다. 테스팅과 QA는 정확히 같은 의미이다","맞다. 둘 다 동일한 품질 문제를 대처하므로 서로 바꿔서 사용할 수 있다","틀리다. 테스팅이 QA보다 더 큰 개념이다","틀리다. QA는 품질 관련 프로세스에 중점을, 테스팅은 결함 식별에 중점을 둔다"],"answer":3,"explanation":"QA는 프로세스, 테스팅은 결함 식별과 목적 적합성 확인에 중점을 둔다."},{"id":"easy-AA3","chapter":1,"difficulty":"easy","question":"전화가 프로그래머의 주의를 분산시켜 입력 변수의 상한 확인 논리를 잘못 프로그래밍하게 했다. 시스템 테스팅에서 이 필드가 유효하지 않은 입력 값을 허용한다는 것을 알아냈다.\n잘못 코딩 된 상한선을 올바르게 설명한 것은?","options":["근본 원인","장애","오류","결함"],"answer":3,"explanation":"코드에 남아있는 잘못된 로직은 결함이다. 주의 분산은 근본 원인, 프로그래머 실수는 오류, 관찰된 동작은 장애다."},{"id":"easy-AA4","chapter":1,"difficulty":"easy","question":"테스트 차터 #04.018, 세션시간 1시간, 대상: 등록 페이지, 도구: 잘못된 값을 가진 입력 데이터, 목적: 등록 과정 결함 식별.\n다음 테스트웨어를 작성하는 테스트 활동은?","options":["테스트 계획","테스트 모니터링과 제어","테스트 분석","테스트 설계"],"answer":3,"explanation":"테스트 차터는 테스트 설계 활동의 결과물이다."},{"id":"easy-AA5","chapter":1,"difficulty":"easy","question":"다음 중 추적성이 테스팅을 어떻게 지원하는지 보여주는 가장 좋은 예제는?","options":["변경의 영향도를 분석함으로써 테스트 완료에 대한 정보를 얻을 수 있다","테스트 케이스와 테스트 결과 간의 추적성을 분석함으로써 잔존 리스크 수준을 추정하는 데 필요한 정보를 얻을 수 있다","변경의 영향도 분석을 실행하는 것은 리그레션 테스팅에 적절한 테스트 케이스 선택에 도움이 된다","테스트 베이시스, 테스트 대상 및 테스트 케이스 간의 추적성을 분석하는 것은 테스트 데이터 선택에 도움이 된다"],"answer":2,"explanation":"추적성을 활용한 영향도 분석은 리그레션 테스트 케이스 선택에 실질적으로 도움이 된다."},{"id":"easy-AA6","chapter":1,"difficulty":"easy","question":"다음 중 테스팅 독립성의 이점을 가장 잘 설명한 것은?","options":["독립적인 테스트팀이 있으면, 결과물의 품질에 대한 책임을 테스트팀이 지도록 할 수 있다","외부 테스트팀은 마감 압박에 쉽게 휘둘리지 않는다는 면에서 뚜렷한 이점이 생긴다","독립적인 테스트팀은 개발자와의 소통을 결함 관리 시스템을 통한 보고로 제한할 수 있다","명세가 모호하거나 불일치하면 해석 시 가정을 하게 되며, 독립적인 테스터는 개발자의 가정과 해석에 의문을 제기하는 데 유용할 수 있다"],"answer":3,"explanation":"독립적인 테스터는 개발자가 세운 가정과 해석에 의문을 제기해 결함을 조기에 찾아낼 수 있다."},{"id":"easy-AA7","chapter":2,"difficulty":"easy","question":"V 모델을 따르는 팀. 다음 중 어떤 활동을 SDLC 초기 단계에서 수행할 수 있는가? (2개 선택)","options":["동적 테스트 수행","정적 테스팅","테스트 계획","인수 테스트 수행","유지보수 테스팅"],"answer":[1,2],"explanation":"초기 단계에는 정적 테스팅(B)과 테스트 계획(C)이 가능하다."},{"id":"easy-AA8","chapter":2,"difficulty":"easy","question":"다음 중 데브옵스(DevOps)의 장점은? i.빠른 제품 출시 ii.반복적 수동 테스팅 필요성 증가 iii.실행 가능한 소프트웨어의 지속적 가용성 iv.리팩토링 관련 리그레션 테스트 수 감소 v.자동화 프레임워크 설정 비용 저렴","options":["i, ii, iv","iii, v","i, iii","ii, iv, v"],"answer":2,"explanation":"빠른 출시(i)와 지속적 가용성(iii)이 실제 장점이다."},{"id":"easy-AA9","chapter":2,"difficulty":"easy","question":"음식 주문 앱: \"전체 주문의 95% 이상은 10초 이내에 처리되어야 한다\"는 요구사항에 따라 무작위 주문·처리시간 측정 테스트 케이스를 만들었다.\n다음 중 수행한 테스트 유형은?","options":["기능 테스트(비즈니스 요구사항이므로)","비기능 테스트(성능 측정이므로)","기능 테스트(UI와 상호작용하므로)","화이트박스 테스트(내부구조 알아야 하므로)"],"answer":1,"explanation":"처리 시간(성능)을 측정하는 것은 비기능 테스트다."},{"id":"easy-AA10","chapter":2,"difficulty":"easy","question":"시스템 단종 시 데이터 마이그레이션 테스트를 수행해야 한다는 테스트 전략. 이런 테스팅은 어떤 유형에 포함될 가능성이 가장 높은가?","options":["유지보수 테스팅","리그레션 테스팅","신뢰성 테스팅","통합 테스팅"],"answer":0,"explanation":"시스템 단종/데이터 마이그레이션 테스트는 유지보수 테스팅에 해당한다."},{"id":"easy-AA11","chapter":3,"difficulty":"easy","question":"작업산출물: i.비즈니스 요구사항 ii.일정 계획 iii.테스트 예산 iv.타사 실행 코드 v.사용자 스토리 및 인수 조건.\n다음 중 리뷰가 가능한 작업 산출물은?","options":["i, iv","i, ii, iii, iv","i, ii, iii, v","ii, iv, v"],"answer":2,"explanation":"제3자 실행 코드(iv)는 리뷰할 수 없다. 나머지 문서형 산출물은 리뷰 가능하다."},{"id":"easy-AA12","chapter":3,"difficulty":"easy","question":"다음 중 정적 테스팅에 대한 올바른 설명은? i.비정상 외부 행동 식별 용이 ii.코딩 표준 불일치 식별 용이 iii.장애 식별 iv.가능한 빨리 결함 식별이 목표 v.중요 보안 요구사항 미커버 식별 용이","options":["i, iv, v","i, iii, iv","ii, iii","ii, iv, v"],"answer":3,"explanation":"코딩표준 불일치(ii), 조기 결함 식별(iv), 커버리지 누락 식별(v)이 정적 테스팅의 특징이다."},{"id":"easy-AA13","chapter":3,"difficulty":"easy","question":"다음 중 공식 리뷰에 대한 설명으로 올바른 것은?","options":["일부 리뷰는 하나 이상의 역할이 필요하지 않다","리뷰 과정에 여러 활동이 포함된다","리뷰 회의 전에 문서를 배포하지 않는다","리뷰 중 발견한 결함은 보고하지 않는다"],"answer":1,"explanation":"공식 리뷰는 계획, 준비, 회의, 후속 조치 등 여러 활동으로 구성된다."},{"id":"easy-AA14","chapter":3,"difficulty":"easy","question":"다음 중 공식 리뷰에서 관리자가 수행할 수 있는 작업은?","options":["리뷰에 대한 전반적인 책임을 진다","리뷰 대상을 결정한다","리뷰 회의의 효과적인 진행을 보장한다","리뷰 정보를 기록한다"],"answer":1,"explanation":"리뷰 대상 결정은 관리자, A는 리뷰 리더, C는 중재자, D는 서기의 역할이다."},{"id":"easy-AA15","chapter":4,"difficulty":"easy","question":"와인 저장 시스템: 온도 T가 최적 온도 12에서 벗어난 경우 알림. 3개 선택(3-value) 경계값 분석(BVA)으로 확인하려 한다.\n100% 커버리지를 달성하는 최소 테스트 입력값 세트는?","options":["11, 12, 13","10, 12, 14","10, 11, 12, 13, 14","10, 11, 13, 14"],"answer":2,"explanation":"경계는 11,12,13이며 3-value BVA는 양쪽 이웃값까지 필요해 10,11,12,13,14 다섯 개가 필요하다."},{"id":"easy-AA16","chapter":4,"difficulty":"easy","question":"다음 중 분기 테스팅에 대한 설명으로 올바른 것은?","options":["무조건 분기만 포함하면 테스트 없이도 100% 분기 커버리지 달성 가능","모든 무조건 분기 실행 시 100% 분기 커버리지 달성","100% 구문 커버리지 달성하면 분기 커버리지도 100%","100% 분기 커버리지 달성하면 모든 결정문의 모든 결정 결과가 실행된다"],"answer":3,"explanation":"100% 분기 커버리지는 모든 결정문의 모든 결정 결과가 실행됨을 의미한다."},{"id":"easy-AA17","chapter":4,"difficulty":"easy","question":"은행 계좌 관리 모바일 앱. 유명한 UI 모범 사례 책을 참고해 각 화면과 입력 항목을 평가하는 테스트 스위트를 실행 중이다.\n이 테스트 기법의 분류는?","options":["블랙박스","탐색적","체크리스트 기반","오류 추정"],"answer":2,"explanation":"알려진 모범 사례 목록을 체계적으로 확인하는 것은 체크리스트 기반 테스팅이다."},{"id":"easy-AA18","chapter":4,"difficulty":"easy","question":"다음 중 사용자 스토리 작성을 위한 협업 접근법을 가장 잘 설명한 것은?","options":["테스터와 개발자가 작성 후 비즈니스 담당자가 승인","비즈니스 담당자, 개발자, 테스터가 함께 작성","비즈니스 담당자가 작성하고 개발자와 테스터가 검증","독립적이고 협의 가능하며 가치있고 추정 가능하며 작고 테스트 가능한 방식으로 작성"],"answer":1,"explanation":"협업 기반 작성은 모든 이해관계자가 함께 스토리를 만드는 것이다."},{"id":"easy-AA19","chapter":5,"difficulty":"easy","question":"\"단위·단위통합 테스팅 수행. 치명적 등급 컴포넌트는 100% 분기 커버리지 입증 필요.\" 다음은 테스트 계획서의 어느 부분에 속하는가?","options":["의사소통","리스크 목록","테스팅 정황","테스트 접근법"],"answer":3,"explanation":"테스트 레벨과 완료 조건(커버리지 기준) 정보는 테스트 접근법에 포함된다."},{"id":"easy-AA20","chapter":5,"difficulty":"easy","question":"플래닝 포커로 테스트 노력 추정 중. 세 번째 라운드 추정치: 13, 8, 13, 13, 13, 13, 8. 합의 규칙: 편차 작으면 가장 많은 표를 채택.\n다음 중 다음 단계로 가장 적합한 예제는?","options":["제품 소유자 개입","13을 최종 추정치로 채택","합의됐으므로 추가 조치 불필요","새 기능 제외"],"answer":1,"explanation":"편차가 작으므로 다수결 규칙에 따라 13을 채택하는 것이 적합하다."},{"id":"easy-AA21","chapter":5,"difficulty":"easy","question":"다음 중 테스트 피라미드에 대한 설명으로 올바른 것은?","options":["하위 테스트 레벨에서 훨씬 더 많은 테스트를 수행해야 한다는 것을 강조한다","각 하위 레벨에서 커다란 기능을 확인해야 한다","전체 SDLC에서 테스트 유형의 배치를 설명한다","자동화 테스트 구성에 영향을 미치지 않는다"],"answer":0,"explanation":"테스트 피라미드는 하위 레벨에서 상대적으로 더 많은 테스트를 수행해야 함을 강조한다."},{"id":"easy-AA22","chapter":5,"difficulty":"easy","question":"리스크: \"시스템이 고객에게 너무 높은 할인을 허용할 수 있다.\" 영향도는 매우 높음으로 추정.\n리스크 발생 가능성에 대해서는 어떻게 말할 수 있는가?","options":["가능성도 매우 높다","매우 낮다","영향도와 가능성은 독립적이라 알 수 없다","중요하지 않아 정의할 필요 없다"],"answer":2,"explanation":"리스크 영향도와 발생 가능성은 서로 독립적인 요소다."},{"id":"easy-AA23","chapter":5,"difficulty":"easy","question":"리스크: i.숙련된 테스터 두 명이 다른 프로젝트로 이동 ii.기능 안전 표준 미준수 iii.응답 시간이 느림 iv.이해관계자 기대치 부정확 v.장애인 사용 시 문제 발생\n다음 중 프로젝트 리스크는?","options":["i, iv","iv, v","i, iii","ii, v"],"answer":0,"explanation":"테스터 이동(i)과 이해관계자 기대치 부정확(iv)이 프로젝트 리스크다."},{"id":"easy-AA24","chapter":5,"difficulty":"easy","question":"다음 중 제품 리스크 분석이 테스팅의 강도와 범위에 어떻게 영향을 미치는지 보여주는 예제는?","options":["리스크 수준을 매일 모니터링·보고해 출시일 결정을 돕는다","\"오픈소스 DB 지원 부족\" 리스크로 팀이 오픈소스 DB 통합을 결정","정량적 리스크 분석으로 총 잔여 리스크를 보고","성능 리스크 수준이 매우 높아 SDLC 초기에 구체적인 수행 효율성 테스트를 수행하기로 결정"],"answer":3,"explanation":"리스크 수준에 따라 테스트의 강도와 시점을 조정하는 것이 리스크 기반 테스팅의 예다."},{"id":"easy-AA25","chapter":5,"difficulty":"easy","question":"다음 중 테스트 대상의 품질 수준을 보고하는 데 많이 사용하는 지표 두 가지는?","options":["시스템 테스팅 중 식별한 결함 수","테스트 설계 노력/설계된 케이스 수","실행된 테스트 절차의 수","결함 수/작업 산출물 크기(결함밀도)","결함 수정 시간"],"answer":[0,3],"explanation":"식별한 결함 수(A)와 결함 밀도(D)가 대표적인 품질 지표다."},{"id":"easy-AA26","chapter":5,"difficulty":"easy","question":"테스트 진행 상황 보고서 정보 중 비즈니스 담당자에게 가장 유용하지 않은 것은?","options":["테스팅 진행을 방해하는 장애물","달성한 분기 커버리지","테스트 진행 상황","테스트 진행 중 나타나는 새로운 리스크"],"answer":1,"explanation":"분기 커버리지는 기술적 지표로, 비즈니스 담당자는 관심이 적다."},{"id":"easy-B1","chapter":1,"difficulty":"easy","question":"다음 중 테스팅이 필요한 이유인 것은?","options":["동적 테스팅에서는 사용자가 절대 할 수 없는 방법으로 문제를 발생시켜 품질을 향상시킨다","정적 테스팅은 개발자가 동적 테스팅보다 더 빠른 시점에 작성한 코드에서 장애를 식별하기 위해 사용한다","정적 분석은 출력이 없는 시스템 컴포넌트가 배포 준비 완료 상태라는 증거를 고객에게 제공한다","리뷰를 통해 요구사항 명세서의 품질이 높아짐에 따라 도출되는 작업 산출물의 변경 필요성이 줄어들게 된다"],"answer":3,"explanation":"리뷰는 결함을 조기에 찾아 후속 개발 활동에서의 낭비를 막는다. b)는 \"장애\"가 아니라 \"결함\"을 찾는 것이므로 오답."},{"id":"easy-B2","chapter":1,"difficulty":"easy","question":"다음 중 품질 보증(QA) 및 품질 제어(QC)에 대한 설명으로 올바른 것은?","options":["품질 보증은 테스팅의 일부로 수행된다","구문 테스팅은 품질 제어의 일부로 수행된다","테스팅과 품질 제어는 같은 의미이다","테스팅은 품질 보증의 일부로 수행된다"],"answer":1,"explanation":"QC는 결함 식별·수정을 통한 품질 달성이며, 테스팅(구문 테스팅 포함)은 QC의 중요한 부분이다."},{"id":"easy-B3","chapter":1,"difficulty":"easy","question":"완벽한 테스팅은 불가능하다는 원리에 대처할 수 있는 방법은?","options":["명시된 모든 가능한 출력값을 커버하는 테스트 케이스 작성","가능한 모든 테스트 입력값을 문서화하고 우선순위 지정","리뷰 등 정적 테스팅으로 가능한 한 빨리 테스팅 시작","동등 분할과 경계값 분석을 사용해 테스트 케이스 작성"],"answer":3,"explanation":"동등 분할·경계값 분석은 유한한 부분집합을 체계적으로 도출하는 기법이므로 정답이다."},{"id":"easy-B4","chapter":1,"difficulty":"easy","question":"다음 중 테스트 데이터 요구사항, 테스트 컨디션, 테스트 환경 요구사항, 테스트 케이스를 작성하는 테스트 활동은?","options":["테스트 설계","테스트 실행","테스트 분석","테스트 구현"],"answer":0,"explanation":"테스트 설계는 테스트 컨디션을 사용해 테스트 케이스와 각종 요구사항을 만드는 활동이다."},{"id":"easy-B5","chapter":1,"difficulty":"easy","question":"다음 중 테스트 수행 방식에 영향을 줄 가능성이 가장 큰 것은?","options":["조직 마케팅팀의 평균 경험치 수준","사용자가 새 시스템 개발을 인지하는 것","테스트팀 구성원의 경력 연수","음악 스트리밍 앱 최종 사용자의 조직 구성"],"answer":2,"explanation":"테스트팀 구성원의 경력 연수는 테스팅 수행 방식에 직접 영향을 준다."},{"id":"easy-B6","chapter":1,"difficulty":"easy","question":"다음 중 추적성의 가치에 대한 올바른 설명은?","options":["완화된 리스크와 성공한 테스트 케이스 간 추적성은 잔존 리스크 수준 판단 수단","사용자 요구사항과 테스트 실행 결과 간 추적성은 비즈니스 목표 대비 진행 상황 측정 수단","테스터와 실패한 테스트 케이스 간 추적성은 테스터 기술 수준 판단 수단","리스크와 테스트 컨디션 간 추적성은 테스트할 가치가 있는 리스크 판단 수단"],"answer":1,"explanation":"사용자 요구사항과 테스트 실행 결과 간 추적성은 비즈니스 목표 대비 진행 상황을 측정하는 수단이다."},{"id":"easy-B7","chapter":1,"difficulty":"easy","question":"다음 중 테스터가 보유한 보편적인 역량을 보여주는 사례로 가장 적절한 것은?","options":["컴퓨터 게임 전문 지식으로 개발자와 좋은 관계 구축","전직 조종사이기 때문에 헬리콥터 제어 시스템 인수 조건을 잘 이해","전직 프로그래머 경험으로 비즈니스 분석가와 소통","탐색적 테스팅 전 테스트 케이스를 체계적으로 작성"],"answer":1,"explanation":"도메인 지식(조종사 경력)은 테스터에게 필요한 일반적 기술의 예다."},{"id":"easy-B8","chapter":1,"difficulty":"easy","question":"다음 중 전체 팀 접근법의 장점은?","options":["팀원들은 언제든지 어떤 역할이든 수행할 수 있다","하나의 팀만 있으면 된다","비즈니스 대표자를 개발자와 함께 배치한다","전체 프로젝트에 도움이 되는 팀 시너지를 만들어낸다"],"answer":3,"explanation":"전체 팀 접근법은 팀 시너지를 창출해 협업을 강화한다."},{"id":"easy-B9","chapter":2,"difficulty":"easy","question":"다음 중 SDLC에 대한 설명으로 올바른 것은?","options":["애자일에서는 시스템 테스트 자동화가 리그레션 테스팅 필요성을 대체한다","순차 개발 모델에서는 동적 테스팅을 일반적으로 수명주기 후반에 수행한다","반복 개발 모델에서는 단위 테스팅을 일반적으로 개발자가 수동으로 수행한다","점진적 개발 모델에서는 정적 테스팅을 초기, 동적 테스팅을 나중에 수행한다"],"answer":1,"explanation":"순차 개발 모델은 초기에 실행 가능한 코드가 없어 정적 테스팅이 먼저, 후반부에 동적 테스팅이 수행된다."},{"id":"easy-B10","chapter":2,"difficulty":"easy","question":"다음 중 모든 SDLC에 적용되는 좋은 테스팅 사례는?","options":["이전 개발 단계의 산출물을 리뷰한다","초안이 제공되는 즉시 작업 산출물을 리뷰한다","테스트 분석·설계 시작 전에 작업 산출물을 리뷰한다","작업 산출물이 배포된 직후 리뷰를 시작한다"],"answer":1,"explanation":"시프트 레프트의 일환으로 초안이 가용해지는 즉시 조기에 리뷰해야 한다."},{"id":"easy-B11","chapter":2,"difficulty":"easy","question":"다음 중 테스트 우선 개발 접근법인 것은?","options":["테스트 주도 개발","커버리지 주도 개발","품질 주도 개발","기능 주도 개발"],"answer":0,"explanation":"TDD는 널리 알려진 테스트 우선 개발 접근법이다."},{"id":"easy-B12","chapter":2,"difficulty":"easy","question":"다음 중 데브옵스(DevOps)에 대한 설명으로 올바른 것은?","options":["릴리스 속도를 위해 개발자가 단위 테스팅 없이도 빠르게 코드를 제출하도록 장려한다","잦은 업데이트/릴리스에는 리그레션 위험을 줄이기 위한 많은 자동화된 리그레션 테스트가 필요하다","테스터는 시프트 라이트로 릴리스 테스팅에 더 많은 노력을 할당한다","시너지를 위해 수동 테스팅 없이 완전히 자동화해야 한다"],"answer":1,"explanation":"잦은 릴리스를 지원하려면 리그레션 리스크 최소화를 위한 자동화된 리그레션 테스트가 많이 필요하다."},{"id":"easy-B13","chapter":2,"difficulty":"easy","question":"다음 중 시스템 테스팅에서 수행할 가능성이 가장 높은 것은?","options":["독립 테스트팀이 진행하는 신용 관리 시스템의 보안 테스팅","환전 시스템과 외부 은행 시스템의 인터페이스 테스팅","개발자가 진행하는 원격 학습 시스템 베타 테스팅","UI와 데이터베이스 간 상호작용 테스팅"],"answer":0,"explanation":"시스템 테스팅은 완전한 시스템의 동작·기능(보안 등 비기능 포함)을 독립 테스트팀이 수행하는 경우가 많다."},{"id":"easy-B14","chapter":2,"difficulty":"easy","question":"다음 설명 중 올바른 것은?","options":["프로젝트 진행에 따라 리그레션 테스트는 많아지지만 확인 테스트는 줄어든다","리그레션은 수정 시, 확인은 개선 시마다 실행한다","리그레션은 운영 환경 확인, 확인은 변경사항 테스트와 관련","리그레션은 변경되지 않은 코드의 부작용, 확인은 변경된 코드 테스트와 관련"],"answer":3,"explanation":"리그레션 테스팅은 변경되지 않은 부분에 대한 부작용 확인, 확인 테스팅은 변경된 코드 검증과 관련된다."},{"id":"easy-B15","chapter":3,"difficulty":"easy","question":"다음 중 정적 테스팅으로 식별할 수 있지만 동적 테스팅은 식별할 수 없는 결함은?","options":["UI의 사용성 부족","도달할 수 없는 코드","대부분 사용자에 대한 느린 응답 시간","코드에 구현되지 않은 필요 기능"],"answer":1,"explanation":"도달할 수 없는 코드는 리뷰로 식별 가능하지만 동적 테스팅은 도달 가능한 코드만 실행할 수 있다."},{"id":"easy-B16","chapter":3,"difficulty":"easy","question":"다음 중 이해관계자의 빠르고 빈번한 피드백이 제공하는 이점은?","options":["생산성 낮은 개발자를 관리자가 파악","PM이 이해관계자 상호작용 우선순위 결정","잠재적 품질 문제에 대한 빠른 의사소통 촉진","최종 사용자가 산출물 지연 이유를 이해"],"answer":2,"explanation":"조기·빈번한 피드백은 잠재적 품질 문제에 대한 빠른 의사소통을 촉진한다."},{"id":"easy-B17","chapter":3,"difficulty":"easy","question":"업무: 1.품질특성·완료조건 선택 2.모두 산출물 접근 가능 3.이상한점 식별 4.이상사항 논의. 활동: A.개별리뷰 B.리뷰착수 C.리뷰계획 D.의사소통및분석","options":["1B,2C,3D,4A","1B,2D,3C,4A","1C,2A,3B,4D","1C,2B,3A,4D"],"answer":3,"explanation":"1(계획-C), 2(착수-B), 3(개별리뷰-A), 4(의사소통및분석-D)이므로 1C,2B,3A,4D."},{"id":"easy-B18","chapter":3,"difficulty":"easy","question":"역할: 1.서기 2.리뷰리더 3.중재자 4.관리자. 책임: A.효과적 진행·편안한환경 보장 B.결정사항 기록 C.리뷰대상 결정, 자원제공 D.리뷰 전반 책임","options":["1A,2B,3D,4C","1A,2C,3B,4D","1B,2D,3A,4C","1B,2D,3C,4A"],"answer":2,"explanation":"서기(기록-B), 리더(전반책임-D), 중재자(진행보장-A), 관리자(대상결정-C)이므로 1B,2D,3A,4C."},{"id":"easy-B19","chapter":4,"difficulty":"easy","question":"다음 중 결정 테이블 테스팅과 분기 테스팅의 차이점을 가장 잘 설명한 것은?","options":["결정테이블은 코드 결정문에서, 분기는 제어흐름 지식에서 도출","결정테이블은 명세에서, 분기는 소스코드 잠재 결함 예상에서 도출","결정테이블은 제어흐름 지식에서, 분기는 비즈니스 규칙 명세에서 도출","결정테이블은 구현 방식과 무관, 분기는 코드 설계·구현 후에만 도출 가능"],"answer":3,"explanation":"결정테이블(블랙박스)은 구현과 무관, 분기 테스팅(화이트박스)은 구현 완료 후에만 도출 가능하다."},{"id":"easy-B20","chapter":4,"difficulty":"easy","question":"세차 이용권 시스템: 10번마다 10% 할인 1회, 20번마다 40% 추가 할인(총 50%). 다음 중 동등 분할 커버리지가 가장 높은 입력 데이터 세트는?","options":["19, 20, 30","11, 12, 20","1, 10, 50","10, 29, 30, 31"],"answer":0,"explanation":"\"할인없음\"(19), \"50%할인\"(20), \"10%할인\"(30) 세 분할을 모두 커버하는 것은 A뿐이다."},{"id":"easy-B21","chapter":4,"difficulty":"easy","question":"비밀번호 길이 6~12자만 유효. 100% 2-value 경계값 커버리지 테스트 케이스가 이미 있고, 100% 3-value 커버리지를 위해 추가할 값은?","options":["4, 5, 13, 14","7, 11","1, 5, 13","1, 4, 7, 11, 14"],"answer":3,"explanation":"세 경계(0/1/4/5, 6/7/11/12, 13/14)에서 2-value가 이미 커버한 0,5,6,12,13 외에 추가로 필요한 값은 1,4,7,11,14다."},{"id":"easy-B22","chapter":4,"difficulty":"easy","question":"동맥경화증 위험도 판정 결정테이블(규칙1~5). TC1(125,141)→규칙4, TC2(200,201)→규칙4, TC3(124,201)→규칙2, TC4(109,200)→규칙2, TC5(201,141)→규칙5.\n달성한 결정 테이블 커버리지는?","options":["40%","60%","80%","100%"],"answer":1,"explanation":"5개 규칙 중 3개(규칙2,4,5)만 커버되므로 60%다."},{"id":"easy-B23","chapter":4,"difficulty":"easy","question":"최대 3개 요소 저장 시스템 상태전이(START→Add→NOT FULL 자기루프[N<2]→Add[N=2]→FULL→Remove→NOT FULL 자기루프[N>0]).\n가장 높은 유효 전이 커버리지를 달성하는 테스트 케이스는?","options":["Add,Remove,Add,Add,Add","Add,Add,Add,Add,Remove,Remove","Add,Add,Add,Remove,Remove","Add,Add,Add,Remove,Add"],"answer":2,"explanation":"C는 5개 유효 전이 중 5개(100%)를 커버한다. B는 FULL 상태에서 Add를 시도해 실행 불가능하다."},{"id":"easy-B24","chapter":4,"difficulty":"easy","question":"같은 코드에 T1(40% 구문커버리지), T2(65% 구문커버리지) 실행. 반드시 참인 것은?","options":["T1+T2는 105% 구문 커버리지 달성","T1과 T2가 모두 실행한 명령문이 하나 이상 존재","최소 5%는 실행되지 않는 코드","T1+T2는 100% 분기 커버리지 달성"],"answer":1,"explanation":"커버리지는 100%를 초과할 수 없으므로 두 테스트가 겹치는 구문이 최소 5% 이상 존재해야 한다."},{"id":"easy-B25","chapter":4,"difficulty":"easy","question":"분기 커버리지 공식 BCov=(X/Y)*100%에서 X와 Y는?","options":["X=실행된 결정 결과 수, Y=전체 결정 결과 수","X=실행된 조건 분기 수, Y=전체 분기 수","X=실행된 분기 수, Y=전체 분기 수","X=실행된 조건 분기 수, Y=전체 결정 결과 수"],"answer":2,"explanation":"분기 커버리지는 실행된 분기 수를 총 분기 수로 나눈 값이며, 분기는 조건 분기뿐 아니라 무조건 분기도 포함한다."},{"id":"easy-B26","chapter":4,"difficulty":"easy","question":"다음 중 탐색적 테스팅을 선택할 근거로 가장 적절한 두 가지는?","options":["테스트 설계·실행 시간이 충분히 할당되지 않아서","테스트 전략에서 공식적인 블랙박스 기법 사용을 요구해서","명세가 도구로 처리 가능한 공식 언어로 작성돼서","테스터가 충분한 프로그래밍 기술을 가지고 있어서","테스터가 비즈니스 영역 경험과 분석 능력을 가지고 있어서"],"answer":[0,4],"explanation":"시간적 압박(a)과 테스터의 경험·분석력(e)이 탐색적 테스팅 선택의 근거다."},{"id":"easy-B27","chapter":4,"difficulty":"easy","question":"다음 중 체크리스트에 포함하기 가장 적절한 것은?","options":["\"개발자가 구현할 때 실수를 했는가?\"","\"구문 커버리지가 85%를 초과했는가?\"","\"프로그램이 요구사항에 따라 올바르게 동작하는가?\"","\"오류 메시지가 이해할 수 있는 언어로 작성되는가?\""],"answer":3,"explanation":"D는 사람이 확인할 수 있는 구체적인 테스트 컨디션의 예다."},{"id":"easy-B28","chapter":4,"difficulty":"easy","question":"Given/When/Then 형식의 인수 조건이 주어졌다. 이 형식은?","options":["규칙 중심","시나리오 중심","제품 중심","프로세스 중심"],"answer":1,"explanation":"Given/When/Then은 시나리오 중심 형식이다."},{"id":"easy-B29","chapter":4,"difficulty":"easy","question":"사용자 스토리: 등록 고객이 이전 주문 내역을 조회. 다음 중 이 스토리와 관련이 없는 테스트 케이스는?","options":["로그인 후 주문 내역 보기","특정 주문 클릭 시 상세 표시","오름차순 정렬 기능","미등록 고객의 신규 계정 등록"],"answer":3,"explanation":"D는 신규 고객 등록 프로세스로 이전 주문 내역 조회 스토리와 무관하다."},{"id":"easy-B30","chapter":5,"difficulty":"easy","question":"데브옵스 파이프라인: (1)코드 작성 (2)버전관리 제출·병합 (3)단위 테스팅 수행. (2)단계의 시작 조건으로 가장 적합한 것은?","options":["정적 분석 결과 심각도 높은 경고가 없다","버전관리에서 병합 충돌이 없다고 보고","단위 테스트가 컴파일되어 실행 준비됨","구문 커버리지가 80% 이상"],"answer":0,"explanation":"코드 제출 전 확인해야 하는 것은 정적 분석 결과이므로 (2)단계의 시작 조건이다."},{"id":"easy-B31","chapter":5,"difficulty":"easy","question":"비율 기반 추정: 과거 4개 프로젝트 평균 개발노력 $900,000, 평균 테스트노력 $90,000(비율 10%). 새 프로젝트 개발노력 $800,000일 때 예상 테스트 노력은?","options":["$40,000","$80,000","$81,250","$82,500"],"answer":1,"explanation":"800,000 × 0.1 = $80,000."},{"id":"easy-B32","chapter":5,"difficulty":"easy","question":"7개 테스트 케이스, 논리적 의존성(검색→보기→추가→주문). 상품B 우선순위가 상품A보다 높음. 네 번째로 실행되어야 하는 테스트 케이스는?","options":["TC3","TC1","TC7","TC2"],"answer":1,"explanation":"순서 TC2→TC4→TC6→TC1→TC3→TC5→TC7이므로 네 번째는 TC1이다."},{"id":"easy-B33","chapter":5,"difficulty":"easy","question":"다음 중 테스팅 사분면 모델에서 1사분면(기술 측면, 팀 지원)에 속하는 것은?","options":["사용성 테스팅","기능 테스팅","사용자 인수 테스팅","단위 통합 테스팅"],"answer":3,"explanation":"컴포넌트 통합(단위 통합) 테스팅이 1사분면(Q1)에 해당한다."},{"id":"easy-B34","chapter":5,"difficulty":"easy","question":"리스크: 1.비효율적 루프로 응답 지연 2.소비자 선호도 변경 3.서버룸 침수 4.연령대별 부정확한 보고서. 완화활동: A.리스크수용 B.성능테스팅 C.경계값분석 D.리스크전가","options":["1C,2D,3A,4B","1B,2D,3A,4C","1B,2A,3D,4C","1C,2A,3D,4B"],"answer":2,"explanation":"1(성능테스팅-B), 2(수용-A), 3(전가-D), 4(경계값분석-C)이므로 1B,2A,3D,4C."},{"id":"easy-B35","chapter":5,"difficulty":"easy","question":"다음 중 제품 품질 지표인 것은?","options":["평균 고장 시간","식별된 결함 수","요구사항 커버리지","결함 탐지율"],"answer":0,"explanation":"평균 고장 시간(MTTF)은 제품 품질 메트릭이며, 나머지는 결함/커버리지 메트릭이다."},{"id":"easy-B36","chapter":5,"difficulty":"easy","question":"유럽 사용자 대상 제품, 팀은 북미 위치, 애자일/데브옵스/CI-CD 사용. 다음 중 고객에게 진행 상황을 전달하는 효과가 가장 낮은 방법은?","options":["면대면","대시보드","이메일","화상회의"],"answer":0,"explanation":"위치와 시간대가 다르므로 면대면 의사소통은 이루어지기 어려워 효과가 가장 낮다."},{"id":"easy-B37","chapter":5,"difficulty":"easy","question":"다음 중 형상관리(CM)가 테스팅을 지원하는 방법을 가장 잘 설명한 것은?","options":["환경 버전을 알고 있어 형상관리 도구에서 라이브러리, 스텁, 드라이버의 버전을 알아낼 수 있다","테스트 입력값 기록으로 커버리지를 계산할 수 있다","라이선스 구매 데이터로 라이선스 종료 정보를 자동 생성","테스트 케이스 버전으로 테스트 데이터를 자동 생성"],"answer":0,"explanation":"복잡한 형상 항목(테스트 환경)의 구성 요소·관계·버전을 기록하는 것이 형상관리의 지원 방식이다."},{"id":"easy-B38","chapter":5,"difficulty":"easy","question":"정렬 함수 테스트 로그: TC3(8 7 3 7 1→1 3 7 8, 실패), TC4(-2 -2 -2 -3 -3→-3 -2, 실패), TC5(0 -2 0 3 4 4→-2 0 3 4, 실패).\n결함보고서에 작성할 실패에 대한 가장 적절한 설명은?","options":["여러 숫자 세트 정렬 실패 (TC3,4,5)","정렬 시 중복 항목 무시 (TC3,4,5)","음수 정렬 실패 (TC4,5)","입력 데이터 중복이 결함"],"answer":1,"explanation":"시스템이 중복을 무시하고 정렬하는 것이 TC3,4,5 실패의 공통 원인으로 추정된다."},{"id":"easy-B39","chapter":6,"difficulty":"easy","question":"도구 설명: 1.작업흐름 추적 2.의사소통 촉진 3.가상머신 4.리뷰 지원. 분류: A.정적테스팅도구 B.확장성및배포표준화도구 C.데브옵스도구 D.협업도구","options":["1A,2B,3C,4D","1B,2D,3C,4A","1C,2D,3B,4A","1D,2C,3A,4B"],"answer":2,"explanation":"작업흐름추적(C), 의사소통(D), 가상머신(B), 리뷰지원(A)이므로 1C,2D,3B,4A."},{"id":"easy-B40","chapter":6,"difficulty":"easy","question":"다음 중 테스트 자동화의 이점으로 가장 적절한 것은?","options":["사람이 도출하기에 너무 복잡한 커버리지 측정치를 제공","테스팅 책임을 도구 공급업체와 공유","결과 분석 시 비판적 사고 불필요","코드 분석으로 테스트 케이스 자동 작성"],"answer":0,"explanation":"테스트 자동화는 사람이 직접 도출하기 어려운 복잡한 커버리지 측정치를 제공할 수 있다는 것이 이점이다."},{"id":"easy-C1","chapter":1,"difficulty":"easy","question":"다음 중 테스트의 일반적인 목적인 것은?","options":["기록된 요구사항이 충족됐는지 확인하는 벨리데이션","장애 유발 및 결함 식별","오류 유발 및 근본 원인 식별","사용자 기대를 충족하는지 확인하는 베리피케이션"],"answer":1,"explanation":"장애를 유발하고 결함을 식별하는 것은 동적 테스팅의 가장 일반적인 목적이다. A·D는 벨리데이션/베리피케이션 정의가 뒤바뀌었다."},{"id":"easy-C2","chapter":1,"difficulty":"easy","question":"다음 중 테스팅과 디버깅의 차이를 가장 잘 설명한 것은?","options":["테스팅은 장애를 일으키고 디버깅은 장애를 수정한다","테스팅은 부정적, 디버깅은 긍정적 활동이다","테스팅은 결함이 존재하는지 판단하고 디버깅은 결함을 제거한다","테스팅은 결함의 원인을, 디버깅은 원인 수정을 찾는다"],"answer":2,"explanation":"테스팅은 결함 존재 여부를 판단하고, 디버깅은 결함을 찾아 수정하는 별개 활동이다."},{"id":"easy-C3","chapter":1,"difficulty":"easy","question":"'결함 부재의 궤변'에 실무에서 대처하는 예제로 적절한 것은?","options":["결함이 없음을 증명하기는 불가능하다고 설명","최종 사용자가 인수 테스팅을 수행하도록 지원","인도된 시스템에 구현 결함이 없음을 확인","잔존 결함 최소화 위해 장애 유발 안 하는 테스트 수정"],"answer":1,"explanation":"결함 부재의 궤변 대처법은 시스템이 실제 사용자 요구와 기대를 충족하는지 검증하는 것이다."},{"id":"easy-C4","chapter":1,"difficulty":"easy","question":"다음 테스트 활동 중 경계값 분석과 동등 분할을 적용할 가능성이 가장 큰 활동 두 개는?","options":["테스트 구현","테스트 설계","테스트 실행","테스트 모니터링","테스트 분석"],"answer":[1,4],"explanation":"테스트 기법은 테스트 컨디션을 식별하는 테스트 분석과 테스트 케이스를 만드는 테스트 설계에서 주로 사용된다."},{"id":"easy-C5","chapter":1,"difficulty":"easy","question":"테스트웨어: 1.커버리지항목 2.변경요청 3.테스트실행일정 4.테스트컨디션우선순위. 활동: A.테스트분석 B.테스트설계 C.테스트구현 D.테스트완료","options":["1B,2D,3C,4A","1B,2D,3A,4C","1D,2C,3A,4B","1D,2C,3B,4A"],"answer":0,"explanation":"커버리지항목(설계-B), 변경요청(완료-D), 실행일정(구현-C), 우선순위(분석-A)이므로 1B,2D,3C,4A."},{"id":"easy-C6","chapter":1,"difficulty":"easy","question":"다음 중 테스팅 역할에 대한 설명으로 가장 적절한 것은?","options":["애자일에서 테스트 관리는 팀이, 테스팅 역할은 팀 외부가 책임","테스팅 역할은 모니터링·제어, 테스트 관리는 계획·완료를 담당","애자일에서 여러 팀에 걸친 테스트 관리는 팀 외부 관리자가, 일부는 팀 자체가 처리","테스트 관리는 분석·설계, 테스팅 역할은 구현·실행 담당"],"answer":2,"explanation":"애자일에서는 일부 테스트 관리 업무를 팀 자체가 처리하지만 여러 팀에 걸친 활동은 팀 외부 관리자가 처리한다."},{"id":"easy-C7","chapter":1,"difficulty":"easy","question":"다음 중 전체 팀 접근법의 장점인 것은?","options":["테스터가 없는 팀","향상된 팀 역학","전문가 팀 멤버","보다 큰 팀의 규모"],"answer":1,"explanation":"전체 팀 접근법은 팀원의 다양한 기술을 활용해 우수한 팀 역학을 조성한다."},{"id":"easy-C8","chapter":1,"difficulty":"easy","question":"다음 중 테스팅의 독립성에 대한 설명으로 맞는 것은?","options":["독립적인 테스터는 개발자와 기술적 관점이 달라 결함을 식별할 수 있지만 적대적 관계가 될 수 있다","개발자는 소수 결함만 찾지만 배경 공유로 테스터도 같은 결함을 찾을 수 있다","독립 테스팅에는 조직 외부 테스터가 필요하지만 도메인 이해가 어려울 수 있다","외부 테스터가 더 독립적이지만 지연 비난은 내부 테스터가 더 받는다"],"answer":0,"explanation":"독립성의 이점은 다른 관점으로 결함을 발견하는 것, 단점은 적대적 관계·협업 어려움이다."},{"id":"easy-C9","chapter":2,"difficulty":"easy","question":"다음 중 모든 SDLC에 적용되는 좋은 테스팅 사례는?","options":["각 테스트 레벨에는 상응하는 개발 레벨이 있다","각 테스트 목적에는 상응하는 개발 목적이 있다","모든 테스트 활동에는 상응하는 사용자 활동이 있다","모든 개발 활동에는 상응하는 테스트 활동이 있다"],"answer":3,"explanation":"모든 소프트웨어 개발 활동에는 상응하는 테스트 활동이 있어야 한다."},{"id":"easy-C10","chapter":2,"difficulty":"easy","question":"다음 중 테스트 우선(test-first) 개발 접근법은?","options":["단위 테스트 주도 개발","통합 테스트 주도 개발","시스템 테스트 주도 개발","인수 테스트 주도 개발"],"answer":3,"explanation":"ATDD는 테스트 우선 개발 접근법의 잘 알려진 예다."},{"id":"easy-C11","chapter":2,"difficulty":"easy","question":"다음 중 시프트 레프트 접근법을 가장 잘 설명한 것은?","options":["수동 활동을 자동화해 조기 테스팅 원칙을 따름","비용 효율적인 경우 테스트 활동을 SDLC 초기로 앞당겨 후반 결함 수를 줄여 품질 비용 절감","시간 여유 있을 때 단위/단위통합 테스트부터 자동화","SDLC 후반 자동화를 위해 초기에 훈련받아야 함"],"answer":1,"explanation":"시프트 레프트는 SDLC 초기에 테스트를 시작해 후반 결함을 줄이는 것을 강조한다."},{"id":"easy-C12","chapter":2,"difficulty":"easy","question":"다음 중 회고의 결과로 발생할 가능성이 가장 낮은 것은?","options":["개발 관행 개선으로 품질 향상","자동화로 테스트 환경 구성 가속화","최종 사용자의 개발·테스트 프로세스 이해도 향상","개발자 피드백으로 자동화 스크립트 개선"],"answer":2,"explanation":"회고 참가자에는 보통 최종 사용자가 포함되지 않으므로 이해도 향상 가능성이 낮다."},{"id":"easy-C13","chapter":2,"difficulty":"easy","question":"다음 중 벨리데이션에 중점을 두고 테스터가 아닌 사람이 수행하는 테스트 레벨은?","options":["단위 테스팅","단위 통합 테스팅","시스템 통합 테스팅","인수 테스팅"],"answer":3,"explanation":"인수 테스팅은 벨리데이션에 중점을 두며 이상적으로 최종 사용자가 수행한다."},{"id":"easy-C14","chapter":2,"difficulty":"easy","question":"교통법규 위반 경로를 안내하던 네비게이션 소프트웨어를 업데이트했다. 수행해야 할 테스팅으로 가장 적절한 것은?","options":["확인 테스팅만","확인 테스팅 후 리그레션 테스팅","리그레션 테스팅만","리그레션 테스팅 후 확인 테스팅"],"answer":1,"explanation":"확인 테스팅으로 수정을 먼저 확인한 후 리그레션 테스팅으로 다른 부분의 부작용을 확인해야 한다."},{"id":"easy-C15","chapter":3,"difficulty":"easy","question":"결함: i.설계명세서 불일치(복잡성) ii.응답시간 길어 인내심 저하 iii.도달불가 코드경로 iv.미사용 선언 변수 v.보고서 작성 시 과도한 메모리 사용. 정적 테스팅으로만 식별 가능한 것은?","options":["ii, v","iii, v","i, ii, iv","i, iii, iv"],"answer":3,"explanation":"명세불일치(i), 도달불가 코드(iii), 미사용 변수(iv)는 정적 테스팅으로, 응답시간(ii)·메모리(v)는 동적 테스팅으로 식별된다."},{"id":"easy-C16","chapter":3,"difficulty":"easy","question":"다음 중 이해관계자의 빠르고 빈번한 피드백의 이점인 것은?","options":["요구사항 변경을 조기에 이해하고 구현 가능","비즈니스 담당자가 요구사항을 이해하게 됨","제품 소유자가 원하는 만큼 요구사항 변경 가능","구현 안 될 요구사항을 최종 사용자에게 릴리스 전 통보"],"answer":0,"explanation":"조기·빈번한 피드백은 요구사항 변경을 신속히 이해하고 구현하게 해준다."},{"id":"easy-C17","chapter":3,"difficulty":"easy","question":"리뷰 유형: 1.기술리뷰 2.비공식리뷰 3.인스펙션 4.워크쓰루. 설명: A.합의도출·새아이디어·저자동기부여 B.리뷰어훈련·공감대·새아이디어·잠재결함식별 C.결함식별이주목적+프로세스개선지표수집 D.결함식별이주목적+공식결과문서없음","options":["1A,2B,3C,4D","1A,2D,3C,4B","1B,2C,3D,4A","1C,2D,3A,4B"],"answer":1,"explanation":"기술리뷰(A), 비공식리뷰(D), 인스펙션(C), 워크쓰루(B)이므로 1A,2D,3C,4B."},{"id":"easy-C18","chapter":3,"difficulty":"easy","question":"다음 중 성공적인 리뷰에 기여하는 요소인 것은?","options":["경영진이 반드시 리뷰어로 참여","분량이 많은 작업 산출물을 작은 단위로 분할","리뷰어 평가를 목적으로 설정","리뷰 당 하나의 문서만 커버"],"answer":1,"explanation":"작업 산출물을 작은 단위로 나누어 리뷰어의 집중력을 유지하는 것이 핵심 요소다."},{"id":"easy-C19","chapter":4,"difficulty":"easy","question":"블랙박스 테스트 기법과 경험 기반 테스트 기법의 주요 차이점은?","options":["테스트 대상","테스트 레벨","테스트 베이시스","사용 가능한 SDLC"],"answer":2,"explanation":"블랙박스는 명세를 테스트 베이시스로 사용하고, 경험 기반은 테스터의 지식·경험을 사용해 명세를 전혀 안 쓸 수도 있다."},{"id":"easy-C20","chapter":4,"difficulty":"easy","question":"4자리 PIN 검증기: \"길이정확\"/\"길이부정확\", \"서로다른숫자개수정확(2개이상)\"/\"부정확(모두동일)\". 다음 중 최적의 입력 테스트 데이터 세트는?","options":["112, 1111, 1234, 123456","1, 123, 1111, 1234","12, 112, 1112, 11112","1, 111, 1111, 11111"],"answer":0,"explanation":"112(길이부정확·자릿수부족), 1111(길이정확·개수부정확), 1234(길이정확·개수정확), 123456(길이부정확·초과) 4개 분할을 모두 커버한다."},{"id":"easy-C21","chapter":4,"difficulty":"easy","question":"규칙: IF(value≤100 OR value≥200) THEN \"value incorrect\" ELSE \"value OK\". 2-value 경계값 분석 커버리지가 가장 높은 입력은?","options":["100, 150, 200, 201","99, 100, 200, 201","98, 99, 100, 101","101, 150, 199, 200"],"answer":3,"explanation":"경계 100,101,199,200 중 D는 101,199,200 3개를 포함해 75% 커버리지를 달성(최고)."},{"id":"easy-C22","chapter":4,"difficulty":"easy","question":"결정테이블: R1(-,T,T→면허발급) R2(-,F,-→재응시요청) R3(F,-,F→강습추가요청). 모순되는 규칙을 보여주는 테스트 데이터는?","options":["C1=T,C2=T,C3=F","C1=T,C2=F,C3=T","C1=T,C2=T,C3=T & C1=F,C2=T,C3=T","C1=F,C2=F,C3=F"],"answer":3,"explanation":"(F,F,F)는 R2와 R3에 모두 일치하지만 서로 다른 동작을 요구해 모순을 보여준다."},{"id":"easy-C23","chapter":4,"difficulty":"easy","question":"상태전이: START→REQUESTING→CONFIRMED(가능)/WAITING LIST(불가능)→END(결제/취소), WAITING LIST→CONFIRMED(가능). 100% 유효 전이 커버리지 최소 테스트 케이스 수는?","options":["3","2","5","6"],"answer":0,"explanation":"세 전이(REQUESTING→CONFIRMED, WAITING LIST→CONFIRMED, WAITING LIST→END)가 한 테스트케이스에 공존 불가해 최소 3개가 필요하다."},{"id":"easy-C24","chapter":4,"difficulty":"easy","question":"제어흐름그래프 기반 분기 테스팅에서 테스트해야 하는 커버리지 아이템(간선) 개수는?","options":["2","4","8","7"],"answer":2,"explanation":"그래프에 8개의 간선(분기)이 있으므로 커버리지 항목은 8개다."},{"id":"easy-C25","chapter":4,"difficulty":"easy","question":"다음 중 화이트박스 테스팅이 블랙박스 테스팅에 도움을 주는 설명으로 올바른 것은?","options":["화이트박스 커버리지 측정은 블랙박스 테스트로 달성한 코드 커버리지를 확인시켜 테스트 케이스 평가를 지원한다","화이트박스 분석은 도달할 수 없는 소스코드 영역을 식별하게 해준다","분기 테스팅은 블랙박스 기법을 포함해 100% 달성 시 모든 블랙박스 기법 100%도 보장","화이트박스 기법으로 블랙박스 기법의 커버리지 항목을 도출할 수 있다"],"answer":0,"explanation":"화이트박스 커버리지 측정치는 블랙박스 테스트의 실제 코드 커버리지를 객관적으로 확인시켜준다."},{"id":"easy-C26","chapter":4,"difficulty":"easy","question":"목록: 올바른입력 미허용/잘못된입력 허용/출력형식오류/0으로나눔. 이 목록으로 테스팅하는 테스터가 사용 중인 기법은?","options":["탐색적 테스팅","결함 공격","체크리스트 기반 테스팅","경계값 분석"],"answer":1,"explanation":"발생 가능한 결함·장애 목록을 활용하는 것은 오류 추정의 결함 공격 기법이다."},{"id":"easy-C27","chapter":4,"difficulty":"easy","question":"다음 중 체크리스트 기반 테스팅이 커버리지 확장에 기여하는 방식을 가장 잘 설명한 것은?","options":["구체적 항목을 상세 테스트 케이스로 구현·실행 가능","자동화 실행으로 커버리지를 높일 수 있음","각 항목이 독립적이라 다른 측면을 커버","상위 수준 항목 기반이라 테스터마다 다르게 수행해 커버리지가 높아짐"],"answer":3,"explanation":"상위 수준 체크리스트는 테스터마다 조금씩 다르게 실행되어 잠재적으로 커버리지를 높인다(재현성은 낮아짐)."},{"id":"easy-C28","chapter":4,"difficulty":"easy","question":"다음 중 시나리오 중심 인수 조건으로 가장 적절한 것은?","options":["\"사용자 요청 시 계정·데이터 삭제 허용해야 함\"","\"장바구니 추가·결제 시 미로그인이면 로그인/계정생성 메시지 표시\"","IF(contain(...)) THEN return FALSE","\"웹사이트는 접근성 508 표준 준수해야 함\""],"answer":1,"explanation":"B는 구체적 시나리오를 설명한 시나리오 중심 인수 조건이다. A·D는 규칙 중심, C는 코드에 가까워 부적절하다."},{"id":"easy-C29","chapter":4,"difficulty":"easy","question":"사용자 스토리: 전자 출입 카드로 특정 층 출입. AC1:일반사용자 1~3층. AC2:4층은 특별사용자만. AC3:특별사용자는 일반사용자 권한 모두 가짐. AC3을 테스트하는 데 가장 합리적인 테스트 케이스는?","options":["일반사용자 1층·3층 출입 확인","일반사용자 4층 출입 불가 확인","특별사용자 5층 출입 확인","특별사용자 1,2,3층 출입 확인"],"answer":3,"explanation":"AC3(특별사용자가 일반사용자 권한도 가짐)을 직접 테스트하려면 특별사용자의 1~3층 출입을 확인해야 한다."},{"id":"easy-C30","chapter":5,"difficulty":"easy","question":"다음 중 테스트 계획의 목적이 아닌 것은?","options":["단위·단위통합 테스트를 위한 테스트 데이터와 기대 결과 정의","단위 테스트 완료조건으로 100% 구문·분기 커버리지 정의","진행상황 보고서 내용·양식 설명","테스트 전략에서 요구하는 시스템 통합 테스트 제외 이유 설명"],"answer":0,"explanation":"구체적인 테스트 데이터는 테스트 케이스의 일부이지 테스트 계획 단계에서 정의할 수 있는 것이 아니다."},{"id":"easy-C31","chapter":5,"difficulty":"easy","question":"외삽법: E(n)=(3*A(n-1)+A(n-2))/4. A(4)=6, A(3)=8일 때 5번째 반복주기 예상 작업량은?","options":["10.5 M/D","8.25 M/D","6.5 M/D","9.4 M/D"],"answer":2,"explanation":"E(5)=(3*6+8)/4=26/4=6.5 M/D."},{"id":"easy-C32","chapter":5,"difficulty":"easy","question":"7개 테스트 케이스, 우선순위와 종속성(화살표)이 주어짐(TC4→TC5, TC4→TC7, TC2→TC5, TC5→TC6, TC1→TC2). 여섯 번째로 실행해야 하는 테스트 케이스는?","options":["TC3","TC5","TC6","TC2"],"answer":0,"explanation":"전체 순서 TC4-TC7-TC1-TC2-TC5-TC3-TC6이므로 여섯 번째는 TC3이다."},{"id":"easy-C33","chapter":5,"difficulty":"easy","question":"다음 중 테스트 피라미드 모델이 보여주는 것은?","options":["테스트의 우선순위는 다를 수 있다","테스트의 상세화 수준은 다를 수 있다","테스트의 커버리지 조건은 다를 수 있다","테스트는 다른 테스트에 따라 달라질 수 있다"],"answer":1,"explanation":"테스트 피라미드는 테스트 레벨마다 상세화 수준이 다르다는 것을 보여준다."},{"id":"easy-C34","chapter":5,"difficulty":"easy","question":"다음 중 테스트 사분면, 테스트 레벨, 테스트 유형 간의 관계를 올바르게 설명하는 것은?","options":["사분면은 레벨·유형의 조합과 SDLC 내 위치를 정의","사분면은 레벨별 테스트 유형의 상세화 수준 설명","사분면은 레벨별로 수행 가능한 유형을 지정","사분면은 여러 기준에 따라 레벨과 유형을 그룹화"],"answer":3,"explanation":"테스트 사분면은 팀 지원/제품 평가 등 여러 기준에 따라 테스트 레벨과 유형을 그룹화하는 모델이다."},{"id":"easy-C35","chapter":5,"difficulty":"easy","question":"다음 중 제품 리스크 분석이 테스팅의 강도와 범위에 영향을 주는 예제는?","options":["리스크 수준 모니터링·보고로 출시일 결정 지원","리스크 식별로 완화 활동 구축, 리스크 수준 낮춤","평가된 리스크 수준이 테스팅 엄격도 판단에 도움","리스크 분석으로 커버리지 아이템 도출"],"answer":2,"explanation":"평가된 리스크 수준으로 테스팅의 엄격도(강도)를 판단하는 것이 직접적인 예다."},{"id":"easy-C36","chapter":5,"difficulty":"easy","question":"다음 테스트 프로세스 활동 중 테스트 진행 상황 보고서를 가장 많이 활용하는 활동은?","options":["테스트 설계","테스트 완료","테스트 분석","테스트 계획"],"answer":1,"explanation":"테스트 완료 보고서 작성 시 진행 상황 보고서의 정보를 주로 사용한다."},{"id":"easy-C37","chapter":5,"difficulty":"easy","question":"다음 중 형상 관리가 테스팅을 지원하는 예가 아닌 것은?","options":["모든 커밋이 고유하게 식별·버전관리됨","테스트 환경 요소 변경 사항이 추적됨","테스트 계획서에서 요구사항 명세가 명확히 참조됨","식별된 모든 결함에는 지정된 상태가 있다"],"answer":3,"explanation":"결함 상태 관리는 형상 관리가 아닌 결함 관리에 의해 보장되는 사항이다."},{"id":"easy-C38","chapter":5,"difficulty":"easy","question":"결함보고서: WebShop v0.99, 로그인 버튼 미동작, 재현절차/기대결과/실제결과/심각도/우선순위 기재. 누락된 가장 중요한 정보는?","options":["테스터 이름과 날짜","테스트 환경 요소와 버전","테스트 대상 식별 정보","이해관계자 이익에 미치는 영향"],"answer":1,"explanation":"브라우저·장치 등 테스트 환경 정보가 빠져 있어 개발자가 재현하기 어렵다."},{"id":"easy-C39","chapter":6,"difficulty":"easy","question":"다음 중 테스트 케이스, 결함, 형상 관리의 구성에 도움이 되는 도구는?","options":["테스트 실행 및 커버리지 도구","테스트 설계 및 구현 도구","결함 관리 도구","테스트 관리 도구"],"answer":3,"explanation":"테스트 관리 도구는 SDLC, 요구사항, 테스트, 결함, 형상 관리를 종합적으로 관리한다."},{"id":"easy-C40","chapter":6,"difficulty":"easy","question":"다음 중 테스트 자동화의 이점으로 가장 적절한 것은?","options":["테스트 베이시스 없이도 테스트 케이스 생성 가능","객관적 평가로 커버리지를 높일 수 있음","처리 능력이 높아져 실행 가능 시간이 늘어남","일관성과 재현성이 높아져 인적 오류 방지"],"answer":3,"explanation":"테스트 자동화는 인적 오류에 시달리지 않아 일관성과 재현성을 높인다."},{"id":"easy-D1","chapter":1,"difficulty":"easy","question":"다음 중 테스트의 일반적인 목적으로 맞는 것은?","options":["테스트 대상의 결함 식별 및 수정","개발자와 효과적인 커뮤니케이션 유지","법적 요구사항 충족을 확인하는 벨리데이션","테스트 대상의 품질에 대한 자신감 확보"],"answer":3,"explanation":"품질에 대한 신뢰 확보는 합격한 테스트 실행을 통해 달성되는 테스팅의 일반적 목적이다."},{"id":"easy-D2","chapter":1,"difficulty":"easy","question":"설계자가 피곤해서 장애인 사용자를 고려 못한 UI를 설계, 개발자는 시간압박으로 예외처리 누락, 배포 후 불만 및 벌금 부과, 보너스 계산 오류는 아직 미발견. 다음 중 올바른 설명은?","options":["보너스 계산 오류는 결함이다","벌금은 장애다","시간압박 속 근무는 근본 원인이다","UI 설계에 설계자 오류가 포함되어 있다"],"answer":2,"explanation":"시간 압박 속 근무는 후속 코드 결함의 근본 원인이다. 보너스 계산 오류는 이미 발생한 장애, 벌금은 장애의 결과다."},{"id":"easy-D3","chapter":1,"difficulty":"easy","question":"테스트 컨디션은 동일하나 테스트 케이스는 매번 달라진다. 이런 변화로 다루는 테스팅 원리는?","options":["테스트 효과는 줄어든다","결함 부재는 궤변이다","조기 테스팅으로 시간·비용 절약","결함은 집중된다"],"answer":0,"explanation":"테스트 케이스를 매번 변경함으로써 테스트 효과 감소(살충제 패러독스)에 대처하고 있다."},{"id":"easy-D4","chapter":1,"difficulty":"easy","question":"업무: 1.테스트컨디션에서 케이스 도출 2.재사용 가능 테스트웨어 식별 3.케이스를 절차로 구성 4.베이시스·대상 평가. 활동: A.테스트분석 B.테스트설계 C.테스트구현 D.테스트완료","options":["1B,2A,3D,4C","1B,2D,3C,4A","1C,2A,3B,4D","1C,2D,3A,4B"],"answer":1,"explanation":"케이스 도출(설계-B), 재사용식별(완료-D), 절차구성(구현-C), 평가(분석-A)이므로 1B,2D,3C,4A."},{"id":"easy-D5","chapter":1,"difficulty":"easy","question":"테스트웨어: i.완료보고서 ii.테스트데이터DB iii.환경구성요소목록 iv.실행순서 테스트케이스시퀀스 v.테스트케이스. 테스트 구현 결과물은?","options":["ii, iv","iii, v","i, ii, v","i, iii, iv"],"answer":0,"explanation":"테스트 데이터(ii)와 테스트 절차(iv)가 테스트 구현 활동의 산출물이다."},{"id":"easy-D6","chapter":1,"difficulty":"easy","question":"다음 중 테스트 관리 역할을 맡은 사람이 수행하는 작업을 가장 적절하게 설명하는 것은?","options":["테스트 베이시스와 테스트 대상 평가","테스트 환경 요구사항 정의","테스트 대상의 테스트 용이성 평가","테스트 완료 보고서 작성"],"answer":3,"explanation":"테스트 완료 보고서 작성은 테스트 관리 역할이 수행하는 대표적 산출물이다."},{"id":"easy-D7","chapter":1,"difficulty":"easy","question":"다음 중 전체 팀 접근법의 장점인 것은?","options":["팀원 간 의사소통 개선","개인의 품질 책임감 감소","최종 사용자에게 더 빠른 배포","외부 비즈니스 사용자와의 협업 감소"],"answer":0,"explanation":"전체 팀 접근법은 팀원 간 활발한 의사소통과 협업을 장려한다."},{"id":"easy-D8","chapter":1,"difficulty":"easy","question":"독립성 요소: i.다른 장소에서 작업 ii.개발자 가정에 의문 제기 iii.대립적 관계 형성 iv.개발자가 품질 책임을 테스터에게 미룸 v.서로 다른 편향. 장점에 해당하는 것은?","options":["i, iv","ii, v","i, iii, iv","ii, iii, v"],"answer":1,"explanation":"가정에 의문 제기(ii)와 서로 다른 편향(v)이 장점이며, 나머지는 단점이다."},{"id":"easy-D9","chapter":2,"difficulty":"easy","question":"다음 중 모든 SDLC에 적용할 수 있는 좋은 테스팅 방법은?","options":["각 테스트 레벨은 구체적이고 명확한 테스트 목적을 가진다","테스트 구현·실행은 연관된 개발 단계에서 시작한다","테스터는 초안이 작성되는 즉시 테스트 설계를 시작한다","모든 동적 테스팅 활동은 상응하는 정적 테스팅 활동을 가진다"],"answer":0,"explanation":"각 테스트 레벨이 구별되는 목적을 갖는 것이 모든 SDLC에 적용되는 좋은 방법이다."},{"id":"easy-D10","chapter":2,"difficulty":"easy","question":"다음 중 테스트 우선 개발 접근법인 것은?","options":["행위 주도 개발","테스트 레벨 주도 개발","기능 주도 개발","성능 주도 개발"],"answer":0,"explanation":"BDD는 잘 알려진 테스트 우선 접근법의 예다."},{"id":"easy-D11","chapter":2,"difficulty":"easy","question":"다음 중 데브옵스를 구축할 때 생길 수 있는 문제일 가능성이 가장 높은 것은?","options":["비기능적 품질 특성을 간과하지 않도록 확인하는 문제","지속 변화하는 테스트 환경 관리 문제","경험 있는 수동 테스터 확보 문제","배포 파이프라인에 테스트 자동화를 구축하는 문제"],"answer":3,"explanation":"배포 파이프라인 정의 및 테스트 자동화 구축은 데브옵스 도입 시 실제 발생하는 난제다."},{"id":"easy-D12","chapter":2,"difficulty":"easy","question":"다음 중 회고를 가장 적절하게 설명하고 있는 것은?","options":["품질 달성에 기여하지 않은 팀원 식별","성공적이었던 활동을 식별해 향후에도 유지하도록 함","관리자·고객에 대한 우려를 비난받지 않고 표명하는 기회","다음 반복주기 계획·기술 결정에 초점"],"answer":1,"explanation":"회고는 성공적이었던 것과 개선할 부분을 논의하는 자리다."},{"id":"easy-D13","chapter":2,"difficulty":"easy","question":"다음 중 기능 테스팅에서 수행할 가능성이 가장 높은 테스트는?","options":["정렬 기능이 요소를 오름차순으로 정렬하는지 확인","정렬이 1초 이내 완료되는지 확인","정렬 방향을 바꾸는 것이 얼마나 쉬운지 확인","32비트→64비트 환경 이동 시에도 올바른지 확인"],"answer":0,"explanation":"기능적 정확성을 평가하는 A만 기능 테스팅이며 나머지는 비기능 테스팅이다."},{"id":"easy-D14","chapter":2,"difficulty":"easy","question":"다음 중 환전 시스템의 유지보수 테스팅을 유발하는 요인이 될 가능성이 가장 큰 것은?","options":["시스템 변경이 어렵다는 보고 확인","환불 기능이 정확한 금액을 지급하지 않아 제거","새 고객 포인트 기능 개발 시작","통화 거래 기능이 다국어 지원하도록 재구성"],"answer":1,"explanation":"결함 있는 기능을 수정(제거)하는 것은 유지보수 테스팅의 대표적 계기다."},{"id":"easy-D15","chapter":3,"difficulty":"easy","question":"다음 중 정적 테스팅의 대상이 아닌 것은?","options":["계약서","테스트 계획서","암호화된 코드","테스트 차터"],"answer":2,"explanation":"암호화된 코드는 사람이 해석하기 어렵고 도구 분석도 어려워 정적 테스팅 대상이 아니다."},{"id":"easy-D16","chapter":3,"difficulty":"easy","question":"다음 중 정적 테스팅의 가치에 대한 설명으로 올바른 것은?","options":["정적/동적 테스팅이 식별하는 결함 유형은 완전히 다르다","동적 테스팅은 정적 테스팅이 찾는 결함+추가 결함까지 찾는다","동적 테스팅은 정적 테스팅이 찾는 결함의 일부만 찾을 수 있다","정적 테스팅은 동적 테스팅이 찾는 결함+추가 결함까지 찾는다"],"answer":2,"explanation":"두 결함 집합은 완전히 겹치지 않으며, 동적 테스팅은 정적 테스팅이 찾는 결함의 일부만 찾을 수 있다."},{"id":"easy-D17","chapter":3,"difficulty":"easy","question":"활동: 1.이상현상 논의·상태결정 2.이슈기록·업데이트처리 3.건의사항·질문도출·이상현상식별 4.목적·일정설정 5.접근권한제공. 리뷰 프로세스 순서는?","options":["4-3-5-2-1","4-5-3-1-2","5-4-1-3-2","5-4-3-2-1"],"answer":1,"explanation":"계획(4)-착수(5)-개별리뷰(3)-의사소통및분석(1)-수정및보고(2) 순서다."},{"id":"easy-D18","chapter":3,"difficulty":"easy","question":"다음 중 리뷰 회의가 효과적으로 진행되고 자유로운 의견 표현을 보장하는 책임을 가진 참가자는?","options":["관리자","중재자","위원장","리뷰 리더"],"answer":1,"explanation":"중재자(퍼실리테이터)가 회의 진행과 안전한 발언 환경을 책임진다."},{"id":"easy-D19","chapter":4,"difficulty":"easy","question":"요구사항: \"구매비용 $100 초과 시 5% 할인, 아니면 할인 없음\". 이 요구사항 기반 테스트 케이스 설계에 가장 적합한 기법은?","options":["화이트박스","블랙박스","경험 기반","리스크 기반"],"answer":1,"explanation":"명시된 동작(요구사항) 기반이므로 블랙박스 기법(경계값분석 등)이 가장 적합하다."},{"id":"easy-D20","chapter":4,"difficulty":"easy","question":"영화예매 할인: D=CY-BY. D<0 오류, 0≤D<18 학생할인, 18≤D<65 할인없음, D≥65 경로할인. 기존 TC: BY=1990,CY=2020(D=30,할인없음), BY=2030,CY=2029(D=-1,오류). 100% 동등분할 커버리지를 위해 추가할 두 데이터는?","options":["BY=2001,CY=2065(D=64)","BY=1900,CY=1965(D=65)","BY=1965,CY=1900(D=-65)","BY=2011,CY=2029(D=18)","BY=2000,CY=2000(D=0)"],"answer":[1,4],"explanation":"\"경로할인\"은 B(D=65), \"학생할인\"은 E(D=0)로 커버된다. 나머지는 이미 커버된 분할에 속한다."},{"id":"easy-D21","chapter":4,"difficulty":"easy","question":"온도 제어: 0~2도(정수)면 \"적정온도\", 미만이면 \"너무낮음\", 초과면 \"너무높음\". 2-value BVA로 가장 높은 경계값 커버리지를 제공하는 입력은?","options":["-1, 3","0, 2","-1, 0, 2, 3","-2, 0, 2, 4"],"answer":2,"explanation":"경계값 -1,0,2,3을 모두 포함하는 것은 C뿐이다."},{"id":"easy-D22","chapter":4,"difficulty":"easy","question":"결정테이블(나이·경력·등록여부→분류A/B/C/D), 기존 TC1~4가 규칙 R2,R3,R7,R6을 각각 커버. 커버리지를 증가시킬 추가 테스트 케이스는?","options":["66세, 경험없는 미등록 남성(분류B 기대)","55세, 2년경력 미등록 여성(분류A 기대)","19세, 5년경력 등록 여성(분류D 기대)","커버리지를 더 높일 수 없다"],"answer":0,"explanation":"A는 아직 커버되지 않은 규칙 R4와 일치해 커버리지를 증가시킨다. B·C는 이미 커버된 규칙과 일치한다."},{"id":"easy-D23","chapter":4,"difficulty":"easy","question":"호텔예약 4상태(요청중/확인됨/대기자명단/종료) 5이벤트. 요청중에서 시작할 때 가장 높은 유효 전이 커버리지를 달성하는 이벤트 순서는?","options":["예약불가,예약가능,객실변경,예약불가,취소","예약가능,객실변경,예약불가,예약가능,결제","예약가능,객실변경,예약가능,객실변경,예약불가","예약불가,취소,객실변경,예약가능,결제"],"answer":1,"explanation":"B는 7개 유효 전이 중 서로 다른 5개를 커버해 가장 높은 커버리지를 달성한다. D는 취소 후 종료 상태에서 다음 이벤트 실행이 불가능하다."},{"id":"easy-D24","chapter":4,"difficulty":"easy","question":"100% 구문 커버리지를 달성한 테스트 스위트(3개 케이스, 각각 50% 구문커버리지). 올바른 설명은?","options":["모든 장애가 발생하게 된다","100% 분기 커버리지도 달성한다","결함 있는 모든 실행문이 최소 한번 실행된다","하나를 제외해도 여전히 100% 구문 커버리지 유지"],"answer":2,"explanation":"100% 구문 커버리지는 결함 유무와 무관하게 모든 실행 가능 구문이 최소 한 번 실행됨을 의미한다."},{"id":"easy-D25","chapter":4,"difficulty":"easy","question":"명세가 모호·오래되고 불완전해도 화이트박스 테스팅으로 결함 식별이 가능한 이유는?","options":["테스트 케이스가 명세가 아닌 코드 구조를 기반으로 설계되기 때문","어떤 기법이든 커버리지를 명확히 정의·측정할 수 있기 때문","요구사항 누락 식별에 매우 좋게 설계됐기 때문","정적·동적 테스팅 모두에 사용 가능하기 때문"],"answer":0,"explanation":"화이트박스 테스팅은 명세가 아닌 코드 구조 기반이므로 명세가 불완전해도 코드 내 결함을 식별할 수 있다."},{"id":"easy-D26","chapter":4,"difficulty":"easy","question":"이자 계산 관련: A.개발자가 공식을 잘못 이해 B.코드에 공식을 잘못 작성 C.개발자가 신규 이율 법안 세미나를 놓침 D.이자 계산 정확성 부족. 오류 추정으로 예상할 수 없는 것은?","options":["개발자가 공식을 잘못 이해(오류)","코드에 잘못 작성(결함)","세미나를 놓침(근본원인)","정확성 부족(장애)"],"answer":2,"explanation":"오류 추정은 오류·결함·장애를 예측하는 기법이며, C는 결함의 잠재적 근본 원인으로 예측 대상이 아니다."},{"id":"easy-D27","chapter":4,"difficulty":"easy","question":"다음 중 탐색적 테스팅에 대한 설명으로 옳은 것은?","options":["세션 시작 전 테스트 케이스를 설계한다","테스터는 실행만 하고 설계는 못한다","결과가 잔존 결함 수의 좋은 예측 지표다","테스터는 블랙박스 테스트 기법을 함께 사용할 수 있다"],"answer":3,"explanation":"탐색적 테스팅 중 테스터는 설계·실행·평가를 동시에 하며 블랙박스 기법도 함께 사용할 수 있다."},{"id":"easy-D28","chapter":4,"difficulty":"easy","question":"다음 중 팀이 전달해야 하는 내용에 대한 공통된 이해를 달성할 협업 사용자 스토리 작성 방법은?","options":["플래닝 포커(노력 합의)","리뷰(불일치 식별)","반복주기 계획(우선순위)","대화(소프트웨어 사용 방법 이해)"],"answer":3,"explanation":"3C 중 대화(Conversation)는 소프트웨어 사용 방법에 대한 공유된 이해를 얻게 해준다."},{"id":"easy-D29","chapter":4,"difficulty":"easy","question":"가격 필터 사용자 스토리: 인수조건 1.버전3.0이상 동작 2.최소·최대가격 설정 3.조정 시 동적 업데이트. 제품A $100, 제품B $110. 가장 적절한 테스트 케이스는?","options":["$90~$100 필터→제품A만; 최대값 $110로 변경→제품A,B 모두 표시","디폴트값 확인 및 제품추가 시 디폴트 변경 확인","통화 변환(USD→EUR) 확인","여러 브라우저 호환성 확인"],"answer":0,"explanation":"A는 최소·최대 가격 설정과 필터 조정 시 동적 업데이트(인수조건 2,3)를 직접 검증한다."},{"id":"easy-D30","chapter":5,"difficulty":"easy","question":"다음 중 테스트 프로젝트의 완료 조건으로 가장 적절한 것은? (두 개)","options":["예산이 승인된다","예산이 소진된다","테스트 베이시스가 가용하다","최소 80% 구문 커버리지 달성","테스트 분석가 전원 ISTQB FL 취득"],"answer":[1,3],"explanation":"예산 소진(B)과 커버리지 달성(D)이 일반적인 완료 기준이며, 나머지는 시작 조건이다."},{"id":"easy-D31","chapter":5,"difficulty":"easy","question":"3점 추정: 낙관적 1시간, 비관적 8시간, 유력 3시간(케이스당). 4개 테스트 케이스 실행 최종 추정치는?","options":["14시간","3.5시간","16시간","12시간"],"answer":0,"explanation":"(1+4*3+8)/6=3.5시간(케이스당), 4개이므로 3.5*4=14시간."},{"id":"easy-D32","chapter":5,"difficulty":"easy","question":"추적성 행렬: TC1(Req1,3,4,7) TC2(Req1,5,7) TC3(Req5,6) TC4(Req2). 커버리지 기반 우선순위 지정 시 마지막으로 실행할 테스트 케이스는?","options":["TC1","TC2","TC3","TC4"],"answer":1,"explanation":"TC1(4개)→TC3(나머지 중 최다)→TC4→TC2 순서가 되어 TC2가 마지막이다."},{"id":"easy-D33","chapter":5,"difficulty":"easy","question":"테스팅 사분면은 테스팅에 어떻게 도움이 되는가?","options":["4가지 테스트 레벨로 프로세스를 나눠 계획 수립","하위 커버리지로 상위 커버리지를 평가","기술적 배경이 부족한 이해관계자가 테스트 유형과 레벨의 관계를 이해하도록 도움","4가지 심리 유형으로 사람을 분류해 소통 전략 개발"],"answer":2,"explanation":"테스팅 사분면은 이해관계자가 테스트 유형과 그 목적/관점 간의 관계를 이해하도록 돕는다."},{"id":"easy-D34","chapter":5,"difficulty":"easy","question":"리스크 수준 $1,000, 발생 가능성 50%. 리스크 영향도는?","options":["$500","$2,000","$50,000","$200"],"answer":1,"explanation":"리스크 수준=가능성×영향도이므로 영향도=1,000/0.5=$2,000."},{"id":"easy-D35","chapter":5,"difficulty":"easy","question":"다음 중 제품 리스크인 것은? (두 개 선택)","options":["개발 범위 증가","낮은 품질의 아키텍처","예산 감소","열악한 도구 지원","너무 긴 응답시간"],"answer":[1,4],"explanation":"낮은 품질 아키텍처(B)와 긴 응답시간(E)은 제품 특성과 관련된 제품 리스크다. 나머지는 프로젝트 리스크다."},{"id":"easy-D36","chapter":5,"difficulty":"easy","question":"다음 중 테스트 보고서의 유효한 목적이 아닌 것은?","options":["진행 상황 추적과 추가 노력 필요 영역 식별","실행된 테스트·결과·결함 정보 제공","재현 절차 등 각 결함에 대한 상세 정보 제공","다음 기간 예정 테스트 정보 제공"],"answer":2,"explanation":"결함별 재현 절차 등 상세 정보 제공은 결함 보고서의 목적이지 테스트 보고서의 목적이 아니다."},{"id":"easy-D37","chapter":5,"difficulty":"easy","question":"버전 번호를 기반으로 릴리즈를 구성한 모든 파일을 재구성해 개발자가 장애를 분석·수정할 수 있었다. 이 활동을 가능하게 한 것은?","options":["리스크 관리","테스트 모니터링과 제어","전체 팀 접근법","형상 관리"],"answer":3,"explanation":"형상 관리는 베이스라인 기록을 유지해 이전 버전으로 되돌려 재현할 수 있게 한다."},{"id":"easy-D38","chapter":5,"difficulty":"easy","question":"도서 대출 시스템 결함보고서(반납 불가, 재현절차 포함, 첨부파일 없음). 개발자가 장애를 신속히 재현하는 데 가장 도움이 되는 것은?","options":["설명란에 영향받는 사용자·도서 정보 추가","우선순위란의 누락값 입력","각 단계별 메모리 덤프·DB스냅샷 첨부","다양한 환경에서 반복 후 개별 보고서 작성"],"answer":0,"explanation":"구체적인 사용자·도서 정보를 추가하면 동일한 입력으로 재현하고 결함을 더 빨리 찾을 수 있다."},{"id":"easy-D39","chapter":6,"difficulty":"easy","question":"도구분류: i.협업도구 ii.데브옵스도구 iii.관리도구 iv.비기능테스팅도구 v.설계및구현도구. 테스트 실행에 가장 도움이 되는 분류는?","options":["i, v","ii, iv","i, iii, v","ii, iii, iv"],"answer":1,"explanation":"데브옵스 도구(CI/CD 실행)와 비기능 테스팅 도구가 테스트 실행을 가장 직접적으로 돕는다."},{"id":"easy-D40","chapter":6,"difficulty":"easy","question":"다음 중 테스트 자동화의 리스크로 가장 적절한 것은?","options":["심각도 높은 결함의 추가 식별","사람이 도출하기 너무 복잡한 지표 제공","개발 플랫폼과의 호환성 부족","테스트 실행 시간의 대폭 단축"],"answer":2,"explanation":"자동화 도구가 개발 플랫폼과 호환되지 않으면 통합이 불가능해지는 것이 실제 리스크다."},{"id":"new-ch1_2-1-1","chapter":1,"difficulty":"medium","question":"한 게임 스튜디오의 QA팀이 기획서에 \"캐릭터 이동속도는 초당 5m\"라고 명시된 대로 실제 구현이 이루어졌는지를 확인했다. 이 활동이 해당하는 개념은?","options":["베리피케이션 — 제품이 명세대로 만들어졌는지 확인","밸리데이션 — 사용자의 실제 요구를 충족하는지 확인","디버깅 — 결함의 근본원인을 찾는 활동","근본원인분석 — 오류의 원인을 규명하는 활동"],"answer":0,"explanation":"명세(스펙)에 맞게 만들어졌는지 확인하는 것은 베리피케이션(\"제대로 만들었는가\")이다. 밸리데이션은 사용자 요구·실제 사용 맥락 충족 여부(\"올바른 것을 만들었는가\")를 다루므로 이 시나리오와 맞지 않는다. 디버깅과 근본원인분석은 결함 원인 규명·수정 활동으로 이 상황과 무관하다."},{"id":"new-ch1_2-2-2","chapter":1,"difficulty":"medium","question":"프로젝트 매니저가 \"출시 전에 남아있는 모든 결함을 완전히 제거했음을 테스트로 증명하라\"고 요구했다. 이 요구에 대한 가장 타당한 반박은?","options":["테스트는 결함의 존재를 밝힐 수는 있지만 결함이 전혀 없음을 증명할 수는 없다","테스트는 리스크를 완화할 수 없으므로 애초에 불가능한 요구다","결함 제거는 테스트가 아니라 밸리데이션의 목적이므로 불가능하다","결함 제거 증명은 커버리지 보장의 목적과 동일하므로 가능하다"],"answer":0,"explanation":"결함이 전혀 없음을 증명하는 것은 유효한 테스트 목적이 아니며, 테스트는 결함의 존재를 드러낼 뿐 부재를 증명하지 못한다(원리1과도 연결). B, C, D는 테스트 목적과 원리를 잘못 연결한 오답이다."},{"id":"new-ch1_2-3-3","chapter":1,"difficulty":"medium","question":"신입 테스터가 \"테스팅이란 프로그램을 실행해서 결과를 확인하는 작업이다\"라고만 이해하고 있다. 이 이해에서 빠진 부분은?","options":["테스트베이시스를 분석하는 절차가 빠졌다","코드를 실행하지 않는 정적 테스트(리뷰, 정적분석 등)도 테스팅에 포함된다는 점이 빠졌다","테스트완료 기준을 정의하는 절차가 빠졌다","테스트제어 활동이 빠졌다"],"answer":1,"explanation":"테스팅은 정적 테스트와 동적 테스트를 모두 포함하는 활동이다. 신입 테스터의 정의는 실행(동적 테스트)만을 가리키므로, 실행 없이 문서·코드를 검토하는 정적 테스트가 누락되어 있다."},{"id":"new-ch1_2-4-4","chapter":1,"difficulty":"medium","question":"개발자가 결함의 원인을 분석해 소스코드를 수정했다. 이후 테스터가 (1) 원래 실패했던 테스트케이스를 재실행해 수정이 되었는지 확인하고, (2) 관련된 다른 기능들도 정상 동작하는지 추가로 점검했다. (1)과 (2)를 순서대로 옳게 짝지은 것은?","options":["(1) 확인테스팅 (2) 리그레션테스팅","(1) 리그레션테스팅 (2) 확인테스팅","(1) 디버깅 (2) 디버깅","(1) 밸리데이션 (2) 베리피케이션"],"answer":0,"explanation":"실패했던 테스트를 재실행해 수정 여부를 확인하는 것은 확인테스팅이고, 수정이 다른 기능에 부정적 영향을 주지 않았는지 확인하는 것은 리그레션테스팅이다. 원인분석과 수정 자체는 디버깅(개발 활동)이며 테스팅 활동은 아니다."},{"id":"new-ch1_2-5-5","chapter":1,"difficulty":"medium","question":"한 팀이 \"코드리뷰 체크리스트를 표준화하고 개발 프로세스 자체를 개선\"하는 데 집중하는 반면, 다른 팀은 \"실제 배포된 제품에서 결함을 찾아 수정 요청\"하는 데 집중한다. 각각 QA와 테스팅 중 무엇에 해당하는가?","options":["둘 다 QA다 — 두 활동 모두 품질을 다루기 때문이다","전자는 QA(프로세스지향·예방접근법), 후자는 테스팅(제품지향·교정접근법)이다","전자는 테스팅, 후자는 QA다","둘 다 테스팅이다 — 품질보증은 테스트 활동의 하위개념이 아니기 때문이다"],"answer":1,"explanation":"QA는 프로세스지향이며 좋은 프로세스가 좋은 제품을 만든다는 가정 하에 예방적으로 접근한다. 테스팅은 제품지향이며 결함을 찾아 고치는 교정적 접근으로 품질관리(QC)의 주요 활동이다."},{"id":"new-ch1_2-6-6","chapter":1,"difficulty":"medium","question":"개발자가 계산식의 괄호 위치를 잘못 입력(사람의 실수)하여 소스코드에 잘못된 수식이 남았고, 특정 입력값에서 실행 시 잘못된 결과가 발생했다. 이 원인을 규명하기 위해 \"왜 괄호를 잘못 입력했는가\"까지 파고드는 활동은?","options":["확인테스팅","테스트모니터링","근본원인분석","테스트제어"],"answer":2,"explanation":"오류(사람의 실수)가 왜 발생했는지 근본적 원인을 규명하는 활동은 근본원인분석이다. 확인테스팅은 결함 수정 확인, 테스트모니터링과 테스트제어는 테스트 진행 관리 활동으로 이 시나리오와 무관하다."},{"id":"new-ch1_2-7-7","chapter":1,"difficulty":"medium","question":"다음 중 결함·장애의 관계에 대한 설명으로 옳은 것은?","options":["결함이 존재하면 반드시 장애로 이어진다","장애는 오직 결함이 있을 때만 발생한다","결함이 있어도 해당 코드가 실행되지 않으면 장애가 발생하지 않을 수 있다","장애가 발생했다면 근본원인분석은 불필요하다"],"answer":2,"explanation":"결함이 존재해도 실행되지 않으면 장애로 나타나지 않을 수 있다. 반대로 결함이 없어도 방사선, 전자기 간섭 등 환경적 요인으로 장애가 발생할 수 있으므로 A, B는 틀렸다. 장애 발생 시 원인 규명을 위해 근본원인분석이 오히려 필요하므로 D도 틀렸다."},{"id":"new-ch1_2-8-8","chapter":1,"difficulty":"medium","question":"6개월간 회귀테스트에서 결함이 하나도 발견되지 않자 팀장이 \"이 모듈은 결함이 전혀 없다\"고 결론지었다. 이 결론이 위배하는 원리는?","options":["원리1 — 테스팅은 결함의 존재를 밝힐 뿐 결함이 없음을 증명하지 못한다","원리3 — 조기 테스팅이 시간과 비용을 절약한다","원리6 — 테스팅은 정황 의존적이다","원리4 — 결함은 집중되는 경향이 있다"],"answer":0,"explanation":"결함이 발견되지 않았다고 해서 결함이 없다고 단정할 수 없다는 것이 원리1의 핵심이다. 나머지 원리는 조기 착수, 정황 의존성, 결함 집중을 다루며 이 시나리오와 무관하다."},{"id":"new-ch1_2-9-9","chapter":1,"difficulty":"medium","question":"입력 필드 3개에 각각 100가지 값이 가능해 전체 조합이 100만 개에 달하는 상황에서, 이 모든 조합을 다 테스트하려는 계획이 세워졌다. 실무적으로 타당한 접근은?","options":["일정을 늘려서라도 100만 개 조합을 모두 실행한다","완벽한 테스팅은 불가능하므로 리스크를 기반으로 우선순위를 정해 테스트 노력을 집중한다","정적 테스트로 전환하여 모든 조합을 리뷰로 대체한다","조합 수가 많을수록 결함이 골고루 분산되므로 무작위로 10개만 뽑아 테스트한다"],"answer":1,"explanation":"원리2(완벽한 테스팅은 불가능)에 따라 모든 것을 테스트할 수 없으므로 리스크에 기반해 테스트 범위와 우선순위를 정해야 한다. A는 비현실적이며, C·D는 근거 없는 대체 방안이다."},{"id":"new-ch1_2-10-10","chapter":1,"difficulty":"medium","question":"요구사항 리뷰를 생략하고 코딩이 끝난 뒤에야 테스트 설계를 시작한 프로젝트에서, 뒤늦게 요구사항 자체의 결함이 발견되어 수정 비용이 크게 늘었다. 이 상황이 보여주는 원리는?","options":["원리3 — 조기 테스팅이 시간과 비용을 절약한다","원리5 — 살충제 패러독스","원리7 — 결함부재궤변","원리1 — 결함 존재를 밝히는 활동"],"answer":0,"explanation":"정적·동적 테스팅을 가능한 한 이른 시점에 시작해야 결함을 조기에 발견해 수정 비용을 줄일 수 있다는 것이 원리3이다. 다른 원리들은 이 상황(늦은 착수로 인한 비용 증가)과 직접 관련이 없다."},{"id":"new-ch1_2-11-11","chapter":1,"difficulty":"medium","question":"인벤토리 관리 모듈에서 전체 결함의 약 70%가 집중적으로 발견되었고, 다른 모듈들에서는 결함이 거의 발견되지 않았다. 이 현상을 설명하는 원리는?","options":["원리2 — 완벽한 테스팅은 불가능","원리6 — 테스팅은 정황 의존적","원리3 — 조기 테스팅","원리4 — 결함 집중(파레토 원리)"],"answer":3,"explanation":"결함이 소수의 모듈에 집중되는 현상은 결함 집중(파레토 원리)에 해당한다. 다른 선지의 원리는 이 현상과 직접 관련이 없다."},{"id":"new-ch1_2-12-12","chapter":1,"difficulty":"medium","question":"결제 모듈의 회귀테스트 스위트가 1년간 변경 없이 그대로 유지되며 더 이상 새로운 결함을 찾아내지 못하고 있는데, 실제 사용자 불만은 오히려 늘고 있다. 이때 팀에 제안할 조치로 가장 적절한 것은?","options":["테스트를 아예 중단하고 사용자 피드백에만 의존한다","동일한 테스트를 더 자주, 더 많이 반복 실행한다","테스트케이스를 정기적으로 리뷰하고 새로운 케이스로 갱신하여 다른 유형의 결함도 탐지할 수 있도록 한다","결함이 없다는 뜻이므로 해당 모듈에 대한 테스트를 종료한다"],"answer":2,"explanation":"동일한 테스트를 반복하면 새로운 결함을 찾아내는 효과가 줄어드는 살충제 패러독스(원리5)에 해당한다. 대응책은 테스트케이스를 주기적으로 검토·변경하는 것이다. A, D는 위험하며 B는 문제를 해결하지 못한다."},{"id":"new-ch1_2-13-13","chapter":1,"difficulty":"medium","question":"병원의 생명유지장치 소프트웨어를 개발하는 팀이, 캐주얼 모바일 게임을 만드는 스튜디오와 동일한 수준의 테스트 문서량과 승인 절차를 그대로 요구받았다. 이 요구가 부적절한 이유를 가장 잘 설명하는 원리는?","options":["원리4 — 결함은 집중되는 경향이 있다","원리6 — 테스팅은 정황 의존적이므로 도메인·리스크 수준에 따라 다르게 수행되어야 한다","원리5 — 살충제 패러독스","원리2 — 완벽한 테스팅은 불가능하다"],"answer":1,"explanation":"테스팅은 안전 중요도, 규제, 도메인 등 정황에 따라 다르게 수행되어야 한다(원리6). 생명유지장치처럼 안전이 중요한 시스템과 캐주얼 게임에 동일한 테스트 접근을 강요하는 것은 이 원리에 위배된다."},{"id":"new-ch1_2-14-14","chapter":1,"difficulty":"medium","question":"한 시스템이 명시된 요구사항을 100% 충족하고 요구사항 기반 테스트를 모두 통과했지만, 실제 사용자는 사용성이 떨어진다며 사용을 꺼렸다. 이 상황이 보여주는 원리는?","options":["원리1 — 결함 존재를 밝히는 활동","원리3 — 조기 테스팅","원리5 — 살충제 패러독스","원리7 — 결함부재궤변, 요구사항 충족만으로는 사용자 기대를 만족시키지 못할 수 있어 밸리데이션도 필요하다"],"answer":3,"explanation":"요구사항을 모두 충족했다는 사실(결함 부재로 보이는 상태)이 곧 사용자 만족을 보장하지 않는다는 것이 원리7이다. 이는 밸리데이션의 필요성과 직접 연결된다."},{"id":"new-ch1_2-15-15","chapter":1,"difficulty":"medium","question":"테스트 프로세스의 주요 활동을 올바른 순서로 나열한 것은?","options":["계획 → 모니터링과제어 → 분석 → 설계 → 구현 → 실행 → 완료","분석 → 설계 → 계획 → 구현 → 실행 → 완료 → 모니터링과제어","계획 → 분석 → 설계 → 구현 → 모니터링과제어 → 실행 → 완료","설계 → 분석 → 계획 → 실행 → 구현 → 완료 → 모니터링과제어"],"answer":0,"explanation":"ISTQB 테스트 프로세스는 계획, (전
