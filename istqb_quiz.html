<!-- ISTQB CTFL v4.0 문제 출제 프로그램: 단일 파일 HTML 퀴즈 앱 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB CTFL v4.0 문제은행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0F1923;
    --bg-elev:#16222E;
    --bg-elev2:#1C2B38;
    --secondary:#00D4FF;
    --accent:#FF6B35;
    --text:#EAF2F7;
    --text-dim:#8DA0AE;
    --border:#26384A;
    --good:#00D4FF;
    --bad:#FF6B35;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }
  #app{max-width:960px;margin:0 auto;padding:24px 20px 80px;}

  /* ---------- 헤더 ---------- */
  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 4px 20px;border-bottom:1px solid var(--border);margin-bottom:24px;
    flex-wrap:wrap;gap:10px;
  }
  .brand-chapter{font-size:14px;font-weight:300;color:var(--accent);letter-spacing:.02em;}
  .brand-title{font-size:26px;font-weight:700;margin:4px 0 2px;}
  .brand-sub{font-size:14px;color:var(--text-dim);font-weight:400;}
  .top-right{text-align:right;font-size:13px;color:var(--text-dim);}
  .badge-count{display:inline-block;background:var(--bg-elev2);border:1px solid var(--border);
    border-radius:20px;padding:4px 12px;font-size:13px;color:var(--secondary);font-weight:600;margin-top:4px;}

  /* ---------- 홈 화면 ---------- */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  @media (max-width:640px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;
    padding:22px 20px;cursor:pointer;transition:border-color .15s, transform .15s;
    display:flex;flex-direction:column;gap:8px;min-height:150px;
  }
  .mode-card:hover{border-color:var(--secondary);transform:translateY(-2px);}
  .mode-card .icon{font-size:30px;}
  .mode-card h3{margin:0;font-size:20px;font-weight:700;}
  .mode-card p{margin:0;font-size:14px;color:var(--text-dim);flex:1;}
  .mode-card .tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bg);
    background:var(--secondary);padding:3px 10px;border-radius:20px;}
  .mode-card .tag.accent{background:var(--accent);}

  .notice-box{
    margin-top:22px;background:var(--bg-elev);border:1px dashed var(--border);border-radius:10px;
    padding:14px 16px;font-size:13px;color:var(--text-dim);
  }
  .notice-box b{color:var(--secondary);}

  /* 하단 시각 요소(퀴즈 앱 아이콘 스트립) */
  .icon-strip{display:flex;gap:14px;justify-content:center;margin-top:30px;font-size:26px;opacity:.5;flex-wrap:wrap;}

  /* ---------- 공통 카드/버튼 ---------- */
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:22px;}
  .btn{
    font-family:inherit;font-size:15px;font-weight:600;padding:11px 20px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg-elev2);color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{border-color:var(--secondary);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--secondary);color:#06222b;border-color:var(--secondary);}
  .btn-primary:hover{background:#33dcff;}
  .btn-accent{background:var(--accent);color:#2b0f00;border-color:var(--accent);}
  .btn-accent:hover{background:#ff8256;}
  .btn-ghost{background:transparent;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  .link-back{cursor:pointer;color:var(--text-dim);font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
  .link-back:hover{color:var(--secondary);}

  h2.screen-title{font-size:22px;margin:0 0 4px;font-weight:700;}
  p.screen-sub{margin:0 0 18px;color:var(--text-dim);font-size:14px;}

  /* ---------- 설정 화면(필터) ---------- */
  .filter-group{margin-bottom:18px;}
  .filter-label{font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.04em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elev2);
    font-size:13px;cursor:pointer;user-select:none;color:var(--text-dim);
  }
  .chip.active{border-color:var(--secondary);color:var(--secondary);background:rgba(0,212,255,.08);}
  .chip.active.diff-medium{border-color:var(--accent);color:var(--accent);background:rgba(255,107,53,.08);}
  .count-select{display:flex;align-items:center;gap:10px;}
  .count-select select{
    background:var(--bg-elev2);color:var(--text);border:1px solid var(--border);border-radius:8px;
    padding:8px 12px;font-family:inherit;font-size:14px;
  }
  .avail-note{font-size:13px;color:var(--text-dim);margin-top:10px;}
  .avail-note b{color:var(--secondary);}

  /* ---------- 퀴즈 진행 화면 ---------- */
  .progress-bar-wrap{background:var(--bg-elev2);border-radius:20px;height:8px;overflow:hidden;margin-bottom:14px;}
  .progress-bar-fill{background:var(--secondary);height:100%;transition:width .2s;}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .quiz-meta .left{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-dim);}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.02em;}
  .badge-ch{background:var(--bg-elev2);border:1px solid var(--border);color:var(--secondary);}
  .badge-diff-easy{background:rgba(0,212,255,.12);color:var(--secondary);}
  .badge-diff-medium{background:rgba(141,160,174,.18);color:#c7d3db;}
  .badge-diff-hard{background:rgba(255,107,53,.14);color:var(--accent);}
  .timer{font-size:15px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .timer.warn{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .question-text{font-size:19px;font-weight:600;margin:14px 0 18px;white-space:pre-wrap;}
  .question-text pre{
    background:#0a1319;border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    overflow-x:auto;font-size:14px;color:#b9e6f5;white-space:pre;font-family:'SFMono-Regular',Consolas,monospace;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg-elev2);cursor:pointer;font-size:15px;
    transition:border-color .12s, background .12s;
  }
  .option:hover{border-color:var(--secondary);}
  .option .opt-letter{
    width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--text-dim);
  }
  .option.selected{border-color:var(--secondary);background:rgba(0,212,255,.08);}
  .option.selected .opt-letter{background:var(--secondary);color:#06222b;border-color:var(--secondary);}
  .option.correct{border-color:#3ddc84;background:rgba(61,220,132,.1);}
  .option.correct .opt-letter{background:#3ddc84;color:#04270f;border-color:#3ddc84;}
  .option.wrong{border-color:var(--accent);background:rgba(255,107,53,.1);}
  .option.wrong .opt-letter{background:var(--accent);color:#2b0f00;border-color:var(--accent);}
  .option.disabled{cursor:default;}

  .explanation-box{
    margin-top:18px;padding:16px 18px;border-radius:10px;background:var(--bg-elev2);
    border-left:3px solid var(--secondary);font-size:14px;color:var(--text-dim);
  }
  .explanation-box.wrong-border{border-left-color:var(--accent);}
  .explanation-box b{color:var(--text);}
  .result-tag{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
  .result-tag.ok{background:rgba(61,220,132,.15);color:#3ddc84;}
  .result-tag.no{background:rgba(255,107,53,.15);color:var(--accent);}

  /* ---------- 결과 화면 ---------- */
  .score-hero{text-align:center;padding:26px 10px 10px;}
  .score-num{font-size:52px;font-weight:800;color:var(--secondary);}
  .score-num.fail{color:var(--accent);}
  .score-label{font-size:14px;color:var(--text-dim);margin-top:2px;}
  .pass-pill{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;padding:6px 18px;border-radius:20px;}
  .pass-pill.pass{background:rgba(61,220,132,.15);color:#3ddc84;}
  .pass-pill.fail{background:rgba(255,107,53,.15);color:var(--accent);}

  table.stat-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;}
  table.stat-table th,table.stat-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  table.stat-table th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .bar-cell{display:flex;align-items:center;gap:8px;}
  .bar-track{flex:1;height:6px;background:var(--bg-elev2);border-radius:4px;overflow:hidden;min-width:60px;}
  .bar-fill{height:100%;background:var(--secondary);}

  .review-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:10px;background:var(--bg-elev2);}
  .review-item .rq{font-size:14px;font-weight:600;margin-bottom:6px;white-space:pre-wrap;}
  .review-item .ra{font-size:13px;color:var(--text-dim);margin:2px 0;}
  .review-item .ra b{color:var(--text);}
  .review-item .ra.wrong-line{color:var(--accent);}
  .review-item .ra.correct-line{color:#3ddc84;}
  details.review-details summary{cursor:pointer;font-size:13px;color:var(--secondary);margin-top:6px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state .icon{font-size:40px;margin-bottom:10px;}

  .notebook-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:10px;background:var(--bg-elev2);
  }
  .notebook-item .nq{font-size:14px;flex:1;white-space:pre-wrap;}
  .notebook-item .badges{display:flex;gap:6px;margin-bottom:6px;}
  .remove-x{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px 8px;}
  .remove-x:hover{color:var(--accent);}

  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);margin-top:6px;}

  footer.foot{margin-top:50px;text-align:center;font-size:12px;color:var(--text-dim);opacity:.6;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== 문제은행 데이터 (임베드) ===================== */

  {

/* ===================== 유틸 ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function byId(id){ return QUESTION_BANK.find(q=>q.id===id); }
function isMulti(q){ return Array.isArray(q.answer); }
function answerSetEqual(sel, ans){
  const a = Array.isArray(ans) ? ans.slice().sort() : [ans];
  const b = sel.slice().sort();
  if(a.length!==b.length) return false;
  return a.every((v,i)=>v===b[i]);
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// 문제 지문 중 ``` 코드블록 부분을 <pre>로 렌더링
function renderQuestionText(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/```([\s\S]*?)```/g, (m,code)=>`<pre>${code.trim()}</pre>`);
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function pct(n,d){ return d===0 ? 0 : Math.round((n/d)*1000)/10; }

function recordHistory(q, correct, mode){
  history.push({qId:q.id, chapter:q.chapter, difficulty:q.difficulty, correct, mode, ts:Date.now()});
  if(correct){ /* 정답이어도 오답노트에서 자동 제거하지 않음(사용자가 선택하도록) */ }
  else { wrongSet.add(q.id); }
}

/* ===================== 퀴즈 진행 화면 (기본/모의고사/오답노트 다시풀기 공용) ===================== */
function quizHtml(isExam){
  const q = quiz.questions[quiz.index];
  const total = quiz.questions.length;
  const answered = quiz.submitted[q.id] !== undefined;
  const sel = quiz.selected[q.id] || [];
  const multi = isMulti(q);

  let timerHtml = "";
  if(isExam){
    const remain = quiz.remainSec;
    const warn = remain <= 300;
    timerHtml = `<div class="timer ${warn?'warn':''}">⏳ 남은 시간 ${fmtTime(remain)}</div>`;
  }

  const optionsHtml = q.options.map((opt,i)=>{
    let cls = "option";
    const isSelected = sel.includes(i);
    if(isSelected) cls += " selected";
    if(!isExam && answered){
      cls += " disabled";
      const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
      if(ansArr.includes(i)) cls += " correct";
      else if(isSelected) cls += " wrong";
    }
    const letter = String.fromCharCode(65+i);
    return `<div class="${cls}" data-opt="${i}">
      <span class="opt-letter">${letter}</span>
      <span>${escapeHtml(opt)}</span>
    </div>`;
  }).join("");

  let explanationHtml = "";
  if(!isExam && answered){
    const correct = quiz.submitted[q.id];
    explanationHtml = `
    <div class="explanation-box ${correct?'':'wrong-border'}">
      <span class="result-tag ${correct?'ok':'no'}">${correct?'정답입니다':'오답입니다'}</span><br>
      <b>해설.</b> ${escapeHtml(q.explanation)}
    </div>`;
  }

  const progressPct = Math.round(((quiz.index)/total)*100);

  let bottomBtns = "";
  if(isExam){
    bottomBtns = `
      <button class="btn" id="prev-btn" ${quiz.index===0?'disabled':''}>이전</button>
      <button class="btn" id="next-btn" ${quiz.index===total-1?'disabled':''}>다음</button>
      <button class="btn btn-accent" id="submit-exam-btn" style="margin-left:auto;">시험 종료 및 채점</button>
    `;
  } else {
    if(!answered){
      bottomBtns = `<button class="btn btn-primary" id="submit-answer-btn" ${sel.length===0?'disabled':''}>정답 확인</button>`;
    } else {
      bottomBtns = `<button class="btn btn-primary" id="next-question-btn">${quiz.index===total-1?'결과 보기':'다음 문제'}</button>`;
    }
  }

  const examPalette = isExam ? `
    <div class="chip-row" style="margin:14px 0 4px;">
      ${quiz.questions.map((qq,i)=>{
        const st = quiz.submitted[qq.id]!==undefined || (quiz.selected[qq.id]&&quiz.selected[qq.id].length>0);
        return `<span class="chip ${i===quiz.index?'active':''}" data-goto="${i}" style="min-width:34px;text-align:center;${st?'border-color:#3ddc84;color:#3ddc84;':''}">${i+1}</span>`;
      }).join("")}
    </div>` : "";

  return `
  <div class="link-back" data-action="${isExam?'confirm-exit-exam':'go-home'}">&larr; ${isExam?'모의고사 종료하고 홈으로':'홈으로'}</div>
  <div class="card">
    <div class="quiz-meta">
      <div class="left">
        <span class="badge badge-ch">${CHAPTER_NAMES[q.chapter]}</span>
        <span class="badge badge-diff-${q.difficulty}">${DIFF_LABEL[q.difficulty]}</span>
        <span>${quiz.index+1} / ${total}</span>
      </div>
      ${timerHtml}
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>
    ${examPalette}
    <div class="question-text">${renderQuestionText(q.question)}${multi?'<div style="font-size:13px;color:var(--text-dim);font-weight:400;margin-top:6px;">※ 복수 정답 문제입니다. 해당하는 보기를 모두 선택하세요.</div>':''}</div>
    <div class="options">${optionsHtml}</div>
    ${explanationHtml}
    <div class="btn-row">${bottomBtns}</div>
  </div>`;
}

function renderResultCommon(session, mode, backAction, title, showRemoveOption){
  const total = session.questions.length;
  const correctCount = session.questions.filter(q=>session.submitted[q.id]===true).length;
  const scorePct = pct(correctCount, total);

  const chapterStats = {};
  session.questions.forEach(q=>{
    chapterStats[q.chapter] = chapterStats[q.chapter] || {c:0,t:0};
    chapterStats[q.chapter].t++;
    if(session.submitted[q.id]) chapterStats[q.chapter].c++;
  });

  const wrongList = session.questions.filter(q=>session.submitted[q.id]===false);
  const rightList = session.questions.filter(q=>session.submitted[q.id]===true);

  let removeSectionHtml = "";
  if(showRemoveOption && rightList.length>0){
    removeSectionHtml = `
    <h3 style="margin-top:26px;">이번에 맞힌 문제를 오답노트에서 제거할까요?</h3>
    <div class="card" style="padding:14px 16px;">
      ${rightList.map(q=>`
        <div class="checkbox-row">
          <input type="checkbox" class="notebook-remove-cb" data-qid="${q.id}" checked>
          <span>${escapeHtml(q.question.slice(0,40))}${q.question.length>40?'...':''}</span>
        </div>`).join("")}
      <div class="btn-row"><button class="btn btn-primary" id="apply-remove-btn">선택한 문제 오답노트에서 제거</button></div>
    </div>`;
  }

  return `
  <div class="card">
    <h2 class="screen-title">${title}</h2>
    <div class="score-hero">
      <div class="score-num ${scorePct<65?'fail':''}">${correctCount} / ${total}</div>
      <div class="score-label">정답률 ${scorePct}%</div>
    </div>
    <table class="stat-table">
      <thead><tr><th>챕터</th><th>정답률</th><th></th></tr></thead>
      <tbody>
      ${Object.keys(chapterStats).sort().map(ch=>{
        const s = chapterStats[ch];
        const p = pct(s.c,s.t);
        return `<tr><td>${CHAPTER_NAMES[ch]}</td><td>${s.c}/${s.t}</td>
          <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>${p}%</td></tr>`;
      }).join("")}
      </tbody>
    </table>

    ${removeSectionHtml}

    <h3 style="margin-top:26px;">틀린 문제 (${wrongList.length})</h3>
    ${wrongList.length===0 ? '<p style="color:var(--text-dim);">틀린 문제가 없습니다. 완벽합니다!</p>' : wrongList.map(q=>reviewItemHtml(q, session)).join("")}

    <div class="btn-row">
      <button class="btn btn-primary" data-action="${backAction}">홈으로</button>
      <button class="btn" data-action="go-notebook">오답노트 보기</button>
    </div>
  </div>`;
}
function reviewItemHtml(q, session){
  const sel = session.selected[q.id] || [];
  const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
  const letters = arr=>arr.map(i=>String.fromCharCode(65+i)).join(", ");
  return `
  <div class="review-item">
    <div class="badges">
      <span class="badge badge-ch">${CHAPTER_NAMES[q.chapter]}</span>
      <span class="badge badge-diff-${q.difficulty}">${DIFF_LABEL[q.difficulty]}</span>
    </div>
    <div class="rq">${renderQuestionText(q.question)}</div>
    <div class="ra wrong-line">내 답: ${sel.length?letters(sel):"(미응답)"}</div>
    <div class="ra correct-line">정답: ${letters(ansArr)}</div>
    <details class="review-details"><summary>해설 보기</summary>
      <div class="ra" style="margin-top:6px;">${escapeHtml(q.explanation)}</div>
    </details>
  </div>`;
}

      }).join("")}

      <tbody>
      ${["easy","medium","hard"].filter(d=>byDiff[d]).map(d=>{
        const s = byDiff[d]; const p = pct(s.c,s.t);

      }).join("")}
      </tbody>
    </table>
  </div>`;
}

/* ===================== 이벤트 바인딩 ===================== */
function attachBodyEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>handleAction(el.getAttribute("data-action")));
  });

  // 설정 화면 chip 토글
  app.querySelectorAll('[data-chip="chapter"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const v = parseInt(el.getAttribute("data-val"));
      if(setupState.chapters.has(v)){
        if(setupState.chapters.size>1) setupState.chapters.delete(v);
      } else setupState.chapters.add(v);
      screen="basic-setup"; render();
    });
  });
  app.querySelectorAll('[data-chip="diff"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const v = el.getAttribute("data-val");
      if(setupState.diffs.has(v)){
        if(setupState.diffs.size>1) setupState.diffs.delete(v);
      } else setupState.diffs.add(v);
      screen="basic-setup"; render();
    });
  });
  const countSel = document.getElementById("count-select");
  if(countSel) countSel.addEventListener("change", e=>{ setupState.count = parseInt(e.target.value); });

  const startBasicBtn = document.getElementById("start-basic-btn");
  if(startBasicBtn) startBasicBtn.addEventListener("click", startBasicQuiz);

  // 퀴즈 화면
  app.querySelectorAll("[data-opt]").forEach(el=>{
    el.addEventListener("click", ()=>selectOption(parseInt(el.getAttribute("data-opt"))));
  });
  const submitAnsBtn = document.getElementById("submit-answer-btn");
  if(submitAnsBtn) submitAnsBtn.addEventListener("click", submitAnswer);
  const nextQBtn = document.getElementById("next-question-btn");
  if(nextQBtn) nextQBtn.addEventListener("click", nextQuestion);
  const prevBtn = document.getElementById("prev-btn");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ quiz.index--; render(); });
  const nextBtn = document.getElementById("next-btn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ quiz.index++; render(); });
  const submitExamBtn = document.getElementById("submit-exam-btn");
  if(submitExamBtn) submitExamBtn.addEventListener("click", ()=>finishExam(false));
  app.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>{ quiz.index = parseInt(el.getAttribute("data-goto")); render(); });
  });

  // 오답노트
  const retryBtn = document.getElementById("retry-notebook-btn");
  if(retryBtn) retryBtn.addEventListener("click", startNotebookRetry);
  app.querySelectorAll("[data-remove-id]").forEach(el=>{
    el.addEventListener("click", ()=>{
      wrongSet.delete(el.getAttribute("data-remove-id"));
      render();
    });
  });
  const applyRemoveBtn = document.getElementById("apply-remove-btn");
  if(applyRemoveBtn) applyRemoveBtn.addEventListener("click", ()=>{
    app.querySelectorAll(".notebook-remove-cb:checked").forEach(cb=>{
      wrongSet.delete(cb.getAttribute("data-qid"));
    });
    screen = "home"; render();
  });
}

function handleAction(action){
  if(action==="go-home"){ stopExamTimer(); screen="home"; render(); }
  else if(action==="go-basic-setup"){ screen="basic-setup"; render(); }
  else if(action==="go-notebook"){ screen="notebook"; render(); }
  else if(action==="go-notebook-from-result"){ screen="notebook"; render(); }
  else if(action==="go-stats"){ screen="stats"; render(); }
  else if(action==="go-exam"){ startExam(); }
  else if(action==="confirm-exit-exam"){
    if(window.confirm("모의고사를 종료하고 홈으로 돌아갈까요? 진행 상황은 저장되지 않습니다.")){
      stopExamTimer(); screen="home"; render();
    }
  }
}

/* ===================== 기본 퀴즈 로직 ===================== */
function startBasicQuiz(){
  const pool = QUESTION_BANK.filter(q=>setupState.chapters.has(q.chapter) && setupState.diffs.has(q.difficulty));
  const n = Math.min(setupState.count, pool.length);
  const chosen = shuffle(pool).slice(0,n);
  quiz = { questions: chosen, index:0, selected:{}, submitted:{}, mode:"basic" };
  screen = "basic-quiz"; render();
}
function selectOption(i){
  if(!quiz) return;
  const q = quiz.questions[quiz.index];
  const isExam = screen==="exam";
  if(!isExam && quiz.submitted[q.id]!==undefined) return; // 이미 채점된 문제는 선택 변경 불가(기본모드)
  const multi = isMulti(q);
  let sel = quiz.selected[q.id] || [];
  if(multi){
    if(sel.includes(i)) sel = sel.filter(x=>x!==i);
    else sel = sel.concat([i]);
  } else {
    sel = [i];
  }
  quiz.selected[q.id] = sel;
  render();
}
function submitAnswer(){
  const q = quiz.questions[quiz.index];
  const sel = quiz.selected[q.id] || [];
  const correct = answerSetEqual(sel, q.answer);
  quiz.submitted[q.id] = correct;
  recordHistory(q, correct, quiz.mode);
  render();
}
function nextQuestion(){
  if(quiz.index < quiz.questions.length-1){
    quiz.index++;
    render();
  } else {
    if(quiz.mode==="basic") screen="basic-result";
    else if(quiz.mode==="notebook"){ notebookRetrySession = quiz; screen="notebook-result"; }
    render();
  }
}

/* ===================== 모의고사 로직 ===================== */
function startExam(){
  const pool = QUESTION_BANK;
  const n = Math.min(EXAM_QUESTION_COUNT, pool.length);
  const chosen = shuffle(pool).slice(0,n);
  quiz = { questions: chosen, index:0, selected:{}, submitted:{}, mode:"exam", remainSec: EXAM_DURATION_SEC };
  screen = "exam"; render();
  startExamTimer();
}
function startExamTimer(){
  stopExamTimer();
  examTimerHandle = setInterval(()=>{
    if(!quiz || quiz.mode!=="exam"){ stopExamTimer(); return; }
    quiz.remainSec--;
    if(quiz.remainSec<=0){
      quiz.remainSec = 0;
      finishExam(true);
      return;
    }
    // 매초 전체 렌더는 비용이 크지 않으므로 그대로 갱신 (문항 400개 이하 규모)
    render();
  }, 1000);
}
function stopExamTimer(){
  if(examTimerHandle){ clearInterval(examTimerHandle); examTimerHandle = null; }
}
function finishExam(auto){
  stopExamTimer();
  // 채점: 모든 문제에 대해 선택 여부와 무관하게 정오 판정
  quiz.questions.forEach(q=>{
    if(quiz.submitted[q.id]===undefined){
      const sel = quiz.selected[q.id] || [];
      const correct = sel.length>0 && answerSetEqual(sel, q.answer);
      quiz.submitted[q.id] = correct;
      recordHistory(q, correct, "exam");
    }
  });
  screen = "exam-result";
  render();
}

/* ===================== 오답노트 다시 풀기 ===================== */
function startNotebookRetry(){
  const items = Array.from(wrongSet).map(byId).filter(Boolean);
  if(items.length===0) return;
  quiz = { questions: shuffle(items), index:0, selected:{}, submitted:{}, mode:"notebook" };
  screen = "basic-quiz"; // 진행 UI는 기본 퀴즈와 동일하게 재사용
  render();
}

/* ===================== 초기 렌더 ===================== */
render();
</script>
