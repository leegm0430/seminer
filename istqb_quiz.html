xplanation":"테스트가 테스트 요구사항이나 테스트 대상을 얼마나 수행했는지를 양적으로 측정해 테스트의 충분성을 판단하고 종료 시점 결정의 근거로 쓰는 지표는 테스트 커버리지(Test Coverage)이다. 요구사항 커버리지, 코드 커버리지(문장·결정·조건 커버리지 등) 형태로 측정된다. 테스트 조건은 커버리지의 측정 대상이 되는 항목일 뿐 양적 평가 개념이 아니고, 테스트 효율성은 투입 자원 대비 성과를, 테스트 케이스 실패율은 결과의 통과·실패 비율을 나타내므로 '수행 정도'를 측정하는 지표가 아니다.","explSource":"authored","answer":3},{"id":"csts-appendix-456-11-172","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트시프로그램의특정모듈에서평균이상의결함이발견되었다.이에대한대응방안으로올바른것은무엇인가?[지문상자:(가)해당부분에대한테스트가충분하므로다른모듈들에","question":"테스트 시 프로그램의 특정 모듈에서 평균이상의 결함이 발견되었다. 이에 대한 대응 방안으로 올바른 것은 무엇인가?\n[지문 상자:\n(가) 해당 부분에 대한 테스트가 충분하므로 다른 모듈들에 대해 더 많은 테스트 노력을 기울인다.\n(나) 많은 결함이 발견되었다는 의미는 그 부분에 더 많은 결함이 존재할 수 있다는 것이므로 그 부분에 대해 더 많은 테스트 노력을 기울여야 한다.\n(다) 모듈에서 발생한 결함의 수와 관계없이 모든 모듈을 동일한 테스트 노력으로 테스트를 수행하는 것이 효율적이다.\n(라) 소프트웨어 설계나 구조에 심각한 문제가 많은 결함을 유발하였는지 조사하고, 구조를 개선함으로써 더 많은 결함의 발생을 예방하도록 한다.]","options":["(가), (나)","(나), (라)","(다), (라)","(가), (라)"],"explanation":"결함 집중(Defect Clustering) 원리에 따라 결함은 특정 모듈에 몰려 있는 경향이 있으므로, 평균 이상의 결함이 발견된 모듈에는 추가 결함이 잠재할 가능성이 높아 테스트 노력을 더 투입해야 한다는 (나)가 옳다. 아울러 다수 결함의 근본 원인이 설계나 구조의 문제인지 조사해 구조를 개선하는 (라)는 결함 예방 관점의 올바른 대응이다. 결함이 많이 나왔으므로 그 부분의 테스트가 충분하다고 보는 (가)는 결함 집중 원리에 반하며, 모든 모듈에 동일한 노력을 균등 배분하는 (다)는 위험 기반 우선순위화를 무시하므로 효율적이지 않다.","explSource":"authored","answer":1},{"id":"csts-appendix-456-12-173","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트프로세스의필요성으로거리가먼것은무엇인가?","question":"테스트 프로세스의 필요성으로 거리가 먼 것은 무엇인가?","options":["소프트웨어 품질목표 달성에 프로세스가 중요한 역할을 하기 때문에","효율적이고 효과적인 테스트 수행을 위한 관리의 중요성이 부각되었기 때문에","충분한 시간과 비용을 사용하여 체계적인 테스트 수행이 필요하기 때문에","평가를 통한 테스트 활동 개선이 필요하기 때문에"],"explanation":"테스트는 언제나 시간·비용·인력이 제한된 조건에서 수행되며, 그 제약 속에서 위험도에 따라 자원을 배분하기 위해 프로세스가 필요한 것이므로 '충분한 시간과 비용을 사용하여'라는 전제를 둔 ③은 테스트 프로세스의 필요성과 거리가 멀다. 완벽한 테스팅은 불가능하다는 원리가 이를 뒷받침한다. 품질 목표 달성에서 프로세스의 역할, 효율적·효과적 수행을 위한 관리의 중요성, 평가를 통한 활동 개선은 모두 테스트 프로세스가 필요한 정당한 이유이다.","explSource":"authored","answer":2},{"id":"csts-appendix-457-13-174","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트프로세스활동중,테스트의범위,수행방법및일정을수립하는활동은무엇인가?","question":"테스트 프로세스 활동 중, 테스트의 범위, 수행방법 및 일정을 수립하는 활동은 무엇인가?","options":["테스트 계획","테스트 모니터링 및 통제","테스트 평가","테스트 실행"],"explanation":"테스트 계획은 테스트 관리 프로세스의 시작 활동으로 동적 테스트를 효과적이고 효율적으로 수행하기 위한 계획 수립(테스트 범위, 수행 방법, 일정 등)을 목적으로 한다.","explSource":"book-dup","answer":0},{"id":"csts-appendix-457-14-175","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음테스트문서중에서작성시점이다른것은무엇인가?","question":"다음 테스트 문서 중에서 작성 시점이 다른 것은 무엇인가?","options":["테스트 절차서","테스트 로그","테스트 사건 보고서","테스트 요약 보고서"],"explanation":"테스트 절차서는 테스트 케이스를 어떤 순서와 방법으로 실행할지 규정하는 문서이므로 테스트 구현 단계, 즉 테스트 실행 전에 작성된다. 반면 테스트 로그는 실행 중 발생한 사건을 시간순으로 기록하고, 테스트 사건(Incident) 보고서는 실행 중 관찰된 이상 현상을 기록하며, 테스트 요약 보고서는 실행 결과를 종합해 종료 시점에 작성되므로 셋 다 실행 이후에 산출되는 문서이다. 따라서 작성 시점이 다른 것은 ①이며, 테스트 문서는 '실행 전 계획·설계 문서'와 '실행 중·후 결과 문서'로 나누어 기억하면 유용하다.","explSource":"authored","answer":0},{"id":"csts-appendix-457-15-176","part":"appendix","chapter":0,"qtype":"mc","dupKey":"A씨는신규개발한소프트웨어에대한테스트계획을수립하고있다.이과정에서기술적으로어려운'보안인증'모듈에강도높은단위테스트를수행하기위해UnitTestFrame","question":"A 씨는 신규 개발한 소프트웨어에 대한 테스트 계획을 수립하고 있다. 이 과정에서 기술적으로 어려운 '보안 인증' 모듈에 강도 높은 단위 테스트를 수행하기 위해 Unit Test Framework를 사용하기로 하였다. 다음 중 Unit Test Framework를 사용하는 이유로 올바르지 않은 것은?","options":["기본 경로(Basis Path)들을 확인함으로써 구조적 테스트를 강화하고자 한다.","경계값(Boundary Value)을 확인함으로써 입력값 범위에 따른 처리 결과를 확인하고자 한다.","OS, 파일 시스템, 하드웨어 또는 시스템 상호 간의 연결성을 테스트하고자 한다.","에러 핸들링 경로를 확인함으로써 기능의 안정적 동작을 확인하고자 한다."],"explanation":"OS, 파일 시스템, 하드웨어, 시스템 상호 간의 연결성을 확인하는 것은 모듈 경계를 넘는 검증이므로 통합 테스트나 시스템 테스트의 목적이며, 단위 테스트 프레임워크(Unit Test Framework)를 사용하는 이유로는 옳지 않다. 단위 테스트 프레임워크는 개별 모듈을 독립적으로 호출해 반복 실행·검증하는 도구로, 기본 경로(Basis Path) 확인을 통한 구조적(화이트박스) 테스트 강화, 경계값(Boundary Value) 입력에 대한 처리 결과 확인, 예외 및 에러 핸들링 경로 확인에 활용된다. 외부 연동 대상은 스텁이나 목(Mock)으로 대체하는 것이 단위 테스트의 전제라는 점도 함께 기억해야 한다.","explSource":"authored","answer":2},{"id":"csts-appendix-457-16-177","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트리소스할당및일정수립에관한설명으로가장올바른것은?","question":"테스트 리소스 할당 및 일정 수립에 관한 설명으로 가장 올바른 것은?","options":["테스트 역량보다는 가용한 테스터를 우선 배정한다.","테스트 가용 인원을 먼저 확인한 후 테스트 업무량을 산정한다.","테스트 자동화 도구는 쉽게 사용할 수 있으므로 테스터 배정 시 테스트 자동화 도구 사용 여부는 고려하지 않는다.","조직 내에 특정 테스트 업무를 수행할 테스터가 없다면, 외부에서 전문가를 찾는다."],"explanation":"① 테스터 역량을 고려해 테스트 업무를 배정해야 한다. ② 테스트 업무량 도출 후 테스트 가용 인원(리소스)을 배치한다. ③ 테스트 자동화 도구 사용 시 전문 지식과 경험이 필요하므로 이를 고려해 테스터를 배정한다. ④ 만일 특정 테스트 업무를 수행할 테스터가 조직 내에 없다면 외부에서 전문가를 찾아 원하는 일정에 참여할 수 있도록 계획한다.","explSource":"book-dup","answer":3},{"id":"csts-appendix-457-17-178","part":"appendix","chapter":0,"qtype":"mc","dupKey":"위험기반테스트계획에서위험도에영향을주는요인으로올바르지않은설명은?","question":"위험 기반 테스트 계획에서 위험도에 영향을 주는 요인으로 올바르지 않은 설명은?","options":["많은 사용자에게 영향을 미치는 경우는 더 높은 위험성을 가진다.","관련 법규, 협력 업체와의 계약 등은 위험성에 영향을 주지 않는다.","오류의 발생 빈도가 위험성에 많은 영향을 미칠 수가 있다.","신뢰도에 심각한 영향을 미칠 수 있다면 위험성 측면에서도 많은 영향을 미친다."],"explanation":"심각성, 발생 가능성뿐만 아니라 관련 법규, 협력 업체와의 계약 등도 고려해야 한다.","explSource":"book-dup","answer":1},{"id":"csts-appendix-458-18-179","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트효과성평가메트릭에대한설명으로적절하지않은것은?","question":"테스트 효과성 평가 메트릭에 대한 설명으로 적절하지 않은 것은?","options":["커버리지 기반 기준에서는 요구사항 커버리지, 설계 커버리지, 코드 커버리지를 기준으로 평가할 수 있다.","개발 단계에서 생성된 결함을 해당 단계에서 검출하는 비율로 효과성을 평가한다.","테스트 케이스 통과 기반 기준에서는 각 테스트 케이스의 심각도를 고려한다.","테스트 케이스의 실패율이 통과 기준이 될 수 있다."],"explanation":"심각도(Severity)는 발견된 결함이 시스템에 미치는 영향의 정도를 나타내는 결함의 속성이므로, 테스트 케이스 통과 기반 기준에서 각 테스트 케이스의 심각도를 고려한다는 ③은 적절하지 않다. 통과 기반 기준은 계획된 테스트 케이스의 수행률과 통과·실패 건수, 실패율로 평가하며 이때 결함의 심각도는 결함 기반 메트릭에서 다룬다. 요구사항·설계·코드 커버리지를 효과성 기준으로 삼는 ①, 해당 단계에서 유입된 결함을 그 단계에서 검출한 비율(단계별 결함 제거 효율)로 평가하는 ②, 실패율을 통과 기준으로 활용하는 ④는 모두 타당하다.","explSource":"authored","answer":2},{"id":"csts-appendix-458-19-180","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음중결함관리에대한설명으로적절하지않은것은?","question":"다음 중 결함 관리에 대한 설명으로 적절하지 않은 것은?","options":["테스트 실행을 통하여 발견된 오류는 일반화, 고립화, 구체화되어 기록된다.","해당 오류가 재연될 수 있도록 구체적으로 오류를 기술해야 한다.","일반적으로 오류를 발견한 테스터가 해당 오류를 수정한다.","발견된 오류는 테스트 사건 보고서에 기록된다."],"explanation":"결함의 수정은 해당 코드와 설계에 책임이 있는 개발자가 수행하고, 테스터는 결함을 발견·기록하고 수정 후 재테스트로 확인하는 역할을 담당하므로 ③은 적절하지 않다. 역할을 분리해야 객관적인 검증이 가능하다는 점이 결함 관리의 기본 원칙이다. 발견된 오류를 일반화·고립화·구체화하여 재현 가능하도록 구체적으로 기술하고 테스트 사건(Incident) 보고서에 기록한다는 ①·②·④는 모두 올바른 설명이다.","explSource":"authored","answer":2},{"id":"csts-appendix-458-20-181","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트목적에대한설명으로적절하지않은것은?","question":"테스트 목적에 대한 설명으로 적절하지 않은 것은?","options":["테스트 목적은 테스트 수준에 따라서 달라질 수 있다.","테스트 목적은 테스트 유형에 따라서 달라질 수 있다.","테스트 목적은 테스트 대상 시스템의 비기능 측면을 중점적으로 고려한다.","테스트 목적은 테스트 분석 및 설계 활동에서 구체화된다."],"explanation":"테스트 목적은 기능 측면과 비기능 측면을 모두 포괄하며 대상과 상황에 따라 어느 쪽을 중점적으로 볼지가 달라지므로, 비기능 측면을 중점적으로 고려한다고 단정한 ③은 적절하지 않다. 예를 들어 단위·통합 테스트는 기능과 구조 확인이 주된 목적이고, 성능·보안 테스트에서 비기능 품질 특성이 중심이 된다. 테스트 목적이 테스트 수준(레벨)과 유형에 따라 달라지고 테스트 분석 및 설계 활동에서 테스트 조건으로 구체화된다는 ①·②·④는 모두 올바르다.","explSource":"authored","answer":2},{"id":"csts-appendix-458-21-182","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트환경구축및점검단계에대한설명으로가장올바른것은?","question":"테스트 환경 구축 및 점검 단계에 대한 설명으로 가장 올바른 것은?","options":["테스트 환경 구축 업무는 개발자 또는 시스템 담당자의 도움 없이 항상 테스터가 진행한다.","요구 및 정의대로 테스트 환경이 구축되었는지를 확인한다.","테스트 환경 구축 점검에는 체크리스트보다 테스트 케이스를 사용하는 것이 효과적이다.","테스트를 실행하면서 테스트 환경 요구 사항을 확인하고 테스트 환경을 구축한다."],"explanation":"테스트 환경 구축 및 점검 단계의 핵심은 사전에 정의한 환경 요구사항대로 하드웨어·소프트웨어·연동 시스템·데이터가 실제로 갖추어졌는지 확인하는 것이므로 ②가 가장 올바르다. 환경 구축에는 개발자, 시스템·네트워크 담당자, DBA의 협조가 필수적이므로 테스터가 항상 단독으로 진행한다는 ①은 틀렸다. 환경 점검은 구성 항목의 누락 여부를 확인하는 작업이라 테스트 케이스보다 체크리스트가 효과적이므로 ③도 옳지 않으며, 환경은 실행 전에 구축·점검을 완료해야 하므로 실행하면서 요구사항을 확인한다는 ④도 순서가 어긋난다.","explSource":"authored","answer":1},{"id":"csts-appendix-458-22-183","part":"appendix","chapter":0,"qtype":"mc","dupKey":"결함생명주기에대한설명으로올바른것은?","question":"결함 생명 주기에 대한 설명으로 올바른 것은?","options":["결함 생명 주기는 조직 및 프로젝트의 특성에 상관없이 동일하게 정의한다.","결함 관리는 결함 해결 과정 전반을 모니터링 한다.","Open된 결함을 즉각적으로 수정하지 않고 다음 릴리즈로 연기된 상태는 결함 생명 주기에 해당하지 않는다.","테스터가 할당된 수정요구를 처리한 상태를 Verified라고 한다."],"explanation":"결함 관리는 결함의 등록부터 할당, 수정, 재테스트, 종료까지 해결 과정 전반의 상태 변화를 추적·모니터링하는 활동이므로 ②가 올바르다. 결함 생명 주기의 상태와 흐름은 조직과 프로젝트의 특성, 사용하는 결함 관리 도구에 따라 다르게 정의될 수 있어 ①은 틀렸다. 즉시 수정하지 않고 다음 릴리즈로 미루는 연기(Deferred) 역시 결함 생명 주기의 정상적인 상태이므로 ③도 옳지 않으며, 할당된 수정 요구를 처리해 조치한 상태는 개발자가 만드는 Resolved(Fixed)이고 Verified는 테스터가 재테스트로 수정을 확인한 상태이므로 ④의 서술은 주체와 상태가 뒤바뀌었다.","explSource":"authored","answer":1},{"id":"csts-appendix-459-23-184","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트계획을수립할때고려되는주요이슈로적절하지않은것은?","question":"테스트 계획을 수립할 때 고려되는 주요 이슈로 적절하지 않은 것은?","options":["언제 테스트를 종료하는 것이 좋을까?","단위 테스트를 수행하는 것이 효과적일까?","테스트 케이스를 생성할 때 소스 코드를 바탕으로 할까?","어떤 코딩 스타일을 사용할까?"],"explanation":"①, ②, ③ 테스트 계획 수립 시 주요 이슈이다. ④ 테스트보다는 개발(프로그래밍)에서 결정할 사항이다.","explSource":"book-dup","answer":3},{"id":"csts-appendix-459-24-185","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음중테스트문서에대한설명으로적절하지않은것은?","question":"다음 중 테스트 문서에 대한 설명으로 적절하지 않은 것은?","options":["테스트 설계 명세서에 따라 테스트 케이스와 절차가 정의된다.","테스트 로그에는 테스트 케이스를 생성하는 과정이 자세하게 기록된다.","테스트 절차서에는 테스트 케이스를 실행시키는 절차가 정의된다.","테스트 케이스 명세서에는 구체적인 테스트 접근 방법과 테스트 통과 기준이 기록된다."],"explanation":"테스트 로그(Test Log)는 테스트를 실행하는 동안 누가 언제 무엇을 수행했고 어떤 결과와 사건이 발생했는지를 시간순으로 기록하는 실행 기록이므로, 테스트 케이스를 생성하는 과정이 기록된다는 ②는 적절하지 않다. 테스트 케이스가 도출되는 과정과 근거는 테스트 설계 명세서에 담긴다. 테스트 설계 명세서에 따라 테스트 케이스와 절차가 정의된다는 ①과 테스트 절차서에 테스트 케이스 실행 절차가 정의된다는 ③은 표준적인 테스트 문서 체계에 부합하므로, 문서의 작성 시점과 담는 내용을 짝지어 기억해야 한다.","explSource":"authored","answer":1},{"id":"csts-appendix-459-25-186","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트케이스명세서에대한설명으로적절하지않은것은?","question":"테스트 케이스 명세서에 대한 설명으로 적절하지 않은 것은?","options":["테스트 케이스가 입력될 테스트 대상이 명시된다.","테스트 대상에 입력될 값과 예상 출력값이 명시된다.","입력값에 의해서 실제로 출력될 값을 관찰하는 방법이 명시된다.","해당 테스트 케이스 고유의 테스트 환경이 있다면 이를 명시한다."],"explanation":"테스트 케이스 명세서에는 테스트 대상(테스트 항목), 입력값과 예상 출력값, 필요한 환경, 특별한 절차상 요구사항과 케이스 간 의존 관계가 기술되므로, 실제 출력값을 관찰하는 방법을 명시한다는 ③은 적절하지 않다. 실행하며 결과를 어떻게 확인하고 기록할지는 테스트 절차서에 규정되고, 실제 관찰된 결과는 테스트 로그에 기록된다. 즉 테스트 케이스 명세서는 '무엇을 무엇으로 넣어 무엇이 나와야 하는가'를 규정하는 문서이고, '어떻게 실행하고 관찰하는가'는 절차서의 몫이라는 역할 구분이 핵심이다.","explSource":"authored","answer":2},{"id":"csts-appendix-459-26-187","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트케이스에대한설명으로올바르지않은것은무엇인가?","question":"테스트 케이스에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["하나의 테스트 절차서로 여러 개의 테스트 케이스를 실행할 수 있다.","오작동(Failure)을 유도해 낼 수 있도록 설계해야 한다.","테스트 목적에 따라 테스트 케이스를 다르게 선택해야 한다.","많은 테스트 케이스로 넓은 커버리지를 수행해야 정상적으로 테스트했다고 볼 수 있다."],"explanation":"완벽한 테스트(Exhaustive Testing)는 불가능하므로 테스트 케이스는 개수나 커버리지 수치가 아니라 리스크와 테스트 목적에 근거해 선별되어야 하며, 많이 만들어 넓은 커버리지를 채우는 것 자체가 정상적인 테스트의 기준이 될 수 없다. A는 하나의 테스트 절차서(Test Procedure)가 여러 테스트 케이스의 실행 순서를 묶어 기술하므로 옳고, B는 테스트의 목적이 결함으로 인한 오작동을 드러내는 것이므로 옳다. C 역시 동일한 대상이라도 테스트 목적(기능 확인, 회귀, 성능 등)에 따라 선택하는 케이스가 달라지므로 올바른 설명이다.","explSource":"authored","answer":3},{"id":"csts-appendix-459-27-188","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음설명에부합되는테스트설계기법은?[지문상자:프로그램내부논리구조를참조하지않고사용자의요구사항이나설계정보등을이용하여테스트케이스를개발하는방법이다.]","question":"다음 설명에 부합되는 테스트 설계기법은?\n[지문 상자: 프로그램 내부 논리 구조를 참조하지 않고 사용자의 요구사항이나 설계 정보 등을 이용하여 테스트 케이스를 개발하는 방법이다.]","options":["클리어박스 테스트","구조기반 테스트","그레이박스 테스트","명세기반 테스트"],"explanation":"내부 논리 구조를 참조하지 않고 요구사항·설계 정보 등 명세를 근거로 테스트 케이스를 도출하는 기법은 명세기반 테스트(Specification-based Testing, 블랙박스 테스트)이며 동등 분할, 경계값 분석, 결정 테이블, 상태 전이 등이 여기에 속한다. B 구조기반 테스트(Structure-based)와 A 클리어박스(화이트박스)는 코드의 제어 흐름·논리 구조를 직접 참조하므로 지문과 반대되고, C 그레이박스는 내부 구조를 일부 알고 있는 상태에서 수행하는 혼합 방식이므로 '내부 구조를 참조하지 않는다'는 조건에 맞지 않는다.","explSource":"authored","answer":3},{"id":"csts-appendix-460-28-189","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음은자동온도조절장치에관한설명이다.동등클래스분할기법을사용하여선정할수있는최소의테스트입력값들은무엇인가?[지문상자:온도가20도아래로떨어지면히터세기를강","question":"다음은 자동 온도 조절 장치에 관한 설명이다. 동등 클래스 분할 기법을 사용하여 선정할 수 있는 최소의 테스트 입력값들은 무엇인가?\n[지문 상자: 온도가 20도 아래로 떨어지면 히터 세기를 강으로 작동시키고, 온도가 25도 이상이 되면 히터의 작동을 중단시킨다.]","options":["17, 23, 32","18, 19, 20, 25","20, 23, 25, 30","23, 25"],"explanation":"동등 분할(Equivalence Partitioning)은 동작이 같은 입력 영역을 하나의 클래스로 묶어 대표값 하나만 선택하는 기법인데, 이 장치의 입력은 '20 미만(강 작동)', '20 이상 25 미만(유지)', '25 이상(중단)'의 세 클래스로 나뉘므로 최소 테스트 입력값은 3개이다. A는 17, 23, 32가 세 클래스를 각각 하나씩 대표하므로 최소 집합에 부합한다. 반면 B는 18·19가 같은 클래스에 중복되고 C도 20과 23이 같은 클래스에 속해 최소가 아니며, D는 23과 25 두 값만 있어 20 미만 클래스를 전혀 커버하지 못한다.","explSource":"authored","answer":0},{"id":"csts-appendix-460-29-190","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음은어느대학교의학점평가프로그램에대한설명이다.다음프로그램에동등클래스분할기법적용시,시험점수에대한테스트케이스로적절한것은?[지문상자:총점은시험점수와리","question":"다음은 어느 대학교의 학점 평가 프로그램에 대한 설명이다. 다음 프로그램에 동등 클래스 분할 기법 적용 시, 시험점수에 대한 테스트 케이스로 적절한 것은?\n[지문 상자: 총점은 시험점수와 리포트 점수를 합한 점수이고, 시험점수는 75점이 만점, 리포트 점수는 25점이 만점이다. 성적은 정수 형태만 입력할 수 있다.]","options":["'시험점수 < 0', '시험점수 > 100'","'시험점수 < 0', '0 ≤ 시험점수 ≤ 75', '75 < 시험점수'","'시험점수 < 0', '0 ≤ 시험점수 < 25', '25 ≤ 시험점수 < 75', '75 < 시험점수'","'시험점수 < 25', '25 ≤ 시험점수 ≤ 100', '100 < 시험점수'"],"explanation":"시험점수는 만점이 75점인 정수 입력이므로 동등 클래스는 무효(0 미만), 유효(0 이상 75 이하), 무효(75 초과)의 세 개로 나뉘며 이것이 B이다. A와 D는 총점의 만점인 100을 시험점수의 경계로 잘못 사용했고, C는 유효 범위 안의 25를 경계로 삼아 '0 이상 25 미만'과 '25 이상 75 미만'으로 쪼갰지만 시험점수 자체의 처리 결과가 25에서 달라지지 않으므로 불필요한 분할이다. 동등 분할에서는 출력이나 처리 결과가 달라지는 지점만 클래스 경계가 된다는 점이 핵심이다.","explSource":"authored","answer":1},{"id":"csts-appendix-460-30-191","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음구조기반테스트기법에대한설명중올바르지않은것은무엇인가?","question":"다음 구조기반 테스트 기법에 대한 설명 중 올바르지 않은 것은 무엇인가?","options":["조건 커버리지는 분기문을 구성하는 각 기본 조건들이 참/거짓이 되는 모든 경우를 고려하는 것을 기준으로 하는 테스트 기법이다.","조건 커버리지를 수행하면 분기 커버리지를 수행하지 않아도 된다.","다중조건 커버리지는 각 기본 조건들의 가능한 모든 논리조합이 테스트 될 수 있도록 하는 방법이다.","조건/분기 커버리지는 분기커버리지와 조건 커버리지의 문제점을 해결하기 위한 방법이다."],"explanation":"조건 커버리지(Condition Coverage)는 개별 기본 조건이 참·거짓을 모두 갖도록 요구하지만 전체 결정문(분기)의 결과가 참·거짓을 모두 갖는 것은 보장하지 않으므로, 조건 커버리지 100%가 분기 커버리지 100%를 포함하지 않아 B가 틀린 설명이다. 예를 들어 (A and B)에서 (A=T, B=F)와 (A=F, B=T) 두 케이스는 조건 커버리지를 만족하지만 결정 결과는 모두 거짓이다. C의 다중조건 커버리지(Multiple Condition Coverage)는 기본 조건들의 모든 논리조합을 테스트하는 기법이고, D의 조건/결정(분기) 커버리지는 기본 조건과 전체 조건식을 함께 참·거짓으로 만들어 이 포함 관계의 빈틈을 메우는 기법이므로 모두 옳다.","explSource":"authored","answer":1},{"id":"csts-appendix-461-31-192","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음은영화티켓예약프로그램의상태전이도를도식화한그림이다.\"예약됨\"에서\"사용됨\"으로전이되는경우에대해테스트케이스를작성하려고할때,도출된테스트케이스로적합한","question":"다음은 영화 티켓 예약 프로그램의 상태 전이도를 도식화한 그림이다. \"예약됨\"에서 \"사용됨\"으로 전이되는 경우에 대해 테스트 케이스를 작성하려고 할 때, 도출된 테스트 케이스로 적합한 것은 무엇인가?\n[그림: 상태 전이도 — 시작점에서 \"예약\" 입력으로 [예약됨] 상태로 진입. [예약됨] --결재--> [결재됨]. [예약됨] --취소--> [취소됨]. [결재됨] --환불--> [취소됨]. [결재됨] --티켓인쇄--> [티켓 발급됨]. [티켓 발급됨] --환불--> [취소됨]. [티켓 발급됨] --티켓전달--> [사용됨].]","options":["[표: TC# / 입력(상태, 입력값) / 예상출력 — 1-1: 예약됨, 결재 → 결재됨 / 1-2: 결재됨, 티켓인쇄 → 사용됨]","[표: TC# / 입력(상태, 입력값) / 예상출력 — 1-1: 예약됨, 결재 → 결재됨 / 1-2: 결재됨, 티켓인쇄 → 티켓 발급됨 / 1-3: 티켓 발급됨, 티켓전달 → 사용됨]","[표: TC# / 입력(상태, 입력값) / 예상출력 — 1-1: 결재됨, 티켓인쇄 → 티켓 발급됨 / 1-2: 티켓 발급됨, 티켓전달 → 사용됨]","[표: TC# / 입력(상태, 입력값) / 예상출력 — 1-1: 예약됨, 결재 → 결재됨 / 1-2: 결재됨, 환불 → 취소됨 / 1-3: 취소됨, 환불 → 티켓 발급됨 / 1-4: 티켓 발급됨, 티켓전달 → 사용됨]"],"explanation":"상태 전이 테스트(State Transition Testing)의 테스트 케이스는 상태 전이도에 실제로 존재하는 전이를 시작 상태부터 목표 상태까지 순서대로 이어 붙여야 하는데, 예약됨에서 사용됨까지의 유효 경로는 예약됨-(결재)-결재됨-(티켓인쇄)-티켓 발급됨-(티켓전달)-사용됨이므로 B가 정답이다. A는 결재됨에서 티켓인쇄의 결과를 사용됨으로 적어 중간 상태인 티켓 발급됨을 빠뜨렸고, C는 시작 상태가 예약됨이 아니라 결재됨이어서 요구된 전이 구간을 다 포함하지 못한다. D는 취소됨에서 환불로 티켓 발급됨이 된다는, 상태 전이도에 없는 무효 전이를 포함하고 있어 유효 전이 테스트로 쓸 수 없다.","explSource":"authored","answer":1},{"id":"csts-appendix-462-32-193","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음은전면에부착된초음파센서값에따라장애물을피하는로봇에대한요구사항명세이다.경계값분석을통하여선정되는테스트입력값들로가장효율이높은것은무엇인가?[지문상자:","question":"다음은 전면에 부착된 초음파 센서값에 따라 장애물을 피하는 로봇에 대한 요구사항 명세이다. 경계값 분석을 통하여 선정되는 테스트 입력값들로 가장 효율이 높은 것은 무엇인가?\n[지문 상자: • 0~5cm까지는 후진   • 10cm까지는 좌회전   • 100cm까지는 전진]","options":["0, 1, 2, 5, 25, 50, 100, 101","-1, 0, 3, 8, 15, 100, 150","-1, 0, 5, 6, 10, 11, 100, 101","0, 1, 2, 10, 11, 100, 101, 102"],"explanation":"경계값 분석(Boundary Value Analysis)은 동등 클래스의 경계와 그 바로 안팎의 값을 선택하는 기법이며, 이 요구사항의 클래스는 0 미만(무효), 0~5, 6~10, 11~100, 100 초과(무효)로 나뉘므로 경계값은 -1, 0, 5, 6, 10, 11, 100, 101이 되어 C가 가장 효율적이다. A와 D는 25·50이나 1·2처럼 클래스 내부의 중간값을 포함해 경계 검출력이 없는 값이 섞여 있고, 특히 A는 -1과 6, D는 0 미만과 5·6 경계를 놓쳤다. B는 3, 8, 15, 150처럼 경계가 아닌 값을 골라 5와 6, 10과 11, 100과 101 같은 실제 경계 쌍을 확인하지 못한다.","explSource":"authored","answer":2},{"id":"csts-appendix-462-33-194","part":"appendix","chapter":0,"qtype":"mc","dupKey":"입력인자(X)에대해10≤X≤30제약조건이있는시스템을개발중이다.개발자가실수로X≤30조건을누락하여10≤X로구현하였을때,다음중에서경계누락오류를찾을가능","question":"입력 인자(X)에 대해 10≤X≤30 제약조건이 있는 시스템을 개발 중이다. 개발자가 실수로 X≤30 조건을 누락하여 10≤X로 구현하였을 때, 다음 중에서 경계 누락 오류를 찾을 가능성이 가장 높은 테스트 입력값은 무엇인가?","options":["9","10","30","31"],"explanation":"31은 10≤X≤30에서는 외부의 점으로 간주하고 10≤X에서는 내부의 점으로 간주하기 때문에 다른 처리를 하게 되어 다른 출력을 낼 가능성이 크다.","explSource":"book-dup","answer":3},{"id":"csts-appendix-462-34-195","part":"appendix","chapter":0,"qtype":"mc","dupKey":"어느시스템에서버튼이눌러졌을때의액션은시스템이현재어떤기능을수행하고있는지에따라달라진다고한다면이를테스트하는데가장적합한테스트방법은무엇인가?","question":"어느 시스템에서 버튼이 눌러졌을 때의 액션은 시스템이 현재 어떤 기능을 수행하고 있는지에 따라 달라진다고 한다면 이를 테스트하는데 가장 적합한 테스트 방법은 무엇인가?","options":["리그레션 테스트","상태 전이 테스트","결정 테이블 테스트","페어와이즈 테스트"],"explanation":"동일한 입력(버튼 누름)에 대한 결과가 시스템이 현재 어떤 상태에 있는지에 따라 달라지는 상황은 상태·이벤트·전이·동작으로 모델링해야 하므로 상태 전이 테스트(State Transition Testing)가 가장 적합하다. C 결정 테이블 테스트는 여러 조건의 조합에 따른 결과를 다루지만 시간에 따른 상태 이력을 표현하지 못하고, D 페어와이즈는 파라미터 값 조합을 줄이는 기법이며, A 리그레션 테스트는 변경으로 인한 부작용을 확인하는 테스트 유형이지 이런 동작 모델링 기법이 아니다.","explSource":"authored","answer":1},{"id":"csts-appendix-462-35-196","part":"appendix","chapter":0,"qtype":"mc","dupKey":"한테스트집합이90%의분기커버리지를달성하였다는사실이의미하는것은무엇인가?","question":"한 테스트 집합이 90%의 분기 커버리지를 달성하였다는 사실이 의미하는 것은 무엇인가?","options":["프로그램의 10개 문장이 있다면 테스트 집합에 의해 그중 9개가 실행되었다는 의미이다.","프로그램의 10개 분기가 있다면 테스트 집합에 의해 그중 9개가 실행되었다는 의미이다.","이 프로그램에 대해 10개의 테스트 입력 데이터 중에서 9개가 실행되었다는 의미이다.","10개의 테스트 입력 데이터 중에서 9개가 오류를 검출하였다는 의미이다."],"explanation":"분기 커버리지(Branch Coverage, 결정 커버리지)는 프로그램 내 전체 분기 중 테스트로 실행된 분기의 비율이므로, 90%는 분기 10개 중 9개가 실행되었다는 뜻인 B가 정답이다. A는 분기가 아니라 문장을 세고 있으므로 문장 커버리지(Statement Coverage)의 정의이고, C와 D는 커버리지를 테스트 입력 데이터의 실행 비율이나 결함 검출률로 잘못 해석한 것이다. 커버리지는 테스트 대상 코드 구조 요소의 실행 비율을 의미하며 결함 검출 성공률과는 무관하다는 점을 기억해야 한다.","explSource":"authored","answer":1},{"id":"csts-appendix-463-36-197","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음프로그램에대하여100%문장커버리지를만족하는테스트데이터는무엇인가?(※단,shortcircuitevaluation은없다고가정한다)```IF((X","question":"다음 프로그램에 대하여 100% 문장 커버리지를 만족하는 테스트 데이터는 무엇인가?\n(※ 단, short circuit evaluation은 없다고 가정한다)\n```\nIF (( X > 1 ) AND ( Y == 1 ))\n        Z = Z / X\nEND\nIF (( X == 2 ) OR ( Z > 1 ))\n        Z = Z + 1\nEND\n```","options":["X=5, Y=1, Z=10","X=1, Y=1, Z=2","X=2, Y=2, Z=5","X=3, Y=1, Z=0"],"explanation":"X=5, Y=1이면 첫 번째 IF 조건이 참이 되어 Z=Z/X가 실행되고, 그 결과 Z>1이므로 두 번째 IF의 Z=Z+1도 실행되어 모든 문장을 수행한다.","explSource":"book","answer":0},{"id":"csts-appendix-463-37-198","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음설명중에서인스펙션에해당하는것을모두고른것은무엇인가?(가)완성된결과물이아닌중간산출물을대상으로한다.(나)참가자의역할이명확하다.(다)검토결과에따라다","question":"다음 설명 중에서 인스펙션에 해당하는 것을 모두 고른 것은 무엇인가?\n(가) 완성된 결과물이 아닌 중간 산출물을 대상으로 한다.\n(나) 참가자의 역할이 명확하다.\n(다) 검토 결과에 따라 다음 단계로 진행할지 여부를 승인한다.\n(라) 체크리스트를 사용한다.","options":["(가), (나)","(가), (다)","(나), (라)","(다), (라)"],"explanation":"인스펙션(Inspection)은 가장 공식적인 정적 리뷰로, 주재자(Moderator)·발표자·기록자·검토자 등 참가자의 역할과 절차가 명확하게 규정되어 있고(나) 결함 유형별 체크리스트를 사용해 결함을 찾으므로(라) C가 정답이다. (가)의 미완성 중간 산출물을 대상으로 하는 비공식적 검토는 워크쓰루나 동료 검토의 성격이며, 인스펙션은 진입 조건을 만족한 완성된 작업물을 대상으로 한다. (다)처럼 검토 결과로 다음 단계 진행 여부를 승인하는 것은 관리적 판단을 하는 관리 검토(Management Review)의 목적이고, 인스펙션 자체는 결함 발견에 초점을 둔다.","explSource":"authored","answer":2},{"id":"csts-appendix-463-38-199","part":"appendix","chapter":0,"qtype":"mc","dupKey":"공식검토참가자에대한설명중올바르지않은것은?","question":"공식 검토 참가자에 대한 설명 중 올바르지 않은 것은?","options":["주재자(Moderator)는 공식 검토를 계획하고 공식 검토 회의를 운영하며, 회의 종료 후 사후 관리를 한다.","작성자(Author)는 검토 대상 산출물 작성자로서 문서에 대한 책임이 있으며, 검토 시 해당 산출물에 관해 설명한다.","검토자(Reviewer)는 검토 실행을 결정하고 프로젝트 일정 내에서 검토 시간을 할당하며, 검토 목표가 달성되었는지 판단한다.","기록자(Recorder)는 회의 내용을 기록하고 모든 이슈 사항, 결함, 정의되어야 할 문제점 등을 문서화한다."],"explanation":"검토 실행을 결정하고 검토 시간을 할당하며 목표 달성 여부를 판단하는 것은 관리자(Manager)의 역할이다.","explSource":"book","answer":2},{"id":"csts-appendix-464-39-200","part":"appendix","chapter":0,"qtype":"mc","dupKey":"정적테스트에대한설명으로타당하지않은것은무엇인가?","question":"정적 테스트에 대한 설명으로 타당하지 않은 것은 무엇인가?","options":["동적 테스트 방법에서 검출하기 힘든 오류들을 찾아낸다.","가능한 개발 초기에 오류들을 찾아내어 품질을 향상시킨다.","프로그램 개발단계에서 산출되는 결과물에서 결함을 찾아낸다.","코드 분석을 기반으로 프로그램을 실행하여 오류를 찾아낸다."],"explanation":"정적 테스트는 프로그램을 실행하지 않고 수행한다.","explSource":"book","answer":3},{"id":"csts-appendix-464-40-201","part":"appendix","chapter":0,"qtype":"mc","dupKey":"워크쓰루에관한설명으로올바르지않은것은무엇인가?","question":"워크쓰루에 관한 설명으로 올바르지 않은 것은 무엇인가?","options":["회의 시작 전에 참가자들이 작업물에 대해 철저한 준비를 해야 한다.","보통은 개발자에 의해 회의가 진행된다.","회의를 주재하기 위해 별도의 훈련을 필요로 하지 않는다.","회의의 결과가 잘 처리되었는지 확인하는 작업을 생략할 수 있다."],"explanation":"워크쓰루(Walkthrough)는 작성자가 주도하는 비공식적 검토로 참가자의 사전 준비가 필수가 아니어서 A가 올바르지 않은 설명이며, 참가자 전원의 철저한 사전 준비를 요구하는 것은 공식적인 인스펙션의 특징이다. B와 C는 워크쓰루가 보통 개발자(작성자) 자신이 진행하고 주재자 교육 같은 별도 훈련을 요구하지 않는다는 점에서 옳고, D도 비공식 검토여서 결과 처리에 대한 후속 확인(Follow-up)이 생략될 수 있다는 점에서 옳다. 즉 공식성·역할·사전 준비·후속 확인의 정도가 인스펙션과 워크쓰루를 가르는 기준이다.","explSource":"authored","answer":0},{"id":"csts-appendix-464-41-202","part":"appendix","chapter":0,"qtype":"mc","dupKey":"인스펙션에대한설명으로올바른것은무엇인가?","question":"인스펙션에 대한 설명으로 올바른 것은 무엇인가?","options":["인스펙션의 목적은 가능한 한 개발 초기에 검사하고 제품에서 결함을 찾아내기 위한 취지로 개발되었다.","인스펙션은 주재자, 개발자, 기록자, 검토자의 역할이 명확하며, 효과적인 인스펙션을 위해서 개발자가 주재자의 역할을 하는 것이 바람직하다.","인스펙션에서 발견된 문제점은 담당자가 책임지고 수정하므로 추가적인 확인을 하지 않는 것이 일반적이다.","작업물로부터 오류를 발견하여 더 나은 품질의 소프트웨어를 개발하는 것뿐만 아니라, 개발자의 능력을 평가하는 것을 목적으로 하기도 한다."],"explanation":"인스펙션은 개발 생애주기 가능한 이른 시점에 산출물을 검사해 결함을 조기에 찾아내 재작업 비용을 줄이려는 목적으로 개발된 공식 검토 기법이므로 A가 옳다. B는 작성자인 개발자가 주재자를 맡으면 자기 산출물을 객관적으로 볼 수 없어 중립적인 제3자가 주재해야 하므로 틀리고, C는 발견된 결함의 수정 여부를 확인하는 후속 확인(Follow-up)이 인스펙션의 정식 단계이므로 틀리다. D는 인스펙션 결과를 개발자 개인의 능력 평가나 인사 평가에 사용하면 결함 은폐를 유발하므로 금지된다는 점에서 명백히 틀린 설명이다.","explSource":"authored","answer":0},{"id":"csts-appendix-464-42-203","part":"appendix","chapter":0,"qtype":"mc","dupKey":"각공식검토종류에대한설명으로옳지않은것은무엇인가?","question":"각 공식 검토 종류에 대한 설명으로 옳지 않은 것은 무엇인가?","options":["요구사항 검토(Software Requirement Review, SRR) - 요구사항의 적절성, 기술적 타당성, 요구사항의 완전성, 검증 가능성 등을 검토한다.","예비설계 검토(Preliminary Design Review, PDR) - 소프트웨어 아키텍처의 기술적 타당성을 검토한다.","상세설계 검토(Critical Design Review, CDR) - 코딩 단계 전 상세설계의 기술적 타당성, 완벽성 및 정확성을 검토한다.","테스트 준비 검토(Test Readiness Review, TRR) - 시스템 및 인수 테스트의 결과와 테스트 절차의 완전성을 검토한다."],"explanation":"TRR은 테스트 수행 전 테스트 준비 상태와 테스트 절차의 완전성을 검토하는 것이다.","explSource":"book","answer":3},{"id":"csts-appendix-465-43-204","part":"appendix","chapter":0,"qtype":"mc","dupKey":"정적분석을통해식별할수있는결함유형과거리가먼것은?","question":"정적 분석을 통해 식별할 수 있는 결함 유형과 거리가 먼 것은?","options":["초기화하지 않고 사용한 변수","선언 후 사용하지 않은 함수","선언 후 사용하지 않은 변수","요구사항과 다른 연산 결과"],"explanation":"연산 결과의 오류는 프로그램을 실행해야 확인할 수 있으므로 동적 테스트의 영역이다.","explSource":"book","answer":3},{"id":"csts-appendix-465-44-205","part":"appendix","chapter":0,"qtype":"mc","dupKey":"심볼릭실행과관련이없는것은무엇인가?","question":"심볼릭 실행과 관련이 없는 것은 무엇인가?","options":["동적 분석 방법","프로그램 테스트 데이터 자동 생성","실행 불가능한 경로 검출","주어진 경로가 실행 가능한지 검사"],"explanation":"심볼릭 실행은 정적 분석 방법에 해당한다.","explSource":"book","answer":0},{"id":"csts-appendix-465-45-206","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트자동화도입을고려하는시점에대한설명으로올바르지않은것은?","question":"테스트 자동화 도입을 고려하는 시점에 대한 설명으로 올바르지 않은 것은?","options":["요구사항 명세서에 테스트 자동화에 대한 요구를 명시한다.","자동화에 필요한 API, 로그, 도구 등이 초기에 계획되어야 한다.","GUI 테스트 자동화의 경우, GUI가 확정되는 구현단계 이후부터 자동화를 계획한다.","테스트 자동화 전략이 테스트 총괄 계획서에 포함되고 프로젝트 초기에 이해 관계자와 합의되어야 한다."],"explanation":"테스트 자동화는 구현이 끝난 뒤 착수하는 것이 아니라 프로젝트 초기에 전략과 구조를 함께 설계해야 하므로, GUI가 확정되는 구현단계 이후부터 계획한다는 C가 올바르지 않다. GUI 자동화도 화면 식별자(ID) 부여 규칙이나 테스트 가능한 UI 구조처럼 설계 단계의 결정에 의존하기 때문에 요구사항·설계 시점부터 테스트 용이성(Testability)을 확보해야 한다. A, B, D처럼 자동화 요구를 요구사항 명세서에 명시하고 API·로그·도구를 초기에 계획하며 자동화 전략을 테스트 총괄 계획서에 담아 이해관계자와 합의하는 것이 올바른 접근이다.","explSource":"authored","answer":2},{"id":"csts-appendix-465-46-207","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트자동화에대한설명으로가장올바른것은?","question":"테스트 자동화에 대한 설명으로 가장 올바른 것은?","options":["버튼 클릭 하나로 모든 테스트가 자동화될 수 있다.","테스트 자동화 계획은 프로젝트 요구사항 분석 단계에서 수립한다.","모든 테스트 케이스는 100% 자동화가 가능하다.","자동화 도구 선정 즉시 조직 전체에 적용한다."],"explanation":"테스트 자동화는 자동화용 인터페이스·로그·환경 확보가 개발 산출물에 영향을 주므로 요구사항 분석 단계에서부터 계획을 수립해야 하며, 따라서 B가 가장 올바른 설명이다. A와 C는 테스트 준비·환경 구성·결과 판정에 사람의 판단이 필요한 영역이 남아 있어 버튼 하나로 전부 자동화되거나 모든 테스트 케이스를 100% 자동화하는 것은 불가능하므로 틀리다. D는 도구 선정 후 파일럿(시범 적용)으로 효과와 위험을 검증한 뒤 단계적으로 확산해야 하므로 즉시 전사 적용은 잘못된 전략이다.","explSource":"authored","answer":1},{"id":"csts-appendix-465-47-208","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음테스트도구중테스트실행자동화에해당하지않는것은?","question":"다음 테스트 도구 중 테스트 실행 자동화에 해당하지 않는 것은?","options":["캡처/재생 도구","메모리 테스트 도구","성능 테스트 도구","커버리지 분석 도구"],"explanation":"커버리지 분석 도구는 테스트 수행 결과로 코드의 어느 부분이 실행되었는지를 측정·분석하는 정적/동적 분석 및 측정 지원 도구이므로 테스트 실행 자동화(Test Execution) 범주에 속하지 않아 D가 정답이다. A 캡처/재생 도구(Capture/Replay)는 사용자 조작을 기록해 자동 재실행하고, C 성능 테스트 도구는 부하를 생성해 테스트를 직접 실행하며, B 메모리 테스트 도구도 프로그램을 실제로 구동시키면서 메모리 누수 등을 검출하는 실행 기반 도구이다. 도구를 분류할 때는 '테스트를 직접 실행하는가'와 '실행 결과를 분석·측정하는가'를 구분하는 것이 핵심이다.","explSource":"authored","answer":3},{"id":"csts-appendix-466-48-209","part":"appendix","chapter":0,"qtype":"mc","dupKey":"보안성품질특성에대한설명으로가장적절한것은?","question":"보안성 품질 특성에 대한 설명으로 가장 적절한 것은?","options":["보안성의 부특성은 성숙성, 가용성, 접근성이다.","보안성은 소프트웨어가 정보 및 데이터를 올바르게 보호하는 능력을 의미한다.","보안성 결함은 명세 및 구조 기반 테스팅 기법으로 모두 검출할 수 있다.","보안성의 부특성인 접근성은 데이터가 인가되지 않은 접근으로부터 보호되는 비율, 암호화 및 복호화가 정확히 구현된 비율 등으로 측정한다."],"explanation":"① 보안성의 부특성은 기밀성, 무결성, 부인 방지성, 책임성, 인증성이다. ③ 보안성 결함은 일반적인 테스팅 기법으로 검출할 수 없으므로 침투 시험(Penetration Test)를 수행하여 보안의 취약점을 확인한다. ④ 보안성의 부특성 중 기밀성에 대한 설명이다.","explSource":"book-dup","answer":1},{"id":"csts-appendix-466-49-210","part":"appendix","chapter":0,"qtype":"mc","dupKey":"프로그램이얼마나손쉽게테스트가능한지를나타내는특성과가장거리가먼것은?","question":"프로그램이 얼마나 손쉽게 테스트 가능한지를 나타내는 특성과 가장 거리가 먼 것은?","options":["단순성(Simplicity)","관찰 용이성(Observability)","운용 용이성(Operability)","견고성(Robustness)"],"explanation":"견고성은 테스트 용이성과 가장 거리가 먼 특성이다. 반면에 단순성, 관찰 용이성, 운용 용이성은 테스트 용이성의 구체적인 특성이다","explSource":"book-dup","answer":3},{"id":"csts-appendix-466-50-211","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음중성능효율성테스트의부특성은무엇인가?","question":"다음 중 성능 효율성 테스트의 부특성은 무엇인가?","options":["운용 용이성","자원 활용성","상호 운용성","회복 가능성"],"explanation":"성능 효율성 테스트 부특성: 시간 반응성(Time-behaviour), 자원 효율성(Resource Utilization), 수용성(Capacity). ① 운영 용이성: 사용성 테스트 부특성 ③ 상호 운영성: 호환성 테스트 부특성 ④ 복구성: 신뢰성 테스트 부특성","explSource":"book-dup","answer":1},{"id":"csts-appendix-466-51-212","part":"appendix","chapter":0,"qtype":"ox","dupKey":"테스트프로세스는개발프로세스가종료된후에시작되며,한번정립된프로세스는변경하지않는것이효율적이다.","question":"테스트 프로세스는 개발 프로세스가 종료된 후에 시작되며, 한번 정립된 프로세스는 변경하지 않는 것이 효율적이다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 프로세스는 개발이 끝난 뒤에 시작하는 것이 아니라 요구사항 단계부터 계획·분석·설계가 병행되며(조기 테스트 원리), 프로젝트 특성과 리스크에 맞게 지속적으로 개선·조정해야 하므로 틀린 서술이다. 올바르게 고치면 '테스트 프로세스는 개발 프로세스와 병행하여 요구사항 단계부터 시작되며, 프로젝트 상황과 조직의 성숙도에 따라 지속적으로 개선·조정해야 효율적이다'가 된다. 결함은 발견 시점이 늦어질수록 수정 비용이 커진다는 점이 조기 테스트의 근거이다.","explSource":"authored","answer":1},{"id":"csts-appendix-466-52-213","part":"appendix","chapter":0,"qtype":"ox","dupKey":"결함의고립화(Isolation)란,결함이발견되었을때,사용된테스트데이터,테스트절차,테스트환경등을구성하는어떤요소가결함발생에영향을미치는지분석하는것이다","question":"결함의 고립화(Isolation)란, 결함이 발견되었을 때, 사용된 테스트 데이터, 테스트 절차, 테스트 환경 등을 구성하는 어떤 요소가 결함 발생에 영향을 미치는지 분석하는 것이다.","options":["O (맞다)","X (틀리다)"],"explanation":"결함 고립화(Defect Isolation)는 결함이 재현되는 조건을 좁혀 가며 테스트 데이터, 테스트 절차, 테스트 환경 등 여러 요소 중 어떤 요소가 결함 발생에 실제로 영향을 주는지를 분리해 내는 활동이므로 옳은 서술이다. 고립화를 통해 재현 조건을 최소화하면 결함 보고서의 재현 절차가 명확해지고 개발자의 원인 분석과 수정이 쉬워진다. 결함 관리 흐름에서 고립화는 결함 발견 이후 분류(Classification)와 원인 규명 사이를 잇는 단계로 이해하면 된다.","explSource":"authored","answer":0},{"id":"csts-appendix-466-53-214","part":"appendix","chapter":0,"qtype":"ox","dupKey":"테스트프로세스활동중,테스트프로세스자체에대한효율의향상과개선을목적으로하는활동은테스트평가이다.","question":"테스트 프로세스 활동 중, 테스트 프로세스 자체에 대한 효율의 향상과 개선을 목적으로 하는 활동은 테스트 평가이다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book-dup","answer":0},{"id":"csts-appendix-466-54-215","part":"appendix","chapter":0,"qtype":"ox","dupKey":"결정테이블테스트는논리적으로의존적인,가능한모든조건의조합을생성하는테스트설계기법으로,누락된요구사항을검사하고자할때효과적으로사용할수있다.","question":"결정 테이블 테스트는 논리적으로 의존적인, 가능한 모든 조건의 조합을 생성하는 테스트 설계 기법으로, 누락된 요구사항을 검사하고자 할 때 효과적으로 사용할 수 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"논리적으로 의존적인, 가능한 모든 조건의 조합을 생성한다. 복잡한 논리적 관계를 표현하기에 좋다. 누락된 요구사항을 검사하고자 할 때 쉽게 사용할 수 있다.","explSource":"book-dup","answer":0},{"id":"csts-appendix-467-55-216","part":"appendix","chapter":0,"qtype":"ox","dupKey":"구조기반테스트는특성상시스템및인수테스트단계에서만수행한다.","question":"구조기반 테스트는 특성상 시스템 및 인수 테스트 단계에서만 수행한다.","options":["O (맞다)","X (틀리다)"],"explanation":"구조기반 테스트(Structure-based Testing)는 코드나 내부 구조를 참조하는 기법으로 주로 단위 테스트와 통합 테스트 단계에서 커버리지 측정과 함께 수행되므로 틀린 서술이다. 올바르게 고치면 '구조기반 테스트는 단위·통합 테스트 단계에서 주로 수행되며, 메뉴 구조나 비즈니스 프로세스 구조를 대상으로 하면 시스템·인수 테스트 단계에서도 적용할 수 있다'가 된다. 반대로 시스템 및 인수 테스트 단계에서 중심이 되는 것은 요구사항과 사용자 관점을 근거로 하는 명세기반 테스트이다.","explSource":"authored","answer":1},{"id":"csts-appendix-467-56-217","part":"appendix","chapter":0,"qtype":"ox","dupKey":"오류추정은특정소프트웨어에대해테스터의직관과경험을활용하여어떤유형의결함이발생할것을예측하여테스트하는방법이다.","question":"오류 추정은 특정 소프트웨어에 대해 테스터의 직관과 경험을 활용하여 어떤 유형의 결함이 발생할 것을 예측하여 테스트하는 방법이다.","options":["O (맞다)","X (틀리다)"],"explanation":"오류 추정에 대한 설명이다.","explSource":"book-dup","answer":0},{"id":"csts-appendix-467-57-218","part":"appendix","chapter":0,"qtype":"ox","dupKey":"프로그램코드에대해자료흐름분석을수행할때dd,kk,~u,du는이상패턴에해당한다.","question":"프로그램 코드에 대해 자료 흐름 분석을 수행할 때 dd, kk, ~u, du는 이상 패턴에 해당한다.","options":["O (맞다)","X (틀리다)"],"explanation":"du는 정상 패턴이다.","explSource":"book","answer":1},{"id":"csts-appendix-467-58-219","part":"appendix","chapter":0,"qtype":"ox","dupKey":"요구사항분석서,설계서,코드,테스트관련문서등소프트웨어개발관련모든문서와산출물이정적테스트대상이될수있다.","question":"요구사항 분석서, 설계서, 코드, 테스트 관련 문서 등 소프트웨어 개발 관련 모든 문서와 산출물이 정적 테스트 대상이 될 수 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"정적 테스트(Static Testing)는 프로그램을 실행하지 않고 산출물을 검토·분석하는 활동이므로 요구사항 분석서, 설계서, 소스 코드, 테스트 계획서·테스트 케이스 같은 테스트 관련 문서까지 개발 과정의 모든 문서와 산출물이 대상이 될 수 있어 옳은 서술이다. 정적 테스트는 리뷰(인스펙션, 워크쓰루, 기술 검토 등)와 정적 분석(도구 기반 코드 분석)으로 나뉜다. 실행 가능한 코드가 완성되기 전부터 결함을 찾을 수 있어 조기 결함 제거와 비용 절감에 효과적이라는 점이 정적 테스트의 핵심 가치이다.","explSource":"authored","answer":0},{"id":"csts-appendix-467-59-220","part":"appendix","chapter":0,"qtype":"ox","dupKey":"서로다른시스템과의상호연동능력을확인하기위한테스트로,테스트하고자하는제품이다른제품과공통으로환경및자원을공유하면서그제품에유해한영향을미치지않올바른기능을수행","question":"서로 다른 시스템과의 상호연동능력을 확인하기 위한 테스트로, 테스트하고자 하는 제품이 다른 제품과 공통으로 환경 및 자원을 공유하면서 그 제품에 유해한 영향을 미치지 않 올바른 기능을 수행할 수 있는지 확인하는 테스트는 이식성 테스트이다.","options":["O (맞다)","X (틀리다)"],"explanation":"이는 공존성(상호 운용성) 관련 설명이다.","explSource":"book","answer":1},{"id":"csts-appendix-467-60-221","part":"appendix","chapter":0,"qtype":"ox","dupKey":"Beizer의소프트웨어테스트진화과정에서프로그램을개발할때처음부터테스트가용이하도록테스트용이성을고려하여프로그램을설계하는단계는prevention-ori","question":"Beizer의 소프트웨어 테스트 진화 과정에서 프로그램을 개발할 때 처음부터 테스트가 용이하도록 테스트 용이성을 고려하여 프로그램을 설계하는 단계는 prevention-oriented 단계이다.","options":["O (맞다)","X (틀리다)"],"explanation":"Beizer가 제시한 테스트 사고의 진화 단계에서 마지막 단계인 예방 지향(prevention-oriented) 단계는 테스트의 목적을 결함 발견에 그치지 않고 결함 자체가 생기지 않도록 예방하는 데 두며, 설계 초기부터 테스트 용이성(Testability)을 고려해 프로그램을 만드는 것이 이 단계의 특징이므로 옳은 서술이다. 그 앞 단계들은 테스트와 디버깅을 구분하지 못하는 단계, 소프트웨어가 동작함을 보이려는 단계, 동작하지 않음을 보이려는 단계, 리스크를 줄이려는 단계로 이어진다. 즉 단계가 올라갈수록 테스트가 사후 검출에서 사전 예방으로 이동한다.","explSource":"authored","answer":0},{"id":"csts-appendix-467-61-222","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음은테스트용이성에대한설명이다.어떤특성에대한설명인지용어를기재하시오.테스트할대상영역의문제가발생한곳을고립시켜,독립적으로모듈을테스트할수있도록설계하였다","question":"다음은 테스트 용이성에 대한 설명이다. 어떤 특성에 대한 설명인지 용어를 기재하시오.\n테스트할 대상 영역의 문제가 발생한 곳을 고립시켜, 독립적으로 모듈을 테스트할 수 있도록 설계하였다.","options":[],"explanation":"분할용이성(Decomposability)은 소프트웨어를 독립적인 모듈로 구성해 문제가 발생한 영역을 고립시키고 각 모듈을 따로 테스트할 수 있게 하는 테스트 용이성 특성이다. 모듈 간 결합도가 낮아 분할용이성이 높으면 결함 위치를 좁히기 쉬워 재테스트 범위도 줄어든다. 테스트 용이성의 다른 특성으로는 운영용이성(Operability), 관찰용이성(Observability), 제어용이성(Controllability), 단순성(Simplicity), 안정성(Stability), 이해용이성(Understandability)이 있어 서로 혼동하지 않아야 한다.","explSource":"authored","answerText":"분할용이성(decomposability)"},{"id":"csts-appendix-467-62-223","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음의설명에해당하는테스트유형을기재하시오.•오류를수정한후오류가정상적으로수정되었는지확인한다.•오류수정중발생된코드변경으로인해,새로운오류가발생하지않았는","question":"다음의 설명에 해당하는 테스트 유형을 기재하시오.\n• 오류를 수정한 후 오류가 정상적으로 수정되었는지 확인한다.\n• 오류 수정 중 발생된 코드 변경으로 인해, 새로운 오류가 발생하지 않았는지 확인한다.\n• 전체 테스트 케이스를 모두 재실행하는 것은 비효율적이므로 테스트 일정 및 예산·비용 등을 고려해서 재실행할 테스트 케이스를 신중하게 선택 및 개발해야 한다.","options":[],"explanation":"회귀(Regression) 테스트는 결함 수정이나 코드 변경 이후 그 수정이 제대로 되었는지 확인하고, 변경이 기존에 정상 동작하던 기능에 부작용(새로운 결함)을 일으키지 않았는지 검증하는 테스트 유형이다. 변경 영향 분석을 통해 재실행할 테스트 케이스를 선별하는 것이 핵심이며, 전체 케이스 재실행은 비용이 커서 위험도와 일정을 고려해 선택적으로 수행한다. 반복 실행 빈도가 높아 테스트 자동화의 효과가 가장 크게 나타나는 영역이기도 하다.","explSource":"authored","answerText":"회귀(Regression) 테스트"},{"id":"csts-appendix-468-63-224","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음괄호안에들어갈알맞은단어를기재하시오.테스트수행시실제로수행한작업과발생한오류들을시간대별로기록한것으로,필요시테스트를동일하게재연할수있도록작성하는문서를","question":"다음 괄호 안에 들어갈 알맞은 단어를 기재하시오.\n테스트 수행 시 실제로 수행한 작업과 발생한 오류들을 시간대별로 기록한 것으로, 필요 시 테스트를 동일하게 재연할 수 있도록 작성하는 문서를 테스트 (    ) (이)라고 한다.","options":[],"explanation":"테스트 로그(Test Log)는 테스트 실행 중 수행한 작업과 발생한 사건·오류를 시간 순서대로 기록해 테스트를 동일하게 재연할 수 있게 하는 문서이며 ISO/IEC/IEEE 29119 계열의 테스트 산출물 중 하나이다. 로그는 결함의 재현 절차와 테스트 수행 증거를 제공하므로 결함 보고서 작성과 감사(Audit)의 근거 자료가 된다. 테스트 결과의 요약과 합격·불합격 판정을 담는 테스트 결과 보고서(요약 보고서)와는 목적이 다르므로 구분해야 한다.","explSource":"authored","answerText":"로그(Log)"},{"id":"csts-appendix-468-64-225","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음은구조기반테스트커버리지에대한설명이다.어떤테스트커버리지에대한설명인지기재하시오.•각기본조건식및전체조건식의결과값이참(True)과거짓(False)을","question":"다음은 구조기반 테스트 커버리지에 대한 설명이다. 어떤 테스트 커버리지에 대한 설명인지 기재하시오.\n• 각 기본 조건식 및 전체 조건식의 결과 값이 참(True)과 거짓(False)을 적어도 한 번 이상 실행시키는 것을 기준으로 하는 테스트 방법\n• 테스트 케이스 수트에 의해 실행된 전체 조건식과 기본 조건식이 몇 %인지 측정","options":[],"explanation":"각 기본 조건식과 전체 조건식(결정문)이 모두 참과 거짓을 최소 한 번씩 갖도록 요구하는 커버리지는 조건/결정(분기) 커버리지(Condition/Decision Coverage)이다. 기본 조건만 참·거짓으로 만드는 조건 커버리지는 전체 결정 결과를 보장하지 못하고, 결정(분기) 커버리지는 전체 결과만 따져 개별 조건을 보장하지 못하는데, 조건/결정 커버리지는 두 기준을 함께 만족시켜 그 빈틈을 메운다. 여기서 더 나아가 기본 조건들의 모든 논리조합을 요구하는 것이 다중조건 커버리지이다.","explSource":"authored","answerText":"조건/결정(분기) 커버리지"},{"id":"csts-appendix-468-65-226","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음은전기밥솥의동작을표로나타낸것이다.페어와이즈설계기법을적용하여테스트케이스를설계할때도출될수있는최소테스트케이스개수는몇개인지기재하시오.[표:열은모드/","question":"다음은 전기밥솥의 동작을 표로 나타낸 것이다. 페어와이즈 설계 기법을 적용하여 테스트 케이스를 설계할 때 도출될 수 있는 최소 테스트 케이스 개수는 몇 개인지 기재하시오.\n[표: 열은 모드 / 설정 / 전원. 1행 — 모드: 취사, 설정: 현미, 전원: ON. 2행 — 모드: 보온, 설정: 백미, 전원: OFF.]","options":[],"explanation":"페어와이즈(Pairwise, 2-way) 기법은 모든 파라미터 쌍의 값 조합을 최소 한 번씩 포함하도록 테스트 케이스를 줄이는 기법이며, 이 문제는 모드(취사/보온)·설정(현미/백미)·전원(ON/OFF)의 3개 파라미터가 각 2개 값을 가지므로 전체 조합은 2×2×2=8개이지만 페어와이즈로는 4개면 충분하다. 실제로 (취사,현미,ON), (취사,백미,OFF), (보온,현미,OFF), (보온,백미,ON)의 4개를 대입하면 모드-설정, 모드-전원, 설정-전원 각 쌍의 네 가지 조합이 모두 한 번 이상 나타나 3개 이하로는 어떤 조합도 한 쌍을 빠뜨리게 된다. 파라미터가 모두 2개 값이면 페어와이즈 최소 개수는 파라미터 수가 3~4개일 때 4개가 된다는 점을 기억하면 빠르게 풀 수 있다.","explSource":"authored","answerText":"4개"},{"id":"csts-appendix-468-66-227","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음의제어흐름도를이용하여분기커버리지를100%달성하고자할때,테스트케이스최소개수를기재하시오.[그림:제어흐름도.A(사각형)에서B(마름모,판단문)로화살","question":"다음의 제어 흐름도를 이용하여 분기 커버리지를 100% 달성하고자 할 때, 테스트 케이스 최소 개수를 기재하시오.\n[그림: 제어 흐름도. A(사각형)에서 B(마름모, 판단문)로 화살표가 이어진다. B에서 왼쪽으로 C(사각형), 아래로 D(사각형), 오른쪽으로 E(사각형)로 세 갈래 화살표가 나간다. C, D, E는 각각 아래의 F(사각형)로 화살표가 모인다.]","options":[],"explanation":"분기 커버리지(Branch Coverage)는 판단문에서 뻗어 나가는 모든 분기를 최소 한 번씩 실행해야 하며, 이 흐름도에서 판단문 B는 C, D, E로 향하는 세 갈래 분기를 가지므로 100% 달성에 필요한 최소 테스트 케이스는 3개이다. 각각 A→B→C→F, A→B→D→F, A→B→E→F 경로를 한 번씩 실행하면 세 분기가 모두 커버된다. 하나의 테스트 케이스는 판단문에서 한 분기만 지나가므로 다중 분기(예: switch-case)에서는 분기 수가 곧 최소 테스트 케이스 수가 된다.","explSource":"authored","answerText":"3개"},{"id":"csts-appendix-469-67-228","part":"appendix","chapter":0,"qtype":"short","dupKey":"아래와같은제어흐름그래프를갖는프로그램이있다.\"A→B→G→I→J\"의경로로테스트를수행했을때,문장커버리지는몇%인지기재하시오.[그림:제어흐름그래프(노드는","question":"아래와 같은 제어 흐름 그래프를 갖는 프로그램이 있다. \"A → B → G → I → J\"의 경로로 테스트를 수행했을 때, 문장 커버리지는 몇 %인지 기재하시오.\n[그림: 제어 흐름 그래프(노드는 원형). A → B. B → C, 그리고 B → G(오른쪽 바깥 경로). C → D, C → E. D → F, E → F. F → G. G → H, G → I. H → J, I → J. 전체 노드는 A, B, C, D, E, F, G, H, I, J의 10개.]","options":[],"explanation":"문장 커버리지(Statement Coverage)는 전체 문장(노드) 중 실행된 문장의 비율이며, 전체 노드는 A~J의 10개이고 주어진 경로 A→B→G→I→J는 그중 5개(A, B, G, I, J)만 실행하므로 5÷10=0.5, 즉 50%이다. 실행되지 않은 노드는 C, D, E, F, H의 5개이다. 분기 커버리지와 달리 문장 커버리지는 지나간 노드만 세면 되므로 경로에 등장한 노드 수를 전체 노드 수로 나누어 계산한다는 점이 핵심이다.","explSource":"authored","answerText":"50%"},{"id":"csts-appendix-469-68-229","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음프로그램을테스트하기위한테스트케이스가다음과같이3개가있다.조건커버리지를100%만족하는최소개수의테스트케이스를구하고자할때,사용하지않아도되는테스트케이","question":"다음 프로그램을 테스트하기 위한 테스트 케이스가 다음과 같이 3개가 있다. 조건 커버리지를 100% 만족하는 최소 개수의 테스트 케이스를 구하고자 할 때, 사용하지 않아도 되는 테스트 케이스는 무엇인지 작성하시오.\n```\nIF ((X>1) AND (Y==1))\n      Z=Z/X\nEND\nIF ((X==2) OR (Z>1))\n      Z=Z+1\nEND\n```\n[표: [테스트 케이스]\nTC1 : (X=1, Y=2, Z=2)\nTC2 : (X=2, Y=1, Z=6)\nTC3 : (X=0, Y=0, Z=1)]","options":[],"explanation":"조건 커버리지 100%는 기본 조건 X>1, Y==1, X==2, Z>1이 각각 참과 거짓을 최소 한 번씩 가져야 하는데, TC2(X=2,Y=1,Z=6)는 X>1=T, Y==1=T, X==2=T이고 첫 IF가 실행되어 Z=6/2=3이므로 Z>1=T로 네 조건 모두 참을 만들고, TC3(X=0,Y=0,Z=1)은 네 조건 모두 거짓을 만들어 TC2와 TC3 두 개만으로 100%가 달성된다. 따라서 사용하지 않아도 되는 테스트 케이스는 TC1이다. TC1(X=1,Y=2,Z=2)은 X>1=F, Y==1=F, X==2=F, Z>1=T를 주는데 이 값들은 모두 TC2·TC3에서 이미 확보되어 추가 커버리지가 없으므로 최소 집합에서 제외된다.","explSource":"authored","answerText":"TC1"},{"id":"csts-appendix-470-69-230","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음의자료흐름도에서변수x에대한오류패턴을하나만적으시오.[그림:자료흐름도(노드는타원).노드순서는위에서부터\"defx\"→\"usex/killy\"→\"use","question":"다음의 자료 흐름도에서 변수 x에 대한 오류 패턴을 하나만 적으시오.\n[그림: 자료 흐름도(노드는 타원). 노드 순서는 위에서부터 \"def x\" → \"use x / kill y\" → \"use x / def z\" → \"use y / use z\" → \"kill x / def z\" → \"kill x / def z\". 또한 \"use x / kill y\" 노드에서 \"use x / def z\" 노드로 되돌아오는 곡선 화살표가 있고, \"use y / use z\" 노드에서 마지막 \"kill x / def z\" 노드로 이어지는 곡선 화살표가 있다.]","options":[],"explanation":"kill x가 연이어 나타나므로 kk 이상 패턴이 발생한다.","explSource":"book","answerText":"kk"},{"id":"csts-appendix-470-70-231","part":"appendix","chapter":0,"qtype":"short","dupKey":"다음은ISO/IEC25010품질특성에관한설명이다.어떤품질특성에대한설명인지적으시오.규정된조건에서규정된기간동안오동작없이의도된기능을수행하는소프트웨어의","question":"다음은 ISO/IEC 25010 품질 특성에 관한 설명이다. 어떤 품질 특성에 대한 설명인지 적으시오.\n규정된 조건에서 규정된 기간 동안 오동작 없이 의도된 기능을 수행하는 소프트웨어의 능력을 말하며, 부특성으로는 성숙성, 가용성, 장애 허용성, 회복 가능성이 있다.","options":[],"explanation":"신뢰성(Reliability)은 규정된 조건에서 규정된 기간 동안 시스템이 고장 없이 의도된 기능을 수행하는 능력으로, ISO/IEC 25010에서 성숙성(Maturity), 가용성(Availability), 장애 허용성(Fault Tolerance), 회복 가능성(Recoverability)을 부특성으로 갖는다. 부특성 이름만 보고 가용성이나 회복 가능성을 유지보수성이나 보안성으로 오인하지 않도록 주의해야 한다. 시간 반응성·자원 효율성을 다루는 성능 효율성(Performance Efficiency)이나 장애 발생 시 위험을 다루는 보안성·기능 적합성과는 구분되는 특성이다.","explSource":"authored","answerText":"신뢰성(Reliability)"}];
const TERMS = [{"chapter":1,"chapterName":"테스트 개요","term":"검증","en":"Verification","def":"각 개발 단계의 산출물이 그 단계의 명세와 표준을 올바르게 따랐는지 확인하는 개발자 관점의 활동이다. 즉 '제품을 제대로 만들고 있는가'를 확인하며, 리뷰·인스펙션과 같은 정적 기법이 주로 사용된다. 사용자 관점에서 올바른 제품을 만들었는지 보는 확인(Validation)과 짝을 이루어 V&V를 구성한다.","note":"검증=Building the product right(개발자 관점) / 확인=Building the right product(사용자 관점)."},{"chapter":1,"chapterName":"테스트 개요","term":"결함","en":"Defect / Fault / Bug","def":"에러에 의해 만들어져 제품(문서, 설계, 코드) 안에 포함된 잘못으로, 장애의 원인이 될 수 있다. 결함이 존재해도 그 결함이 실행되지 않으면 장애가 발생하지 않으며, 실행되더라도 반드시 장애로 이어지는 것은 아니다. 사람의 실수를 뜻하는 에러, 실행 결과의 차이를 뜻하는 장애와 구별해야 한다.","note":"'결함이 실행되면 반드시 장애가 발생한다'는 보기는 오답 - 반드시는 아니다."},{"chapter":1,"chapterName":"테스트 개요","term":"결함 집중","en":"Defect Clustering","def":"결함은 프로그램 전체에 균일하게 분포하지 않고 일부 모듈에 집중되어 나타난다는 테스트 원리다. 따라서 평균 이상의 결함이 발견된 모듈에는 더 많은 결함이 남아 있을 가능성이 높으므로 테스트 노력을 그곳에 더 집중해야 한다. 동시에 설계나 구조에 심각한 문제가 결함을 유발했는지 조사하고 구조를 개선해 추가 결함을 예방해야 한다.","note":"'결함이 균일하게 분포한다'거나 '모든 모듈을 동일한 노력으로 테스트한다'는 보기는 오답. 파레토 법칙과 연결."},{"chapter":1,"chapterName":"테스트 개요","term":"디버깅","en":"Debugging","def":"에러의 타입을 식별(Fault Identification)하고 에러의 정확한 위치를 파악(Fault Location)한 뒤 이를 수정(Fault Correction)하고 수정 결과를 확인하는 활동이다. 이미 알려진 오류를 고치는 작업이므로 시스템 내부 관련자(개발자)가 수행한다. 반면 테스팅은 아직 알려지지 않은 결함을 찾는 활동이며 외부의 독립적인 테스터가 수행하는 것이 효과적이다.","note":"테스팅=결함 발견 / 디버깅=결함 위치 파악과 수정. '테스팅은 시스템 내부 관련자가 수행한다'는 보기는 오답."},{"chapter":1,"chapterName":"테스트 개요","term":"분할 용이성","en":"Decomposability","def":"테스트할 대상 영역을 제어함으로써 문제가 발생한 곳을 고립시켜 독립적으로 모듈을 테스트할 수 있도록 설계된 정도를 말한다. 모듈 간 결합도가 낮고 독립 실행이 가능해야 분할 용이성이 높다. 결함의 위치를 좁히는 데 직접 기여하므로 단위 테스트 수행에 유리하다.","note":"'고립시켜 독립적으로 모듈 시험' 서술은 분할 용이성(decomposability). 단답형으로 출제됨."},{"chapter":1,"chapterName":"테스트 개요","term":"안정성","en":"Stability","def":"테스트가 진행되는 동안 소프트웨어에 대한 변경이 자주 발생하지 않도록 설계된 정도를 말한다. 테스트 중 대상이 계속 바뀌면 기존 테스트 결과와 테스트웨어가 무효화되어 재작업이 커진다. 테스트 용이성의 구성 특성이며, 이상 상황에서도 잘 버티는 견고성(Robustness)과는 다른 개념이다.","note":"'테스트 동안 변경이 자주 발생하지 않도록 설계' = 안정성. 견고성과 헷갈리지 말 것."},{"chapter":1,"chapterName":"테스트 개요","term":"에러","en":"Error","def":"결함의 원인으로서 사람이 만들어 낸 실수를 말한다. 요구사항을 잘못 파악하거나 잘못 이해했을 때, 또는 코딩 중 착오가 있을 때 발생한다. 결함(Fault, Bug)과 동일한 의미가 아니며, 에러가 산출물에 반영된 결과물이 결함이다.","note":"에러=사람의 실수(원인) → 결함=산출물의 잘못 → 장애=실행 시 드러난 증상. 순서로 외울 것."},{"chapter":1,"chapterName":"테스트 개요","term":"완벽한 테스트 불가능","en":"Exhaustive Testing is Impossible","def":"무한한 입력값, 실행 시점의 무한한 타이밍, 코드 내 무한한 경로를 모두 고려해 테스트할 수 없기 때문에 완벽한 테스트는 원리적으로 불가능하다는 원리다. 테스터 수가 적거나 일정·지식이 부족한 것은 현실적 제약일 뿐 근본 이유가 아니다. 그래서 위험 기반으로 우선순위를 정해 테스트 범위를 결정해야 한다.","note":"이유를 묻는 문제의 정답은 항상 '무한 입력값·무한 시간·무한 경로'. 조직·일정 문제를 고르면 틀린다."},{"chapter":1,"chapterName":"테스트 개요","term":"이해 용이성","en":"Understandability","def":"소프트웨어 설계 정보가 잘 조직화되어 테스터가 쉽게 접근하고 이해할 수 있도록 설계된 정도를 말한다. 설계 문서와 코드 구조가 명확하면 테스트 케이스 설계와 결함 원인 분석이 쉬워진다. 정보 접근성에 관한 특성이므로 실행 제어에 관한 제어 용이성과 구별된다.","note":"'설계 정보가 잘 조직화되어 쉽게 접근 가능' = 이해 용이성. 짝짓기 문제 단골."},{"chapter":1,"chapterName":"테스트 개요","term":"장애","en":"Failure","def":"프로그램의 실제 실행 결과와 예상(올바른) 결과 사이의 차이로 드러나는 현상이다. 결함이 실행됨으로써 겉으로 나타나는 증상이므로 원인이 아니라 결과에 해당한다. 테스터는 장애를 관찰하고, 개발자는 그 원인인 결함을 디버깅으로 찾아 수정한다.","note":"'프로그램의 실행 결과와 예상 결과의 차이'라는 서술이 나오면 결함이 아니라 장애다."},{"chapter":1,"chapterName":"테스트 개요","term":"제어 용이성","en":"Controllability","def":"프로그램의 실행을 테스터가 원하는 대로 제어하기 용이하도록 설계된 정도를 말한다. 입력을 자유롭게 넣고 특정 경로를 의도적으로 실행시킬 수 있으면 제어 용이성이 높다. 실행 결과와 내부 상태를 외부에서 쉽게 확인할 수 있는 정도인 관찰 용이성(Observability), 대상 영역을 고립시켜 독립 시험하는 분할 용이성과 혼동하기 쉽다.","note":"제어 용이성=입력·실행 조작(입력측) / 관찰 용이성=출력·상태 확인(출력측). 짝짓기 문제에서 분할 용이성과 바꿔 출제된다."},{"chapter":1,"chapterName":"테스트 개요","term":"테스트 용이성","en":"Testability","def":"프로그램을 얼마나 손쉽게 테스트할 수 있는지를 나타내는 특성으로, 운용 용이성·관찰 용이성·제어 용이성·분할 용이성·단순성·안정성·이해 용이성 등으로 구성된다. 개발 초기부터 테스트 용이성을 고려해 설계하는 단계를 Beizer의 테스트 진화 과정에서 예방 중심(prevention-oriented) 단계라고 한다. 견고성(Robustness)은 테스트 용이성의 구성 특성이 아니다.","note":"'테스트 용이성과 거리가 먼 것'을 묻는 문제의 정답은 견고성(Robustness)."},{"chapter":1,"chapterName":"테스트 개요","term":"테스트 커버리지","en":"Test Coverage","def":"테스트가 테스트 요구사항을 얼마큼 만족하는지 나타내는 지표로, 테스팅 정도에 대한 양적 평가를 결정한다. 이를 근거로 테스트를 얼마나 더 해야 할지, 언제 멈출지를 판단할 수 있다. 요구사항 커버리지·설계 커버리지·코드 커버리지 등으로 나누어 테스트 효과성을 평가할 수 있다.","note":"'양적 평가'와 '멈출 시점 결정'이라는 표현이 나오면 커버리지다. 테스트 효율성·테스트 조건과 혼동 주의."},{"chapter":1,"chapterName":"테스트 개요","term":"테스팅","en":"Testing","def":"소프트웨어에 존재하는 알려지지 않은 결함을 발견하여 제거함으로써 품질을 높이는 활동이다. 정해진 요구사항을 만족하는지 확인하고 주어진 표준 등을 준수하는지 검증하는 활동이며, 목적은 결함 검출뿐 아니라 품질 평가, 프로세스 개선, 품질 개선까지 포함한다. 프로그램을 가장 잘 아는 개발자보다 독립적인 제3의 테스터가 수행하는 것이 효과적이며, 타당하지 않거나 예상하지 못한 입력에 대해서도 반드시 테스트해야 한다.","note":"테스팅은 결함이 '없음'을 증명하지 못한다. 남은 결함이 장애를 일으키지 않음을 증명한다는 보기는 항상 오답."},{"chapter":1,"chapterName":"테스트 개요","term":"품질 보증","en":"QA, Quality Assurance","def":"제품과 프로세스가 요구되는 품질 수준을 충족하도록 보장하기 위한 계획적·체계적 활동 전체를 말한다. 테스트와 V&V를 포함하며 프로세스 정의·표준 준수·감사·교육 등 조직 차원의 활동까지 아우른다. 따라서 테스트보다 V&V가, V&V보다 품질 보증이 더 광범위한 개념이다.","note":"품질 보증은 프로세스 중심, 테스트는 제품 중심. 셋의 포함 관계를 틀리지 않도록 주의."},{"chapter":1,"chapterName":"테스트 개요","term":"확인","en":"Validation","def":"완성된 제품이 사용자의 실제 요구와 사용 목적을 만족하는지 사용자 관점에서 판단하는 활동이다. 인수 테스트처럼 실제 사용 환경에서 사용자가 수행하는 활동이 대표적이다. 범위 관계는 테스트 < V&V < 품질 보증으로, 테스트는 V&V의 일부이고 V&V는 품질 보증의 일부다.","note":"범위 순서 '테스트 < V&V < 품질 보증'은 단답·객관식으로 자주 출제."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"경험 기반 테스트","en":"Experience-based Test","def":"테스터의 직관·지식·과거 경험을 활용해 테스트를 설계하고 수행하는 방법으로, 오류 추정(Error Guessing)과 탐색적 테스팅이 대표적이다. 오류 추정은 특정 소프트웨어에서 어떤 유형의 결함이 발생할지 예측해 테스트하는 기법이다. ISO/IEC/IEEE 29119는 테스트 방법을 경험 기반·명세 기반·구조 기반으로 분류한다.","note":"29119의 3분류는 명세/구조/경험. 빈칸 문제에서 '요구사항 기반'이나 '시나리오 기반'을 고르면 틀린다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"단위 테스트","en":"Unit Test / Component Test","def":"테스트가 가능한 최소 단위의 소프트웨어(모듈, 프로그램, 객체, 클래스 등) 내에서 결함을 찾고 검증하는 테스트 레벨이다. 일반적으로 개발자가 개발 환경에서 직접 수행하며, 기본 경로 확인·경계값 확인·에러 핸들링 경로 확인 등을 위해 Unit Test Framework를 사용한다. 단위 테스트를 잘 수행하기 위한 원칙을 FIRST 원칙(Fast, Independent, Repeatable, Self-validating, Timely)이라 하며, OS·파일 시스템·하드웨어나 시스템 간 연결성을 확인하는 것은 단위 테스트의 목적이 아니다.","note":"'FIRST 원칙은 통합 테스트를 잘 수행하기 위한 원칙'이라는 O/X 문제의 답은 X - 단위 테스트 원칙이다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"동적 테스트","en":"Dynamic Test","def":"프로그램을 실제로 실행시켜 입력에 대한 출력을 관찰하고 예상 결과와 비교하여 결함을 찾는 테스트다. 명세 기반 테스트와 구조 기반 테스트가 대표적인 동적 테스트 방법이다. 프로그램을 실행하지 않고 산출물을 검토하는 정적 테스트와 대비된다.","note":"'명세 기반·구조 기반은 정적 테스트'라는 보기는 X. 실행하면 동적, 실행하지 않으면 정적."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"모델 기반 테스팅","en":"MBT, Model-Based Testing","def":"테스트 대상의 동작에 대한 정형적이고 상세한 명세(모델)를 바탕으로 테스트 계획, 테스트 케이스, 테스트 절차, 테스트 입력과 예상 결과를 자동으로 생성·결정하는 테스팅이다. 모델링에는 의사결정표, 순서도, UML 상태 다이어그램, UML 액티비티 다이어그램 등 정형적 표현법을 사용할 수 있다. 개발 단계 산출물에 존재하는 결함까지 검출할 수 있고, 장애 비용이 큰 자동차·의료 등 안전 필수 소프트웨어에 많이 적용된다.","note":"'의사결정표·순서도는 모델이 아니다'라는 보기는 오답. 이들도 MBT의 모델로 쓸 수 있다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"빅뱅 통합","en":"Big-bang Integration","def":"전체 모듈을 한꺼번에 통합한 뒤 테스트하는 비점진적 통합 전략이다. 스텁이나 드라이버가 거의 필요 없지만 결함이 발생했을 때 원인 위치를 찾기 어렵고 수정 비용이 커서 널리 권장되지 않는다. 단위 테스트를 생략하고 바로 시스템 테스트로 넘어가는 방식이라는 설명은 잘못된 서술이다.","note":"'가장 널리 사용되는 방법'이라는 서술이 붙으면 오답. 빅뱅은 결함 고립이 어렵다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"상향식 통합","en":"Bottom-up Integration","def":"구조도의 하위 계층 모듈을 먼저 테스트하고 상위 모듈로 올라가며 통합하는 점진적 통합 전략이다. 상위 모듈의 역할을 대신하는 테스트 드라이버가 필요하지만 스텁은 작성할 필요가 없으므로, 스텁 작성 비용이 큰 경우에 유리하다. 하위 컴포넌트가 충분히 테스트되는 반면 상위의 설계 오류는 늦게 발견된다.","note":"'스텁 작성 비용이 많이 들면 상향식이 좋다'는 O. 빅뱅 방식이 아니라 점진적 방식의 하나임에 주의."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"샌드위치 통합","en":"Sandwich Integration","def":"상향식 통합과 하향식 통합을 동시에 진행하여 중간 계층에서 만나도록 하는 혼합형 통합 전략이다. 스텁과 드라이버가 모두 필요하지만 양쪽 장점을 살려 통합 기간을 단축할 수 있다. 대규모 시스템에서 상위 제어 구조와 하위 유틸리티를 병행 검증할 때 유용하다.","note":"샌드위치=혼합식(하향식+상향식 동시 진행). 스텁과 드라이버 모두 필요하다는 점이 포인트."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"시스템 테스트","en":"System Test","def":"완성된 시스템이 명세된 요구사항에 맞게 개발되었는지 기능 및 비기능 측면을 모두 확인하는 테스트 레벨이다. 단위·통합·시스템·인수와 같은 테스트 레벨(단계) 구분에 속한다. 성능 테스트·보안성 테스트·신뢰성 테스트처럼 테스트 특성(유형)에 따른 구분과는 분류 기준이 다르다.","note":"'분류 기준이 다른 하나'를 찾는 문제에서 시스템 테스트만 레벨, 나머지는 유형이다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"알파 테스트와 베타 테스트","en":"Alpha Test / Beta Test","def":"둘 다 인수 테스트 단계에서 수행되는 사용자 중심 테스트다. 알파 테스트는 개발 조직의 현장에서 선택된 사용자가 개발자의 관찰 아래 수행하고, 베타 테스트는 실제 사용자가 자신의 실제 사용 환경에서 수행하여 결과를 개발 조직에 보고한다. 즉 수행 장소와 개발자 개입 여부로 구분된다.","note":"알파=개발자 현장/개발자 입회, 베타=사용자 현장/필드 테스트."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"인수 테스트","en":"Acceptance Test","def":"개발된 시스템이 인수 조건을 만족하는지 검증하는 최종 테스트 레벨로, 일반적으로 고객 또는 사용자가 수행 주체가 된다. 원칙적으로 개발 환경이 아니라 사용자의 운영 환경에서 사용자에 의해 실행된다. V-모델에서는 요구사항 단계와 대응된다.","note":"'인수 테스트는 운영 환경에서 개발자가 실행한다'는 보기는 오답. 수행 주체는 고객/사용자."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"테스트 드라이버","en":"Test Driver","def":"테스트 대상 모듈을 호출하여 입력값을 전달하고 결과를 받아오는, 상위 모듈 역할을 대신하는 가짜 모듈이다. 하위 모듈부터 테스트하는 상향식 통합과 단위 테스트에서 필요하다. 호출하는 쪽을 만든다는 점에서 호출되는 쪽을 만드는 스텁과 구별된다.","note":"드라이버는 '호출하는' 쪽, 스텁은 '호출되는' 쪽. 상향식에서는 스텁이 필요 없다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"테스트 스텁","en":"Test Stub","def":"아직 구현되지 않았거나 통합되지 않은 하위 모듈을 대신하여 호출에 대해 미리 정해진 값을 반환하는 가짜 모듈이다. 상위 모듈을 먼저 테스트하는 하향식 통합에서 필요하다. 상위 모듈 역할을 대신하는 테스트 드라이버와 방향이 반대다.","note":"스텁=아래를 대신(하향식), 드라이버=위를 대신(상향식). 방향으로 기억."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"테스트 하네스","en":"Test Harness","def":"테스트 대상을 실행하기 위해 필요한 드라이버·스텁·테스트 데이터·실행 및 결과 비교 환경을 묶은 테스트 지원 환경 전체를 말한다. 단위 테스트 프레임워크가 대표적인 구현 형태이며, 테스트를 반복 실행하고 결과를 자동으로 판정할 수 있게 해준다. 개별 대역 모듈인 스텁·드라이버보다 상위의 포괄적 개념이다.","note":"하네스 ⊃ 드라이버 + 스텁 + 테스트 데이터/실행 환경. 포함 관계로 기억."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"통합 테스트","en":"Integration Test","def":"모듈을 통합하는 과정에서 사용되는 인터페이스를 대상으로 모듈 간 상호작용이 올바르게 이루어지는지 검증하는 테스트 레벨이다. 개발 환경에서 단위(컴포넌트) 테스트를 마친 뒤에 수행하며, 시스템 테스트보다 앞선다. 통합 전략으로 하향식·상향식·빅뱅·샌드위치 통합이 있다.","note":"'통합 테스트는 시스템 테스트 완료 후 수행한다'는 보기는 오답 - 컴포넌트 테스트 후다."},{"chapter":2,"chapterName":"테스트 분류와 테스팅 방법","term":"하향식 통합","en":"Top-down Integration","def":"상위 모듈을 먼저 테스트하고 하위 모듈들을 차례로 통합해 나가는 점진적 통합 전략이다. 아직 구현되지 않은 하위 모듈을 대체할 테스트 스텁이 많이 필요하며, 통합 순서는 너비 우선(Breadth-First) 또는 깊이 우선(Depth-First)으로 진행할 수 있다. 상위 제어 구조를 먼저 검증하므로 설계 오류를 빨리 발견할 수 있다는 장점이 있다.","note":"하향식=스텁 필요+설계 오류 조기 발견, 상향식=드라이버 필요+하위 모듈 충분히 테스트."},{"chapter":3,"chapterName":"소프트웨어 개발 단계와 테스트","term":"APFD","en":"Average Percentage of Faults Detected","def":"테스트 케이스 실행 비율 대비 검출된 결함의 비율을 측정하는 지표로, 테스트 케이스의 수와 결함의 수, 그리고 실행 순서로 계산된다. 회귀 테스트 케이스의 우선순위를 결정하고 평가하는 데 사용된다. APFD가 높다는 것은 더 적은 수의 테스트 케이스를 실행하여 더 많은 결함을 빠르게 검출할 수 있다는 의미다.","note":"'APFD가 낮으면 빠르게 많은 결함을 찾는다'는 보기는 오답. 높을수록 좋다."},{"chapter":3,"chapterName":"소프트웨어 개발 단계와 테스트","term":"결함 수정 비용","en":"Cost of Fixing Defects","def":"결함은 발견 시점이 늦어질수록 수정 비용이 기하급수적으로 커진다. 요구사항 정의·분석·설계 단계에서 발견하면 비용이 가장 적고, 운영 및 유지보수 단계에서 발견되면 비용이 가장 크다. 그래서 정적 테스트와 V-모델처럼 개발 초기에 결함을 찾는 활동이 중요하다.","note":"'수정 비용이 가장 큰 시점'을 묻는 단답 문제의 정답은 운영 및 유지보수."},{"chapter":3,"chapterName":"소프트웨어 개발 단계와 테스트","term":"스모크 테스트","en":"Smoke Test","def":"새로 만들어진 빌드가 본격적인 테스트를 수행할 수 있는 최소 수준인지 확인하기 위해 핵심 기능만 빠르게 점검하는 테스트다. 통과하지 못하면 빌드를 반려하고 테스트를 시작하지 않는다. 초기에 결함을 검출한 테스트 케이스를 다시 실행하는 확인 테스트와는 목적이 다르다.","note":"'초기에 결함을 검출한 테스트 케이스로 다시 테스트하는 것을 스모크 테스트라 한다'는 오답."},{"chapter":3,"chapterName":"소프트웨어 개발 단계와 테스트","term":"확인 테스트","en":"Confirmation Test / Retest","def":"보고된 결함을 개발자가 수정한 뒤, 그 결함이 실제로 제거되었는지 확인하기 위해 원래 결함을 검출했던 테스트 케이스를 다시 실행하는 테스트다. 대상이 수정된 결함 자체에 한정되므로 범위가 좁다. 수정으로 인해 기존의 다른 기능이 망가졌는지 확인하는 회귀 테스트와 목적이 다르다.","note":"확인 테스트=수정이 잘 됐나(결함 자체) / 회귀 테스트=수정 때문에 다른 데가 깨졌나(부작용)."},{"chapter":3,"chapterName":"소프트웨어 개발 단계와 테스트","term":"회귀 테스트","en":"Regression Test","def":"소프트웨어가 수정된 후 그 변경으로 인해 기존 프로그램의 다른 부분에 새로운 결함이 도입되지 않았는지 검사하는 테스트다. 결함 수정, 리팩토링, 기능 추가·변경, 유지보수 단계의 변경 후에 수행한다. 전체 테스트 케이스를 모두 재실행하는 것은 비효율적이므로 일정과 비용을 고려해 재실행할 테스트 케이스를 선별하고 우선순위를 정해야 한다.","note":"기능이 제거되면 그 기능의 테스트 케이스는 회귀 테스트 집합에서 반드시 제거해야 한다(그대로 두면 잘못된 결과 보고)."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"ISO/IEC 25010","en":"ISO/IEC 25010","def":"소프트웨어 제품 품질 모델을 정의한 국제 표준으로, 기능 적합성·성능 효율성·호환성·사용성·신뢰성·보안성·유지보수성·이식성의 8대 품질 특성과 각각의 부특성으로 구성된다. 기능 적합성을 제외한 나머지는 대부분 비기능 테스트의 대상이 된다. 각 특성의 부특성을 서로 바꿔 놓은 보기를 골라내는 문제가 반복 출제된다.","note":"8대 특성 암기: 기능·성능·호환·사용·신뢰·보안·유지보수·이식."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"기능 적합성","en":"Functional Suitability","def":"사용자의 요구사항을 시스템이 얼마나 만족하는지에 대한 정보를 제공하는 품질 특성이다. 부특성은 기능 완전성(모든 명시된 기능을 시스템이 제공하는 정도), 기능 정확성(정의된 정밀도에 따라 정확하게 결과를 제공하는 정도), 기능 적절성(사용자의 목적 달성에 소프트웨어가 도움을 주는 정도)이다. 가용성은 기능 적합성이 아니라 신뢰성의 부특성이다.","note":"완전성=모든 기능 제공 / 정확성=정밀한 결과 / 적절성=목적 달성 도움. 세 개를 서로 바꿔 출제한다."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"내구성 테스트","en":"Endurance / Soak Test","def":"임계점보다 낮은 일정 수준의 부하를 장시간 지속적으로 가하여 시스템이 성능 저하 없이 견디는지 확인하는 성능 테스트다. 메모리 누수, 자원 미반환, 로그·세션 누적처럼 시간이 흘러야 드러나는 결함을 찾는 데 효과적이다. 그래프로 보면 임계점 바로 아래 수준에서 오랫동안 평탄하게 유지되는 형태다.","note":"네 가지 구분: 부하=계단식 증가 / 스트레스=임계 초과 / 스파이크=급증 반복 / 내구성=장시간 유지."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"보안성","en":"Security","def":"소프트웨어가 정보 및 데이터를 올바르게 보호하는 능력을 의미한다. 부특성은 기밀성, 무결성, 부인 방지성, 책임성, 인증성이며, 기밀성은 데이터가 인가되지 않은 접근으로부터 보호되는 비율이나 암호화·복호화가 정확히 구현된 비율 등으로 측정한다. 보안성 결함은 일반적인 명세·구조 기반 테스팅 기법으로 모두 검출할 수 없으므로 침투 시험(Penetration Test)을 수행하여 취약점을 확인한다.","note":"보안성 부특성에 '성숙성·가용성·접근성'이 들어간 보기는 오답(그건 신뢰성·사용성 것)."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"부하 테스트","en":"Load Test","def":"예상되는 사용자 수나 트랜잭션을 점진적·단계적으로 증가시켜 임계점 부근까지 부하를 올리면서 시스템의 응답 시간과 처리량을 측정하는 성능 테스트다. 목표 성능 요구사항을 만족하는지, 어느 수준까지 견디는지 확인하는 것이 목적이다. 임계점을 넘겨 한계 상황을 보는 스트레스 테스트와 구분된다.","note":"부하=임계점까지 계단식 증가(정상 범위 검증). 그래프에서 계단 모양이면 부하 테스트."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"사용성","en":"Usability","def":"명시된 사용 상황에서 사용자가 효과적·효율적이고 만족스럽게 목적을 달성하도록 하는 능력이다. 부특성으로 적절성 인식성, 습득성, 운용 용이성, 사용자 오류 방지, 사용자 인터페이스 심미성, 접근성이 있다. 평가 방법으로는 인지적 워크쓰루(Cognitive walk-through), FGI(Focus Group Interview), 휴리스틱 평가(Heuristic Evaluation)가 사용된다.","note":"인지적 워크쓰루·FGI·휴리스틱 평가가 보기에 나오면 정답은 사용성."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"성능 효율성","en":"Performance Efficiency","def":"주어진 조건에서 사용하는 자원의 양에 대한 성능의 정도를 나타내는 품질 특성이다. 부특성은 시간 반응성(Time-behaviour), 자원 활용성(Resource Utilization), 수용성(Capacity)이다. 부하·스트레스·스파이크·내구성 테스트가 이 특성을 확인하는 대표적인 성능 테스트다.","note":"'성능 효율성의 부특성'을 묻는 문제의 정답은 자원 활용성. 운용 용이성(사용성)·상호 운용성(호환성)·복구성(신뢰성)과 구별."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"스트레스 테스트","en":"Stress Test","def":"시스템의 임계점을 초과하는 과도한 부하를 가한 상태로 유지하여 시스템이 어떻게 degrade되고 복구되는지 확인하는 성능 테스트다. 한계를 넘긴 상황에서의 동작과 자원 고갈 시 거동을 보는 것이 목적이다. 정상 범위 내를 보는 부하 테스트, 짧은 급증을 보는 스파이크 테스트와 다르다.","note":"스트레스=임계점을 넘긴 상태로 유지(그래프에서 임계선 위에서 평탄)."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"스파이크 테스트","en":"Spike Test","def":"짧은 시간에 사용자가 급격히 몰릴 때 시스템의 반응을 측정하는 성능 테스트다. 그래프로 보면 사용자 수가 임계점 위로 급격히 치솟았다가 떨어지기를 여러 번 반복하는 형태다. 인기 아이돌 공연 예매처럼 순간적으로 트래픽이 폭증하는 상황이 대표 사례다.","note":"스파이크=짧은 시간 급증 반복(뾰족한 봉우리). 오래 유지되면 스트레스/내구성이다."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"신뢰성","en":"Reliability","def":"규정된 조건에서 규정된 기간 동안 오동작 없이 의도된 기능을 수행하는 소프트웨어의 능력이다. 부특성은 성숙성(Maturity), 가용성(Availability), 결함 허용성(Fault Tolerance), 복구성(Recoverability)이다. 가용성은 사용자가 원하는 시간에 사용 및 접근이 가능한 정도로, 기능 적합성이 아니라 신뢰성에 속한다.","note":"'성숙성·가용성·결함 허용성·복구성' 네 개가 나오면 정답은 신뢰성. 단답형 단골."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"유지보수성","en":"Maintainability","def":"소프트웨어를 수정·개선·적응시키는 데 드는 효과와 효율의 정도를 나타내는 품질 특성이다. 부특성은 모듈성, 재사용성, 분석성, 변경성, 시험성(Testability)이다. 정적 분석 도구로 측정하는 사이클로매틱 복잡도나 코딩 표준 준수 여부가 유지보수성 평가에 활용된다.","note":"테스트 용이성(시험성)이 유지보수성의 부특성으로 들어간다는 점이 포인트."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"이식성","en":"Portability","def":"하나의 하드웨어·소프트웨어·운영 환경에서 다른 환경으로 소프트웨어를 옮길 수 있는 능력이다. 부특성은 적응성(Adaptability), 설치성(Installability), 대체성(Replaceability)이다. 서로 다른 제품이 같은 환경에서 자원을 공유하며 공존하는 능력은 이식성이 아니라 호환성(공존성)에 해당한다.","note":"환경을 '옮기는' 것이 이식성, 같은 환경에서 '함께 쓰는' 것이 호환성."},{"chapter":4,"chapterName":"품질 특성과 비기능 테스트","term":"호환성","en":"Compatibility","def":"동일한 환경과 자원을 공유하면서 다른 제품·시스템과 정보를 교환하거나 요구 기능을 수행하는 능력이다. 부특성은 공존성(Co-existence)과 상호 운용성(Interoperability)이다. 테스트 대상 제품이 다른 제품과 환경·자원을 공유하면서 유해한 영향을 주지 않고 올바른 기능을 수행하는지 확인하는 테스트가 호환성 테스트다.","note":"이 설명을 '이식성 테스트'라고 하면 X - 호환성 테스트다. 상호 운용성은 호환성의 부특성."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"결함 보고","en":"Defect Reporting","def":"위험도가 가장 낮은(교재 기준 90~125) 피처들에 배정되는 최소 수준의 테스트 강도다. 별도의 테스트 설계 없이 개발·사용 과정에서 발견되는 결함을 기록하고 보고하는 수준으로 대응한다. 위험도가 낮은 등급이므로 '심각한 피해를 주는 피처를 긴급히 검출' 같은 설명이 붙으면 잘못된 서술이다.","note":"AVN 예제에서 위험도 100인 피처는 결함 보고 등급이다. 가장 낮은 위험도 구간임을 기억."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"고강도 테스트","en":"High-intensity Test","def":"위험도가 가장 높은(교재 기준 1~30) 피처들을 대상으로 하는 테스트 강도다. 시스템에 심각한 피해를 줄 수 있고 즉각적인 수정이 요구되는 결함을 찾기 위해 많은 자원을 투입해 집중적으로 테스트한다. 예산·일정을 고려해 효과와 효율의 균형을 맞추는 균형적 테스트보다 투입 자원이 크다.","note":"'많은 자원을 사용하여 테스트한다'는 서술은 고강도. 위험도 숫자가 작은 구간임에 주의."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"균형적 테스트","en":"Balanced Test","def":"중간 수준의 위험도(교재 기준 30~70)를 가진 피처를 대상으로 하는 테스트 강도다. 프로젝트에 주어진 예산과 일정을 고려하여 효과적이고 효율적인 테스트를 수행한다. 자원을 최대로 투입하는 고강도 테스트와 최소한만 더하는 부가적 테스트의 중간이다.","note":"'주어진 예산과 일정을 고려하여 효과적·효율적으로'라는 표현이 균형적 테스트의 키워드."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"부가적 테스트","en":"Additional Test","def":"위험도가 비교적 낮은(교재 기준 70~90) 피처를 대상으로 하는 테스트 강도다. 다른 등급의 결함들을 검출하기 위한 목적으로 일부 테스트 케이스 및 테스트 데이터를 추가하여 테스트를 수행한다. 본격적인 테스트 설계를 새로 하지 않고 기존 테스트에 보태는 수준이다.","note":"'일부 테스트 케이스와 데이터를 추가하여 수행'은 부가적 테스트."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"위험","en":"Risk","def":"프로젝트 목적 수행에 부정적인 영향을 미칠 수 있는 불확실한 이벤트나 조건을 말한다. 아직 발생하지 않은 잠재적 문제라는 점이 핵심이다. 잠재 위험이 실제 문제로 발현되기 전에 대응책을 마련하는 과정인 위험 관리와 혼동하기 쉽다.","note":"'프로젝트에 부정적 영향을 주는 불확실한 이벤트/조건'은 위험의 정의. 위험 관리라고 하면 X."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"위험 관리","en":"Risk Management","def":"잠재 위험이 문제로 발현되기 전에 이를 식별·분석·평가하고 대응책을 생각해 내어 실행·감시하는 과정이다. 위험 조치에는 발생 가능성이나 영향도를 낮추는 위험 완화, 테스팅을 아웃소싱하는 위험 전가, 특별한 조치 없이 모니터링만 하는 위험 수용 등이 있다. 비상 계획(Contingency plan)은 조치가 필요하다고 판단된 모든 위험에 대해 준비한다.","note":"'비상 계획은 위험도가 높은 위험만 대상으로 준비한다'는 보기는 오답 - 조치 필요 위험 전체다."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"위험 기반 테스트","en":"Risk-based Testing","def":"모든 기능·비기능 요소를 나열해 위험 요소를 식별하고, 각 피처의 위험도를 발생 가능성(Likelihood, 관련 장애가 실행 시 발생할 가능성)·심각성(Severity, 기능이 기대대로 동작하지 않을 때 미치는 영향)·긴급성(Urgency, 얼마나 시급한 수정이 필요한지)으로 산정한 뒤 위험도가 높은 대상에 테스트 자원을 집중하는 접근법이다. 취약성(Vulnerability)은 위험도 산정과 직접 관련이 없고, 위험 분석에서는 상호 관계 복잡성·구현 기술 난이도·사용 빈도·사용자 수·관련 법규와 협력 업체 계약 등을 함께 고려한다. 위험성이 낮은 항목은 테스트 대상에서 제외될 수도 있으며, 시스템 복잡도 등으로 오류 발생 가능성을 추정하는 일은 비현실적인 것이 아니라 실제로 수행하는 활동이다.","note":"산정 3요소는 발생 가능성·심각성·긴급성이며, 취약성과 '테스트 소요 시간'은 위험 분석 고려 사항이 아니다."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"위험도","en":"Risk Exposure","def":"Boehm의 위험 노출 계산에 따라 장애가 발생할 가능성(probability)과 발생 시 영향도(impact)의 곱으로 산정한다. 복잡도의 곱이 아니며, 위험도 분석은 이 가능성과 영향도를 측정해 테스트 대상의 우선순위를 결정하는 데 쓰인다. CSTS 교재의 위험도 등급화 예제에서는 발생 가능성·심각성·긴급성을 각각 1~5로 평가해 곱하여 1(가장 높은 위험)부터 125(가장 낮은 위험)까지의 값으로 표현한다.","note":"Risk = probability × impact. '발생 가능성 × 복잡도'는 X. 숫자가 작을수록 위험이 크다는 점에 주의."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"탐색적 테스팅","en":"Exploratory Testing","def":"형식적인 테스트 계획이나 테스트 케이스를 먼저 설계하지 않고, 테스트를 수행하면서 얻은 결과에 따라 테스트 전략과 다음 테스트를 즉시 바꿔 나가는 경험 기반 테스팅이다. 무작정 하는 것이 아니라 세션 기반 테스팅(Session-based Testing)을 사용해 시간·목표(차터) 단위로 구조화하며, 다른 테스트 기법의 사용을 포함할 수 있다. 애자일 방법을 사용하는 웹 응용 시스템 테스트에 적합하다.","note":"'애자일에 적합하지 않다'는 보기는 오답. 이 정의를 위험 기반 테스트라고 하면 X."},{"chapter":5,"chapterName":"위험 기반 테스트","term":"테스트 강도","en":"Test Intensity","def":"위험 분석 결과를 바탕으로 테스트에 투입할 노력의 수준을 고강도 테스트, 균형적 테스트, 부가적 테스트, 결함 보고의 4등급으로 분류한 것이다. 위험도 1에서 125까지의 구간을 따라 고강도 → 균형적 → 부가적 → 결함 보고 순으로 배정된다. 교재 예제 기준은 1~30 고강도, 30~70 균형적, 70~90 부가적, 90~125 결함 보고다.","note":"4등급 이름 나열은 단답형 출제. 위험도 숫자가 커질수록(위험이 낮을수록) 강도가 약해진다."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"V-모델","en":"V-model / V&V Model","def":"폭포수 모델에 근간을 두고 개발자 관점의 검증(Verification)과 사용자 관점의 확인(Validation)을 결합한 모델로, 개발 단계별로 대응하는 테스트 유형을 정의한다. 요구사항↔인수 테스트, 요구사항 분석↔시스템 테스트, 구조 설계↔통합 테스트, 상세 설계↔단위 테스트로 대응되며, 좌측 하향은 SDLC, 우측 상향은 단위→통합→시스템→인수 순의 STLC다. 테스트 활동이 개발 시작과 동시에 시작되고, 개발 산출물에 대해서는 정적 테스트가 수행된다.","note":"'V-모델의 테스트는 개발 종료와 동시에 시작' X, '개발 산출물에 동적 테스트 수행' X(정적이다)."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"리팩토링","en":"Refactoring","def":"외부에서 보이는 동작을 바꾸지 않으면서 코드의 내부 구조를 개선하는 작업이다. TDD 사이클에서 테스트를 통과한 코드의 품질을 높이는 단계로 수행된다. 리팩토링 후에는 이 작업으로 기존 기능에 새로운 결함이 도입되었는지 검증해야 하므로 반드시 회귀(리그레션) 테스트를 수행한다.","note":"리팩토링 후 수행하는 테스트는 회귀 테스트. 재구성·재공학·역공학과 용어를 구별할 것."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"애자일","en":"Agile","def":"짧은 반복 주기로 동작하는 소프트웨어를 계속 인도하며 변화에 대응하는 개발 방식으로, 요구사항 변경이 빈번한 경우에 적합하다. 애자일 선언은 프로세스나 도구보다 사람과 상호 의사 교환, 포괄적인 문서보다 동작하는 소프트웨어, 계약 협상보다 고객과의 협력, 계획을 따르는 것보다 변화에 반응하는 것을 우선한다. 프로세스와 문서 위주의 방법론은 애자일이 아니라 순차적 개발 모델이다.","note":"'고객과의 계약이 무엇보다 우선'은 애자일 선언이 아니다(협력 > 계약 협상)."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"진화적 개발 모델","en":"Evolutionary Development Model","def":"이터레이션(Iteration)과 점진적(Incremental) 개발 원칙에 바탕을 두고 시스템 구성 요소를 조금씩 반복적으로 개발해 나가는 모델이다. 요구사항이 불명확할 때 적합하고 대규모 프로젝트에 유리하며, 매 단계 테스트가 수행되므로 문제를 해결할 기회를 여러 번 갖는다. 대표적인 형태인 나선형 모델은 사이클마다 리스크 분석을 수행하고, 프로토타입을 먼저 개발해 사용자 평가와 테스트를 거친 뒤 다음 개발 주기를 시작한다.","note":"프로토타입을 만들어 평가 후 다음 주기로 가는 설명은 순차적 모델이 아니라 진화적(나선형) 모델이다."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"테스트 주도 개발","en":"TDD, Test-Driven Development","def":"실제 코드보다 테스트 케이스를 먼저 작성하고, 그 테스트를 통과하는 코드를 나중에 작성하는 개발 방식이다. 프로세스는 시작 → 실패하는 테스트 작성 → 테스트를 통과하는 코드 작성 → (코드 개선 필요 시) 리팩토링 → 종료로 구성되며, 더 많은 테스트가 필요하면 다시 실패하는 테스트 작성 단계로 돌아간다. 테스트가 설계와 구현을 이끌어 가는 점이 핵심이다.","note":"'코드를 먼저 쓰고 테스트를 나중에 쓴다'는 보기는 X. TDD 흐름도의 빈칸은 리팩토링이 정답."},{"chapter":6,"chapterName":"소프트웨어 생명 주기 모델과 테스트","term":"폭포수 모델","en":"Waterfall Model","def":"요구사항부터 유지보수까지 단계를 순차적으로 진행하는 대표적 순차적 개발 모델로, 프로세스와 문서 위주의 방법론이다. 테스트를 코딩 단계 이후의 하나의 개발 단계로만 간주하기 때문에 개발이 거의 완료될 무렵에야 결함이 발견된다. 그 결과 결함 수정에 드는 비용과 시간이 훨씬 많이 소요된다는 한계가 있다.","note":"'폭포수는 개발 완료 후 발견된 결함의 수정 비용이 적다'는 보기는 오답."},{"chapter":7,"chapterName":"테스트 도구","term":"Record & Playback","en":"Record and Playback","def":"테스트 케이스를 컴퓨터가 실행할 수 있는 스크립트로 변환하는 대표적인 방법으로, 사용자가 브라우저 등을 통해 시스템을 사용하는 행위와 시스템 반응을 스크립트로 기록한 뒤 이를 반복 실행한다. 스크립트 언어에 관한 특별한 지식이 없어도 테스트 케이스를 설계하고 실행할 수 있다는 장점이 있다. Katalon Studio가 이 기능을 제공하는 도구이며, 생성되는 스크립트는 대체로 선형 프레임워크 형태다.","note":"캡처/재생(Capture & Replay)과 같은 뜻. 선형 프레임워크와 짝지어 기억."},{"chapter":7,"chapterName":"테스트 도구","term":"SEARCH 모델","en":"SEARCH Model","def":"테스트 자동화의 구성 요소를 나타내는 모델로, Setup(셋업) → Execution(실행) → Analysis(분석) → Report(보고) → Cleanup(정리) → Help(도움말)의 머리글자를 딴 것이다. 자동화 스크립트가 환경 준비부터 정리·지원까지 전체 흐름을 갖추어야 함을 뜻한다. Retest(재테스트)는 SEARCH 모델의 구성 요소가 아니다.","note":"구성 요소가 아닌 것을 고르라면 Retest. S-E-A-R-C-H 여섯 단어를 순서대로 외울 것."},{"chapter":7,"chapterName":"테스트 도구","term":"정적 분석 도구","en":"Static Analysis Tool","def":"프로그램을 실행하지 않고 소스 코드를 분석하여 사이클로매틱 복잡도 계산, 코딩 표준 준수 검사, 초기화되지 않은 변수나 사용하지 않은 변수·함수 검출 등을 수행하는 도구다. 도구의 지원을 받아 정적 테스트를 수행하는 것을 정적 분석이라 한다. 테스트 케이스 커버리지 측정은 프로그램을 실행해야 하므로 동적 분석 도구의 영역이다.","note":"'정적 분석 도구의 용도가 아닌 것'을 묻는 문제의 정답은 커버리지 측정."},{"chapter":7,"chapterName":"테스트 도구","term":"커버리지 분석 도구","en":"Coverage Analysis Tool","def":"테스트를 실행하는 동안 코드의 어느 문장·분기·조건이 수행되었는지 계측하여 커버리지를 측정하는 동적 분석 도구다. 프로그램을 실행해야 측정이 가능하므로 정적 분석 도구에 속하지 않는다. 또한 테스트를 대신 실행해 주는 도구가 아니므로 테스트 실행 자동화 도구로도 분류하지 않는다.","note":"테스트 실행 자동화에 해당하지 않는 것을 고르라면 커버리지 분석 도구(캡처/재생·메모리·성능 도구는 해당)."},{"chapter":7,"chapterName":"테스트 도구","term":"테스트 관리 도구","en":"Test Management Tool","def":"테스트 계획, 노력 추정, 테스트 일정 수립 등의 관리 작업을 지원하고, 요구사항과 테스트 케이스 간 추적성을 관리하며 테스트 진행 상황과 결과를 보고하는 도구다. Jenkins, Redmine 같은 도구가 테스트 자동화 환경에서 함께 쓰인다. 모델이나 소스 코드로부터 테스트 케이스를 생성하는 것은 테스트 관리 도구가 아니라 테스트 설계 도구의 기능이다.","note":"'모델/소스 코드로부터 테스트 케이스 생성'이 보기에 있으면 테스트 관리 도구의 목적이 아니다."},{"chapter":7,"chapterName":"테스트 도구","term":"테스트 도구 선정 프로세스","en":"Tool Selection Process","def":"요구사항 정의 → 도구 조사 → 도구 평가 → 파일럿 프로젝트 → 도구 선정 → 도구 도입의 순서로 진행된다. 도구 평가 다음 단계인 파일럿 프로젝트에서는 도구의 시험판 버전을 사용하거나 소규모로 실제 적용하여 도구의 품질을 평가하고, 도구의 문제점을 도출하고 해결 방안을 검토한다. 자동화 도구를 선정했다고 해서 즉시 조직 전체에 적용하는 것은 바람직하지 않다.","note":"'시험판 사용 또는 (   ) 수행으로 품질 평가' 빈칸의 정답은 파일럿 프로젝트."},{"chapter":7,"chapterName":"테스트 도구","term":"테스트 실행 자동화 도구","en":"Test Execution Automation Tool","def":"테스트 케이스를 스크립트로 만들어 사람을 대신해 반복 실행하고 결과를 판정하는 도구로, 캡처/재생 도구, 메모리 테스트 도구, 성능 테스트 도구, GUI 테스트 실행 도구(Selenium, Robotium) 등이 있다. 형상 관리 도구(Git, Subversion)나 테스트 관리 도구도 자동화 환경을 함께 구성한다. 반면 소스 코드 빌드 도구(CMake, bitbake)는 그 자체를 테스트 자동화 도구로 보기 어렵다.","note":"'테스트 자동화 도구와 가장 거리가 먼 것'의 정답은 소스 코드 빌드 도구."},{"chapter":7,"chapterName":"테스트 도구","term":"테스트 자동화 프레임워크","en":"Test Automation Framework","def":"테스트 대상 시스템에 대한 의존도를 최소화하고 테스트 케이스 중복을 최소화하며, 테스트 스위트를 효율적으로 구성·관리하고 수행 결과를 저장·관리(DB화)하기 위해 필요하다. 스크립팅 수준에 따라 선형(Linear), 모듈 기반(Module Based), 데이터 주도(Data-Driven), 키워드 주도(Keyword-Driven) 프레임워크로 분류한다. 선형은 구조화 수단 없이 순차 실행하는 가장 단순한 형태로 Record & Playback 도구에서 주로 볼 수 있고, 모듈 기반은 큰 스크립트를 유지가 쉬운 작은 스크립트들로 분할해 관리한다.","note":"'대상 시스템 의존도 최대화'는 오답(최소화가 맞다). 데이터 주도=데이터를 CSV 등으로 분리, 키워드 주도=키워드로 결합도 감소."},{"chapter":7,"chapterName":"테스트 도구","term":"테스트 자동화의 효과와 한계","en":"Benefits and Limits of Test Automation","def":"효과로는 테스트 수행 시간 단축, 테스트 환경 다양화를 통한 커버리지 확대, 실행 및 결과 확인 과정에서의 사람 실수 감소가 있다. 그러나 도구 구매·개발 비용, 테스트 스크립트 개발 비용, 엔지니어 훈련 비용 등 프로젝트 초반에 상당한 투자 비용이 발생하므로 '적은 비용으로 환경을 구축한다'는 서술은 옳지 않다. 모든 테스트 케이스를 100% 자동화할 수는 없고 버튼 하나로 전부 자동화되지도 않는다.","note":"자동화 계획은 프로젝트 요구사항 분석 단계에서 수립하고, GUI 자동화도 구현 단계 이후로 미루지 않는다."},{"chapter":8,"chapterName":"정적 테스트","term":"감사","en":"Audit","def":"소프트웨어 제품 및 프로세스가 규제, 표준, 가이드라인, 계획, 절차를 준수하고 있는지를 독립적으로 평가하는 활동이다(IEEE 1028-2008). 조직 외부 또는 독립된 제3자가 수행하는 가장 공식적인 검토 형태다. 결함 검출 자체를 목표로 하는 인스펙션이나 기술적 타당성을 보는 기술 리뷰와 목적이 다르다.","note":"감사의 목적은 '준수 여부의 독립적 평가'. 코딩 표준 검토나 진행 상황 모니터링을 고르면 틀린다."},{"chapter":8,"chapterName":"정적 테스트","term":"공식 검토 참가자 역할","en":"Review Roles","def":"주재자(Moderator)는 공식 검토를 계획하고 회의를 운영하며 종료 후 사후 관리를 하고, 작성자(Author)는 검토 대상 산출물의 작성자로서 문서에 책임을 지고 산출물을 설명한다. 기록자(Recorder)는 회의 내용을 기록하고 모든 이슈·결함·문제점을 문서화하며, 검토자(Reviewer)는 산출물을 검토해 결함을 찾아낸다. 검토 실행을 결정하고 프로젝트 일정 내에서 검토 시간을 할당하며 검토 목표 달성 여부를 판단하는 것은 검토자가 아니라 관리자(Manager)의 역할이다.","note":"검토자와 관리자의 역할을 바꿔 놓은 보기가 단골 오답."},{"chapter":8,"chapterName":"정적 테스트","term":"기술 리뷰","en":"Technical Review","def":"대표 엔지니어(Lead engineer)가 주재하며 기술 전문가들이 산출물의 기술적 타당성과 표준 적합성을 평가하는 공식 리뷰다. 문서화된 절차와 기록을 갖추며 대안 기술의 비교·평가도 수행한다. 관리자 직책을 담당하는 사람의 참여를 금지하는 것이 아니라, 관리자가 해결해야 할 이슈가 있으면 관리자도 참가할 수 있다.","note":"'기술 리뷰는 관리자의 팀 멤버 참여를 금지한다'는 X. 주재자는 대표 엔지니어."},{"chapter":8,"chapterName":"정적 테스트","term":"리뷰 성공 요소","en":"Success Factors of Review","def":"리뷰 참석자에게도 리뷰 기법에 대한 교육 훈련이 제공되어야 하며, 주재자는 별도의 교육을 필수로 이수해야 한다. 산출물의 종류와 검토자의 수준 등을 고려해 리뷰 기법을 적절히 선택하고, 효과적·효율적인 결함 발견을 위해 필요하면 체크리스트를 활용한다. 결함 발견에 부정적인 태도를 갖지 않아야 하고 발견된 결함은 사람이 아니라 산출물에 대해 객관적으로 표현해야 한다.","note":"'주재자가 교육을 받았으면 참석자는 교육이 필요 없다'는 보기는 오답."},{"chapter":8,"chapterName":"정적 테스트","term":"리뷰 프로세스","en":"Review Process","def":"공식 리뷰는 계획 → 착수(kick-off) → 개별 준비 → 리뷰 회의 → 재작업(수정) → 후속 관리(follow-up)의 절차로 진행된다. 주재자가 계획과 회의 운영, 회의 종료 후 사후 관리를 담당하며, 발견된 결함은 수정 후 제대로 반영되었는지 확인한다. 공식성이 낮은 비공식 리뷰나 워크스루는 개별 준비와 후속 관리 단계를 생략할 수 있다는 점이 인스펙션과의 차이다.","note":"공식 검토 종류로 요구사항 검토(SRR)·예비설계 검토(PDR)·상세설계 검토(CDR)·테스트 준비 검토(TRR)가 있으며, TRR은 테스트 결과가 아니라 수행 전 준비 상태와 절차의 완전성을 검토한다."},{"chapter":8,"chapterName":"정적 테스트","term":"비공식 리뷰","en":"Informal Review","def":"정해진 절차와 문서화 규칙 없이 동료 간에 가볍게 산출물을 살펴보는 가장 공식성이 낮은 리뷰다. 주도자나 참가자 역할이 따로 정의되지 않고, 회의록 등 기록을 남기지 않아도 되며 결과에 대한 사후 관리도 필수가 아니다. 비용이 거의 들지 않고 즉시 적용할 수 있어 자주 쓰이지만 결함 검출의 재현성과 측정 가능성은 낮다.","note":"공식성 순서: 비공식 리뷰 < 워크스루 < 기술 리뷰 < 인스펙션 < 감사."},{"chapter":8,"chapterName":"정적 테스트","term":"심볼릭 실행","en":"Symbolic Execution","def":"변수에 구체적인 값을 넣지 않고 기호(symbol)를 대입한 상태로 프로그램의 경로를 따라가며 경로 조건식을 수집하는 정적 분석 방법이다. 주어진 경로가 실행 가능한지 검사하고 실행 불가능한 경로를 검출하며, 경로를 만족시키는 테스트 데이터를 자동으로 생성하는 데 활용된다. 프로그램을 실제로 실행하지 않으므로 동적 분석 방법이 아니다.","note":"'심볼릭 실행과 관련이 없는 것'의 정답은 동적 분석 방법."},{"chapter":8,"chapterName":"정적 테스트","term":"워크스루","en":"Walkthrough","def":"작성자(보통 개발자)가 직접 회의를 진행하며 자신의 산출물을 설명하고 참가자들이 질문과 의견을 제시하는 리뷰다. 회의를 주재하기 위한 별도의 훈련이 필요하지 않고, 참가자들이 회의 전에 작업물을 철저히 준비해야 하는 것도 아니며, 회의 결과가 잘 처리되었는지 확인하는 사후 작업을 생략할 수도 있다. 지식 공유와 합의 형성에 유용하지만 인스펙션만큼 체계적이지는 않다.","note":"'워크스루는 참가자가 사전에 철저히 준비해야 한다'는 보기는 오답. 주도자는 작성자(개발자)다."},{"chapter":8,"chapterName":"정적 테스트","term":"인스펙션","en":"Inspection","def":"훈련받은 주재자(Moderator)가 이끌고 주재자·작성자·기록자·검토자의 역할이 명확히 구분되며 체크리스트와 정해진 프로세스, 결함 데이터 측정을 사용하는 가장 공식적인 리뷰다. 가능한 한 개발 초기에 검사하여 제품에서 결함을 찾아내려는 취지로 개발되었고, 발견된 문제점은 수정 후 반드시 추가 확인(사후 관리)을 거친다. 효과적인 인스펙션을 위해 작성자인 개발자가 주재자를 맡는 것은 바람직하지 않으며, 개발자의 능력을 평가하는 목적으로 사용해서도 안 된다.","note":"인스펙션의 특징을 고르라면 '참가자 역할이 명확하다'와 '체크리스트를 사용한다'."},{"chapter":8,"chapterName":"정적 테스트","term":"인스펙션 도입 효과","en":"Effect of Inspection","def":"인스펙션을 도입하면 코딩 전까지는 일반적인 개발보다 소요 인력이 더 많이 필요하여 초기 프로젝트 비용이 증가한다. 그러나 개발 단계의 재작업과 투입 인력이 감소하므로 결과적으로 품질에 투입되는 총비용이 줄어들고 개발 기간도 단축된다. 코딩이 시작되면서 투입 인력 수요가 급증하고 테스팅 단계에서 최고치에 이르는 것은 인스펙션을 적용하지 않은 일반적인 개발의 특징이다.","note":"인력 곡선이 앞으로 이동(초기 증가, 후기 감소)하는 것이 인스펙션 도입 효과의 핵심."},{"chapter":8,"chapterName":"정적 테스트","term":"자료 흐름 분석","en":"Data Flow Analysis","def":"변수가 정의(d, define), 사용(u, use), 소멸(k, kill)되는 순서를 정적으로 추적하여 이상 패턴을 찾는 정적 분석 기법이다. 정의 없이 사용(~u), 정의 후 재정의(dd), 소멸 후 소멸(kk), 정의 후 소멸(dk), 정의 후 미사용 종료(d~) 등은 잠재적 오류 패턴이다. 정의 후 사용(du)은 정상 패턴이므로 이상 패턴에 포함시키면 안 된다.","note":"'dd, kk, ~u, du는 모두 이상 패턴'이라는 O/X 문제의 답은 X - du는 정상이다."},{"chapter":8,"chapterName":"정적 테스트","term":"정적 분석","en":"Static Analysis","def":"도구의 지원을 받아 정적 테스트를 수행하는 것을 정적 분석이라 한다. 초기화하지 않고 사용한 변수, 선언 후 사용하지 않은 변수와 함수, 코딩 표준·코딩 지침 위반, 사이클로매틱 복잡도 등을 식별할 수 있다. 반면 요구사항과 다른 연산 결과처럼 프로그램을 실행해야 확인되는 결함은 정적 분석으로 찾을 수 없다.","note":"'정적 분석으로 식별할 수 있는 결함과 거리가 먼 것'의 정답은 요구사항과 다른 연산 결과이며, 코딩 스타일 중 여는 중괄호를 if와 같은 행에 두는 방식은 K&R 스타일이다(BSD·GNU는 아래 행에 배치)."},{"chapter":8,"chapterName":"정적 테스트","term":"정적 테스트","en":"Static Test","def":"프로그램을 실행하지 않고 개발 단계에서 산출되는 결과물을 검토하여 결함을 찾는 테스트다. 동적 테스트로는 검출하기 힘든 오류를 찾아내고, 가능한 개발 초기에 오류를 찾아내어 품질을 향상시킨다. 요구사항 분석서, 설계서, 코드, 테스트 관련 문서 등 개발 중 생성되는 모든 산출물이 대상이 될 수 있다.","note":"'코드 분석을 기반으로 프로그램을 실행하여 오류를 찾는다'는 보기는 항상 오답(실행하면 동적)."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"결정/조건 커버리지","en":"Decision/Condition Coverage","def":"각 기본 조건식의 결과와 전체 조건식(결정문)의 결과가 모두 참과 거짓을 적어도 한 번 이상 갖도록 테스트하는 커버리지로, 조건/분기 커버리지 또는 조건/결정 커버리지라고도 부른다. 분기 커버리지와 조건 커버리지가 각각 가진 한계를 함께 해결하기 위한 기법이다. 측정은 (실행된 결정조건의 결과 수 / 전체 결정조건의 결과 수) x 100이며, 전체 14개 중 13개를 실행했다면 약 93%가 된다.","note":"이름이 조건/분기, 조건/결정, 결정/조건으로 여러 개라 지문에서 서로 다른 기법처럼 보이지만 모두 동일 개념이다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"구조 기반 테스트","en":"Structure-based Testing","def":"프로그램의 내부 논리 구조(소스 코드, 제어 흐름, 자료 흐름)를 근거로 테스트 케이스를 도출하는 동적 테스트 방법으로 화이트박스 테스트라고도 한다. ISO/IEC/IEEE 29119는 테스트 방법을 명세 기반, 구조 기반, 경험 기반으로 분류하며 구조 기반은 그중 하나다. 코드를 실행해서 커버리지를 측정하므로 정적 테스트가 아니라 동적 테스트에 속한다.","note":"구조 기반 테스트가 시스템·인수 테스트 단계에서만 수행된다는 말은 틀림 — 구조 정보를 얻을 수 있으면 모든 레벨에서 적용 가능하다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"기본 경로 커버리지","en":"Basis Path Coverage","def":"제어 흐름도에서 선형 독립인 경로들의 집합인 기본 경로를 모두 최소 한 번 실행하도록 테스트하는 커버리지로, 문장·분기 커버리지와 함께 구조 기반 테스트의 대표적 커버리지 기준이다. 기본 경로의 개수는 순환 복잡도와 같다. 경로 단위이므로 문장이나 분기 단위보다 강한 테스트가 되지만 모든 경로(전체 경로)를 다 보는 것은 아니다.","note":"모든 상태를 최소 한 번 실행한다는 기준은 구조 기반이 아니라 상태 전이 테스트(명세 기반)의 기준이다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"다중 조건 커버리지","en":"Multiple Condition Coverage","def":"결정문을 구성하는 기본 조건식들의 가능한 모든 논리적 조합이 적어도 한 번 테스트되도록 테스트 케이스를 도출하는 커버리지다. 구조 기반 테스트 커버리지 중 테스트 강도가 가장 높으며, 기본 조건이 N개면 최대 2의 N승개의 테스트 케이스가 필요해 비용이 급격히 커진다. MC/DC가 N+1개로 각 조건의 독립적 영향만 확인하는 것과 달리 조합 전체를 확인한다는 점이 다르다.","note":"테스트 강도가 가장 높은 커버리지를 묻는 단답형의 정답은 다중 조건 커버리지다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"문장 커버리지","en":"Statement Coverage","def":"프로그램의 모든 실행 가능한 문장을 최소 한 번 실행하는 정도를 측정하는 커버리지로, (실행된 문장 수 / 전체 실행 가능 문장 수) x 100으로 계산한다. 구조 기반 커버리지 중 테스트 강도가 가장 낮아, 100%를 달성해도 결정(분기) 커버리지 100%는 보장되지 않는다. 문장 수준만 보므로 조건문의 거짓 경로가 전혀 실행되지 않아도 100%가 될 수 있다.","note":"강도 최하위. 분기 100%는 문장 100%를 보장하지만, 문장 100%는 분기 100%를 보장하지 않는다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"변형 조건/결정 커버리지","en":"Modified Condition/Decision Coverage (MC/DC)","def":"각 기본 조건식이 다른 조건과 독립적으로 변할 때 전체 결정 결과에 영향을 미치는 것을 확인하도록 테스트 케이스를 도출하는 커버리지다. 기본 조건이 N개일 때 최소 N+1개의 테스트 케이스가 필요하므로, 조건 3개면 최소 4개다. 다중 조건 커버리지처럼 모든 논리 조합(2의 N승)을 다 보지는 않으면서도 각 조건의 독립적 영향을 보장하는 것이 핵심 구별점이다.","note":"최소 개수 문제는 N+1 공식으로 먼저 답 개수를 확정한 뒤, 한 조건만 바뀌고 결과가 뒤집히는 쌍을 찾는 순서로 푼다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"분기 커버리지","en":"Branch Coverage","def":"프로그램의 모든 분기, 즉 결정문에서 나올 수 있는 모든 결과를 최소 한 번 실행하는 정도를 측정하는 커버리지로 결정 커버리지와 같은 의미로 쓰인다. (실행된 결정의 결과 수 / 전체 결정의 결과 수) x 100으로 계산하며, 90% 달성은 전체 분기 10개 중 9개가 실행되었다는 뜻이다. 분기가 3갈래인 다중 분기 판단문이라면 결과가 3개이므로 100% 달성에 최소 3개의 테스트 케이스가 필요하다.","note":"분기 커버리지 100%면 문장 커버리지 100%가 자동 충족되지만 역은 성립하지 않는다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"순환 복잡도","en":"Cyclomatic Complexity","def":"제어 흐름도의 독립적인 경로 수를 나타내는 지표로, 실무 계산은 판단(분기)문의 개수 + 1로 구하며 그래프로는 간선 수 - 노드 수 + 2로도 구한다. 값이 클수록 논리가 복잡해 테스트가 어렵고 결함 가능성이 높다고 본다. 이 값은 기본 경로 커버리지를 100% 달성하기 위해 필요한 기본 경로(독립 경로)의 개수와 같다.","note":"판단문이 3개인 함수의 순환 복잡도는 3 + 1 = 4 — 조건식 안의 기본 조건 수가 아니라 판단문 수를 센다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"자료 흐름 이상 패턴","en":"Data Flow Anomaly Pattern","def":"변수의 정의(d)·사용(u)·소멸(k)이 연속으로 나타나는 쌍 중 논리적으로 잘못된 조합을 이상 패턴이라 한다. 이상 패턴은 dd(정의 후 사용 없이 재정의), dk(정의 후 사용 없이 소멸), ku(소멸된 변수를 사용), kk(소멸 후 다시 소멸), 그리고 정의 없이 바로 사용하는 ~u이다. 정상 패턴은 du(정의 후 사용), ud(사용 후 재정의), uu(연속 사용), uk(사용 후 소멸), kd(소멸 후 재정의), ~d(맨 처음 정의)이다.","note":"du는 가장 정상적인 패턴이므로 dd·kk·~u와 함께 이상 패턴으로 묶어 놓은 지문은 틀린 것이다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"자료 흐름 테스트","en":"Data Flow Testing","def":"변수가 정의(define, d)되고 사용(use, u)되고 소멸(kill, k)되는 순서를 제어 흐름도 위에서 추적하여 비정상적인 사용 순서를 찾아내는 구조 기반 기법이다. 각 변수별로 경로를 따라가며 연속된 두 동작의 쌍을 패턴으로 만들어 정상/이상 여부를 판정한다. 초기화하지 않고 사용한 변수, 선언 후 사용하지 않은 변수 같은 결함은 정적 분석으로도 검출 가능한 대표적 대상이다.","note":"문제에서 변수를 하나 지정하면 다른 변수의 d·u·k는 모두 무시하고 해당 변수만 순서대로 이어 붙여 패턴을 만든다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"제어 흐름도","en":"Control Flow Graph","def":"프로그램의 문장(노드)과 실행 가능한 제어 이동(간선)을 그래프로 표현한 모델로, 구조 기반 커버리지 측정과 경로 도출의 기준이 된다. 노드 수를 세면 문장 커버리지 계산의 분모가 되고, 판단 노드에서 나가는 간선 수를 세면 결정(분기) 결과의 총 개수가 된다. 순환 복잡도와 기본 경로 집합도 이 그래프에서 계산한다.","note":"노드가 8개인 흐름도에서 4개 노드만 지나는 경로를 실행하면 문장 커버리지는 4/8 = 50%다."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"조건 커버리지","en":"Condition Coverage","def":"결정문을 구성하는 각 기본 조건식(개별 조건)이 참과 거짓을 각각 최소 한 번 갖도록 테스트하는 커버리지다. 전체 조건식(결정문)의 결과는 보지 않기 때문에 조건 커버리지 100%를 달성해도 분기 커버리지 100%가 보장되지 않는다. 예를 들어 X>1 AND Y==1에서 기본 조건들의 참·거짓만 모두 만들면 전체 결정이 참이 되는 경우가 없어도 조건 커버리지는 100%가 될 수 있다.","note":"가장 자주 나오는 함정 — 조건 커버리지를 수행하면 분기 커버리지를 수행하지 않아도 된다는 서술은 틀림."},{"chapter":9,"chapterName":"구조 기반 테스트","term":"커버리지 강도 순서","en":"Coverage Strength Hierarchy","def":"구조 기반 커버리지는 테스트 강도가 문장 < 분기(결정) < 결정/조건 < 변형 조건/결정(MC/DC) < 다중 조건 순으로 높아지고, 강한 커버리지를 100% 만족하면 그보다 약한 커버리지도 100% 만족한다. 다만 조건 커버리지는 이 포함 관계 사슬에서 벗어나 있어 분기 커버리지와 서로를 보장하지 않는다. 강도가 높아질수록 필요한 테스트 케이스 수와 비용이 늘어나므로 대상의 위험도에 맞춰 선택한다.","note":"조건 커버리지와 분기 커버리지는 어느 쪽도 다른 쪽을 포함하지 않는다는 점만 따로 기억하면 순서 문제는 다 풀린다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"All transitions 테스트","en":"All-transitions Test","def":"유효한 전이뿐 아니라 유효하지 않은 전이까지 최소 한 번은 시도하도록 테스트 케이스를 설계하는 기준이다. 정의되지 않은 입력이 들어왔을 때 시스템이 비정상 동작하지 않는지 확인할 수 있어 견고성 검증에 유용하다. 유효 전이만 보는 단일 전이 테스트(0-switch)보다 테스트 강도가 높다.","note":"유효하지 않은 전이를 포함한다는 표현이 있으면 0-switch가 아니라 all transitions다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"Each choice 테스트","en":"Each Choice Testing","def":"각 입력 인자의 동등 클래스에서 최소한 하나의 값이 테스트 케이스에 포함되도록만 보장하는 가장 약한 조합 테스트 기법이다. 인자 간 조합은 고려하지 않으므로 필요한 테스트 케이스 수는 가장 값이 많은 인자의 값 개수와 같아진다. 인자가 메뉴 3종, 라디오 버튼 2종, 체크 여부 2종이라면 최대값이 3이므로 최소 3개의 테스트 케이스로 충분하다.","note":"최소 개수는 가장 값이 많은 인자의 값 수 하나로 결정된다 — 페어와이즈(쌍 보장)보다 약하다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"결정 테이블 테스트","en":"Decision Table Testing","def":"입력 조건들의 조합과 그에 대응하는 시스템의 행동을 표로 정리하여 테스트 케이스를 도출하는 기법으로, 결정표 테스트라고도 한다. 논리적으로 의존적인 가능한 모든 조건의 조합을 생성하므로 복잡한 논리 관계를 표현하기 좋고 누락된 요구사항을 찾아내는 데 효과적이다. 모든 조합을 다루므로 모든 짝의 조합만 보는 페어와이즈와는 목적이 다르다.","note":"모든 짝의 조합을 테스트한다는 설명이 결정 테이블의 특징으로 제시되면 오답 — 그것은 페어와이즈다. 상태 의존적 동작에도 적합하지 않다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"경계값 분석","en":"Boundary Value Analysis","def":"입력 영역의 경계와 그 바로 안쪽·바깥쪽 값을 테스트 입력으로 선정하는 기법으로, 동등 분할을 보완해 경계 처리 결함을 노린다. 개발자가 경계 조건을 누락하거나 부등호를 잘못 쓰는 실수를 잡는 데 가장 효과적이다. 예를 들어 10 이상 30 이하 제약에서 상한 조건이 누락된 결함은 경계 바로 바깥값인 31에서 드러날 가능성이 가장 높다.","note":"여러 구간이 이어질 때는 각 구간 경계마다 경계 바깥·경계·경계 안쪽을 뽑는다 — 구간 중간값을 많이 넣는 보기는 효율이 낮다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"다중 전이 테스트","en":"Multiple Transitions Test (N-switch)","def":"상태 전이도에 존재하는 N+1개 길이의 전이 시퀀스를 모두 최소 한 번 실행하도록 테스트 케이스를 설계하는 기준으로 N-switch 테스트라고 한다. N이 커질수록 연속된 전이의 조합을 보게 되어 테스트 강도와 케이스 수가 함께 커진다. 1-switch는 연속된 두 개의 전이 쌍을 모두 보는 것을 뜻한다.","note":"N-switch의 N은 전이 개수가 아니라 스위치 횟수 — 실제로 보는 전이 시퀀스 길이는 N+1이다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"단일 전이 테스트","en":"Single Transitions Test (0-switch)","def":"상태 전이도의 모든 유효한 전이를 최소 한 번은 실행하도록 테스트 케이스를 설계하는 기준으로 0-switch 테스트라고도 한다. 유효한 전이만 대상으로 하므로 유효하지 않은 전이는 다루지 않는다. 상태 테스트보다 강하고 all transitions 테스트보다 약하다.","note":"0-switch는 전이 1개 길이의 시퀀스를 모두 본다는 뜻 — N-switch가 N+1개 전이 시퀀스를 보는 것과 대응시켜 기억한다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"동등 분할","en":"Equivalence Partitioning","def":"입력이나 출력 영역을 같은 처리를 받는 동등 클래스로 나누고 각 클래스에서 대표값 하나씩만 뽑아 테스트 케이스를 만드는 기법이다. 유효 클래스뿐 아니라 무효 클래스도 빠짐없이 포함해야 하며, 한 클래스에서 여러 값을 뽑는 것은 중복이다. 출력에 바탕을 둔 동등 분할도 가능해서, 오류 메시지처럼 같은 출력을 내는 입력들은 모두 유효한 출력에 근거한 테스트로 인정된다.","note":"경계에 붙은 값들을 여러 개 나열한 보기는 동등 분할이 아니라 경계값 분석의 테스트 케이스다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"명세 기반 테스트","en":"Specification-based Testing","def":"프로그램 내부 논리 구조를 참조하지 않고 요구사항 명세나 설계 정보를 근거로 테스트 케이스를 도출하는 방법으로 블랙박스 테스트라고도 한다. 구조 기반 테스트와 함께 동적 테스트 방법에 속하며, 정적 테스트가 아니다. 명세 정보를 얻을 수 있는 한 컴포넌트·통합·시스템·인수 테스트 전 과정에 적용할 수 있다.","note":"명세 기반 테스트가 시스템·인수 단계에서만 수행된다는 서술은 틀림 — 적용 레벨에 제한이 없다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"분류 트리 기법","en":"Classification Tree Method","def":"테스트 대상의 입력 영역을 분류 기준에 따라 계층적인 트리로 분해하고, 트리의 잎에 해당하는 클래스들을 조합해 테스트 케이스를 도출하는 명세 기반 기법이다. 동등 분할을 시각적·체계적으로 확장한 형태로 볼 수 있어 누락된 입력 조합을 발견하기 쉽다. 도출된 조합에 페어와이즈 같은 조합 기준을 함께 적용해 케이스 수를 줄일 수 있다.","note":"분류 트리는 클래스를 뽑는 구조화 도구이고, 그 클래스를 몇 개씩 조합할지는 each choice·페어와이즈 등 별도 기준이 정한다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"상태 전이 테스트","en":"State Transition Testing","def":"시스템이 현재 어떤 상태에 있는지에 따라 같은 입력에도 다른 동작을 하는 대상을 상태 전이도로 모델링하여 테스트 케이스를 도출하는 기법이다. 테스트 케이스는 시작 상태, 입력, 예상되는 도착 상태의 조합으로 기술하며, 중간 상태를 건너뛰지 않고 전이 순서대로 나열해야 한다. 강도에 따라 상태 테스트, 단일 전이 테스트(0-switch), all transitions 테스트, 다중 전이 테스트(N-switch)로 구분된다.","note":"버튼을 눌렀을 때의 동작이 현재 수행 중인 기능에 따라 달라진다는 지문이 나오면 상태 전이 테스트가 정답이다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"상태 테스트","en":"State Test","def":"상태 전이도의 모든 상태를 최소 한 번은 방문하도록 테스트 케이스를 설계하는 가장 약한 강도의 상태 기반 기준이다. 전이가 아니라 상태를 세므로, 일부 유효한 전이를 실행하지 않아도 모든 상태를 방문했다면 기준을 만족한다. 세 개의 테스트 케이스로 모든 상태를 한 번씩 방문했다면 그것은 단일 전이 테스트가 아니라 상태 테스트에 해당한다.","note":"주어진 테스트 케이스가 모든 상태를 덮는지 먼저 보고, 모든 전이까지 덮으면 0-switch로 올려 판단한다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"오류 추정","en":"Error Guessing","def":"특정 소프트웨어에 대해 테스터의 직관과 경험을 활용하여 어떤 유형의 결함이 발생할지 예측하고 그 결함을 노리는 테스트 케이스를 만드는 기법이다. 명세나 구조에서 기계적으로 도출하지 않으므로 명세 기반·구조 기반이 아니라 경험 기반 테스트로 분류된다. 과거 결함 이력이나 결함 분류표를 근거로 활용하면 효과가 높아진다.","note":"ISO/IEC/IEEE 29119의 세 가지 분류는 명세 기반, 구조 기반, 경험 기반이며 오류 추정·탐색적 테스팅·체크리스트 기반이 경험 기반에 속한다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"유스케이스 테스트","en":"Use Case Testing","def":"사용자가 시스템을 사용하는 시나리오, 즉 유스케이스의 기본 흐름과 대안·예외 흐름을 따라 테스트 케이스를 도출하는 기법으로 시나리오 테스팅이라고도 한다. 여러 기능이 순서대로 맞물려 동작하는 업무 흐름의 결함을 찾는 데 강하며 인수 테스트에서 특히 유용하다. 시나리오가 상태 변화를 따라가므로 상태 의존적 동작을 가진 대상에도 적합하다.","note":"상태 의존적 동작에 적합한 기법은 시나리오 테스팅과 상태 전이 테스팅이며, 결정표 테스팅은 여기에 포함되지 않는다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"직교 배열 테스트","en":"Orthogonal Array Testing","def":"통계학의 직교 배열표를 이용하여 인자값 조합을 균형 있게 뽑아내는 조합 테스트 기법이다. 페어와이즈와 같이 모든 쌍을 덮는 것을 목표로 하되, 미리 정의된 배열표를 사용하므로 각 쌍이 같은 횟수로 나타나도록 균형이 보장된다. 인자 수와 수준 수에 맞는 배열표가 있어야 적용할 수 있어 페어와이즈보다 유연성이 낮다.","note":"페어와이즈는 알고리즘으로 케이스를 만들고, 직교 배열은 정해진 표를 대입한다는 점이 구별 포인트다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"체크리스트 기반 테스트","en":"Checklist-based Testing","def":"과거 경험과 지식을 항목 목록으로 정리한 체크리스트를 근거로 테스트를 수행하는 경험 기반 기법이다. 반복적으로 확인해야 하는 품질 항목이나 환경 구축 점검처럼 정형화된 확인 작업에 효과적이다. 테스트 환경이 요구대로 구축되었는지 점검할 때는 테스트 케이스보다 체크리스트가 더 적합하다.","note":"인스펙션에서 체크리스트를 사용한다는 점도 함께 출제된다 — 워크쓰루와 달리 인스펙션은 역할이 명확하고 체크리스트를 쓴다."},{"chapter":10,"chapterName":"명세 기반 테스트","term":"페어와이즈 조합 테스트","en":"Pairwise Combination Testing","def":"모든 입력 인자값의 전체 조합을 테스트하는 것이 불가능하므로, 임의의 두 인자값 쌍이 적어도 한 번은 함께 나타나도록 테스트 케이스를 설계하는 기법이다. 먼저 두 인자의 모든 쌍을 만들고, 나머지 인자값으로 수평 확장하면서
