"],"explanation":"FIRST 원칙은 단위 테스트를 잘 수행하기 위한 원칙이다.","explSource":"book","answer":1},{"id":"csts-exercise-65-4-24","part":"exercise","chapter":3,"qtype":"mc","dupKey":"다음중올바르지않은설명은무엇인가?","question":"다음 중 올바르지 않은 설명은 무엇인가?","options":["새로운 기능이 추가되면 이 기능을 테스트하는 테스트 케이스도 추가되어야 한다.","기존의 기능이 변경되면 변경된 기능을 테스트하는 테스트 케이스도 변경되어야 한다.","기존의 기능이 제거되면 삭제된 기능을 테스트하는 테스트 케이스는 재사용을 위해 그대로 둔다.","가능한 동일한 프로그램 경로를 실행하는 테스트 케이스들은 제거하여 중복을 피한다."],"explanation":"만약, 어떤 기능이 더 이상 비즈니스에 필요하지 않아 애플리케이션에서 제거되었다면, 이를 테스트하는 테스트 케이스도 리그레션 테스트 케이스 집합에서 제거되어야 한다. 이 경우에 해당 테스트 케이스를 제거하지 않는다면 이로 인하여 리그레션 테스트를 수행할 때 잘못된 테스트 결과가 보고되고 테스트의 신뢰성을 잃게 만드는 요인이 된다.","explSource":"book","answer":2},{"id":"csts-exercise-65-5-25","part":"exercise","chapter":3,"qtype":"mc","dupKey":"다음중에서APFD에대한설명으로옳지않은것은?","question":"다음 중에서 APFD에 대한 설명으로 옳지 않은 것은?","options":["테스트 케이스 실행 비율 대비 검출된 결함의 비율을 측정한다.","APFD가 낮다는 것은 더 적은 수의 테스트 케이스를 실행하여 많은 결함을 빠르게 검출할 수 있다는 것을 의미한다.","APFD는 테스트 케이스의 수와 결함의 수, 실행 순서로 계산된다.","리그레션 테스트 케이스의 우선순위를 결정하는 데 사용된다."],"explanation":"APFD가 높다는 것은 더 적은 수의 테스트 케이스를 실행하여 많은 결함을 빠르게 검출할 수 있다는 것을 의미한다.","explSource":"book","answer":1},{"id":"csts-exercise-65-6-26","part":"exercise","chapter":3,"qtype":"ox","dupKey":"결함수정후이작업이기존의기능에새로운결함이도입되었는지검증하기위해리그레션테스트를수행해야한다.","question":"결함 수정 후 이 작업이 기존의 기능에 새로운 결함이 도입되었는지 검증하기 위해 리그레션 테스트를 수행해야 한다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-66-7-27","part":"exercise","chapter":0,"qtype":"mc","dupKey":"테스트와관련된다음의설명중올바른것은?","question":"테스트와 관련된 다음의 설명 중 올바른 것은?","options":["성숙도가 높은 테스트는 결함이 발견된 소프트웨어 모듈을 확인하고, 이를 해결하기 위해 소스 코드를 어떻게 수정해야 하는지 알려준다.","단순한 소스 코드의 철자를 바로잡거나 알고리즘의 부정확한 구현을 정확하게 수정하는 작업을 정적분석이라 한다.","초기에 결함을 검출한 테스트 케이스를 이용하여 다시 테스트하는 것을 스모크테스트라 한다.","유지보수 단계에서 소프트웨어가 수정된 후, 기존 프로그램이 변경된 부분으로 인해 영향을 받지 않았는지 검사하기 위한 테스트를 회귀(Regression) 테스트라 한다."],"explanation":"①과 ②는 디버깅, ③ 스모크테스트는 빌드가 테스트할 수준인지 확인하는 테스트이다.","explSource":"book","answer":3},{"id":"csts-exercise-66-8-28","part":"exercise","chapter":0,"qtype":"ox","dupKey":"아래의시스템구성모듈을너비우선(Breadth-First)방식으로하향식통합하였을때,통합된순서는M1,M2,M3,M4,M5,M6,M7,M8이다.(시스템","question":"아래의 시스템 구성 모듈을 너비 우선(Breadth-First) 방식으로 하향식 통합하였을 때, 통합된 순서는 M1, M2, M3, M4, M5, M6, M7, M8 이다.\n(시스템 구성도: 최상위 M1 아래에 M2, M3, M4가 있고, M2 아래에 M5와 M6, M3 아래에 M7, M5 아래에 M8이 연결되어 있다.)","options":["O (맞다)","X (틀리다)"],"explanation":"너비 우선(Breadth-First) 하향식 통합은 같은 계층의 모듈을 모두 통합한 뒤 다음 계층으로 내려가므로, 1계층 M1 → 2계층 M2, M3, M4 → 3계층 M5, M6, M7 → 4계층 M8 순서가 되어 제시된 M1~M8 순서와 일치한다. 따라서 O가 맞다. 만약 깊이 우선(Depth-First)이라면 한 경로를 끝까지 따라 M1, M2, M5, M8, M6, M3, M7, M4 식으로 통합되므로 순서가 달라진다는 점을 함께 기억해야 한다.","explSource":"authored","answer":0},{"id":"csts-exercise-66-9-29","part":"exercise","chapter":0,"qtype":"short","dupKey":"다음설명에적절한테스트용어를기재하시오.테스트가가능한최소단위의소프트웨어(모듈,프로그램,객체,클래스등)내에서결함을찾고검증하는테스트단계","question":"다음 설명에 적절한 테스트 용어를 기재하시오.\n테스트가 가능한 최소 단위의 소프트웨어(모듈, 프로그램, 객체, 클래스 등) 내에서 결함을 찾고 검증하는 테스트 단계","options":[],"explanation":"모듈, 프로그램, 객체, 클래스처럼 테스트가 가능한 최소 단위 내부에서 결함을 찾는 테스트 레벨은 단위 테스트(Unit Test)이다. 주로 개발자가 소스 코드와 상세 설계를 기반으로 수행하며 화이트박스 기법과 단위 테스트 프레임워크를 활용한다. 모듈 간 인터페이스를 확인하는 것은 통합 테스트, 완성된 시스템 전체를 요구사항 기준으로 확인하는 것은 시스템 테스트이므로 대상 범위로 레벨을 구분해야 한다.","explSource":"authored","answerText":"단위 테스트(unit test), 단위 테스팅(unit testing)"},{"id":"csts-exercise-66-10-30","part":"exercise","chapter":0,"qtype":"mc","dupKey":"인수테스트의일반적인수행주체는누구인가?","question":"인수 테스트의 일반적인 수행 주체는 누구인가?","options":["개발자","테스트 팀","시스템 엔지니어","고객 또는 사용자"],"explanation":"인수 테스트는 고객 또는 사용자에 의해 행해진다.","explSource":"book","answer":3},{"id":"csts-exercise-92-1-31","part":"exercise","chapter":4,"qtype":"mc","dupKey":"다음중사용자의요구사항을시스템이얼마나만족하는지에대한정보를제공하는기능적합성테스트의부특성에대한설명으로올바른것은?","question":"다음 중 사용자의 요구사항을 시스템이 얼마나 만족하는지에 대한 정보를 제공하는 기능 적합성 테스트의 부특성에 대한 설명으로 올바른 것은?","options":["완전성: 모든 명시된 기능을 시스템이 제공하는 정도","적절성: 기능 수행 시 사용되는 자원이 요구사항을 만족시키는 정도","정확성: 사용자의 목적 달성에 소프트웨어가 도움을 주는 정도","가용성: 사용자가 원하는 시간에 사용 및 접근이 가능한 정도"],"explanation":"① 완전성: 모든 명시된 기능을 시스템이 제공하는 정도 ② 적절성: 사용자의 목적 달성에 소프트웨어가 도움을 주는 정도 ③ 정확성: 정의된 정밀도에 따라 정확하게 결과를 제공하는 정도 ④ 가용성: 신뢰성의 부특성","explSource":"book","answer":0},{"id":"csts-exercise-92-2-32","part":"exercise","chapter":4,"qtype":"mc","dupKey":"다음중성능효율성테스트의부특성은무엇인가?","question":"다음 중 성능 효율성 테스트의 부특성은 무엇인가?","options":["운영 용이성","자원 활용성","상호 운영성","복구성"],"explanation":"성능 효율성 테스트 부특성: 시간 반응성(Time-behaviour), 자원 효율성(Resource Utilization), 수용성(Capacity). ① 운영 용이성: 사용성 테스트 부특성 ③ 상호 운영성: 호환성 테스트 부특성 ④ 복구성: 신뢰성 테스트 부특성","explSource":"book","answer":1},{"id":"csts-exercise-92-3-33","part":"exercise","chapter":4,"qtype":"mc","dupKey":"다음그림에서스파이크테스팅에해당하는것은?(각보기는가로축이'시간',세로축이'(가상)사용자수'이며'임계점'을점선으로표시한그래프이다.)","question":"다음 그림에서 스파이크 테스팅에 해당하는 것은?\n(각 보기는 가로축이 '시간', 세로축이 '(가상) 사용자수'이며 '임계점'을 점선으로 표시한 그래프이다.)","options":["사용자수가 계단 모양으로 조금씩 단계적으로 증가하여 임계점 부근까지 올라갔다가 내려오는 그래프","사용자수가 완만하게 증가하여 임계점을 넘은 수준에서 일정하게 유지되다가 내려오는 그래프","사용자수가 짧은 시간에 임계점 위로 급격히 치솟았다 떨어지기를 여러 번 반복하는 그래프","사용자수가 증가하여 임계점 바로 아래 수준에서 오래 유지되다가 내려오는 그래프"],"explanation":"이 테스팅은 짧은 시간에 사용자가 몰릴 때 시스템의 반응을 측정한다. BTS와 같은 세계적인 아이돌 그룹의 공연 예매를 지원하는 시스템에 짧은 시간에 수많은 사용자가 몰리는 상황을 생각해볼 수 있다.","explSource":"book","answer":2},{"id":"csts-exercise-93-4-34","part":"exercise","chapter":4,"qtype":"ox","dupKey":"서로다른시스템과의상호연동능력을확인하기위한테스트로,테스트하고자하는제품이다른제품과공통으로환경및자원을공유하면서그제품에유해한영향을미치지않고올바른기능을수","question":"서로 다른 시스템과의 상호연동능력을 확인하기 위한 테스트로, 테스트하고자 하는 제품이 다른 제품과 공통으로 환경 및 자원을 공유하면서 그 제품에 유해한 영향을 미치지 않고 올바른 기능을 수행할 수 있는지 확인하는 테스트는 이식성 테스트이다.","options":["O (맞다)","X (틀리다)"],"explanation":"서로 다른 시스템과의 상호연동능력을 확인하기 위한 테스트로, 테스트하고자 하는 제품이 다른 제품과 공통으로 환경 및 자원을 공유하면서 그 제품에 유해한 영향을 미치지 않고 올바른 기능을 수행할 수 있는지 확인하는 테스트는 호환성 테스트이다.","explSource":"book","answer":1},{"id":"csts-exercise-93-5-35","part":"exercise","chapter":4,"qtype":"short","dupKey":"다음은ISO/IEC25010품질특성에관한설명이다.어떤품질특성에대한설명인지기술하시오.```특정조건에서특정기간동안오동작없이의도된기능을수행하는소프트웨","question":"다음은 ISO/IEC 25010 품질 특성에 관한 설명이다. 어떤 품질 특성에 대한 설명인지 기술하시오.\n```\n특정 조건에서 특정 기간 동안 오동작 없이 의도된 기능을 수행하는 소프트웨어의 능력을 말하며, 부특성으로는 성숙성, 가용성, 결함 허용성, 복구성이 있다.\n```","options":[],"explanation":"신뢰성에 대한 설명이다.","explSource":"book","answerText":"신뢰성(Reliability)"},{"id":"csts-exercise-93-6-36","part":"exercise","chapter":4,"qtype":"mc","dupKey":"보안성품질특성에대한설명으로가장적절한것은?","question":"보안성 품질 특성에 대한 설명으로 가장 적절한 것은?","options":["보안성의 부특성은 성숙성, 가용성, 접근성이 있다.","소프트웨어가 정보 및 데이터를 올바르게 보호하는 능력을 의미한다.","보안성 결함은 명세 및 구조 기반 테스팅 기법으로 모두 검출할 수 있다.","부특성인 접근성은 데이터가 인가되지 않은 접근으로부터 보호되는 비율, 암호화 및 복호화가 정확히 구현된 비율 등으로 측정한다."],"explanation":"① 보안성의 부특성은 기밀성, 무결성, 부인 방지성, 책임성, 인증성이다. ③ 보안성 결함은 일반적인 테스팅 기법으로 검출할 수 없으므로 침투 시험(Penetration Test)를 수행하여 보안의 취약점을 확인한다. ④ 보안성의 부특성 중 기밀성에 대한 설명이다.","explSource":"book","answer":1},{"id":"csts-exercise-93-7-37","part":"exercise","chapter":4,"qtype":"mc","dupKey":"프로그램이얼마나손쉽게테스트가능한지를나타내는특성과가장거리가먼것은?","question":"프로그램이 얼마나 손쉽게 테스트 가능한지를 나타내는 특성과 가장 거리가 먼 것은?","options":["단순성(Simplicity)","관찰 용이성(Observability)","운용 용이성(Operability)","견고성(Robustness)"],"explanation":"견고성은 테스트 용이성과 가장 거리가 먼 특성이다. 반면에 단순성, 관찰 용이성, 운용 용이성은 테스트 용이성의 구체적인 특성이다","explSource":"book","answer":3},{"id":"csts-exercise-94-8-38","part":"exercise","chapter":4,"qtype":"mc","dupKey":"다음은어떤품질특성을평가하는방법인가?```•인지적워크쓰루(Cognitivewalk-through)•FGI(FocusGroupInterview)•휴","question":"다음은 어떤 품질 특성을 평가하는 방법인가?\n```\n• 인지적 워크쓰루(Cognitive walk-through)\n• FGI(Focus Group Interview)\n• 휴리스틱 평가(Heuristic Evaluation)\n```","options":["사용성","호환성","유지보수성","신뢰성"],"explanation":"모두 사용성을 평가하는 방법이다.","explSource":"book","answer":0},{"id":"csts-exercise-94-9-39","part":"exercise","chapter":4,"qtype":"mc","dupKey":"다음은프로그램을얼마나손쉽게테스트할수있는지를나타내는테스트용이성에관한설명이다.특성과설명이올바르게연결된것은?```(가)제어용이성Ⓐ테스트동안에소프트웨어","question":"다음은 프로그램을 얼마나 손쉽게 테스트할 수 있는지를 나타내는 테스트 용이성에 관한 설명이다. 특성과 설명이 올바르게 연결된 것은?\n```\n(가) 제어 용이성      Ⓐ 테스트 동안에 소프트웨어에 대한 변경이 자주 발생하지 않도록 설계\n(나) 안정성           Ⓑ 소프트웨어 설계 정보가 잘 조직화되어 쉽게 접근 가능하도록 설계\n(다) 분할 용이성      Ⓒ 테스트할 대상 영역을 제어함으로써 문제가 발생된 곳을 고립시켜 독립적으로 모듈 시험\n(라) 이해 용이성      Ⓓ 프로그램의 실행을 제어하기 용이하도록 설계\n```","options":["(가)—Ⓓ, (나)—Ⓐ, (다)—Ⓒ, (라)—Ⓑ","(가)—Ⓓ, (나)—Ⓑ, (다)—Ⓒ, (라)—Ⓐ","(가)—Ⓒ, (나)—Ⓐ, (다)—Ⓓ, (라)—Ⓑ","(가)—Ⓒ, (나)—Ⓑ, (다)—Ⓓ, (라)—Ⓐ"],"explanation":"(가) 제어용이성: 프로그램의 실행을 제어하기 용이하도록 설계 (나) 안정성: 테스트 동안에 소프트웨어에 대한 변경이 자주 발생하지 않도록 설계 (다) 분할용이성: 테스트할 대상 영역을 제어함으로써 문제가 발생된 곳을 고립시켜 독립적으로 모듈 시험 (라) 이해용이성: 소프트웨어 설계 정보가 잘 조직화되어 쉽게 접근 가능하도록 설계","explSource":"book","answer":0},{"id":"csts-exercise-103-1-40","part":"exercise","chapter":5,"qtype":"mc","dupKey":"위험기반테스트계획에서위험도에영향을주는요인으로올바르지않은설명은?","question":"위험 기반 테스트 계획에서 위험도에 영향을 주는 요인으로 올바르지 않은 설명은?","options":["많은 사용자에게 영향을 미치는 경우는 더 높은 위험성을 가진다.","관련 법규, 협력 업체와의 계약 등은 위험성에 영향을 주지 않는다.","오류의 발생 빈도는 위험성에 많은 영향을 미칠 수 있다.","신뢰도에 심각한 영향을 미칠 수 있다면 위험성 측면에서도 많은 영향을 미친다."],"explanation":"심각성, 발생 가능성뿐만 아니라 관련 법규, 협력 업체와의 계약 등도 고려해야 한다.","explSource":"book","answer":1},{"id":"csts-exercise-103-2-41","part":"exercise","chapter":5,"qtype":"short","dupKey":"위험분석결과를바탕으로테스트에대한강도를4등급으로분류할수있다.이중에서3개이상을나열하시오.","question":"위험 분석 결과를 바탕으로 테스트에 대한 강도를 4등급으로 분류할 수 있다. 이 중에서 3개 이상을 나열하시오.","options":[],"explanation":"위험도에 따른 테스트강도는 위험도 1에서 125까지의 구간을 따라 고강도 테스트 → 균형적 테스트 → 부가적 테스트 → 결함 보고 순으로 구분된다.","explSource":"book","answerText":"고강도, 균형적, 부가적, 결함 보고 중 3개 이상 제시"},{"id":"csts-exercise-103-3-42","part":"exercise","chapter":5,"qtype":"ox","dupKey":"형식적인테스트계획이나테스트케이스없이테스트결과에따라테스트전략을변경해나가는테스트방식을위험기반테스트라고한다.","question":"형식적인 테스트 계획이나 테스트 케이스 없이 테스트 결과에 따라 테스트 전략을 변경해 나가는 테스트 방식을 위험 기반 테스트라고 한다.","options":["O (맞다)","X (틀리다)"],"explanation":"X이다. 형식적인 테스트 계획이나 테스트 케이스 없이 테스트를 수행하면서 그 결과에 따라 다음 테스트를 설계하고 전략을 변경해 나가는 방식은 탐색적 테스팅(Exploratory Testing)이다. 위험 기반 테스트(Risk-based Testing)는 장애 발생 가능성과 영향도로 위험도를 산정해 테스트 대상과 범위의 우선순위를 정하고 자원을 배분하는, 오히려 계획적인 접근법이다. 올바른 서술로 고치면 '형식적인 테스트 계획이나 테스트 케이스 없이 테스트 결과에 따라 테스트 전략을 변경해 나가는 테스트 방식을 탐색적 테스팅이라고 한다'가 된다.","explSource":"authored","answer":1},{"id":"csts-exercise-103-4-43","part":"exercise","chapter":5,"qtype":"mc","dupKey":"다음중위험기반테스트에대한설명으로올바르지않은것은?","question":"다음 중 위험기반 테스트에 대한 설명으로 올바르지 않은 것은?","options":["시스템의 복잡도 등을 통하여 오류의 발생 가능성을 추정하는 것은 비현실적이다.","위험도는 오류가 발생하였을 때 미치는 영향과 해당 오류가 발생할 가능성이 고려되어야 한다.","낮은 위험성을 가지는 오류는 테스트 대상에서 제외될 수도 있다.","위험성의 정도에 따라서 테스트 접근 방법이 고려될 수 있다."],"explanation":"위험성의 요인은 발생 가능성(B), 심각성(C), 긴급성(D)이다.","explSource":"book","answer":0},{"id":"csts-exercise-104-5-44","part":"exercise","chapter":5,"qtype":"ox","dupKey":"위험도(Risk)는장애가발생할가능성과복잡도의곱으로계산한다.","question":"위험도(Risk)는 장애가 발생할 가능성과 복잡도의 곱으로 계산한다.","options":["O (맞다)","X (틀리다)"],"explanation":"Boehm의 위험 노출 계산. Risk = probability(장애가 발생할 가능성) × impact(영향도)","explSource":"book","answer":1},{"id":"csts-exercise-104-6-45","part":"exercise","chapter":5,"qtype":"mc","dupKey":"다음위험도를산정하기위해필요한항목과항목에대한설명으로잘못된것은?","question":"다음 위험도를 산정하기 위해 필요한 항목과 항목에 대한 설명으로 잘못된 것은?","options":["발생 가능성(Likelihood) : 해당 피처와 관련된 장애가 실행 시에 발생할 가능성","취약성(vulnerability) : 외부 요소로부터 시스템의 안전도를 낮추는 데 사용되는 정도","긴급성(Urgency) : 관련 장애가 발생하였을 때 얼마나 시급한 수정이 필요한지의 정도","심각성(Severity) : 시스템의 기능 요소가 기대한 대로 동작하지 않을 때 미치는 영향의 정도"],"explanation":"위험분석 기반 테스트를 수행할 때는 먼저 위험 요소를 식별하기 위해 모든 기능, 비기능 요소를 나열한다. 어떤 피처를 테스트 대상에 포함할 것인지에 관한 결정과 효과적인 테스트 전략의 결정을 위하여 위험도를 산정해야 한다. 각 피처 후보의 위험도 산정은 발생 가능성(Likelihood), 심각성(Severity), 긴급성(Urgency)을 바탕으로 수행된다. ② 취약성은 위험도 산정과 직접적인 관련이 없다.","explSource":"book","answer":1},{"id":"csts-exercise-104-7-46","part":"exercise","chapter":5,"qtype":"ox","dupKey":"위험관리란프로젝트목적수행에부정적인영향을미칠수있는불확실한이벤트나조건을의미한다.","question":"위험 관리란 프로젝트 목적 수행에 부정적인 영향을 미칠 수 있는 불확실한 이벤트나 조건을 의미한다.","options":["O (맞다)","X (틀리다)"],"explanation":"위험에 대한 설명. 위험관리는 잠재 위험이 문제로 발현되기 전에 대응책을 생각해 내는 과정이다.","explSource":"book","answer":1},{"id":"csts-exercise-104-8-47","part":"exercise","chapter":5,"qtype":"ox","dupKey":"위험도분석은장애발생가능성과영향도를측정하여테스트대상에대한우선순위를결정한다.","question":"위험도 분석은 장애발생 가능성과 영향도를 측정하여 테스트 대상에 대한 우선순위를 결정한다.","options":["O (맞다)","X (틀리다)"],"explanation":"O이다. 위험도(Risk)는 일반적으로 위험 발생 가능성(Likelihood)과 발생 시 영향도(Impact)의 조합으로 산정되며, 이를 근거로 테스트 대상의 우선순위와 테스트 강도를 결정하는 것이 위험 기반 테스트의 핵심이다. 시간과 비용이 유한하여 완벽한 테스팅은 불가능하다는 원리 때문에, 위험도가 높은 영역에 테스트 자원을 집중 배분하는 것이 효과적인 전략이 된다.","explSource":"authored","answer":0},{"id":"csts-exercise-105-9-48","part":"exercise","chapter":5,"qtype":"mc","dupKey":"개발중인차량에탑재되어운전자에게인포테인먼트기능을제공하는AVN(AudioVideoNavigation)장치에대해아래표에제시하고있는피처들을대상으로위험분","question":"개발 중인 차량에 탑재되어 운전자에게 인포테인먼트 기능을 제공하는 AVN(Audio Video Navigation) 장치에 대해 아래 표에 제시하고 있는 피처들을 대상으로 위험 분석을 수행하여, 위험 기반 테스트를 수행하고자 한다. 각 피처의 위험도를 등급화하고 계획한 테스트 강도의 설명으로 올바르지 않은 것은? (테스트 강도에 따른 위험도는 표 아래에 제시된 기준에 따르며, 매우 높은 위험도를 1, 가장 낮은 위험도를 125로 한다.)\n```\n피처 / 발생 가능성 / 심각성 / 긴급성\n(가) 후진 기어 입력 시 후방 카메라 영상을 디스플레이 장치에 표시 : 4 / 2 / 4\n(나) 차량 공조 장치(에어컨 등)의 가동 상태를 차량 관리 화면에 표시 : 4 / 4 / 5\n(다) 심각한 차량 충격이 감지되면 긴급 연락망(119 등)으로 전화 연결 : 2 / 1 / 1\n(라) 네비게이션 음성 안내 멘트가 재생되는 동안, 재생 중이던 음악 볼륨을 자동으로 줄였다가, 안내 멘트 재생이 끝나면 원래 크기로 자동 조절 : 5 / 5 / 4\n\n위험도에 따른 테스트강도\n1 ~ 30 : 고강도 테스트 / 30 ~ 70 : 균형적 테스트 / 70 ~ 90 : 부가적 테스트 / 90 ~ 125 : 결함 보고\n```","options":["(가) 프로젝트의 주어진 예산과 일정을 고려하여 효과적이고 효율적인 테스트를 수행한다.","(나) 다른 등급의 결함들을 검출하기 위한 목적으로 일부 테스트 케이스 및 데이터를 추가하여 테스트를 수행한다.","(다) 시스템에 심각한 피해를 줄 수 있으며, 즉각적인 수정이 요구되는 결함에 해당되는 피처들을 대상으로 많은 자원을 사용하여 테스트를 수행한다.","(라) 시스템에 심각한 피해를 주는 피처들을 대상으로 긴급하게 해결되어야 하는 결함을 검출하고 빠른 보고를 위해 테스트를 수행한다."],"explanation":"각 피처의 위험도는 (가) 32 → 균형적, (나) 80 → 부가적, (다) 2 → 고강도, (라) 100 → 결함보고이다. (라) 항목은 위험도 100으로, 제시된 기준에 따르면 결함 보고의 테스트 강도에 해당된다. 결함 보고는 가장 낮은 위험도를 가지는 피처들을 대상으로 분류된다.","explSource":"book","answer":3},{"id":"csts-exercise-106-10-49","part":"exercise","chapter":5,"qtype":"mc","dupKey":"다음중위험분석에서고려해야할사항으로가장거리가먼것은?","question":"다음 중 위험 분석에서 고려해야 할 사항으로 가장 거리가 먼 것은?","options":["상호 관계 복잡성","구현 기술 난이도","테스트 소요 시간","사용 빈도"],"explanation":"③ 테스트 소요 시간은 위험 분석에서 고려해야 할 사항으로 보기 어렵다.","explSource":"book","answer":2},{"id":"csts-exercise-119-1-50","part":"exercise","chapter":6,"qtype":"mc","dupKey":"다음은테스트주도개발(Test-DrivenDevelopment,TDD)프로세스를나타내는그림이다.(가)에들어갈용어는무엇인가?```시작→실패하는테스트","question":"다음은 테스트 주도 개발(Test-Driven Development, TDD) 프로세스를 나타내는 그림이다. (가)에 들어갈 용어는 무엇인가?\n```\n시작 → 실패하는 테스트 작성 → 테스트를 통과하는 코드 작성 → 종료\n'테스트를 통과하는 코드 작성'에서 '코드 개선 필요' 시 (가) 로 이동한 뒤 다시 '테스트를 통과하는 코드 작성'으로 돌아옴\n'테스트를 통과하는 코드 작성'에서 '더 많은 테스트 필요' 시 '실패하는 테스트 작성'으로 돌아옴\n```","options":["재구성(Restructuring)","리팩토링(Refactoring)","재공학(Reengineering)","역공학(Reverse engineering)"],"explanation":"(가)에는 리팩토링이 들어간다. TDD 프로세스는 시작 → 실패하는 테스트 작성 → 테스트를 통과하는 코드 작성 → (코드 개선 필요 시) 리팩토링 → 종료로 구성된다.","explSource":"book","answer":1},{"id":"csts-exercise-120-2-51","part":"exercise","chapter":6,"qtype":"mc","dupKey":"리팩토링을수행한후에수행하는테스트는?","question":"리팩토링을 수행한 후에 수행하는 테스트는?","options":["리그레션 테스트(Regression test)","재테스트(Retest)","인수 테스트((Acceptance test)","벤치마크 테스트(Benchmark test)"],"explanation":"코드의 내부구조를 개선하는 리팩토링 작업을 수행한 뒤에는 이 작업으로 인해 기존의 기능에 새로운 결함이 도입되었는지 검증해야 하므로 리그레션 테스트를 수행한다.","explSource":"book","answer":0},{"id":"csts-exercise-120-3-52","part":"exercise","chapter":6,"qtype":"mc","dupKey":"소프트웨어생명주기모델인순차적모델과테스트에관한설명중올바른것은무엇인가?","question":"소프트웨어 생명 주기 모델인 순차적 모델과 테스트에 관한 설명 중 올바른 것은 무엇인가?","options":["폭포수 모델은 개발 완료 후 발견된 결함의 수정 비용과 시간이 적게 소요된다.","V-모델에서 테스트 활동은 개발이 종료됨과 동시에 시작된다.","V-모델에서 개발 산출물에 대한 동적 테스트가 수행된다.","폭포수 모델은 테스트를 하나의 개발 단계로만 간주한다."],"explanation":"① 폭포수 모델은 개발이 거의 완료될 무렵에 결함을 발견하여 수정할 때 비용과 시간이 훨씬 많이 든다. ② V-모델에서 테스트 활동은 개발이 시작됨과 동시에 시작된다. ③ V-모델에서 개발 산출물에 대한 정적 테스트가 수행된다. ④ 폭포수 모델은 기본적으로 테스트 작업을 코딩 단계 후의 한 단계로만 취급한다.","explSource":"book","answer":3},{"id":"csts-exercise-120-4-53","part":"exercise","chapter":6,"qtype":"short","dupKey":"다음에서설명하는용어는무엇인가?```•개발자관점의검증(Verification)과사용자관점의확인(Validation)을기반으로한개발모델•소프트웨어개","question":"다음에서 설명하는 용어는 무엇인가?\n```\n• 개발자 관점의 검증(Verification)과 사용자 관점의 확인(Validation)을 기반으로 한 개발 모델\n• 소프트웨어 개발방법론 중 폭포수 개발모델(Waterfall)에 근간을 두고 있는 모델\n• 소프트웨어 개발 단계별 테스트 유형이 대응하여 정의됨\n  (요구사항↔인수 테스트, 요구사항 분석↔시스템 테스트, 구조설계↔통합 테스트, 상세설계↔단위 테스트)\n```","options":[],"explanation":"V&V모델(브이모델)에 대한 설명이다.","explSource":"book","answerText":"V&V모델, 브이모델"},{"id":"csts-exercise-121-5-54","part":"exercise","chapter":6,"qtype":"mc","dupKey":"아래의V-모델에서빈칸에들어갈알맞은용어를적절하게나열한것은무엇인가?[그림:V-모델.좌측하향화살표(가),좌측에요구사항→요구사항분석→구조설계→상세설계→","question":"아래의 V-모델에서 빈칸에 들어갈 알맞은 용어를 적절하게 나열한 것은 무엇인가?\n[그림: V-모델. 좌측 하향 화살표 (가), 좌측에 요구사항 → 요구사항 분석 → 구조 설계 → 상세 설계 → 코딩 순서로 배치. 우측 상향 화살표(테스트 실행)와 함께 코딩 쪽에서부터 (나) → (다) → (라) → 인수 테스트 순으로 배치되고 우측 맨 위에 STLC 표기. 좌측에 \"테스트 계획, 테스트 분석 및 설계\" 표기]","options":["(가) 단위 테스트, (나) 시스템 테스트, (다) 통합 테스트, (라) SDLC","(가) 단위 테스트, (나) 통합 테스트 (라) 시스템 테스트, (라) SDLC","(가) SDLC, (나) 단위 테스트, (다) 통합 테스트, (라) 시스템 테스트","(가) SDLC, (나) 단위 테스트, (다) 디버깅, (라) 시스템 테스트"],"explanation":"(가) SDLC, (나) 단위 테스트, (다) 통합 테스트, (라) 시스템 테스트이며, 우측 상향은 단위 테스트 → 통합 테스트 → 시스템 테스트 → 인수 테스트(STLC) 순이다.","explSource":"book","answer":2},{"id":"csts-exercise-121-6-55","part":"exercise","chapter":6,"qtype":"mc","dupKey":"다음중애자일선언(AgileManifesto)과가장거리가먼것은?","question":"다음 중 애자일 선언(Agile Manifesto)과 가장 거리가 먼 것은?","options":["사람 및 상호 의사 교환이 프로세스나 도구보다 우선한다.","동작하는 소프트웨어가 포괄적인 문서보다 우선한다.","고객과의 계약이 무엇보다 우선한다.","변화에 반응하는 것이 계획을 따르는 것보다 우선한다."],"explanation":"① 사람 및 상호 의사 교환이 프로세스나 도구보다 우선한다. ② 동작하는 소프트웨어가 포괄하는 문서보다 우선한다. ③ 고객과의 협력이 계약 협상보다 우선한다. ④ 변화에 반응하는 것이 계획을 따르는 것보다 우선한다.","explSource":"book","answer":2},{"id":"csts-exercise-122-7-56","part":"exercise","chapter":0,"qtype":"ox","dupKey":"테스트주도개발(Test-DrivenDevelopment)인TDD는테스트되는실제프로그램의코드를먼저작성하고프로그램에대한테스트케이스를나중에작성하는방식","question":"테스트 주도 개발(Test-Driven Development)인 TDD는 테스트 되는 실제 프로그램의 코드를 먼저 작성하고 프로그램에 대한 테스트 케이스를 나중에 작성하는 방식이다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 주도 개발(Test-Driven Development)인 TDD는 프로그램에 대한 테스트 케이스를 먼저 작성하고, 이 테스트 케이스로 테스트 되는 실제 프로그램의 코드를 나중에 작성하는 방식이다.","explSource":"book","answer":1},{"id":"csts-exercise-122-8-57","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음소프트웨어생명주기모형중진화적개발모델에대한설명으로가장올바른것은?","question":"다음 소프트웨어 생명 주기 모형 중 진화적 개발 모델에 대한 설명으로 가장 올바른 것은?","options":["요구사항이 프로젝트 시작부터 명확하게 정의된 프로젝트에 적합한 개발 모델이다.","시스템의 모든 구성 요소를 한꺼번에 개발 완료하는 방식이다.","폭포수 모델보다 프로젝트 관리가 용이하여 보다 큰 차세대 프로젝트에 적합한 개발 모델이다.","사이클마다 리스크 분석이 수행되므로 발생하는 문제점을 해결할 방안을 마련할 수 있다."],"explanation":"④ 요구사항이 불명확할 때 사용하기 적합한 개발 모델로 시스템 구성 요소를 조금씩 개발 반복적으로 수행하여 프로젝트를 진행하는 방식으로 대규모 프로젝트에 적합하다. 매 단계 테스트가 수행되므로 많은 문제점을 해결할 기회를 가질 수 있다.","explSource":"book","answer":3},{"id":"csts-exercise-122-9-58","part":"exercise","chapter":0,"qtype":"ox","dupKey":"폭포수모델과같은순차적개발모델은매단계에서적정한테스트가이루어지므로고객의주요요구사항에대해우선프로토타입을개발하고사용자평가및테스트를거쳐다음개발주기를시작한","question":"폭포수 모델과 같은 순차적 개발 모델은 매 단계에서 적정한 테스트가 이루어지므로 고객의 주요 요구사항에 대해 우선 프로토타입을 개발하고 사용자 평가 및 테스트를 거쳐 다음 개발 주기를 시작한다.","options":["O (맞다)","X (틀리다)"],"explanation":"진화적 개발 모델에 대한 설명이다. 진화적 개발 모델은 이터레이션(Iteration)과 점진적(Incremental) 개발 원칙에 바탕을 두고 있다. 나선형 모델의 일반적인 방법은 기술적으로 어렵거나 고객의 비즈니스 가치를 최상으로 만드는 요구사항들에 대해 우선 프로토타입을 개발하고, 프로토타입에 대한 테스트 및 사용자의 평가를 거쳐 다음 개발 주기를 시작한다.","explSource":"book","answer":1},{"id":"csts-exercise-122-10-59","part":"exercise","chapter":0,"qtype":"ox","dupKey":"소프트웨어생명주기모델중애자일(Agile)개발모델은프로세스와문서위주의방법론으로요구사항의변경이빈번하게발생하는경우에적합한방법이다.","question":"소프트웨어 생명 주기 모델 중 애자일(Agile) 개발 모델은 프로세스와 문서 위주의 방법론으로 요구사항의 변경이 빈번하게 발생하는 경우에 적합한 방법이다.","options":["O (맞다)","X (틀리다)"],"explanation":"프로세스와 문서 위주의 방법론은 순차적 개발모델이다.","explSource":"book","answer":1},{"id":"csts-exercise-137-1-60","part":"exercise","chapter":7,"qtype":"mc","dupKey":"다음중정적분석도구의용도로적합하지않은경우는?","question":"다음 중 정적 분석 도구의 용도로 적합하지 않은 경우는?","options":["사이클로매틱 복잡도 계산","코딩 표준 준수 검사","사용하지 않은 변수 검출","테스트 케이스 커버리지 측정"],"explanation":"④ 동적 분석 도구","explSource":"book","answer":3},{"id":"csts-exercise-137-2-61","part":"exercise","chapter":7,"qtype":"mc","dupKey":"다음중테스트관리도구의목적이아닌것은?","question":"다음 중 테스트 관리 도구의 목적이 아닌 것은?","options":["테스트 계획, 노력 추정, 테스트 일정과 관련된 작업 수행","요구사항과 테스트 케이스 추적성 관리","테스트 진행과 보고","모델이나 소스 코드로부터 테스트 케이스 생성"],"explanation":"④ 테스트 설계 도구","explSource":"book","answer":3},{"id":"csts-exercise-137-3-62","part":"exercise","chapter":7,"qtype":"short","dupKey":"다음은테스트도구를선정하는프로세스의한단계에대한설명이다.()에알맞은용어는?```도구의시험판버전을사용하거나()를수행하여도구의품질을평가한다.또한도구의문","question":"다음은 테스트 도구를 선정하는 프로세스의 한 단계에 대한 설명이다. (   )에 알맞은 용어는?\n```\n도구의 시험판 버전을 사용하거나 (   )를 수행하여 도구의 품질을 평가한다. 또한 도구의 문제점을 도출하고 해결방안을 검토한다.\n```\n[그림: 테스트 도구 선정 프로세스 - 요구사항 정의 → 도구 조사 → 도구 평가 → 파일럿 프로젝트 → 도구 선정 → 도구 도입]","options":[],"explanation":"도구 평가 이후 단계로 시험판 버전 사용 또는 파일럿 프로젝트를 수행하여 도구의 품질을 평가한다.","explSource":"book","answerText":"파일럿 프로젝트"},{"id":"csts-exercise-138-4-63","part":"exercise","chapter":7,"qtype":"mc","dupKey":"테스트자동화에대한설명으로올바르지않은것은?","question":"테스트 자동화에 대한 설명으로 올바르지 않은 것은?","options":["많은 경우 테스트에 소요되는 수행시간을 줄일 수 있다.","적은 비용으로 테스트 환경을 구축할 수 있다.","테스트 환경의 다양화로 테스트 커버리지를 확대할 수 있다.","테스트 실행 및 결과 확인 과정에서 사람의 실수를 줄일 수 있다."],"explanation":"② 테스트 도구 구매 및 개발 비용, 테스트 스크립트 개발 비용, 테스트 엔지니어 훈련 비용 등 프로젝트 초반에 테스트 자동화를 위해 상당한 투자 비용이 발생한다.","explSource":"book","answer":1},{"id":"csts-exercise-138-5-64","part":"exercise","chapter":7,"qtype":"mc","dupKey":"다음테스트자동화프레임워크필요성에대한설명으로올바르지않은것은?","question":"다음 테스트 자동화 프레임워크 필요성에 대한 설명으로 올바르지 않은 것은?","options":["테스트 대상 시스템에 대한 의존도 최대화","테스트 케이스 중복 최소화","테스트 스위트(Test Suite)의 효율적 구성 및 관리","테스트 수행 및 결과의 저장 및 관리(DB화)"],"explanation":"테스트 대상 시스템에 대한 의존도 최소화를 해야 한다.","explSource":"book","answer":0},{"id":"csts-exercise-138-6-65","part":"exercise","chapter":7,"qtype":"mc","dupKey":"다음중SEARCH모델의테스트자동화구성요소로올바르지않은것은?","question":"다음 중 SEARCH 모델의 테스트 자동화 구성 요소로 올바르지 않은 것은?","options":["Analysis (분석)","Execution (실행)","Setup (셋업)","Retest (재테스트)"],"explanation":"SEARCH 모델: Setup(셋업) → Execution(실행) → Analysis(분석) → Report(보고) → Cleanup(정리) → Help(도움말)","explSource":"book","answer":3},{"id":"csts-exercise-139-7-66","part":"exercise","chapter":7,"qtype":"mc","dupKey":"테스트실행프레임워크를지원하는스크립팅언어수준에따라다음과같이분류할수있다.다음중프레임워크에대한설명으로올바른것은?","question":"테스트 실행 프레임워크를 지원하는 스크립팅 언어 수준에 따라 다음과 같이 분류할 수 있다. 다음 중 프레임워크에 대한 설명으로 올바른 것은?","options":["테스트 주도(Test-Driven) 프레임워크: Record & PlayBack을 지원하는 도구에서 주로 볼 수 있다.","데이터 주도(Data-Driven) 프레임워크: 키워드를 사용한 테스트 케이스를 이용하여 애플리케이션 간에 결합을 줄여준다.","선형(Linear) 프레임워크: 테스트 데이터 셋을 하드 코딩하지 않고 CSV 파일 등에 보관하여 전달하면 테스트 효율을 높일 수 있다.","모듈 기반(Module Based) 프레임워크: 하나의 큰 스크립트를 유지가 용이한 여러 개의 작은 스크립트로 분할하여 관리할 수 있다."],"explanation":"①는 선형(Linear) 프레임워크에 대한 설명이다. 스크립트를 작성하는 가장 간단한 형태이다. 모듈과 같은 스크립트를 구조화하는 수단을 제공하지 않으며 스크립트의 테스트 단계들을 순차적인 흐름으로 실행한다. 이는 Record&Playback을 지원하는 도구에서 주로 찾아볼 수 있다. ②은 키워드 주도(Keyword-Driven) 프레임워크에 대한 설명이다. ③은 데이터 주도(Data-Driven) 프레임워크에 대한 설명이다. 테스트에 사용되는 데이터를 테스트 스크립트의 로직과 분리하여 보관하는 프레임워크이다.","explSource":"book","answer":3},{"id":"csts-exercise-139-8-67","part":"exercise","chapter":7,"qtype":"ox","dupKey":"테스트케이스를컴퓨터가실행할수있는스크립트로변환하는방법중Record&Playback방식이있다.","question":"테스트 케이스를 컴퓨터가 실행할 수 있는 스크립트로 변환하는 방법 중 Record & Playback 방식이 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 케이스를 컴퓨터가 실행할 수 있는 스크립트로 변환하는 방법 중에서 대표적인 것이 Record&Playback 방식이다. 옳은 내용이다. 이 방식을 지원하는 도구는 사용자가 브라우저 등을 통해 시스템을 사용하는 행위와 시스템 반응을 스크립트로 기록하고 이를 다시 반복 실행할 수 있도록 한다. 따라서 도구 사용자가 테스트 스크립트 언어에 관한 특별한 지식이 없어도 테스트 케이스를 설계하여 실행할 수 있다. Katalon Studio는 Record&Playback 기능을 제공하는 도구이다.","explSource":"book","answer":0},{"id":"csts-exercise-139-9-68","part":"exercise","chapter":7,"qtype":"mc","dupKey":"다음중테스트자동화도구로가장거리가먼것은?","question":"다음 중 테스트 자동화 도구로 가장 거리가 먼 것은?","options":["GUI 테스트 실행 도구(Selenium, Robotium)","소스 코드 빌드 도구(CMake, bitbake)","테스트 관리 도구(Jenkins, Redmine)","형상 관리 도구(Git, Subversion)"],"explanation":"② 빌드 도구는 테스트 자동화 도구로 보기 어렵다. (빌드 규칙을 서술한 텍스트 파일에 테스트 모듈을 포함하거나 수행하도록 기술하기는 하지만, 빌드 도구 자체가 테스트 자동화 도구로 보기는 어려움)","explSource":"book","answer":1},{"id":"csts-exercise-140-10-69","part":"exercise","chapter":0,"qtype":"short","dupKey":"이슈관리도구를이용하여프로젝트에서검출되는결함을관리하려고한다.결함이식별되고완료되기까지의이슈상태를추적하기위해다음보기를충족하는결함의생명주기를설계하고이를","question":"이슈 관리 도구를 이용하여 프로젝트에서 검출되는 결함을 관리하려고 한다. 결함이 식별되고 완료되기까지의 이슈 상태를 추적하기 위해 다음 보기를 충족하는 결함의 생명 주기를 설계하고 이를 상태 전이 다이어그램으로 표현하시오. (서답형/상태 간 전이는 단방향 화살표로 표현)\n```\n• 테스터는 테스트를 수행하여 결함을 식별하고, 결함에 관련된 정보를 기록한 이슈를 \"Open\" 상태로 등록한다.\n• \"Open\" 또는 \"Re-open\" 상태의 이슈는 개발자에게 할당되며, 개발자는 이슈의 상태를 \"In progress\"으로 변경한 후 분석 활동을 수행한다.\n• 개발자는 소스 코드를 수정하고, 개발자 테스트를 수행하여 결함이 해결되었다고 판단한 후 테스터에게 재테스트를 요청하면서 이슈 상태를 \"Resolved\"로 변경한다.\n• 테스터는 실제 결함이 해결되었는지 테스트하여 확인한다.\n• 테스터는 재테스트를 수행한 후 보고된 결함이 제거되었다면 이슈의 상태를 \"Closed\"로 변경하고, 기존 결함이 여전히 발견된다면 이슈의 상태를 \"In progress\"으로 변경한 후 개발자에게 해결을 지시한다.\n• 테스터는 \"Closed\" 상태의 이슈에 대해 동일한 결함이 재발되는 것을 확인하면 해당 이슈를 \"Re-open\" 상태로 변경한다.\n```","options":[],"explanation":"일반적으로 이슈 관리 도구(예: Jira)는 원활한 이슈 트래킹을 위하여 이슈 상태를 변경함으로써 이슈의 생명 주기를 관리한다. 본 문제에서는 테스터에 의한 신규 결함 보고(Open)부터, 개발자에게 할당(In Progress), 해결(Resolved), 최종 완료(Closed) 그리고 리그레션이 발생으로 인한 결함 보고(Re-open)에 이르는 이슈 생명 주기를 설계할 수 있는 역량이 있는지 점검한다.","explSource":"book","answerText":"시작 → Open → In progress → Resolved → Closed 순으로 전이하며, Closed 상태에서 동일 결함이 재발하면 Re-open으로, Re-open에서는 다시 In progress로 전이하는 상태 전이 다이어그램"},{"id":"csts-exercise-162-1-70","part":"exercise","chapter":8,"qtype":"ox","dupKey":"요구사항분석서,설계서,코드,테스트관련문서등소프트웨어개발관련모든문서와산출물이리뷰대상이될수있다.","question":"요구사항 분석서, 설계서, 코드, 테스트 관련 문서 등 소프트웨어 개발 관련 모든 문서와 산출물이 리뷰 대상이 될 수 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"리뷰 대상이 되는 작업물은 프로그램에 한정되지 않고 소프트웨어 개발 중에 생성되는 모든 산출물이다. 즉, 요구사항 명세서, 설계 명세서, 테스트 계획서와 같은 문서들이 올바르게 작성되었는지를 판단하기 위해 리뷰 방법을 이용할 수 있다.","explSource":"book","answer":0},{"id":"csts-exercise-162-2-71","part":"exercise","chapter":8,"qtype":"mc","dupKey":"다음중감사(Audit)의목적을가장잘설명한것은?","question":"다음 중 감사(Audit)의 목적을 가장 잘 설명한 것은?","options":["대상 작업물이 계획, 법규, 표준이나 명세를 충실히 지키는지를 평가한다.","소프트웨어 제품 및 프로세스가 규제, 표준, 가이드라인, 계획, 절차를 준수하고 있는지 평가한다.","개발자가 작성한 소스코드가 코딩표준 또는 코딩 지침에 맞게 작성되었는지 검토한다.","현재 계획에 따라 진행 상황을 모니터하여 계획과 일정 상태를 평가하여 필요하다면 자원, 일정이나 프로젝트 범위 등을 변경한다."],"explanation":"감사(Audit)의 목적은 소프트웨어 제품 및 프로세스가 규제, 표준, 가이드라인, 계획, 절차를 준수하고 있는지를 독립적으로 평가하는 것이다. (IEEE 1028-2008)","explSource":"book","answer":1},{"id":"csts-exercise-162-3-72","part":"exercise","chapter":8,"qtype":"ox","dupKey":"기술리뷰는관리자직책을담당하는사람이팀의멤버로참여하는것을금지하고있다.","question":"기술 리뷰는 관리자 직책을 담당하는 사람이 팀의 멤버로 참여하는 것을 금지하고 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"기술 리뷰는 대표 엔지니어(Lead engineer)가 주재를 하며 경우에 따라 관리자가 해결해야 할 이슈가 있으면 관리자도 참가할 수 있다.","explSource":"book","answer":1},{"id":"csts-exercise-162-4-73","part":"exercise","chapter":8,"qtype":"mc","dupKey":"정적분석을통해식별할수있는결함유형과거리가먼것은?","question":"정적 분석을 통해 식별할 수 있는 결함 유형과 거리가 먼 것은?","options":["초기화하지 않고 사용한 변수","선언 후 사용하지 않은 함수","선언 후 사용하지 않은 변수","요구사항과 다른 연산 결과"],"explanation":"도구의 지원을 받아 정적테스트를 수행하는 것을 정적 분석이라고 한다. 정적분석으로 식별할 수 있는 결함은 초기화하지 않고 사용한 변수, 선언 후 사용하지 않은 함수, 선언 후 사용하지 않은 변수 등이다.","explSource":"book","answer":3},{"id":"csts-exercise-163-5-74","part":"exercise","chapter":8,"qtype":"ox","dupKey":"다음프로그램코드는K&R코딩스타일을따른다.```if(x==1){프로그램문장;}```","question":"다음 프로그램 코드는 K&R 코딩 스타일을 따른다.\n```\nif (x == 1){\n    프로그램 문장;\n}\n```","options":["O (맞다)","X (틀리다)"],"explanation":"중괄호의 위치에 따른 코딩 스타일에는 대표적으로 BSD, K&R, GNU 3가지가 있다. BSD는 블록을 if 문 아래에 작성하고 들여쓰기를 하지만 중괄호는 들여쓰기를 하지 않는다. K&R은 블록의 여는 중괄호를 if와 같은 행에 배치한다. GNU는 블록을 if 문 아래에 작성하고 들여쓰기를 한다. K&R은 여는 블록을 if와 같은 행에 배치한다. 코드 줄 수를 절약하여 한눈에 많은 코드를 볼 수 있고 수평으로 많은 코드를 작성할 수 있다.","explSource":"book","answer":0},{"id":"csts-exercise-164-6-75","part":"exercise","chapter":0,"qtype":"short","dupKey":"다음의자료흐름도에서변수x에대한오류패턴을하나만적으시오.[그림:자료흐름도.defx→usex/killy→usex/defz→usey/usez→killx","question":"다음의 자료 흐름도에서 변수 x에 대한 오류 패턴을 하나만 적으시오.\n[그림: 자료 흐름도. def x → use x / kill y → use x / def z → use y / use z → kill x / def z → kill x / def z. 또한 use x / kill y 에서 use x / def z 로 가는 우회 간선과, use y / use z 에서 마지막 kill x / def z 로 가는 우회 간선이 있음]","options":[],"explanation":"위의 자료 흐름도의 최대 기본 경로에 대한 자료 흐름 패턴은 다음과 같다. x 열: ~d, du, uu, -, uk, kk / y 열: -, ~k, -, ku(u~), -, - / z 열: -, -, ~d, du, ud, dd. 변수 x의 오류 패턴은 kk이다.","explSource":"book","answerText":"kk"},{"id":"csts-exercise-0-7-76","part":"exercise","chapter":8,"qtype":"mc","dupKey":"다음프로그램에대해자료흐름분석을수행하여검출되는자료패턴중에서잠재적오류인패턴은무엇인가?```intfoo(intx){1inty;2if(x==1)3y=x","question":"다음 프로그램에 대해 자료흐름 분석을 수행하여 검출되는 자료 패턴 중에서 잠재적 오류인 패턴은 무엇인가?\n```\n    int foo(int x) {\n1       int y;\n2       if (x==1)\n3           y=x+1;\n4       x=10;\n5       return y;\n6       y=10;\n7   }\n```","options":["~u","du","uu","~k"],"explanation":"변수 x가 정의되지 않고 사용되었다. (No.1 y: ~u(잠재적 결함), No.5 y: dk(잠재적 결함), No.7 x·y: d~(잠재적 결함))","explSource":"book","answer":0},{"id":"csts-exercise-0-8-77","part":"exercise","chapter":8,"qtype":"mc","dupKey":"리뷰(Review,검토)를성공시키기위해필요한요소로가장거리가먼것은?","question":"리뷰(Review, 검토)를 성공시키기 위해 필요한 요소로 가장 거리가 먼 것은?","options":["리뷰 주재자가 리뷰 기법에 대한 교육을 이수한 경우, 리뷰 참석자는 별도의 교육이 필요하지 않다.","소프트웨어 개발 산출물과 검토자의 수준 등을 고려하여 리뷰 기법을 적절히 적용해야 한다.","결함의 발견에 부정적이지 않으며, 발견된 결함은 객관적으로 표현되어야 한다.","효과적이고 효율적인 결함 발견을 위해 필요 시 체크리스트를 활용할 수 있다."],"explanation":"① 리뷰 참석자는 리뷰 기법에 대한 교육 훈련이 제공되어야 하며, 주재자는 별도의 교육을 필수로 이수해야 한다.","explSource":"book","answer":0},{"id":"csts-exercise-0-9-78","part":"exercise","chapter":8,"qtype":"mc","dupKey":"다음중테스트실행에대한설명으로올바른것은?","question":"다음 중 테스트 실행에 대한 설명으로 올바른 것은?","options":["테스트를 실행하는 주체는 테스트 단계(레벨)에 따라서 달라질 수 있다.","컴포넌트 테스트는 사용자가 직접 실행시키는 것이 일반적이다.","인수 테스트는 원칙적으로 운영 환경에서 개발자에 의해 실행된다.","통합 테스트는 개발 환경에서 시스템 테스트 완료 후에 수행한다."],"explanation":"② 컴포넌트 테스트는 개발자가 직접 실행시키는 것이 일반적이다. ③ 인수 테스트는 원칙적으로 사용자의 환경에서 사용자에 의해서 실행이 된다. ④ 통합 테스트는 개발 환경에서 컴포넌트 테스트 후에 수행한다.","explSource":"book","answer":0},{"id":"csts-exercise-0-10-79","part":"exercise","chapter":8,"qtype":"mc","dupKey":"인스펙션(Inspection)을도입하여프로그램을개발하는경우나타나는특징으로올바르지않은것은?","question":"인스펙션(Inspection)을 도입하여 프로그램을 개발하는 경우 나타나는 특징으로 올바르지 않은 것은?","options":["결과적으로 품질에 투입되는 비용이 감소하며 개발 기간이 단축된다.","코딩 전까지는 일반적인 개발보다 소요 인력이 더 많이 필요할 수 있다.","초기 프로젝트 비용이 증가하지만, 개발 단계의 재작업과 투입 인력이 감소한다.","코딩이 시작되면서 투입 인력 수요가 급증하고 테스팅 단계에서 최고치가 된다."],"explanation":"④ 인스펙션을 적용하지 않은 일반적인 개발에서 코딩이 시작되면서 투입 인력 수요가 급증하며, 테스팅 단계에서 절정을 이루게 된다.","explSource":"book","answer":3},{"id":"csts-exercise-193-1-80","part":"exercise","chapter":9,"qtype":"mc","dupKey":"다음보기중에서구조기반테스팅의커버리지기준으로사용되는것은?(가)프로그램의모든문장을최소한한번은실행해야한다.(나)프로그램의모든분기가최소한한번은실행해야한","question":"다음 보기 중에서 구조 기반 테스팅의 커버리지 기준으로 사용되는 것은?\n(가) 프로그램의 모든 문장을 최소한 한 번은 실행해야 한다.\n(나) 프로그램의 모든 분기가 최소한 한 번은 실행해야 한다.\n(다) 프로그램의 모든 기본 경로가 최소한 한 번은 실행해야 한다.\n(라) 프로그램의 모든 상태를 최소한 한 번은 실행하여야 한다.","options":["(가), (나), (다)","(나), (다), (라)","(가), (다)","(나), (라)"],"explanation":"(가) 문장 커버리지 (나) 분기 커버리지 (다) 기본경로 커버리지","explSource":"book","answer":0},{"id":"csts-exercise-193-2-81","part":"exercise","chapter":9,"qtype":"mc","dupKey":"다음프로그램에대하여100(%)문장커버리지를만족하는테스트데이터는무엇인가?(※단,shortcircuitevaluation은없다고가정한다)```IF(","question":"다음 프로그램에 대하여 100(%) 문장 커버리지를 만족하는 테스트 데이터는 무엇인가? (※단, short circuit evaluation은 없다고 가정한다)\n```\nIF (( X > 1 ) AND ( Y == 1 ))\nZ = Z / X\nEND\nIF (( X == 2 ) OR ( Z > 1 ))\nZ = Z + 1\nEND\n```","options":["X=5, Y=1, Z=10","X=1, Y=1, Z=2","X=2, Y=2, Z=5","X=3, Y=1, Z=0"],"explanation":"모든 문장을 1회 이상 수행하면 100% 문장 커버리지를 만족한다. ① (X=5, Y=1, Z=10)의 경우 두 조건문이 모두 참이 되어 모든 문장을 수행한다.","explSource":"book","answer":0},{"id":"csts-exercise-194-3-82","part":"exercise","chapter":9,"qtype":"short","dupKey":"아래와같은제어흐름도를갖는프로그램이있다.A,C,F,H의경로로테스트를수행했을때,문장커버리지는얼마인가?(※단,소수점첫째자리에서반올림)(제어흐름도:A에","question":"아래와 같은 제어 흐름도를 갖는 프로그램이 있다. A, C, F, H의 경로로 테스트를 수행했을 때, 문장 커버리지는 얼마인가? (※단, 소수점 첫째 자리에서 반올림)\n(제어 흐름도: A에서 B와 C로 분기, B에서 D와 E로 분기, C에서 F로, D와 E에서 G로, G와 F에서 H로 합류)","options":[],"explanation":"문장 커버리지 = (테스트 케이스 집합에 의해 실행된 문장의 수 / 전체 실행 가능한 프로그램 문장의 수) × 100. 전체 문장 8개(A, B, C, D, E, F, G, H)중 4개(A, C, F, H)를 지나가게 되므로 문장 커버리지는 50%이다.","explSource":"book","answerText":"50%"},{"id":"csts-exercise-194-4-83","part":"exercise","chapter":9,"qtype":"mc","dupKey":"다음명세와이를구현한프로그램에대해올바르지않은것은?명세:함수foo는입력x와z또는y와z가양수이거나x,y값에상관없이z가10보다크면10을반환한다.그외의경","question":"다음 명세와 이를 구현한 프로그램에 대해 올바르지 않은 것은?\n명세: 함수 foo는 입력 x와 z 또는 y와 z가 양수이거나 x, y 값에 상관없이 z가 10보다 크면 10을 반환한다. 그 외의 경우는 0을 반환한다.\n```\nint foo(int x, int y, int z) {\n        int w=0;\n        if (x>0 || y>0)\n            z=z-10;\n        if (z>10)\n            w=10;\n        return w;\n}\n```","options":["z=z-10을 z=z+10으로 수정하여야 한다.","x=-10, y=10, z=30은 결함을 검출할 수 있다.","x=-10, y=10, z=30은 100% 문장 커버리지를 만족한다.","x=-10, y=-10, z=30은 결함을 검출할 수 없다."],"explanation":"② x=-10, y=10, z=30은 결함을 검출할 수 없다.","explSource":"book","answer":1},{"id":"csts-exercise-195-5-84","part":"exercise","chapter":9,"qtype":"short","dupKey":"다음의제어흐름도를이용하여결정커버리지를100(%)달성하고자할때,테스트케이스최소개수를기술하시오.(제어흐름도:A→판단B에서C,D,E세갈래로분기→모두F","question":"다음의 제어 흐름도를 이용하여 결정 커버리지를 100(%) 달성하고자 할 때, 테스트 케이스 최소 개수를 기술하시오.\n(제어 흐름도: A → 판단 B에서 C, D, E 세 갈래로 분기 → 모두 F로 합류)","options":[],"explanation":"결정 커버리지 = (테스트 케이스 집합에 의해 실행된 결정의 결과 수 / 전체 프로그램 결정의 결과 수) × 100. 주어진 제어흐름도에서 전체 프로그램의 결정 결과가 3개(B→C, B→D, B→E)이므로 결정 커버리지를 100% 달성하려면 최소 3개의 테스트 케이스가 필요하다.","explSource":"book","answerText":"3개"},{"id":"csts-exercise-195-6-85","part":"exercise","chapter":9,"qtype":"short","dupKey":"다음프로그램을테스트하기위한테스트케이스가다음과같이3개가있다.조건커버리지를100(%)만족하는최소개수의테스트케이스를구하고자할때,사용하지않아도되는테스트","question":"다음 프로그램을 테스트하기 위한 테스트 케이스가 다음과 같이 3개가 있다. 조건 커버리지를 100(%) 만족하는 최소 개수의 테스트 케이스를 구하고자 할 때, 사용하지 않아도 되는 테스트 케이스는 무엇인지 기술하시오.\n```\nIF ((X>1) AND (Y==1))\n    Z=Z/X\nEND\nIF ((X==2) OR (Z>1))\n    Z=Z+1\nEND\n\n[테스트 케이스]\nTC1 : (X=1, Y=2, Z=2)\nTC2 : (X=2, Y=1, Z=6)\nTC3 : (X=0, Y=0, Z=1)\n```","options":[],"explanation":"TC2와 TC3만으로도 모든 기본조건의 T, F를 만족한다. 따라서, TC1을 사용하지 않더라도 100%의 조건 커버리지를 만족할 수 있다.","explSource":"book","answerText":"TC1"},{"id":"csts-exercise-196-7-86","part":"exercise","chapter":9,"qtype":"mc","dupKey":"다음프로그램에대하여(X=15,Y=2,Z=0),(X=10,Y=20,Z=0)의테스트케이스를실행하였을때,조건/분기커버리지는몇%인가?(※단,소수점첫째자","question":"다음 프로그램에 대하여 (X=15, Y=2, Z=0), (X=10, Y=20, Z=0)의 테스트 케이스를 실행하였을 때, 조건/분기 커버리지는 몇 %인가? (※단, 소수점 첫째 자리에서 반올림)\n```\nIF ((X > 10) OR (Y == 2))\n    Z = X + Y\nIF ((X < Z) AND (Y > 15))\n    Z = X\nIF (X <= Z)\n    PRINT(Z)\n```","options":["64%","75%","93%","100%"],"explanation":"결정/조건 커버리지 = (테스트 케이스 집합에 의해 실행된 결정조건의 결과 수 / 전체 프로그램 결정조건의 결과 수) × 100 = 13/14 × 100 = 92.8","explSource":"book","answer":2},{"id":"csts-exercise-196-8-87","part":"exercise","chapter":9,"qtype":"short","dupKey":"다음은구조기반테스트커버리지에대한설명이다.어떤테스트커버리지에대한설명인지기재하시오.•각기본조건식및전체조건식의결괏값이참(True)과거짓(False)을","question":"다음은 구조기반 테스트 커버리지에 대한 설명이다. 어떤 테스트 커버리지에 대한 설명인지 기재하시오.\n• 각 기본 조건식 및 전체 조건식의 결괏값이 참(True)과 거짓(False)을 적어도 한 번 이상 실행시키는 것을 기준으로 하는 테스트 방법\n• 테스트 케이스 수트에 의해 실행된 전체 조건식과 기본 조건식이 몇 (%)인지 측정","options":[],"explanation":"결정/조건 커버리지에 대한 설명이다.","explSource":"book","answerText":"결정/조건 커버리지, 조건/분기 커버리지"},{"id":"csts-exercise-197-9-88","part":"exercise","chapter":9,"qtype":"short","dupKey":"다음은구조기반테스트에대한설명이다.어떤테스트에대한설명인지기재하시오.구조기반테스트커버리지중테스트강도가가장높으며,기본조건식의가능한논리적인조합이적어도한","question":"다음은 구조기반 테스트에 대한 설명이다. 어떤 테스트에 대한 설명인지 기재하시오.\n구조기반 테스트 커버리지 중 테스트 강도가 가장 높으며, 기본 조건식의 가능한 논리적인 조합이 적어도 한번 테스트 되도록 테스트 케이스를 도출하는 방법","options":[],"explanation":"다중 조건 테스트는 기본 조건식의 가능한 논리적 조합을 모두 테스트하는 방법으로 테스트 강도가 가장 높다.","explSource":"book","answerText":"다중 조건 (테스트)"},{"id":"csts-exercise-197-10-89","part":"exercise","chapter":9,"qtype":"short","dupKey":"다음의진리표를이용해변형조건/결정(MC/DC)테스트를하고자한다.변형조건/결정(MC/DC)커버리지를100%달성하는최소테스트케이스집합은?(테스트케이스","question":"다음의 진리표를 이용해 변형 조건/결정(MC/DC) 테스트를 하고자 한다. 변형 조건/결정(MC/DC) 커버리지를 100% 달성하는 최소 테스트 케이스 집합은? (테스트 케이스 ID를 모두 나열)\n```\n테스트 케이스 ID |  A  |  B  |  C  | A and B or C\n       1        |  T  |  T  |  T  |      T\n       2        |  T  |  T  |  F  |      T\n       3        |  T  |  F  |  T  |      T\n       4        |  T  |  F  |  F  |      F\n       5        |  F  |  T  |  T  |      T\n       6        |  F  |  T  |  F  |      F\n       7        |  F  |  F  |  T  |      T\n       8        |  F  |  F  |  F  |      F\n```","options":[],"explanation":"변형 조건/결정(MC/DC) 테스트는 개별 조건이 독립적으로 변경될 때 전체 결과에 영향을 미치는 케이스를 식별하고, 개별 조건 N개의 변경 조건/변경 커버리지(MC/DC) 케이스는 N+1개 필요하다. 개별 조건 3개: 3 + 1 = 4. 최소 테스트 케이스는 테스트 케이스 2: T, T, F (T) / 3: T, F, T (T) / 4: T, F, F (F) / 6: F, T, F (F)이다.","explSource":"book","answerText":"2, 3, 4, 6"},{"id":"csts-exercise-198-11-90","part":"exercise","chapter":9,"qtype":"mc","dupKey":"다음소스코드에대하여100%MC/DC커버리지를만족하는테스트케이스는무엇인가?```IF((score>90ANDperiod>2)ORmembership=","question":"다음 소스 코드에 대하여 100% MC/DC 커버리지를 만족하는 테스트 케이스는 무엇인가?\n```\nIF ((score>90 AND period>2) OR membership == 'gold')\n   fee = 15000\nELSE\n   fee = 25000\nEND\n```","options":["TC1(score=91, period=3, membership=basic), TC2(90, 3, gold), TC3(89, 3, basic), TC4(91, 2, basic)","TC1(score=91, period=3, membership=gold), TC2(90, 3, gold), TC3(89, 3, basic), TC4(91, 2, basic)","TC1(score=91, period=3, membership=basic), TC2(90, 3, gold), TC3(89, 3, basic), TC4(89, 2, basic)","TC1(score=91, period=3, membership=gold), TC2(90, 3, gold), TC3(89, 3, basic), TC4(89, 2, basic)"],"explanation":"MC/DC 100%를 만족하는 테스트 데이터(score, period, membership)는 (T, T, F), (F, T, T), (F, T, F), (T, F, F)이다.","explSource":"book","answer":0},{"id":"csts-exercise-199-12-91","part":"exercise","chapter":9,"qtype":"short","dupKey":"보기의코드를제어흐름도로작성하고,순환복잡도를구하시오.```intcomputeBill(inta){intb=0;if(a>120){if(a<=240)b","question":"보기의 코드를 제어 흐름도로 작성하고, 순환 복잡도를 구하시오.\n```\nint computeBill(int a)\n{\n    int b=0;\n    if (a>120)\n    {\n        if (a<=240)\n            b=(a-120)*2;\n        else\n        {\n            b=(a-240)*2;\n            if (b>=100) b=b*3;\n        }\n    }\n    return b;\n}\n```","options":[],"explanation":"[제어 흐름도] 시작 → b=0 → 판단 a>120 (F이면 Return b로) → T이면 판단 a<=240 (T이면 b=(a-120)*2 후 Return b, F이면 b=(a-240)*2) → 판단 b>=100 (T이면 b=b*3, F이면 그대로) → Return b → 종료. 순환 복잡도 = 분기문 + 1 = 3 + 1 = 4","explSource":"book","answerText":"순환 복잡도 = 분기문 + 1 = 3 + 1 = 4"},{"id":"csts-exercise-238-1-92","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음보기를읽고동등클래스분할기법으로테스트케이스를설계하였다.가장적절한테스트케이스는무엇인가?[보기]우리회사는다음과같은인력채용규정을따르고있다.21~23","question":"다음 보기를 읽고 동등 클래스 분할 기법으로 테스트 케이스를 설계하였다. 가장 적절한 테스트 케이스는 무엇인가?\n[보기] 우리 회사는 다음과 같은 인력 채용 규정을 따르고 있다. 21~23세까지는 Part-time으로만 채용 가능하고, 24~55세까지는 Full-time으로 채용이 가능하다. 20세 이하, 56세 이상은 채용이 불가능하다.","options":["{26, 30, 41, 52, 55}","{19, 22, 35, 57, null}","{19, 20, 21, 23, 24, 25, 54, 55, 56}","{19, 31, 32, 50, 51, 52}"],"explanation":"① 24세 이상 ~ 55세 이하 클래스에 해당하는 값으로만 이루어져 있음 ③ 경곗값 분석에 해당하는 테스트 케이스임 ④ 21세 이상 ~ 23세 이하, 56세 이상 클래스 값을 포함하지 않았고, 20세 이하, 24세 이상 ~ 55세 이하 값만 포함하고 있어 동등 클래스 분할 테스트 케이스로 적절하지 못함","explSource":"book","answer":1},{"id":"csts-exercise-238-2-93","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음의명세를동등분할테스트를수행하여테스트케이스를설계할때유효한출력에바탕을둔테스트입력은무엇인가?[보기]공연티켓을예매하는시스템에서티켓의수량을입력하는필드","question":"다음의 명세를 동등 분할 테스트를 수행하여 테스트 케이스를 설계할 때 유효한 출력에 바탕을 둔 테스트 입력은 무엇인가?\n[보기] 공연 티켓을 예매하는 시스템에서 티켓의 수량을 입력하는 필드가 있다. 한 사람이 한 번에 구매할 수 있는 수량은 1장에서 5장까지이다. 1보다 작거나 5보다 큰 숫자가 입력되거나 정수가 아닌 값이 입력되면 invalid input 메시지가 출력된다.","options":["입력 수량을 -5로 테스트한다.","입력 수량을 10으로 테스트한다.","입력 수량을 5.3으로 테스트한다.","①, ②, ③ 모두 유효한 출력에 바탕을 둔 테스트이다."],"explanation":"모두 유효한 출력인 invalid input 메시지가 출력되게 한다.","explSource":"book","answer":3},{"id":"csts-exercise-239-3-94","part":"exercise","chapter":10,"qtype":"short","dupKey":"다음은어떤애플리케이션프로그램의사용자인터페이스에대한설명이다.최소의eachchoice테스트케이스를구하라.단기대출력은기술하지않는다.[보기]사용자인터페","question":"다음은 어떤 애플리케이션 프로그램의 사용자 인터페이스에 대한 설명이다. 최소의 each choice 테스트 케이스를 구하라. 단 기대 출력은 기술하지 않는다.\n[보기] 사용자 인터페이스 윈도우에 3개의 항목(m1, m2, m3)을 가진 리스트 메뉴와 3개의 라디오 버튼(r1, r2, r3)이 있다. 라디오 버튼 r1과 r2는 동시에 같이 선택될 수 없으나 r1이나 r2 반드시 하나는 선택되어야 한다.","options":[],"explanation":"동등 클래스는 입력 인자별로 리스트 메뉴 M은 m1/m2/m3, 라디오 버튼 그룹(r1, r2)은 r1만 선택/r2만 선택, r3는 선택 안됨/r3 선택으로 나뉜다. 각 입력 인자의 분할된 클래스로부터 최소한 하나의 입력값이 테스트 케이스에 포함되도록 한다.","explSource":"book","answerText":"테스트 케이스 3개 — TC1(M=m1, r1만 선택, r3 선택 안됨), TC2(M=m2, r2만 선택, r3 선택), TC3(M=m3, r1만 선택, r3 선택), 기대출력은 기술하지 않음(−)"},{"id":"csts-exercise-239-4-95","part":"exercise","chapter":10,"qtype":"mc","dupKey":"입력인자(X)에대해10≤X≤30제약조건이있는시스템을개발중이다.개발자가실수로X≤30조건을누락하여10≤X로구현하였을때,다음중에서경계누락오류를찾을가능","question":"입력 인자(X)에 대해 10≤X≤30 제약조건이 있는 시스템을 개발 중이다. 개발자가 실수로 X≤30 조건을 누락하여 10≤X로 구현하였을 때, 다음 중에서 경계 누락 오류를 찾을 가능성이 가장 높은 테스트 입력값은 무엇인가?","options":["9","10","30","31"],"explanation":"31은 10≤X≤30에서는 외부의 점으로 간주하고 10≤X에서는 내부의 점으로 간주하기 때문에 다른 처리를 하게 되어 다른 출력을 낼 가능성이 크다.","explSource":"book","answer":3},{"id":"csts-exercise-239-5-96","part":"exercise","chapter":10,"qtype":"mc","dupKey":"한국기업이운영하는웹사이트에서비밀번호는알파벳과숫자를제외한특수부호가최소한1개이상5이하가들어가야한다.경곗값분석방법을사용하여비밀번호검사기능을테스트하려고","question":"한국기업이 운영하는 웹사이트에서 비밀번호는 알파벳과 숫자를 제외한 특수 부호가 최소한 1개 이상 5 이하가 들어가야 한다. 경곗값 분석 방법을 사용하여 비밀번호 검사 기능을 테스트하려고 할 때 테스트 입력으로 적절한 것은?\n[보기] (가) ab#$cde  (나) #$%@**  (다) ab%%@k  (라) abcde","options":["(가), (나), (다)","(가), (나), (라)","(나), (다), (라)","(가), (다), (라)"],"explanation":"경곗값 분석(Boundary Value Analysis)은 입력 영역 경계 근처에 있는 값들을 이용하여 테스트 케이스를 설계하는 테스트 방법이다. 주어진 조건에서 1과 5의 경계에 있는 값을 테스트하는 것이 적절하다. (가) 알파벳 5개, 특수부호 2개 (나) 특수부호 6개 (다) 알파벳 3개, 특수부호 3개 (라) 알파벳 5개","explSource":"book","answer":1},{"id":"csts-exercise-240-6-97","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음보기를읽고페어와이즈조합테스트기법으로테스트케이스를설계하였다.빈칸에들어가는테스트케이스는무엇인가?[보기]소프트웨어테스트를위한테스트환경을구축하고자한","question":"다음 보기를 읽고 페어와이즈 조합 테스트 기법으로 테스트 케이스를 설계하였다. 빈칸에 들어가는 테스트 케이스는 무엇인가?\n[보기] 소프트웨어 테스트를 위한 테스트 환경을 구축하고자 한다. 필요한 환경은 Windows 7, Windows 8, Windows 10의 3가지 운영체제와 admin 계정, user 계정이 필요하다. 또한, Internet Explorer 9, 10, 11의 3가지 브라우저 버전이 필요하다.\n[표: 운영체제 / 권한 / 브라우저]\nWin 10 / admin / IE 9\nWin 8 / admin / IE 11\nWin 7 / user / IE 9\nWin 7 / (가) / (가)\nWin 8 / user / IE 9\nWin 7 / user / IE 11\nWin 8 / user / IE 10\nWin 10 / user / IE 10\n(나) / admin / (나)","options":["(가) (user, IE 10), (나) (Win 8, IE 9)","(가) (admin, IE 10), (나) (Win 7, IE 10)","(가) (admin, IE 10), (나) (Win 10, IE 11)","(가) (user, IE 11), (나) (Win 10, IE 11)"],"explanation":"① 처음 두 인자(운영체제, 권한)의 모든 쌍을 구한다. ② 운영체제/권한/브라우저의 모든 쌍(AP)을 구한다. AP={(Win 7, admin), (Win 7, user), (Win 8, admin), (Win 8, user), (Win 10, admin), (Win 10, user), (Win 7, IE 9), (Win 7, IE 10), (Win 7, IE 11), (Win 8, IE 9), (Win 8, IE 10), (Win 8, IE 11), (Win 10, IE 9), (Win 10, IE 10), (Win 10, IE 11), (admin, IE 9), (admin, IE 10), (admin, IE 11), (user, IE 9), (user, IE 10), (user, IE 11)} ③ ①에서 만든 테스트 케이스들을 전원 인자 값을 사용하여 수평 확장한다. 주어진 테스트 케이스가 커버하지 않은 AP는 조합은 (Win 7, admin), (Win 7, IE 10), (Win 10, IE 11), (admin, IE 10)으로 (가)에 들어가야 하는 테스트 케이스는 (admin, IE 10), (나)에 들어가야 하는 테스트 케이스는 (Win 10, IE 11)이다.","explSource":"book","answer":2},{"id":"csts-exercise-242-7-98","part":"exercise","chapter":0,"qtype":"short","dupKey":"다음은전기밥솥의동작을표로나타낸것이다.페어와이즈설계기법을적용하여테스트케이스를설계할때도출될수있는최소테스트케이스개수는몇개인지기술하시오.[표:모드/설정","question":"다음은 전기밥솥의 동작을 표로 나타낸 것이다. 페어와이즈 설계 기법을 적용하여 테스트 케이스를 설계할 때 도출될 수 있는 최소 테스트 케이스 개수는 몇 개인지 기술하시오.\n[표: 모드 / 설정 / 전원]\n취사 / 현미 / ON\n보온 / 백미 / OFF","options":[],"explanation":"① 처음 두 인자(모드, 설정)의 모든 쌍을 구한다: (취사, 현미), (취사, 백미), (보온, 현미), (보온, 백미) ② 모드/설정/전원의 모든 쌍(AP)를 구한다. AP={(취사, 현미), (취사, 백미), (보온, 현미), (보온, 백미), (취사, ON), (취사, OFF), (보온, ON), (보온, OFF), (현미, ON), (현미, OFF), (백미, ON), (백미, OFF)} ③ ①에서 만든 테스트 케이스들을 전원 인자 값을 사용하여 수평 확장한다. 이때 AP의 짝들을 가장 많이 포함되도록 하는 인자값을 사용한다. 결과는 (취사, 현미, ON), (취사, 백미, OFF), (보온, 현미, OFF), (보온, 백미, ON)의 4개이다.","explSource":"book","answerText":"4개"},{"id":"csts-exercise-242-8-99","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중결정테이블에대한설명으로올바르지않은것은무엇인가?","question":"다음 중 결정 테이블에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["입력 조건의 모든 조합에 대한 시스템의 행동을 고려하여 테스트 케이스를 도출하는 기법이다.","복잡한 논리적 관계를 표현하기에 좋은 기법이다.","가능한 모든 입력값들의 조합으로 테스트하는 것은 불가능하므로 모든 짝의 조합을 테스트하는 기법이다.","누락된 요구사항이 있는지 검사하는데 좋은 기법이다."],"explanation":"③은 페어와이즈 조합 테스트에 대한 설명이다.","explSource":"book","answer":2},{"id":"csts-exercise-243-9-100","part":"exercise","chapter":10,"qtype":"ox","dupKey":"결정테이블테스트는논리적으로의존적인,가능한모든조건의조합을생성하는테스트설계기법으로,누락된요구사항을검사하고자할때효과적으로사용할수있다.","question":"결정 테이블 테스트는 논리적으로 의존적인, 가능한 모든 조건의 조합을 생성하는 테스트 설계 기법으로, 누락된 요구사항을 검사하고자 할 때 효과적으로 사용할 수 있다.","options":["O (맞다)","X (틀리다)"],"explanation":"논리적으로 의존적인, 가능한 모든 조건의 조합을 생성한다. 복잡한 논리적 관계를 표현하기에 좋다. 누락된 요구사항을 검사하고자 할 때 쉽게 사용할 수 있다.","explSource":"book","answer":0},{"id":"csts-exercise-243-10-101","part":"exercise","chapter":10,"qtype":"mc","dupKey":"다음상태전이도에서(가),(나),(다)테스트케이스들을추출하였을때사용된상태전이테스팅방법은?[상태전이도:시작점에서OFF로진입.OFF--push-->D","question":"다음 상태 전이도에서 (가), (나), (다) 테스트 케이스들을 추출하였을 때 사용된 상태 전이 테스팅 방법은?\n[상태 전이도: 시작점에서 OFF로 진입. OFF --push--> DIM, DIM --off--> OFF, DIM --push--> ON, ON --push, off--> OFF, OFF --on--> ON]\n[보기] (가) OFF → push → DIM  (나) DIM → off → OFF  (다) OFF → on → ON","options":["상태 테스팅","0-switch 테스팅","all-transitions 테스팅","3-switch 테스팅"],"explanation":"(가), (나), (다) 테스트 케이스는 모든 상태를 한번 방문하였으므로 이는 상태 테스팅 방법에 해당한다. 상태 테스트(State test): 상태 전이도의 모든 상태를 최소한 한 번은 방문하는 테스트 케이스들을 설계한다. 단일 전이 테스트(Single transitions test, 0-switch 테스트): 상태 전이도의 모든 유효한 전이들을 최소한 한 번은 방문하는 테스트 케이스들을 설계한다. All transitions 테스트: 유효한 전이를 포함하여 유효하지 않은 전이들도 최소한 한 번은 방문하는 테스트 케이스들을 설계한다. 다중 전이 테스트(Multiple transitions test, N-switch test): 상태 전이도에 있는 N+1개의 전이 시퀀스들을 최소한 한 번은 방문하는 테스트 케이스들을 설계한다.","explSource":"book","answer":0},{"id":"csts-exercise-243-11-102","part":"exercise","chapter":10,"qtype":"ox","dupKey":"명세기반테스트에서테스트대상의특성에따라테스트설계기법이결정될수있다.테스트대상이상태의존적인동작을가지는경우에는시나리오테스팅,결정표테스팅,그리고상태전이테","question":"명세 기반 테스트에서 테스트 대상의 특성에 따라 테스트 설계 기법이 결정될 수 있다. 테스트 대상이 상태 의존적인 동작을 가지는 경우에는 시나리오 테스팅, 결정표 테스팅, 그리고 상태 전이 테스팅을 적용하는 것이 일반적이다.","options":["O (맞다)","X (틀리다)"],"explanation":"시나리오 테스팅과 상태 전이 테스팅은 상태 의존적인 동작을 하는 경우에 적합하다. 하지만 결정표 테스팅은 그렇지 않다.","explSource":"book","answer":1},{"id":"csts-exercise-288-1-103","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음은조직테스트전략을수립할때의고려사항이다.나머지와성격이먼것은무엇인가?","question":"다음은 조직 테스트 전략을 수립할 때의 고려 사항이다. 나머지와 성격이 먼 것은 무엇인가?","options":["비용, 위험, 그리고 목표로 하고자 하는 품질 수준 등을 고려하여 전체적인 독립성 행태를 적절히 결정한다.","동적 테스트 프로세스를 구성하는 활동별로 시작 조건과 종료 조건을 기술할 수 있다.","테스트 활동 및 테스트 대상 소프트웨어에 대한 평가를 위해서는 각 테스트 활동별로 메트릭을 정의한다.","테스트를 통해서 식별된 결함을 기록하고 결함이 종결될 때까지 추적하는 절차를 정의한다."],"explanation":"① 테스트 독립성에 대한 설명이다. ② 테스트 시작 및 종료 조건에 대한 설명이다. ③ 테스트 메트릭에 대한 설명이다. ④ 결함 관리에 대한 설명이다. ①, ②, ③은 개별 테스트 수준에서의 전략이고 ④는 프로젝트 수준에서의 전략이다.","explSource":"book","answer":3},{"id":"csts-exercise-288-2-104","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음설명중에서위험조치에대한설명으로가장거리가먼것은?","question":"다음 설명 중에서 위험 조치에 대한 설명으로 가장 거리가 먼 것은?","options":["비상 계획(Contingency plan)은 조치가 필요한 위험 중 위험도가 높은 위험을 대상으로 준비한다.","위험의 발생 가능성을 낮추거나 발생에 따른 영향도를 축소시키는 방안을 수립한다.","위험에 해당되는 기능 및 비기능 피처에 대한 테스팅을 아웃소싱할 수 있다.","상황에 따라서는 위험에 대한 특별한 조치 없이 모니터링만 할 수도 있다."],"explanation":"① 비상 계획은 조치가 필요하다고 판단된 모든 위험에 대해서 준비한다. ② 위험 조치 중 위험 완화에 대한 설명이다. ③ 위험 조치 중 위험 전가에 대한 설명이다. ④ 위험 조치 중 위험 수용에 대한 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-288-3-105","part":"exercise","chapter":0,"qtype":"ox","dupKey":"조직테스트정책명세서는최상위수준에서의테스트에대한명세로서조직수준에서의테스트목적과원칙을정의하며테스트를수행하는구체적인방법에대해서는언급하지않는다.","question":"조직 테스트 정책 명세서는 최상위 수준에서의 테스트에 대한 명세로서 조직 수준에서의 테스트 목적과 원칙을 정의하며 테스트를 수행하는 구체적인 방법에 대해서는 언급하지 않는다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-289-4-106","part":"exercise","chapter":11,"qtype":"short","dupKey":"조직테스트정책을수립할때결정되는사항을3가지이상나열하시오.","question":"조직 테스트 정책을 수립할 때 결정되는 사항을 3가지 이상 나열하시오.","options":[],"explanation":"조직 테스트 정책에서는 테스트를 수행하는 목적, 테스트 수행을 위한 표준 프로세스, 테스트를 수행할 조직과 역할, 적용하는 테스트 표준, 테스트 자산 관리 그리고 테스트 프로세스 개선 방법을 정의한다. 테스트 목적: 조직에서의 테스트에 대한 목적, 목표 그리고 테스트의 범위를 기술한다. 테스트 프로세스: 조직에서 테스트를 수행할 때 준수할 테스트 프로세스를 명시한다. 테스트 조직 및 역할: 테스트 활동을 수행하는 테스트 조직의 구조와 역할을 정의한다. 테스트 표준: 테스트를 수행하면서 참고하고 준수해야 할 표준을 정의한다. 테스트 자산 관리: 테스트의 결과물을 축적하고 이후 재사용하는 방법을 정의한다. 테스트 프로세스 개선: 테스트 프로세스를 평가하고 개선하는 방법을 정의한다.","explSource":"book","answerText":"테스트 목적, 테스트 프로세스, 테스트 조직 및 역할, 테스트 표준, 테스트 자산 관리, 테스트 프로세스 개선 중에서 3개 이상 나열"},{"id":"csts-exercise-289-5-107","part":"exercise","chapter":11,"qtype":"mc","dupKey":"다음중에서ISO,IEEE등의표준과주제가올바른것은?","question":"다음 중에서 ISO, IEEE 등의 표준과 주제가 올바른 것은?","options":["ISO/IEC 33063 : 품질 모델","IEEE 1028 : V&V","ISO/IEC 25023 : 자동차","ISO/IEC 16805 : 위험관리"],"explanation":"① 테스트 프로세스 평가, ② 리뷰, ③ 품질 측정에 해당한다.","explSource":"book","answer":3},{"id":"csts-exercise-295-1-108","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중에서테스트관리프로세스에대한설명으로서부적절한것은?","question":"다음 중에서 테스트 관리 프로세스에 대한 설명으로서 부적절한 것은?","options":["테스트 대상과 범위를 식별하고 조직 테스트 프로세스를 참고하여 테스트 전략을 수립한다.","테스트 실행 결과에 대한 분석을 바탕으로 결함을 식별하고 기록한다.","동적 테스트 프로세스의 수행을 모니터링하여 테스트 상황을 파악하고 필요시 테스트 활동을 제어한다.","테스트가 종료되면 생성된 산출물을 관리하고 테스트 환경을 정리하고 테스트 종료 보고를 한다."],"explanation":"① 테스트 관리 프로세스 중 테스트 계획에 대한 설명이다. ② 동적 테스트 프로세스 중 테스트 실행 활동에 대한 설명이다. ③ 테스트 관리 프로세스 중 테스트 모니터링 및 제어에 대한 설명이다. ④ 테스트 관리 프로세스 중 테스트 종료에 대한 설명이다.","explSource":"book","answer":1},{"id":"csts-exercise-295-2-109","part":"exercise","chapter":12,"qtype":"mc","dupKey":"테스트관리프로세스에대한설명으로올바르지않은것은무엇인가?","question":"테스트 관리 프로세스에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["테스트 관리 프로세스는 테스트 계획, 모니터링 및 제어, 테스트 환경 정리 및 종료 보고를 수행하는 테스트 종료 단계로 구성된다.","개별 테스트의 특성을 고려하여 테스트 관리 프로세스를 정의할 때 조직 공통의 테스트 정책은 참조하지 않아도 된다.","테스트 관리 프로세스는 조직 테스트 프로세스의 정책과 전략에 따라 계획, 모니터링 및 제어, 활동에 대한 결과를 관리하는 등의 테스트 활동을 제어할 수 있다.","테스트 관리 프로세스는 프로젝트 전체의 테스트 관리뿐만 아니라 컴포넌트 테스트, 통합 테스트, 시스템 테스트, 인수 테스트 등의 개별 테스트 관리에도 적용한다."],"explanation":"테스트 관리 프로세스의 최상위 프로세스인 조직 테스트 프로세스를 기반으로 개별 테스트 프로세스를 정의한다.","explSource":"book","answer":1},{"id":"csts-exercise-0-1-110","part":"exercise","chapter":11,"qtype":"ox","dupKey":"동적테스트프로세스에서는테스트계획에서정의된테스트대상과테스트범위를확장하여광범위한테스트를수행하여더많은결함을검출할수있도록한다.","question":"동적 테스트 프로세스에서는 테스트 계획에서 정의된 테스트 대상과 테스트 범위를 확장하여 광범위한 테스트를 수행하여 더 많은 결함을 검출할 수 있도록 한다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 대상과 범위는 계획에서 결정된다. 동적 테스트 프로세스에서는 범위를 세분화하고 전략을 구체화한다.","explSource":"book","answer":1},{"id":"csts-exercise-0-2-111","part":"exercise","chapter":11,"qtype":"mc","dupKey":"테스트프로세스는조직테스트프로세스,테스트관리프로세스,동적테스트프로세스로구성된다.다음중동적테스트프로세스를구성하는활동으로올바르지않은것은?","question":"테스트 프로세스는 조직 테스트 프로세스, 테스트 관리 프로세스, 동적 테스트 프로세스로 구성된다. 다음 중 동적 테스트 프로세스를 구성하는 활동으로 올바르지 않은 것은?","options":["테스트 설계 및 구현","테스트 환경 구축 및 관리","테스트 실행","테스트 모니터링 및 제어"],"explanation":"동적 테스트 프로세스는 테스트 설계 및 구현 → 테스트 환경 구축 및 관리 → 테스트 실행 → 결함 보고의 활동으로 구성된다. ④ 테스트 모니터링 및 제어는 테스트 관리 프로세스의 활동 중 하나이다.","explSource":"book","answer":3},{"id":"csts-exercise-345-1-112","part":"exercise","chapter":12,"qtype":"mc","dupKey":"테스트프로세스활동중,테스트의범위,수행방법및일정을수립하는활동은무엇인가?","question":"테스트 프로세스 활동 중, 테스트의 범위, 수행 방법 및 일정을 수립하는 활동은 무엇인가?","options":["테스트 계획","테스트 모니터링 및 통제","테스트 평가","테스트 실행"],"explanation":"테스트 계획은 테스트 관리 프로세스의 시작 활동으로 동적 테스트를 효과적이고 효율적으로 수행하기 위한 계획 수립(테스트 범위, 수행 방법, 일정 등)을 목적으로 한다.","explSource":"book","answer":0},{"id":"csts-exercise-345-2-113","part":"exercise","chapter":12,"qtype":"mc","dupKey":"테스트계획을수립할때고려되는주요이슈로적절하지않은것은?","question":"테스트 계획을 수립할 때 고려되는 주요 이슈로 적절하지 않은 것은?","options":["언제 테스트를 종료하는 것이 좋을까?","단위 테스트를 수행하는 것이 효과적일까?","테스트 케이스를 생성할 때 소스 코드를 바탕으로 할까?","어떤 코딩 스타일을 사용할까?"],"explanation":"①, ②, ③ 테스트 계획 수립 시 주요 이슈이다. ④ 테스트보다는 개발(프로그래밍)에서 결정할 사항이다.","explSource":"book","answer":3},{"id":"csts-exercise-345-3-114","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중에서테스트계획을수립할때테스트컨텍스트를설정하는과정에해당되지않는것은?","question":"다음 중에서 테스트 계획을 수립할 때 테스트 컨텍스트를 설정하는 과정에 해당되지 않는 것은?","options":["테스트 대상에 대한 테스트 완료 여부를 결정하는 기준을 정한다.","테스트 대상 및 테스트 범위를 바탕을 어떤 개별 테스트를 수행할지 결정하도록 한다.","테스트 대상의 미션 또는 비즈니스 목표 등을 기술한다.","각 테스트 레벨별로 초점을 두는 테스트 범위가 다를 수 있다."],"explanation":"① 테스트 전략에 해당한다.","explSource":"book","answer":0},{"id":"csts-exercise-345-4-115","part":"exercise","chapter":12,"qtype":"ox","dupKey":"테스트계획을수립할때테스트컨텍스트에서는테스트대상,테스트범위,가정및제약사항그리고이해관계자를정의한다.","question":"테스트 계획을 수립할 때 테스트 컨텍스트에서는 테스트 대상, 테스트 범위, 가정 및 제약 사항 그리고 이해관계자를 정의한다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-346-5-116","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중에서테스트전략을수립할때고려할사항만을포함하고있는것은무엇인가?[보기:(가)수행하는테스트활동의수행을중단시키고중단된테스트활동을다시시작할수있는조건을","question":"다음 중에서 테스트 전략을 수립할 때 고려할 사항만을 포함하고 있는 것은 무엇인가?\n[보기: (가) 수행하는 테스트 활동의 수행을 중단시키고 중단된 테스트 활동을 다시 시작할 수 있는 조건을 기술한다. / (나) 테스트 활동의 수행과 그 결과에 대한 정량적인 판단을 위한 측정할 메트릭을 결정한다. / (다) 테스트 대상에 대하여 충분한 테스트를 수행하였다고 판단할 수 있는 기준을 의미한다. / (라) 테스트 프로젝트에서 발생할 수 있는 위험을 식별하고 적절한 대처 방안을 수립한다.]","options":["(가), (나)","(가), (나) (다)","(가), (다), (라)","(가), (나), (다), (라)"],"explanation":"(가) 테스팅 중단 및 재시작 조건, (나) 테스트 메트릭, (다) 테스트 완료 기준, (라) 위험 분석. (라) 위험 분석은 테스트 전략에 해당하지 않는다.","explSource":"book","answer":1},{"id":"csts-exercise-346-6-117","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중에서테스트완료기준으로사용되는예를모두고른것은?[보기:(가)95%의문장커버리지가충족되어야한다/(나)90%의테스트케이스(테스트절차)가통과되어야한","question":"다음 중에서 테스트 완료 기준으로 사용되는 예를 모두 고른 것은?\n[보기: (가) 95%의 문장 커버리지가 충족되어야 한다 / (나) 90%의 테스트 케이스(테스트 절차)가 통과되어야 한다. / (다) 2개 이하의 결함만이 허용된다.]","options":["(가)","(가), (나)","(가), (다)","(가), (나), (다)"],"explanation":"(가), (나), (다) 모두 테스트 완료 기준의 예이다.","explSource":"book","answer":3},{"id":"csts-exercise-346-7-118","part":"exercise","chapter":12,"qtype":"mc","dupKey":"테스트리소스할당및일정수립에관한설명으로가장올바른것은?","question":"테스트 리소스 할당 및 일정 수립에 관한 설명으로 가장 올바른 것은?","options":["테스트 역량보다는 가용한 테스터를 우선 배정한다.","테스트 가용 인원을 먼저 확인한 후 테스트 업무량을 산정한다.","테스트 자동화 도구는 쉽게 사용할 수 있으므로 테스터 배정 시 테스트 자동화 도구 사용 여부는 고려하지 않는다.","조직 내에 특정 테스트 업무를 수행할 테스터가 없다면, 외부에서 전문가를 찾는다."],"explanation":"① 테스터 역량을 고려해 테스트 업무를 배정해야 한다. ② 테스트 업무량 도출 후 테스트 가용 인원(리소스)을 배치한다. ③ 테스트 자동화 도구 사용 시 전문 지식과 경험이 필요하므로 이를 고려해 테스터를 배정한다. ④ 만일 특정 테스트 업무를 수행할 테스터가 조직 내에 없다면 외부에서 전문가를 찾아 원하는 일정에 참여할 수 있도록 계획한다.","explSource":"book","answer":3},{"id":"csts-exercise-347-8-119","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중에서테스트역할과담당작업의연결이가장올바른것은?","question":"다음 중에서 테스트 역할과 담당 작업의 연결이 가장 올바른 것은?","options":["테스트 관리자 - 테스트 현황 보고","테스트 리더 - 테스트 계획 수립","테스트 분석가 - 테스트 케이스 개발","테스트 수행자 - 테스트 환경 구축"],"explanation":"① 테스트 리더 – 테스트 현황 보고, ③ 테스트 설계자 – 테스트 케이스 개발, ④ 테스트 환경 전문가 – 테스트 환경 구축","explSource":"book","answer":1},{"id":"csts-exercise-347-9-120","part":"exercise","chapter":12,"qtype":"mc","dupKey":"다음중테스트계획서에포함되지않는항목은무엇인가?","question":"다음 중 테스트 계획서에 포함되지 않는 항목은 무엇인가?","options":["테스트 범위","가정 및 제약 사항","프로젝트 위험","피처 집합별 피처 목록"],"explanation":"④ 피처 집합별 피처 목록은 테스트 설계 명세서에 포함된다.","explSource":"book","answer":3},{"id":"csts-exercise-347-10-121","part":"exercise","chapter":12,"qtype":"short","dupKey":"다음의정보를바탕으로결함나이를구하시오.[표:OpenDate:1월1일/AssignedDate:1월3일/ResolvedDate:1월10일/Verifi","question":"다음의 정보를 바탕으로 결함 나이를 구하시오.\n[표: Open Date: 1월 1일 / Assigned Date: 1월 3일 / Resolved Date: 1월 10일 / Verified Date: 1월 15일 / Closed Date: 1월 17일]","options":[],"explanation":"결함 나이는 Open부터 Closed까지의 시간을 말한다. 주어진 정보에서 Open~Closed까지의 시간은 17일이다.","explSource":"book","answerText":"17일"},{"id":"csts-exercise-368-1-122","part":"exercise","chapter":13,"qtype":"mc","dupKey":"다음보기에서테스트분석및설계에대한올바른설명을모두고른것은무엇인가?[보기:(가)테스트수행시사용될테스트케이스에대한생성및확보전략을수립한다./(나)테스트계","question":"다음 보기에서 테스트 분석 및 설계에 대한 올바른 설명을 모두 고른 것은 무엇인가?\n[보기: (가) 테스트 수행 시 사용될 테스트 케이스에 대한 생성 및 확보 전략을 수립한다. / (나) 테스트 계획서에 기술된 테스트 목적을 달성하기 위한 구체적인 테스트 접근 방법을 정의한다. / (다) 테스트 수행에 앞서 테스트에 사용될 테스트 데이터를 준비한다. / (라) 테스트를 수행하기 위한 테스트 절차서를 작성한다. / (마) 효과적인 커버리지 달성을 위하여 테스트 케이스는 가능한 한 많이 작성한다.]","options":["(가), (나)","(나), (다), (라)","(가), (나), (라)","(가), (나), (다), (마)"],"explanation":"(다) 테스트 실행에 대한 설명이다. (마) 테스트 케이스는 중복되지 않고, 최소한의 케이스로 넓은 커버리지를 갖도록 하는 것이 좋다.","explSource":"book","answer":2},{"id":"csts-exercise-368-2-123","part":"exercise","chapter":13,"qtype":"mc","dupKey":"테스트설계명세에서는각피처를구체화하여세부피처를기술한다.다음중세부피처에대한명세항목으로가장거리가먼것은?","question":"테스트 설계 명세에서는 각 피처를 구체화하여 세부 피처를 기술한다. 다음 중 세부 피처에 대한 명세 항목으로 가장 거리가 먼 것은?","options":["세부 피처의 내용으로 무엇을 테스트할지 기술한다.","세부 피처의 우선순위를 기술한다.","세부 피처에 적합한 테스트 설계 기법을 기술한다.","세부 피처의 내용에 대한 테스트 베이시스의 해당 항목에 대한 참조를 나열한다."],"explanation":"테스트 설계 기법은 세부 피처 및 피처별이 아니라 피처 집합 별로 기술된다.","explSource":"book","answer":2},{"id":"csts-exercise-368-3-124","part":"exercise","chapter":13,"qtype":"ox","dupKey":"테스트설계및구현활동은테스트계획서에정의된테스트설계기법,테스트환경요건,테스트데이터요건등을바탕으로수행된다.","question":"테스트 설계 및 구현 활동은 테스트 계획서에 정의된 테스트 설계 기법, 테스트 환경 요건, 테스트 데이터 요건 등을 바탕으로 수행된다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-369-4-125","part":"exercise","chapter":13,"qtype":"mc","dupKey":"다음중에서테스트케이스에대한설명으로가장거리가먼것은무엇인가?","question":"다음 중에서 테스트 케이스에 대한 설명으로 가장 거리가 먼 것은 무엇인가?","options":["피처를 구체화한 세부 피처를 바탕으로 테스트 케이스를 개발한다.","예상 결과와 실제 결과를 비교하는 행위(action)는 테스트 절차에 기술한다.","테스트 케이스가 실행되기 위해서 테스트 대상 및 테스트 환경 항목에 대하여 요구되는 특정 상태를 기술한다.","테스트 베이시스의 해당 항목에 대한 참조를 나열한다."],"explanation":"테스트 케이스의 예상 결과 항목에는 예상 결과와 실제 결과를 비교하기 위하여 필요한 행위(action)도 기술될 수 있다.","explSource":"book","answer":1},{"id":"csts-exercise-369-5-126","part":"exercise","chapter":13,"qtype":"ox","dupKey":"테스트절차는여러개의테스트케이스로구성된다.각테스트케이스는선행조건을기술하고있으므로테스트절차를구성하는테스트케이스는순서에관계없이나열해도상관없다.","question":"테스트 절차는 여러 개의 테스트 케이스로 구성된다. 각 테스트 케이스는 선행 조건을 기술하고 있으므로 테스트 절차를 구성하는 테스트 케이스는 순서에 관계없이 나열해도 상관없다.","options":["O (맞다)","X (틀리다)"],"explanation":"선행 조건만으로 테스트 케이스의 순서를 결정할 수 없다. 실행 순서대로 테스트 케이스를 나열한다.","explSource":"book","answer":1},{"id":"csts-exercise-369-6-127","part":"exercise","chapter":13,"qtype":"mc","dupKey":"테스트설계명세서는피처집합별로설계결과를기술한다.다음중피처집합별로기술되는항목과거리가먼것은?","question":"테스트 설계 명세서는 피처 집합별로 설계 결과를 기술한다. 다음 중 피처 집합 별로 기술되는 항목과 거리가 먼 것은?","options":["피처 집합을 통해서 확인하고자 하는 테스트 대상에 대한 목표 및 범위를 간략하게 기술한다.","피처 집합에 포함된 피처에 대하여 요구사항 명세서, 구조 설계 명세서 등의 테스트 베이시스에 대한 참조를 나열하도록 한다.","피처 집합에 대하여 적용하고자 하는 테스트 설계 기법, 테스트 환경 요건, 테스트 데이터 요건, 테스트 완료 기준 등 구체화한 테스트 전략을 기술한다.","피처 집합에 필요한 테스트 환경 항목에 대한 구체적인 요건을 기술한다."],"explanation":"① 목적, ② 추적성, ③ 구체화된 테스트 전략 → 테스트 설계 명세서에 기술된다. ④ 테스트 환경에 대한 요구사항으로 테스트 환경 요건 명세서에 기술된다.","explSource":"book","answer":3},{"id":"csts-exercise-0-1-128","part":"exercise","chapter":13,"qtype":"mc","dupKey":"다음중테스트환경에대한요구사항정의와가장거리가먼것은무엇인가?","question":"다음 중 테스트 환경에 대한 요구사항 정의와 가장 거리가 먼 것은 무엇인가?","options":["테스트 대상 요소가 실행될 수 있는 하드웨어 및 시스템 소프트웨어 환경이 정의되어야 한다.","하드웨어의 경우 규격(CPU, 메모리 등)은 추후에 정의하도록 한다.","시스템 테스트 수준에서는 가능하다면 운영 환경에 근접한 환경을 구성하는 것이 권장된다.","컴포넌트 테스트 수준에서는 개발자 환경에서 테스트를 수행하는 것이 일반적이다."],"explanation":"② 구체적인 규격이 정의되어야 한다.","explSource":"book","answer":1},{"id":"csts-exercise-0-2-129","part":"exercise","chapter":13,"qtype":"mc","dupKey":"다음중테스트환경요건명세서에기재되는내용과거리가먼것은무엇인가?","question":"다음 중 테스트 환경 요건 명세서에 기재되는 내용과 거리가 먼 것은 무엇인가?","options":["해당 테스트 환경 항목이 어떤 목적으로 활용되는지 기술한다.","해당 테스트 환경 항목의 중요도와 우선 순위를 기술한다.","해당 테스트 환경이 필요한 시점과 사용되는 기간을 기술한다.","해당 테스트 환경을 준비하여 필요시기에 사용될 수 있도록 책임을 지는 담당자를 기술한다."],"explanation":"① 활용 목적, ③ 필요시기, ④ 담당자는 모두 테스트 환경 요건 명세서의 항목이다. ② 테스트 환경 항목에 대한 중요도와 우선순위는 환경 요건 명세서에 기술되지 않는다.","explSource":"book","answer":1},{"id":"csts-exercise-0-3-130","part":"exercise","chapter":13,"qtype":"ox","dupKey":"테스트환경구축및관리활동은주어진요건에따라서테스트환경을구축하고테스트데이터를준비하여테스트계획활동을지원하는것을목표로한다.","question":"테스트 환경 구축 및 관리 활동은 주어진 요건에 따라서 테스트 환경을 구축하고 테스트 데이터를 준비하여 테스트 계획 활동을 지원하는 것을 목표로 한다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 환경 구축 및 관리 활동은 테스트 실행 활동을 지원하는 것을 목표로 한다.","explSource":"book","answer":1},{"id":"csts-exercise-0-4-131","part":"exercise","chapter":13,"qtype":"mc","dupKey":"다음에서설명하고있는테스트활동은무엇인가?[보기:테스트케이스의실행에필요한하드웨어,시스템소프트웨어,외부연동시스템(또는시뮬레이터),공존소프트웨어,그리고","question":"다음에서 설명하고 있는 테스트 활동은 무엇인가?\n[보기: 테스트 케이스의 실행에 필요한 하드웨어, 시스템 소프트웨어, 외부 연동시스템(또는 시뮬레이터), 공존 소프트웨어, 그리고 테스트 도구 등을 준비하는 활동이다.]","options":["테스트 케이스 명세","테스트 데이터 준비","테스트 환경 구축","테스트 실행"],"explanation":"하드웨어, 시스템 소프트웨어, 외부 연동 시스템 또는 시뮬레이터, 공존 소프트웨어, 테스트 도구 등 테스트 케이스를 실행할 수 있는 기반을 갖추는 활동은 테스트 환경 구축이다. 테스트 케이스 명세는 입력값과 기대 결과를 설계·문서화하는 활동이고, 테스트 데이터 준비는 환경 위에 올릴 데이터 자체를 만드는 활동이므로 대상이 다르다. 테스트 실행은 구축된 환경에서 실제로 테스트 케이스를 수행하고 결과를 기록하는 후속 활동이다.","explSource":"authored","answer":2},{"id":"csts-exercise-385-1-132","part":"exercise","chapter":14,"qtype":"mc","dupKey":"다음중테스트실행에설명으로가장거리가먼것은무엇인가?","question":"다음 중 테스트 실행에 설명으로 가장 거리가 먼 것은 무엇인가?","options":["수많은 테스트 케이스 중에서 어떤 것을 먼저 실행시킬지 결정해야 한다.","효율적인 테스트를 수행하기 위하여 테스트 절차에 부여된 우선순위를 활용한다.","테스트 완료 기준은 테스트 실행이 완료된 후 시점에서의 평가이므로 테스트 실행과 관련성이 없다.","컴포넌트 테스트, 시스템 테스트 등의 테스트 레벨에 따라서 테스트 실행의 주체가 달라진다."],"explanation":"테스트 완료 기준을 적용해서 테스트 절차를 선택할 수도 있다.","explSource":"book","answer":2},{"id":"csts-exercise-385-2-133","part":"exercise","chapter":14,"qtype":"ox","dupKey":"효율적으로테스트실행활동을수행하기위해서는적절한기준으로실행할테스트절차를선택할필요가있다.테스트완료기준의달성에가장크게기여할수있는테스트절차를먼저실행시키는","question":"효율적으로 테스트 실행 활동을 수행하기 위해서는 적절한 기준으로 실행할 테스트 절차를 선택할 필요가 있다. 테스트 완료 기준의 달성에 가장 크게 기여할 수 있는 테스트 절차를 먼저 실행시키는 것이 바람직하다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 완료 기준 전략에 대한 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-385-3-134","part":"exercise","chapter":14,"qtype":"mc","dupKey":"테스트실행시단계별활동으로올바르지않은것은?","question":"테스트 실행 시 단계별 활동으로 올바르지 않은 것은?","options":["리그레션 테스트 케이스 선택 시, 대상이 영향받을 부분이 작은 것부터 실행","테스트 케이스 실행 시, 사전에 정의된 테스트 환경을 대상으로 테스트 절차에 따라 실행","테스트 케이스 실행 시, 시간대별로 오류를 기록하고 필요 시 테스트 재연이 가능하도록 작성","테스트 결함분석 시, 발견된 결함을 분석하고 각 결함을 구체적으로 정의하여 개발자에게 통보"],"explanation":"① 테스트 케이스 선택 시, 테스트 대상이 영향받을 수 있는 부분이 큰 것부터 실행하여야 함","explSource":"book","answer":0},{"id":"csts-exercise-385-4-135","part":"exercise","chapter":14,"qtype":"ox","dupKey":"테스트의실행주체로컴포넌트테스트는개발자와테스터가,통합테스트는개발자와사용자가,시스템테스트는개발자와테스터및사용자가,인수테스트는테스터와사용자가실행의주체","question":"테스트의 실행 주체로 컴포넌트 테스트는 개발자와 테스터가, 통합 테스트는 개발자와 사용자가, 시스템 테스트는 개발자와 테스터 및 사용자가, 인수 테스트는 테스터와 사용자가 실행의 주체가 된다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트의 실행 주체로 컴포넌트 테스트는 개발자와 테스터가 통합테스트는 개발자와 테스터가 시스템 테스트는 개발자와 테스터 및 사용자가 인수테스트는 테스터와 사용자가 실행의 주체가 된다.","explSource":"book","answer":1},{"id":"csts-exercise-386-5-136","part":"exercise","chapter":14,"qtype":"mc","dupKey":"다음에서설명하는리뷰방법은무엇인가?이리뷰방법에서는작성자본인이보통회의를주재하며기록자역할도담당할수있고,절차및작업물에대한개요설명단계를회의의한부분으로다룰","question":"다음에서 설명하는 리뷰 방법은 무엇인가?\n이 리뷰방법에서는 작성자 본인이 보통 회의를 주재하며 기록자 역할도 담당할 수 있고, 절차 및 작업물에 대한 개요 설명 단계를 회의의 한 부분으로 다룰 수 있다. 이 리뷰 방법으로 결함을 검출할 뿐만 아니라 참가자들의 교육이나 지식 공유를 위해 수행되기도 한다.","options":["관리 리뷰(Management review)","워크쓰루(Walkthrough)","인스펙션(Inspection)","감사(Audit)"],"explanation":"작성자가 직접 회의를 주재하고 작업물 개요를 설명하며, 결함 검출과 함께 참가자 교육 및 지식 공유를 목적으로도 수행하는 비교적 비형식적인 리뷰는 워크쓰루(Walkthrough)이다. 인스펙션(Inspection)은 훈련된 모더레이터가 주재하고 체크리스트와 진입·종료 조건, 메트릭을 갖춘 가장 형식적인 리뷰라는 점에서 다르다. 관리 리뷰는 프로젝트 진행 상황과 계획 대비 진척을 경영 관점에서 판단하는 리뷰이고, 감사(Audit)는 표준·규정 준수 여부를 독립적으로 확인하는 활동이므로 목적이 구분된다.","explSource":"authored","answer":1},{"id":"csts-exercise-399-1-137","part":"exercise","chapter":14,"qtype":"mc","dupKey":"식별된결함은결함생명주기에따라서관리된다.각결함이가지는상태의변화로가장올바른것은?","question":"식별된 결함은 결함 생명 주기에 따라서 관리된다. 각 결함이 가지는 상태의 변화로 가장 올바른 것은?","options":["Open – Assigned – Verified – Review – Resolved – Closed","Open – Review – Assigned – Resolved – Verified – Closed","Open – Assigned – Verified – Resolved – Review – Closed","Open – Assigned – Resolved – Review – Verified – Closed"],"explanation":"[그림: 결함 생명 주기 상태 전이도 — 시작점에서 Open → Review → Assigned → Resolved → Verified → Closed 순으로 진행되며, Verified에서 Fixed/Duplicated/Won't Fix/Invalid로 분류된다. Reopen과 Deferred 상태가 있어 Verified·Deferred에서 Reopen을 거쳐 Assigned로 되돌아가거나 Review로 돌아갈 수 있고, Closed 이후 종료점으로 이어진다.] [결함 생명 주기] • \"Open\": 테스터가 테스트 절차를 실행하여 발견한 결함을 분석 후 구체화, 고립화, 일반화한 결함으로서 보고된 상황 • \"Review\": \"Open\"된 결함의 처리 방안을 검토하는 상태 • \"Assigned\": 결함을 수정할 개발자가 결정되고 그 개발자에게 결함 해결이 요구된 상태 • \"Resolved\": 개발자가 자신에게 할당된 수정 해결을 처리한 상태 • \"Verified\": 개발자의 결함 처리가 합당한지, 정확한지 검증이 된 상태 • \"Closed\": Fixed에 대해서 정확한 수정이 이루어졌다고 판단되어 종료한 상태","explSource":"book","answer":1},{"id":"csts-exercise-400-2-138","part":"exercise","chapter":14,"qtype":"mc","dupKey":"다음중결함보고서에기재되는내용과거리가먼것은무엇인가?","question":"다음 중 결함 보고서에 기재되는 내용과 거리가 먼 것은 무엇인가?","options":["검출된 결함이 영향을 미칠 수 있는 요구사항을 기술한다.","실제 결과와 예상 결과와의 차이점에 대한 분석 내용 및 예상치 않게 발견된 오동작 상황을 기록한다.","검출된 결함과 관련된 새로운 위험 요소에 대한 분석 결과를 기술한다.","결함을 고립화하고, 일반화하여 결함의 해결을 도울 수 있는 정보도 기술한다."],"explanation":"② 결함 설명, ③ 위험 분석, ④ 결함 설명에 해당한다. ① 결함과 관련된 요구사항을 기술하지는 않는다.","explSource":"book","answer":0},{"id":"csts-exercise-400-3-139","part":"exercise","chapter":14,"qtype":"mc","dupKey":"다음설명에해당하는산출물로올바른것은?•테스트수행시발생한사건을기록한문서•오류이해및재현을할수있도록상세히기록•해당오류가테스트활동에미칠수있는영향을기록•오","question":"다음 설명에 해당하는 산출물로 올바른 것은?\n• 테스트 수행 시 발생한 사건을 기록한 문서\n• 오류 이해 및 재현을 할 수 있도록 상세히 기록\n• 해당 오류가 테스트 활동에 미칠 수 있는 영향을 기록\n• 오류 발생 가능성, 심각성, 긴급성 등을 바탕으로 오류의 위험도 기록","options":["테스트 종료 보고서","테스트 절차 보고서","테스트 결함 보고서","테스트 케이스 명세서"],"explanation":"• 테스트 종료 보고서 : 테스팅 요약, 계획 대비 차이점, 테스트 메트릭, 테스트 방해 요인, 테스트 완료 평가, 잔존 위험, 테스트 산출물, 재사용 가능한 테스트 자산, 교훈 • 테스트 절차 보고서 : 테스트 목표, 테스트 케이스, 준비/시작/테스트 상세/종료/복원 절차, 결과 측정 방법 • 테스트 케이스 명세서 : 테스트 대상, 입력 명세, 출력 명세, 테스트 환경, 의존 테스트 케이스","explSource":"book","answer":2},{"id":"csts-exercise-400-4-140","part":"exercise","chapter":14,"qtype":"mc","dupKey":"테스트결함보고서에기록되지않는것은?","question":"테스트 결함 보고서에 기록되지 않는 것은?","options":["결함에 대한 요약","결함 수정 방법","결함의 심각도","결함 우선순위"],"explanation":"결함 수정 방법은 테스트 결함 보고서에 기록되지 않는다.","explSource":"book","answer":1},{"id":"csts-exercise-401-5-141","part":"exercise","chapter":14,"qtype":"mc","dupKey":"다음중테스트결함보고서에일반적으로기재되지않는항목은?","question":"다음 중 테스트 결함 보고서에 일반적으로 기재되지 않는 항목은?","options":["테스트 절차","테스트 케이스","오류 발생 시간","오류의 수정 예상 비용"],"explanation":"테스트 결함 보고서는 오류를 재연할 수 있을 정도로 테스트 절차, 테스트 케이스, 테스트 환경을 기술한다. 또한 오류가 심각성과 긴급성도 기술한다. 오류의 수정 예상 비용은 기재되지 않는다.","explSource":"book","answer":3},{"id":"csts-exercise-0-1-142","part":"exercise","chapter":15,"qtype":"mc","dupKey":"다음중테스트모니터링및제어활동에서테스트활동에대한제어에대한설명으로가장거리가먼것은?","question":"다음 중 테스트 모니터링 및 제어 활동에서 테스트 활동에 대한 제어에 대한 설명으로 가장 거리가 먼 것은?","options":["동적 테스트 활동의 시작을 결정한다.","동적 테스트 활동의 종료를 결정한다.","테스트 계획과의 차이를 보완하기 위한 작업을 결정한다.","테스트 완료 기준을 바탕으로 테스트 완료 여부를 결정한다."],"explanation":"④ 테스트 완료 기준 평가는 테스트 종료 활동에서 수행된다.","explSource":"book","answer":3},{"id":"csts-exercise-0-2-143","part":"exercise","chapter":15,"qtype":"mc","dupKey":"다음중테스트모니터링에대한설명으로올바르지않은것은무엇인가?","question":"다음 중 테스트 모니터링에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["테스트 활동에 대한 모니터링 수행에서는 위험 관리 작업을 생략한다.","테스트 계획과 활동에 차이가 있다면 테스트 진척도를 지연시키는 원인을 분석한다.","모니터링을 통해서 테스트 활동의 실제 진척도가 수립된 테스트 계획과 차이가 있는지 파악한다.","테스트 계획에서 결정된 메트릭을 이용하여 테스트 상황에 대한 정량적인 모니터링을 수행한다."],"explanation":"① 테스트 활동에 대한 모니터링을 수행하면서 위험 관리 작업도 수행될 필요가 있다. 즉, 모니터링을 통해서 새로운 위험 요소가 식별될 수가 있으며 식별된 위험에 대한 위험도 산정과 평가를 수행하고 이를 테스트 활동의 제어에 반영할 필요가 있다.","explSource":"book","answer":0},{"id":"csts-exercise-0-3-144","part":"exercise","chapter":15,"qtype":"mc","dupKey":"다음은테스트프로세스중테스트모니터링및제어단계에관한내용이다.올바르지않은설명은무엇인가?","question":"다음은 테스트 프로세스 중 테스트 모니터링 및 제어 단계에 관한 내용이다. 올바르지 않은 설명은 무엇인가?","options":["계획된 일정에 따라 테스트가 진행되고 있는지 조사한다.","테스트 종료 기준을 만족하면 테스트 활동을 종료하도록 승인한다.","계획 대비 차이가 있더라도 계획된 테스트 활동은 한 사이클 동안은 유지한다.","측정되고 수집된 테스트 지표를 통해 테스트 계획 대비 진척도를 모니터링한다."],"explanation":"테스트 모니터링 및 제어 단계는 테스트 계획에 따라 테스트가 진행되고 있는지를 자세히 조사하고 계획 대비 차이가 있으면 계획된 테스트 활동을 조정하는 단계이다. 설정(Set up) → 모니터(Monitor) → 제어(Control) → 보고(Report) 단계로 이루어진다. ③번은 모니터링 및 제어 단계에서는 계획 대비 차이가 있는 경우 계획된 테스트 활동을 조정하는 것이 적합하므로 틀린 답이다.","explSource":"book","answer":2},{"id":"csts-exercise-416-4-145","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중테스트모니터링및제어활동으로올바르지않은것은?","question":"다음 중 테스트 모니터링 및 제어 활동으로 올바르지 않은 것은?","options":["결함 발견율, 조치율, 수정율 및 결함 추이를 관리한다.","계획된 일정 대비 테스트가 정상적으로 수행되는지 확인한다.","테스트를 수행할 인적 자원에 대한 역량 및 역할을 결정한다.","정기적 또는 비정기적으로 회의를 통해 테스트 진행 상태를 확인한다."],"explanation":"③ 테스트 계획 단계에서 테스트를 수행할 인적 자원에 대한 역량 및 역할을 결정한다.","explSource":"book","answer":2},{"id":"csts-exercise-416-5-146","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음에해당하는테스트활동은무엇인가?[박스:•테스트관리자는정기적으로테스트활동진행을점검하기위해검토회의를개최하고테스트진행상태를확인한다.•검토회의에서는수","question":"다음에 해당하는 테스트 활동은 무엇인가?\n[박스: • 테스트 관리자는 정기적으로 테스트 활동 진행을 점검하기 위해 검토 회의를 개최하고 테스트 진행 상태를 확인한다. • 검토 회의에서는 수립된 일정계획과 실제 테스트 상태 및 테스트 진행 상황을 비교한다. • 실제 테스트 진행 상황이 계획과 다를 경우 그 원인 및 파급 효과를 분석한다.]","options":["테스트 분석 및 설계","테스트 구현 및 실행","테스트 모니터링 및 제어","테스트 실행 완료 및 보고"],"explanation":"계획된 일정과 실제 테스트 진행 상황을 정기적으로 비교하고, 차이가 발생하면 원인과 파급 효과를 분석해 시정 조치를 취하는 활동은 테스트 모니터링 및 제어(Test Monitoring and Control)이다. 모니터링은 현황 정보를 수집·보고하는 것이고 제어는 그 결과에 따라 계획을 조정하는 것으로, 테스트 프로세스 전체에 걸쳐 지속되는 관리 활동이다. 테스트 분석 및 설계는 테스트 조건과 테스트 케이스를 도출하는 활동이며, 테스트 구현 및 실행은 절차서를 만들고 실제로 수행하는 활동이므로 관리 활동과 구분된다.","explSource":"authored","answer":2},{"id":"csts-exercise-427-1-147","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중테스트종료보고에포함되는항목과거리가먼것은?","question":"다음 중 테스트 종료 보고에 포함되는 항목과 거리가 먼 것은?","options":["결함 목록","잔존 위험","테스트 산출물","신규 및 변경 위험"],"explanation":"④ 신규 및 변경 위험은 테스트 현황 보고서에 기록된다.","explSource":"book","answer":3},{"id":"csts-exercise-427-2-148","part":"exercise","chapter":0,"qtype":"mc","dupKey":"테스트종료보고의첫번째항목은수행된테스트에대한요약이다.다음중테스트요약에포함되는내용과가장거리가먼것은?","question":"테스트 종료 보고의 첫 번째 항목은 수행된 테스트에 대한 요약이다. 다음 중 테스트 요약에 포함되는 내용과 가장 거리가 먼 것은?","options":["종료 보고서 작성의 대상이 되는 테스트 대상을 나열한다.","테스트 대상별로 관련된 테스트 계획서, 테스트 설계 명세서, 테스트 케이스 명세서 등을 명시한다.","테스트를 실행한 테스트 환경을 간략히 기술한다.","재사용 가능한 산출물과 테스트를 통해서 얻은 교훈을 기술한다."],"explanation":"④ 재사용 가능한 산출물과 교훈은 테스트 요약과 별개의 항목으로 기술된다.","explSource":"book","answer":3},{"id":"csts-exercise-427-3-149","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중테스트종료에대한설명으로올바르지않은것은?","question":"다음 중 테스트 종료에 대한 설명으로 올바르지 않은 것은?","options":["테스트에서 생성된 결과물이 재사용될 수 있도록 자산으로 관리한다.","테스트 환경과 테스트 데이터에 대한 요건을 정의한다.","수행된 다양한 테스트 환경 요소들을 사용하기 이전의 상태로 복구시킨다.","미해소된 위험에 대하여 해소되지 않은 이유와 품질에 미치는 영향을 분석한다."],"explanation":"② 테스트 환경 항목 구축은 테스트 실행","explSource":"book","answer":1},{"id":"csts-exercise-427-4-150","part":"exercise","chapter":0,"qtype":"mc","dupKey":"다음중테스트종료조건에대한기준(ExitCriteria)으로올바르지않은것은?","question":"다음 중 테스트 종료 조건에 대한 기준(Exit Criteria)으로 올바르지 않은 것은?","options":["전체 요구 사항 중 테스트를 통해 확인된 요구 사항 비율","준비된 테스트 케이스의 통과율(Pass rate)","해당 제품 개발자의 승인 여부","발견된 결함 수 대비 수정된 결함 수"],"explanation":"테스트 종료 판단은 테스트 수행 결과, 잔여 결함 수준, 고객의 승인 여부 등으로 결정한다.","explSource":"book","answer":2},{"id":"csts-exercise-428-5-151","part":"exercise","chapter":0,"qtype":"ox","dupKey":"테스트프로세스를구성하는활동중에서일반적으로테스트실행이가장많은시간이소요된다.","question":"테스트 프로세스를 구성하는 활동 중에서 일반적으로 테스트 실행이 가장 많은 시간이 소요된다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 프로세스 구성하는 활동 중에서 일반적으로 테스트 실행이 가장 많은 시간을 소요된다. 즉 많은 수의 테스트 절차를 적용하여 그 결과를 관찰하고 예상 결과와 비교하는 데는 많은 시간이 소요된다.","explSource":"book","answer":0},{"id":"csts-exercise-428-6-152","part":"exercise","chapter":0,"qtype":"ox","dupKey":"테스트평가및개선활동산출물인테스트평가보고서는테스트프로세스의마지막단계에서작성되는모든테스트활동과결과를요약한문서이다.","question":"테스트 평가 및 개선 활동 산출물인 테스트 평가 보고서는 테스트 프로세스의 마지막 단계에서 작성되는 모든 테스트 활동과 결과를 요약한 문서이다.","options":["O (맞다)","X (틀리다)"],"explanation":"테스트 평가 보고서는 테스트 프로세스의 마지막 단계에서 작성되는 모든 테스트 활동과 결과를 요약한 문서이다.","explSource":"book","answer":0},{"id":"csts-exercise-450-1-153","part":"exercise","chapter":16,"qtype":"ox","dupKey":"테스트프로세스활동중,테스트프로세스자체에대한효율의향상과개선을목적으로하는활동은테스트평가이다.","question":"테스트 프로세스 활동 중, 테스트 프로세스 자체에 대한 효율의 향상과 개선을 목적으로 하는 활동은 테스트 평가이다.","options":["O (맞다)","X (틀리다)"],"explanation":"맞는 설명이다.","explSource":"book","answer":0},{"id":"csts-exercise-450-2-154","part":"exercise","chapter":16,"qtype":"mc","dupKey":"다음과같이테스트가수행되었다.테스트케이스효율성은얼마인가?[박스:•개발된테스트케이스수=10개•예상결과와동일한결과가산출된테스트케이스수=4•디버깅을통해","question":"다음과 같이 테스트가 수행되었다. 테스트 케이스 효율성은 얼마인가?\n[박스: • 개발된 테스트 케이스 수 = 10개 • 예상 결과와 동일한 결과가 산출된 테스트 케이스 수 = 4 • 디버깅을 통해서 확인된 결함 수 = 1]","options":["10%","6%","4%","1%"],"explanation":"테스트 케이스 효율성 = 검출된 전체 결함의 수 / 생성된 전체 테스트 케이스 수. 주어진 보기에서 테스트 케이스 효율성은 결함 수(1) / 테스트 케이스 수(10) = 10%이다.","explSource":"book","answer":0},{"id":"csts-exercise-450-3-155","part":"exercise","chapter":16,"qtype":"mc","dupKey":"다음중에서ISO/IEC33063의프로세스역량레벨에대한설명으로가장부적절한것은?","question":"다음 중에서 ISO/IEC 33063의 프로세스 역량 레벨에 대한 설명으로 가장 부적절한 것은?","options":["수행 수준: 프로세스의 목적을 달성하는 정도를 말한다.","관리 수준: 수행된 프로세스가 관리되는 정도, 작업 산출물이 적절하게 관리되는 정도를 말한다.","확립 수준: 프로세스 성과를 달성할 수 있는 정의된 프로세스를 사용하여 이행되는 정도를 말한다.","최적화 수준: 예측 가능한 프로세스가 조직의 변경에 대응하기 위해 지속해서 혁신 목적을 달성하는 정도를 말한다."],"explanation":"④ 혁신(Innovating) 수준에 대한 설명이다.","explSource":"book","answer":3},{"id":"csts-exercise-451-4-156","part":"exercise","chapter":16,"qtype":"short","dupKey":"다음표에서설계단계의결함구속효율성을구하시오.[표:행은결함검출단계,열은결함발생단계(요구사항분석/설계/구현).요구사항분석:10/-/-|설계:5/20/","question":"다음 표에서 설계 단계의 결함 구속 효율성을 구하시오.\n[표: 행은 결함 검출 단계, 열은 결함 발생 단계(요구사항분석 / 설계 / 구현). 요구사항분석: 10 / - / - | 설계: 5 / 20 / - | 구현/단위 테스트: 5 / 20 / 50 | 통합 테스트: 5 / 20 / 25 | 시스템 테스트: 5 / 10 / 55 | 인수 테스트: 5 / 0 / 15 | 운영: 5 / 0 / 5 | 합계: 40 / 70 / 150]","options":[],"explanation":"결함 구속 효율성은 해당 단계에서 발생한 결함을 검출하는 비율을 말한다. 주어진 표에서 설계 단계에 도입된 결함의 수는 70개이고 그 중에서 설계 단계에서 검출된 결함의 수가 20개이므로 20 / 70 = 28.6 %이다.","explSource":"book","answerText":"20 / 70 = 28.6%"},{"id":"csts-exercise-451-5-157","part":"exercise","chapter":16,"qtype":"mc","dupKey":"테스트평가및개선단계에대한설명으로가장적절한것은?","question":"테스트 평가 및 개선 단계에 대한 설명으로 가장 적절한 것은?","options":["테스트 계획서에 명시한 테스트 종료 기준에 따라 테스트를 종료한다.","테스트 종료 후 테스트 활동의 효과성과 효율성에 대해 평가한다.","테스트 평가 및 개선 계획 단계에서 테스트 계획서를 작성한다.","테스트 환경을 구축하고 테스트 데이터를 준비한다."],"explanation":"① 테스트 종료 단계 ③ 테스트 계획 단계 ④ 테스트 환경 구축 단계","explSource":"book","answer":1},{"id":"csts-exercise-451-6-158","part":"exercise","chapter":16,"qtype":"ox","dupKey":"테스트프로세스의마지막단계에서작성되는문서로,테스트활동평가결과와테스트개선방안을작성하는문서는테스트평가보고서이다.","question":"테스트 프로세스의 마지막 단계에서 작성되는 문서로, 테스트 활동 평가 결과와 테스트 개선방안을 작성하는 문서는 테스트 평가보고서이다.","options":["O (맞다)","X (틀리다)"],"explanation":"O이다. 테스트 프로세스의 마지막 단계인 완료(종료) 활동에서 작성되는 문서로, 모든 테스트 활동과 결과를 요약하고 테스트 활동 자체에 대한 평가와 개선방안을 담는 것이 테스트 평가보고서이다. 결함 현황이나 진행률을 주기적으로 알리는 테스트 현황(진행) 보고서와 달리, 평가보고서는 종료 기준 충족 여부 판단과 다음 프로젝트를 위한 교훈 정리라는 목적을 갖는다.","explSource":"authored","answer":0},{"id":"csts-exercise-451-7-159","part":"exercise","chapter":16,"qtype":"mc","dupKey":"다음중테스트프로세스의마지막단계에서모든테스트활동과결과를요약한문서로,테스트활동에대한평가와개선방안이기술되는문서는무엇인가?","question":"다음 중 테스트 프로세스의 마지막 단계에서 모든 테스트 활동과 결과를 요약한 문서로, 테스트 활동에 대한 평가와 개선방안이 기술되는 문서는 무엇인가?","options":["테스트 결함 보고서","테스트 활동 보고서","테스트 평가 보고서","테스트 현황 보고서"],"explanation":"테스트 프로세스 종료 단계에서 모든 테스트 활동과 결과를 요약하고 테스트 활동에 대한 평가 및 개선방안까지 기술하는 문서는 테스트 평가 보고서이다. 테스트 결함 보고서는 개별 결함의 재현 절차와 상태를 기록하는 문서이고, 테스트 현황 보고서는 테스트 진행 중 진척도와 결함 추이를 주기적으로 알리는 문서이므로 작성 시점과 목적이 다르다. 평가 보고서의 핵심 차별점은 '테스트 활동 자체에 대한 평가와 프로세스 개선방안'이 포함된다는 점이다.","explSource":"authored","answer":2},{"id":"csts-exercise-452-8-160","part":"exercise","chapter":16,"qtype":"mc","dupKey":"테스트평가및개선활동에대한설명으로올바르지않은것은?","question":"테스트 평가 및 개선 활동에 대한 설명으로 올바르지 않은 것은?","options":["적용된 테스트 프로세스의 효율성에 대한 평가를 테스트 활동 중 지속적으로 수행한다.","향후 수정되어야 할 테스트 프로세스 활동에 대한 검토 · 분석 의견을 제시한다.","새롭게 적용된 활동 및 도구 · 기법에 대한 평가를 수행한다.","발견된 오류 유형을 통해 각 단계별 테스트 기법을 평가한다."],"explanation":"테스트 평가 및 개선 활동은 전체 테스트 활동이 완료된 후, 그 동안 모니터링을 통해 수집된 정보를 활용하여, 평가를 수행하는 것이 일반적입니다. 업무의 효율을 위해서 테스트 활동 중에 평가를 수행하지는 않습니다.","explSource":"book","answer":0},{"id":"csts-exercise-452-9-161","part":"exercise","chapter":16,"qtype":"mc","dupKey":"다음의테스트결과를평가한것으로올바른설명은무엇인가?[표:설계된테스트케이스/테스트케이스실행결과/발생된결함.테스트케이스1:실패/결함A|테스트케이스2:실","question":"다음의 테스트 결과를 평가한 것으로 올바른 설명은 무엇인가?\n[표: 설계된 테스트 케이스 / 테스트 케이스 실행 결과 / 발생된 결함. 테스트 케이스 1: 실패 / 결함 A | 테스트 케이스 2: 실패 / 결함 A | 테스트 케이스 3: 실패 / 결함 A | 테스트 케이스 4: 통과 / 없음 | 테스트 케이스 5: 통과 / 없음 | 테스트 케이스 6: 실패 / 결함 A | 테스트 케이스 7: 실패 / 결함 B]","options":["테스트를 통해 결함을 발견하였으므로 재사용 가능한 테스트 케이스 후보로 볼 수 있다.","결함을 검출하는데 많은 수의 테스트 케이스가 사용되었다.","해당 모듈이 이미 높은 수준의 품질에 도달하였다.","사용된 테스트 케이스의 효율성이 높다."],"explanation":"[테스트 케이스 실패율] = 실패된 테스트 케이스 / 설계된 테스트 케이스 수 → 5/7 = 71%. 테스트 케이스 실패율이 낮은 경우: 결함을 검출하지 못하고 통과(Pass)되는 테스트 케이스가 많은 것. 테스트 케이스 실패율이 높은 경우: 결함을 검출할 가능성이 높은 것으로 효과적인 테스트를 수행한 것. [테스트 케이스 효율성] = 발생된 결함 수 (중복 제외) / 설계된 테스트 케이스 수 → 2/7 = 29%. 테스트 효율성이 낮은 경우: 하나의 결함을 검출하는데 많은 수의 테스트 케이스가 사용된 것","explSource":"book","answer":0},{"id":"csts-appendix-454-1-162","part":"appendix","chapter":0,"qtype":"mc","dupKey":"에러(Error)의정의로올바른것은무엇인가?","question":"에러(Error)의 정의로 올바른 것은 무엇인가?","options":["결함의 원인으로 사람에 의하여 생성된 실수를 말한다.","결함(Fault), 버그(Bug)와 동일한 의미이다.","프로그램의 실행 결과와 올바른 결과의 차이를 말한다.","제품에 포함된 결함을 의미한다."],"explanation":"에러(Error)는 사람이 잘못 이해하거나 실수해서 만들어낸 결과로, 결함(Defect/Fault)의 원인이 된다. 따라서 에러와 결함을 동일시하는 ②는 틀리며, 에러는 사람의 행위, 결함은 그 결과로 산출물에 남은 결점이라는 인과 관계로 구분해야 한다. 프로그램의 실행 결과와 올바른 결과의 차이를 뜻하는 ③은 장애(Failure)에 대한 설명이고, 제품에 포함된 결점을 뜻하는 ④는 결함 자체에 대한 설명이므로 모두 에러의 정의가 아니다.","explSource":"authored","answer":0},{"id":"csts-appendix-454-2-163","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트케이스설계를위한다음의용어정의중올바르지않은것은무엇인가?","question":"테스트 케이스 설계를 위한 다음의 용어 정의 중 올바르지 않은 것은 무엇인가?","options":["요구사항(Requirement): 사용자가 제품에 기대하는 기능 혹은 품질 특성","테스트 시나리오(Test Scenario): 테스트가 필요한 상황","테스트 케이스(Test Case): 입력 + 사전 조건 → 사후 조건 + 예상 출력","테스트 스크립트(Test Script): 테스트 케이스를 작성한 문서"],"explanation":"테스트 스크립트(Test Script)는 테스트 케이스를 실행 가능한 형태로 표현한 것, 즉 실행 순서와 명령이 기술된 절차 또는 자동화 도구가 수행할 수 있는 코드를 말하므로 '테스트 케이스를 작성한 문서'라는 ④의 서술은 옳지 않다. 테스트 케이스를 기술한 문서는 테스트 케이스 명세서이다. 반면 요구사항은 사용자가 기대하는 기능·품질 특성, 테스트 시나리오는 테스트가 필요한 상황, 테스트 케이스는 사전 조건과 입력에 대한 기대 출력·사후 조건의 조합이라는 ①~③의 정의는 모두 타당하다.","explSource":"authored","answer":3},{"id":"csts-appendix-454-3-164","part":"appendix","chapter":0,"qtype":"mc","dupKey":"소프트웨어테스트에관한설명중에서올바른것은무엇인가?","question":"소프트웨어 테스트에 관한 설명 중에서 올바른 것은 무엇인가?","options":["프로그램의 오류를 발견하여 프로그램의 품질을 높이는 활동이다.","테스트는 프로그램에 결함이 존재하지 않음을 보여 주기 위한 목적으로 수행한다.","타당하지 않고 예상하지 못한 경우들에 대해서는 테스트를 수행하지 않아도 된다.","프로그램을 가장 잘 이해하는 개발자가 직접 테스트를 수행하는 것이 효과적이다."],"explanation":"② 테스트를 통하여 결함이 없음을 보여 주는 것은 현실적으로 불가능하다. ③ 타당하지 않고 예상하지 못한 경우에 대한 테스트를 반드시 수행해야 한다. ④ 개발자가 아닌 다른 테스터가 테스트를 수행하는 것이 효과적이다.","explSource":"book-dup","answer":0},{"id":"csts-appendix-454-4-165","part":"appendix","chapter":0,"qtype":"mc","dupKey":"완벽한소프트웨어테스트는불가능하다.다음중그이유를가장잘설명한것은?","question":"완벽한 소프트웨어 테스트는 불가능하다. 다음 중 그 이유를 가장 잘 설명한 것은?","options":["테스트 조직이 작아 할당할 수 있는 테스터가 적기 때문이다.","테스트 지식이 부족하고 테스트 전략과 계획의 완성도가 낮기 때문이다.","개발 일정 대신 테스트 일정을 줄여 결과적으로 충분한 테스트 일정을 확보하지 못하기 때문이다.","무한 입력값, 무한 시간, 코드 내 무한 경로 등을 모두 고려해 테스트할 수 없기 때문이다."],"explanation":"완벽한 테스트는 불가능하며, 이는 소프트웨어의 무한 입력값, 실행 시점의 무한 타이밍, 소프트웨어 코드 내 무한 경로 등을 모두 고려해 테스트할 수 없기 때문이다.","explSource":"book-dup","answer":3},{"id":"csts-appendix-455-5-166","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스팅과디버깅에대한설명으로올바르지않은것은무엇인가?","question":"테스팅과 디버깅에 대한 설명으로 올바르지 않은 것은 무엇인가?","options":["테스팅의 목적은 알려지지 않은 결함의 발견에 있다.","테스팅은 외부 개입을 배제하고, 시스템 내부관련자가 수행하는 것이다.","디버깅은 이미 알고 있는 오류를 수정하는 것이다.","디버깅의 주요작업은 오류의 위치를 파악하고 이를 적절히 수정하는 것이다."],"explanation":"테스팅의 목적은 알려지지 않은 결함을 발견하고자 하는 활동이고, 디버깅은 이미 알고 있는 오류를 수정하는 활동으로 주로 오류의 위치를 찾고 이를 수정하는 작업이 이루어진다.","explSource":"book-dup","answer":1},{"id":"csts-appendix-455-6-167","part":"appendix","chapter":0,"qtype":"mc","dupKey":"소프트웨어개발단계별테스트에대한설명으로올바른것은?","question":"소프트웨어 개발 단계별 테스트에 대한 설명으로 올바른 것은?","options":["단위 테스트: 모듈을 통합하는 과정에 사용되는 인터페이스를 대상으로 상호 작용이 올바르게 이루어지는지 검증하는 테스트","통합 테스트: 개발 시스템이 인수 조건을 만족하는지 검증하는 테스트","시스템 테스트: 시스템이 명세된 요구사항에 맞게 개발되었는지 기능 및 비기능 측면을 확인하는 테스트","인수 테스트: 하나의 소프트웨어 단위가 정상적으로 기능을 수행하는지 여부를 확인하는 테스트"],"explanation":"① 통합테스트에 대한 설명이다. ② 인수테스트에 대한 설명이다. ④ 단위테스트에 대한 설명이다.","explSource":"book-dup","answer":2},{"id":"csts-appendix-455-7-168","part":"appendix","chapter":0,"qtype":"mc","dupKey":"통합테스트를위한다음의전략중적절하지않은것은무엇인가?","question":"통합 테스트를 위한 다음의 전략 중 적절하지 않은 것은 무엇인가?","options":["하향식 통합: 상위 모듈을 먼저 테스트하고 하위의 모듈들을 통합하는 방법으로서, 하위 모듈을 대체할 수 있는 테스트 스텁이 필요하다.","상향식 통합: 하위 모듈을 먼저 테스트하고 상위의 모듈들을 통합하는 방법으로서, 상위 모듈의 역할을 대신하는 테스트 드라이버가 필요하다.","샌드위치 통합: 상향식 통합과 하향식 통합을 동시에 진행한다.","빅뱅 통합: 가장 널리 사용되는 방법으로서, 전체 모듈을 한꺼번에 통합한 후, 단위 테스트를 생략하고 시스템 테스트로 바로 진행한다."],"explanation":"빅뱅(Big Bang) 통합은 모든 모듈을 한꺼번에 결합하는 방식으로, 결함의 원인 위치를 특정하기 어렵고 디버깅이 매우 힘들어 실무에서 권장되지 않으며 '가장 널리 사용되는 방법'이라거나 '단위 테스트를 생략'한다는 ④의 서술은 옳지 않다. 통합 테스트는 단위 테스트를 마친 모듈을 대상으로 하는 것이 전제이다. 하향식 통합에 스텁(Stub), 상향식 통합에 드라이버(Driver)가 필요하다는 ①·②의 설명과 두 방식을 병행하는 샌드위치 통합에 대한 ③의 설명은 모두 올바르다.","explSource":"authored","answer":3},{"id":"csts-appendix-455-8-169","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트전략에대한설명으로가장올바른것은?","question":"테스트 전략에 대한 설명으로 가장 올바른 것은?","options":["테스트 전략은 테스트를 효과적으로 수행하여 테스트 대상의 품질을 향상시키기 위한 전략적 접근법으로 테스트 설계 단계에서 수립한다.","테스트 전략은 테스트 레벨, 유형, 사람, 도구, 절차, 방법, 자원 등과 같은 테스트 요소들에 대해 타당한 근거를 기반으로 결정한다.","테스트 설계 기법이나 테스트 실행 순서 등은 테스트 결과에 영향을 미치므로 테스트 전략 요소로 사용할 수 없다.","조직의 테스트 철학과 개요를 정의한 문서로써 모든 프로젝트의 테스트에 반영해야 한다."],"explanation":"테스트 전략은 테스트 레벨, 테스트 유형, 인력, 도구, 절차, 방법, 자원 등 테스트 요소들을 프로젝트 상황과 위험에 근거해 합리적으로 결정하는 것이므로 ②가 가장 올바르다. ①은 전략 수립 시점을 잘못 말한 것으로, 전략은 설계 단계가 아니라 테스트 계획 단계에서 수립되어 이후 설계·실행의 기준이 된다. ③은 반대로 테스트 설계 기법과 실행 순서가 전략의 대표적인 결정 요소이므로 틀렸고, ④는 조직의 테스트 철학과 방향을 담은 테스트 정책(Test Policy) 수준의 설명이며 프로젝트 특성에 맞게 조정(tailoring)되어야 하므로 모든 프로젝트에 그대로 반영한다고 볼 수 없다.","explSource":"authored","answer":1},{"id":"csts-appendix-456-9-170","part":"appendix","chapter":0,"qtype":"mc","dupKey":"테스트프로세스와관련된설명으로부적절한것은무엇인가?","question":"테스트 프로세스와 관련된 설명으로 부적절한 것은 무엇인가?","options":["테스트 프로세스는 개발 프로세스가 종료된 후에 시작되는 것이 바람직하다.","테스트 프로세스는 효율적이고 효과적인 테스트 수행을 위하여 필요하다.","테스트 활동 자체에 대한 평가를 통하여 지속적으로 테스트 프로세스에 대해 개선하는 것이 바람직하다.","테스트 프로세스의 개선은 테스트 비용을 줄이면서 높은 품질의 소프트웨어를 개발하는 데 도움을 줄 수 있다."],"explanation":"테스트는 개발이 끝난 뒤 시작하는 활동이 아니라 요구사항 정의 시점부터 병행되어야 하므로 ①이 부적절하다. 결함은 발견 시점이 늦어질수록 수정 비용이 커지기 때문에 요구사항·설계 산출물에 대한 정적 테스팅으로 조기에 결함을 찾는 조기 테스팅(Early Testing) 원리가 적용된다. 테스트 프로세스가 효과적·효율적 수행을 위해 필요하고, 테스트 활동 자체를 평가해 지속적으로 개선하면 비용 절감과 품질 향상에 기여한다는 ②~④는 모두 타당한 설명이다.","explSource":"authored","answer":0},{"id":"csts-appendix-456-10-171","part":"appendix","chapter":0,"qtype":"mc","dupKey":"다음은무엇에대한설명인가?[지문상자:테스트가테스트요구사항을얼마큼만족하는지나타내는용어로\"테스팅정도에대한양적평가\"를결정하는것이다.이를근거로얼마나더해야","question":"다음은 무엇에 대한 설명인가?\n[지문 상자: 테스트가 테스트 요구사항을 얼마큼 만족하는지 나타내는 용어로 \"테스팅 정도에 대한 양적 평가\"를 결정하는 것이다. 이를 근거로 얼마나 더 해야 할지 또는 테스트를 멈출지 결정할 수 있다.]","options":["테스트 효율성","테스트 조건","테스트 케이스 실패율","테스트 커버리지"],"e
