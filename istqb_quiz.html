 아직 덮이지 않은 쌍을 가장 많이 덮는 값을 채워 넣는 순서로 설계한다. 인자가 3개이고 각 값이 2개씩이면 전체 조합 8개 대신 최소 4개의 테스트 케이스로 모든 쌍을 덮을 수 있다.","note":"설계 순서는 쌍 목록(AP) 작성 → 미충족 쌍 확인 → 수평 확장 — 빈칸 채우기 문제는 미충족 쌍을 찾으면 바로 답이 나온다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"ISO/IEC/IEEE 29119","en":"ISO/IEC/IEEE 29119","def":"소프트웨어 테스팅에 관한 국제 표준으로 테스트 개념·용어, 테스트 프로세스, 테스트 문서, 테스트 기법 등을 규정한다. 테스트 프로세스를 조직 테스트 프로세스, 테스트 관리 프로세스, 동적 테스트 프로세스의 계층으로 정의하고, 테스트 방법을 명세 기반, 구조 기반, 경험 기반으로 분류한다. CSTS 교재의 테스트 프로세스와 산출물 체계가 이 표준을 따른다.","note":"테스트 방법 분류의 빈칸 문제는 경험 기반이 정답 — 요구사항·키워드·시나리오 기반은 분류 축이 아니다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"동적 테스트 프로세스","en":"Dynamic Test Process","def":"실제로 소프트웨어를 실행하여 테스트를 수행하는 프로세스로, 테스트 설계 및 구현 → 테스트 환경 구축 및 관리 → 테스트 실행 → 결함 보고의 순서로 구성된다. 테스트 대상과 범위 자체는 테스트 계획에서 결정되고, 동적 테스트 프로세스에서는 그 범위를 세분화하고 전략을 구체화한다. 테스트 모니터링 및 제어는 여기에 포함되지 않는다.","note":"동적 테스트 프로세스에서 테스트 범위를 확장한다는 서술은 틀림 — 범위는 계획에서 정해지고 여기서는 세분화·구체화만 한다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"조직 테스트 전략","en":"Organizational Test Strategy","def":"조직 테스트 정책을 실현하기 위한 테스트 접근 방법을 정의하는 문서로, 테스트 독립성, 동적 테스트 활동별 시작·종료 조건, 테스트 메트릭 등 개별 테스트 수준의 전략과 결함 관리 절차 같은 프로젝트 수준의 전략을 함께 담는다. 테스트 레벨, 유형, 사람, 도구, 절차, 방법, 자원 같은 요소를 타당한 근거를 기반으로 결정한다. 조직 차원 문서지만 개별 프로젝트의 테스트 계획서에서 구체화된다.","note":"테스트 독립성·시작/종료 조건·메트릭은 개별 테스트 수준, 결함을 종결까지 추적하는 절차는 프로젝트 수준으로 성격이 다르다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"조직 테스트 정책","en":"Organizational Test Policy","def":"조직 수준에서 테스트의 목적과 원칙을 정의하는 최상위 테스트 명세로, 테스트 목적, 테스트 프로세스, 테스트 조직 및 역할, 테스트 표준, 테스트 자산 관리, 테스트 프로세스 개선을 결정한다. 테스트를 수행하는 구체적인 방법까지는 언급하지 않는다는 점이 테스트 전략과의 핵심 차이다. 조직 테스트 정책 명세서 형태로 문서화된다.","note":"정책은 무엇을·왜(원칙), 전략은 어떻게(접근법) — 구체적 수행 방법이 나오면 정책이 아니다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"조직 테스트 프로세스","en":"Organizational Test Process","def":"조직 전체가 공통으로 준수할 테스트 정책과 테스트 전략을 수립하고 유지하는 최상위 테스트 프로세스다. 개별 프로젝트의 테스트 관리 프로세스는 이 조직 테스트 프로세스를 기반으로 정의되어야 한다. 개별 테스트의 특성을 고려한다는 이유로 조직 공통의 테스트 정책을 참조하지 않아도 된다는 것은 잘못된 서술이다.","note":"3계층 구조는 조직 테스트 프로세스 → 테스트 관리 프로세스 → 동적 테스트 프로세스 순으로 좁아진다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"테스트 관련 표준","en":"Testing-related Standards","def":"테스트 활동에서 참조하는 국제 표준들은 주제가 서로 다르므로 짝을 정확히 구분해야 한다. ISO/IEC 33063은 테스트 프로세스 평가, IEEE 1028은 리뷰(정적 검토), ISO/IEC 25023은 품질 측정, ISO/IEC 16805는 위험 관리에 해당한다. 품질 모델은 ISO/IEC 25010이 담당하며 ISO/IEC 33063과 혼동하기 쉽다.","note":"33063=프로세스 평가, 1028=리뷰, 25023=품질 측정, 25010=품질 모델로 짝을 외운다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"테스트 관리 프로세스","en":"Test Management Process","def":"테스트 계획, 테스트 모니터링 및 제어, 테스트 종료(완료)의 세 활동으로 구성되어 동적 테스트의 수행을 관리하는 프로세스다. 테스트 대상과 범위를 식별하고 전략을 수립하며, 동적 테스트의 진행을 모니터링해 필요시 제어하고, 종료 시 산출물 관리·환경 정리·종료 보고를 수행한다. 프로젝트 전체뿐 아니라 컴포넌트·통합·시스템·인수 테스트 등 개별 테스트 관리에도 적용한다.","note":"테스트 실행 결과를 분석해 결함을 식별·기록하는 것은 관리 프로세스가 아니라 동적 테스트 프로세스의 활동이다."},{"chapter":11,"chapterName":"테스트 프로세스 개요","term":"테스트 독립성","en":"Test Independence","def":"테스트를 수행하는 주체가 개발 주체로부터 얼마나 분리되어 있는지를 나타내는 정도로, 비용·위험·목표 품질 수준을 고려해 조직 테스트 전략에서 전체적인 독립성 형태를 결정한다. 독립성이 높을수록 개발자의 편향을 피해 결함 검출력이 올라가지만 비용과 커뮤니케이션 부담이 커진다. 프로그램을 가장 잘 이해하는 개발자가 직접 테스트하는 것이 효과적이라는 서술은 틀리며, 개발자가 아닌 다른 테스터가 수행하는 것이 효과적이다.","note":"결함을 발견한 테스터가 그 결함을 직접 수정한다는 서술도 오답 — 수정은 개발자의 일이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"결함 나이","en":"Defect Age","def":"결함이 Open된 시점부터 Closed된 시점까지 걸린 시간을 나타내는 테스트 관리 메트릭이다. 1월 1일 Open되고 1월 17일 Closed되었다면 중간의 Assigned·Resolved·Verified 날짜와 무관하게 결함 나이는 17일이다. 결함 나이가 길면 결함 처리 지연을 의미하므로 모니터링 및 제어의 개선 대상이 된다.","note":"Open~Resolved나 Open~Verified가 아니라 Open~Closed 전체 구간임을 반드시 확인한다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"위험 조치","en":"Risk Response","def":"식별·평가된 위험에 대응하는 방안으로 위험 완화, 위험 전가, 위험 수용 등이 있다. 위험 완화는 발생 가능성을 낮추거나 영향도를 축소하는 방안 수립이고, 위험 전가는 해당 피처의 테스팅을 아웃소싱하는 것처럼 위험을 다른 주체로 옮기는 것이며, 위험 수용은 특별한 조치 없이 모니터링만 하는 것이다. 비상 계획(Contingency plan)은 위험도가 높은 것만이 아니라 조치가 필요하다고 판단된 모든 위험에 대해 준비한다.","note":"비상 계획을 고위험만 대상으로 준비한다는 서술이 대표적 오답이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 계획","en":"Test Planning","def":"테스트 관리 프로세스의 시작 활동으로, 동적 테스트를 효과적·효율적으로 수행하기 위해 테스트의 범위, 수행 방법, 일정을 수립하는 활동이다. 언제 테스트를 종료할지, 단위 테스트를 수행할지, 테스트 케이스를 소스 코드 기반으로 만들지 같은 이슈를 결정한다. 테스트를 수행할 인적 자원의 역량과 역할도 이 단계에서 결정된다.","note":"어떤 코딩 스타일을 사용할지는 개발(프로그래밍)에서 결정할 사항이므로 테스트 계획의 이슈가 아니다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 시작 조건","en":"Entry Criteria","def":"테스트 활동을 시작하기 위해 충족되어야 하는 전제 조건으로, 테스트 대상의 준비 상태, 테스트 환경 구축 완료, 테스트 산출물 승인 등이 포함된다. 조직 테스트 전략에서 동적 테스트 프로세스의 활동별로 시작 조건과 종료 조건을 함께 기술할 수 있다. 시작 조건이 충족되지 않은 상태에서 테스트를 시작하면 재작업 비용이 커진다.","note":"시작·종료 조건은 개별 테스트 수준의 전략 항목이며, 실제 시작·종료 결정은 모니터링 및 제어에서 내린다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 역할과 책임","en":"Test Roles and Responsibilities","def":"테스트 조직의 역할별 담당 작업을 정의한 것으로, 테스트 리더는 테스트 계획 수립과 테스트 현황 보고를 담당한다. 테스트 설계자는 테스트 케이스를 개발하고, 테스트 환경 전문가는 테스트 환경을 구축하며, 테스트 수행자는 테스트 절차를 실행한다. 역할별 역량과 책임은 테스트 계획 단계에서 결정된다.","note":"테스트 리더=계획 수립+현황 보고, 설계자=테스트 케이스 개발, 환경 전문가=환경 구축으로 짝을 정확히 기억한다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 전략","en":"Test Strategy","def":"테스트 목적을 달성하기 위한 접근 방법을 정하는 계획 요소로, 테스트 중단 및 재시작 조건, 테스트 메트릭, 테스트 완료 기준, 테스트 설계 기법, 테스트 독립성 등을 포함한다. 테스트 레벨·유형·사람·도구·절차·방법·자원 같은 요소를 타당한 근거를 기반으로 결정한다. 위험을 식별하고 대처 방안을 수립하는 위험 분석은 테스트 전략이 아니라 별도의 위험 관리 항목이다.","note":"전략 항목 고르기 문제에서 위험 식별·대처 방안이 섞여 있으면 그것만 제외하면 된다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 종료 보고서","en":"Test Completion Report","def":"테스트 종료 시 작성하는 문서로, 테스팅 요약, 계획 대비 차이점, 테스트 메트릭, 테스트 방해 요인, 테스트 완료 평가, 잔존 위험, 결함 목록, 테스트 산출물, 재사용 가능한 테스트 자산, 교훈을 담는다. 첫 항목인 테스트 요약에는 테스트 대상 목록, 관련 계획서·설계 명세서·케이스 명세서, 테스트 환경을 간략히 기술한다. 재사용 가능한 산출물과 교훈은 테스트 요약이 아닌 별개의 항목으로 기술된다.","note":"신규 및 변경 위험은 종료 보고서가 아니라 테스트 현황 보고서에 기록된다 — 잔존 위험과 혼동하지 않는다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 종료 조건","en":"Exit Criteria","def":"테스트 대상에 대해 충분한 테스트를 수행했다고 판단할 수 있는 기준으로 테스트 완료 기준이라고도 한다. 95% 문장 커버리지 충족, 90% 테스트 케이스 통과율, 2개 이하 결함만 허용처럼 커버리지·통과율·잔여 결함 수를 모두 기준으로 쓸 수 있고, 전체 요구사항 중 확인된 비율이나 발견 결함 대비 수정 결함 수도 사용된다. 최종 종료 판단은 테스트 수행 결과, 잔여 결함 수준, 고객의 승인 여부 등으로 결정한다.","note":"개발자의 승인 여부는 종료 조건 기준이 될 수 없다 — 승인 주체는 고객이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 종료 활동","en":"Test Completion","def":"테스트 관리 프로세스의 마지막 활동으로, 생성된 산출물을 재사용 가능한 자산으로 관리하고 테스트 환경 요소를 사용 이전 상태로 복구하며 테스트 종료 보고를 수행한다. 테스트 완료 기준을 바탕으로 테스트 완료 여부를 평가하는 것도 종료 활동에서 이루어진다. 미해소된 위험에 대해서는 해소되지 않은 이유와 품질에 미치는 영향을 분석한다.","note":"테스트 환경과 데이터에 대한 요건을 정의하는 것은 종료가 아니라 분석·설계 및 환경 구축 단계의 일이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 중단 및 재시작 조건","en":"Suspension and Resumption Criteria","def":"수행 중인 테스트 활동을 중단시켜야 하는 상황과 중단된 테스트를 다시 시작할 수 있는 조건을 기술한 테스트 전략 항목이다. 치명적 결함으로 테스트 진행이 불가능하거나 테스트 환경이 붕괴된 경우처럼 더 이상 테스트가 의미 없는 상황을 기준으로 정한다. 테스트 완료 기준과 달리 테스트를 끝내는 것이 아니라 일시 정지하고 복귀하는 기준이라는 점이 다르다.","note":"중단·재시작 조건은 테스트 전략에 포함되는 항목이며 완료 기준과 별개로 출제된다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 총괄 계획서","en":"Master Test Plan","def":"프로젝트 전체의 테스트 활동을 아우르는 상위 계획 문서로, 테스트 범위, 가정 및 제약 사항, 프로젝트 위험, 조직과 역할, 일정, 테스트 자동화 전략 등을 담는다. 테스트 자동화 전략은 이 문서에 포함되어 프로젝트 초기에 이해관계자와 합의되어야 한다. 각 테스트 레벨별 세부 계획은 별도의 레벨 테스트 계획서로 구체화된다.","note":"피처 집합별 피처 목록은 계획서가 아니라 테스트 설계 명세서에 들어간다는 것이 대표적 함정이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 추정","en":"Test Estimation","def":"테스트에 필요한 업무량, 기간, 비용, 인력을 산정하는 활동으로, 테스트 업무량을 먼저 도출한 뒤 그에 맞춰 가용 인원과 리소스를 배치하는 순서로 진행한다. 테스터 배정은 가용성보다 역량을 우선 고려해야 하고, 테스트 자동화 도구 사용 여부도 전문 지식과 경험이 필요하므로 배정 시 반드시 고려한다. 조직 내에 특정 테스트 업무를 수행할 테스터가 없으면 외부에서 전문가를 찾아 일정에 참여시키도록 계획한다.","note":"가용 인원을 먼저 확인한 뒤 업무량을 산정한다는 서술은 순서가 뒤바뀐 오답이다."},{"chapter":12,"chapterName":"테스트 관리 프로세스","term":"테스트 컨텍스트","en":"Test Context","def":"테스트 계획 수립 시 테스트가 놓인 상황을 규정하는 부분으로, 테스트 대상, 테스트 범위, 가정 및 제약 사항, 이해관계자를 정의한다. 테스트 대상의 미션이나 비즈니스 목표를 기술하고, 대상과 범위를 바탕으로 어떤 개별 테스트를 수행할지 결정하며, 테스트 레벨별로 초점을 두는 범위가 다를 수 있음을 반영한다. 테스트 완료 여부를 결정하는 기준은 컨텍스트가 아니라 테스트 전략에 속한다.","note":"컨텍스트=대상·범위·가정및제약·이해관계자 네 가지로 외우고, 완료 기준이 보이면 전략으로 분류한다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"추적성","en":"Traceability","def":"테스트 베이시스의 요구사항·설계 항목과 피처, 테스트 케이스, 테스트 결과 사이의 대응 관계를 유지·확인할 수 있는 성질이다. 테스트 설계 명세서와 테스트 케이스 명세서에 테스트 베이시스 항목에 대한 참조를 나열하는 방식으로 확보한다. 추적성이 확보되면 요구사항 커버리지 측정과 변경 영향 분석, 회귀 테스트 범위 선정이 가능해진다.","note":"추적성은 문서 작성 의무가 아니라 요구사항 커버리지와 회귀 범위 산정의 전제 조건이라는 관점으로 이해한다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 데이터","en":"Test Data","def":"테스트 케이스 실행에 필요한 입력값과 사전 상태를 구성하는 데이터로, 요건은 테스트 설계 단계에서 정의되고 실제 준비는 테스트 실행(환경 구축 및 관리) 단계에서 수행된다. 운영 데이터를 활용할 때는 개인정보 등을 고려한 가공이 필요하다. 테스트 데이터 준비 자체는 테스트 분석 및 설계 활동이 아니라 실행을 지원하는 활동이다.","note":"테스트 수행에 앞서 데이터를 준비한다는 서술은 분석·설계가 아니라 테스트 실행 쪽 설명이다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 베이시스","en":"Test Basis","def":"테스트 조건과 테스트 케이스를 도출하는 근거가 되는 모든 문서와 정보로, 요구사항 명세서, 구조 설계 명세서, 유스케이스, 소스 코드 등이 해당한다. 테스트 설계 명세서와 테스트 케이스 명세서에는 각각 대응되는 테스트 베이시스 항목에 대한 참조를 나열해 추적성을 확보한다. 테스트 베이시스가 불완전하면 테스트 조건 도출 자체가 불완전해진다.","note":"테스트 베이시스 참조를 나열하는 것이 곧 추적성 확보이며, 설계 명세서와 케이스 명세서 양쪽에 모두 기술된다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 설계 명세서","en":"Test Design Specification","def":"피처 집합별로 테스트 설계 결과를 기술하는 문서로, 피처 집합의 목적(확인하려는 목표와 범위), 피처 집합별 피처 목록, 테스트 베이시스 참조(추적성), 그리고 구체화한 테스트 전략(테스트 설계 기법, 테스트 환경 요건, 테스트 데이터 요건, 테스트 완료 기준)을 담는다. 이 명세서에 따라 테스트 케이스와 테스트 절차가 정의된다. 테스트 환경 항목의 구체적 요건은 여기가 아니라 테스트 환경 요건 명세서에 기술된다.","note":"피처 집합별 피처 목록은 테스트 계획서가 아니라 테스트 설계 명세서의 항목이다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 스크립트","en":"Test Script","def":"테스트 절차를 자동화 도구가 실행할 수 있는 형태로 구현한 코드나 명령 집합이다. 테스트 케이스를 작성한 문서 자체가 아니라, 테스트를 실행시키기 위한 구현 산출물이라는 점이 구별 포인트다. 테스트 구현 활동에서 테스트 절차와 함께 만들어진다.","note":"테스트 스크립트를 테스트 케이스를 작성한 문서라고 정의한 보기는 틀린 정의다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 케이스 명세서","en":"Test Case Specification","def":"개별 테스트 케이스를 기술하는 문서로, 테스트 대상, 입력 명세, 출력(예상 결과) 명세, 해당 케이스 고유의 테스트 환경, 의존하는 테스트 케이스, 테스트 베이시스 참조를 담는다. 테스트 케이스는 세부 피처를 바탕으로 개발하며, 실행에 필요한 테스트 대상과 환경의 특정 상태(선행 조건)를 기술한다. 예상 결과 항목에는 예상 결과와 실제 결과를 비교하기 위해 필요한 행위(action)도 기술될 수 있다.","note":"실제 출력값을 관찰하는 방법, 구체적 테스트 접근 방법과 통과 기준은 케이스 명세서 항목이 아니다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 프로시저 명세","en":"Test Procedure Specification","def":"테스트 케이스들을 실행하는 절차를 정의한 문서로 테스트 절차서라고도 하며, 테스트 목표, 포함되는 테스트 케이스, 준비·시작·테스트 상세·종료·복원 절차, 결과 측정 방법을 담는다. 하나의 테스트 절차서로 여러 개의 테스트 케이스를 실행할 수 있다. 각 테스트 케이스가 선행 조건을 가지고 있어도 절차를 구성하는 케이스는 실제 실행 순서대로 나열해야 한다.","note":"선행 조건이 있으니 순서와 무관하게 나열해도 된다는 서술은 오답 — 선행 조건만으로 순서가 결정되지 않는다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 환경 구축","en":"Test Environment Setup","def":"테스트 케이스 실행에 필요한 하드웨어, 시스템 소프트웨어, 외부 연동 시스템 또는 시뮬레이터, 공존 소프트웨어, 테스트 도구 등을 준비하는 활동이다. 구축 후에는 요구 및 정의대로 환경이 구축되었는지 확인(점검)해야 하며, 점검에는 테스트 케이스보다 체크리스트가 효과적이다. 시스템 테스트 수준에서는 운영 환경에 근접한 환경 구성이 권장되고, 컴포넌트 테스트 수준에서는 개발자 환경에서 수행하는 것이 일반적이다.","note":"테스트 환경 구축 및 관리 활동의 목표는 테스트 계획이 아니라 테스트 실행 활동을 지원하는 것이다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"테스트 환경 요건 명세서","en":"Test Environment Requirements Specification","def":"테스트 환경 항목별 구체적 요건을 기술하는 문서로, 해당 환경 항목의 활용 목적, 필요한 시점과 사용 기간, 준비 책임 담당자를 담는다. 하드웨어의 규격(CPU, 메모리 등)까지 구체적으로 정의되어야 하며 추후로 미루면 안 된다. 테스트 환경 항목의 중요도와 우선순위는 이 명세서에 기술되지 않는다.","note":"활용 목적·필요 시기·담당자는 포함, 중요도·우선순위는 미포함이 정답 패턴이다."},{"chapter":13,"chapterName":"테스트 분석·설계·구현 및 환경 구축","term":"피처","en":"Feature / Test Condition","def":"테스트 베이시스를 분석해 도출한 테스트 대상의 특성으로, 무엇을 테스트할지를 나타내는 테스트 조건에 해당한다. 여러 피처를 묶은 것이 피처 집합이며, 각 피처를 구체화한 것이 세부 피처다. 세부 피처에는 무엇을 테스트할지의 내용, 우선순위, 테스트 베이시스 참조를 기술한다.","note":"테스트 설계 기법은 세부 피처나 피처별이 아니라 피처 집합별로 기술된다는 것이 최대 함정이다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"결함 관리 도구","en":"Defect Management Tool","def":"결함의 등록, 할당, 상태 변경, 이력 추적을 지원하는 이슈 관리 도구로 Jira 등이 대표적이다. 상태 전이를 도구 워크플로로 구성해 결함 생명 주기를 강제하고, 결함 나이·결함 밀도 같은 메트릭을 자동 집계해 모니터링 및 제어에 활용할 수 있다. 테스트 실행 자동화 도구(캡처/재생, 성능, 메모리 테스트 도구)와는 범주가 다르다.","note":"커버리지 분석 도구는 테스트 실행 자동화 도구가 아니라 분석·측정 도구로 분류된다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"결함 생명 주기","en":"Defect Life Cycle","def":"식별된 결함이 상태 변화를 거치며 관리되는 과정으로, 교재의 표준 흐름은 Open → Review → Assigned → Resolved → Verified → Closed다. 이슈 관리 도구를 사용하는 프로젝트에서는 Open → In progress → Resolved → Closed로 단순화하고, Closed 이후 동일 결함이 재발하면 Re-open으로 되돌려 다시 In progress로 보내도록 설계할 수 있다. Verified 단계에서 Fixed, Duplicated, Won't Fix, Invalid로 분류되며, 즉시 수정하지 않고 다음 릴리스로 연기하는 Deferred도 생명 주기의 정상적인 상태다.","note":"결함 생명 주기는 조직·프로젝트 특성에 따라 다르게 정의할 수 있고, Resolved는 개발자가 처리한 상태이며 Verified는 그 처리를 검증한 상태다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"결함 심각도","en":"Defect Severity","def":"결함이 시스템의 기능과 품질에 미치는 영향의 크기를 나타내는 등급으로, 데이터 손실이나 시스템 중단처럼 기술적 파급이 큰 결함에 높은 값이 부여된다. 결함이 발생시키는 결과 자체의 무게를 재는 것이므로 주로 테스터가 객관적 기준에 따라 판정한다. 결함 보고서의 필수 기재 항목이며 우선순위와 함께 기록된다.","note":"심각도는 얼마나 심한가(영향도), 우선순위는 얼마나 급한가(처리 순서) — 심각도가 높아도 우선순위가 낮을 수 있다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"결함 우선순위","en":"Defect Priority","def":"결함을 얼마나 빨리 수정해야 하는지를 나타내는 처리 순서의 등급으로, 비즈니스 가치, 사용 빈도, 릴리스 일정 같은 관리적 판단이 반영된다. 심각도가 낮아도 사용자가 매일 보는 화면의 오타처럼 비즈니스 영향이 크면 우선순위가 높을 수 있고, 반대로 심각도가 높아도 거의 발생하지 않는 경로의 결함은 우선순위가 낮아 연기(Deferred)될 수 있다. 결함 보고서에 심각도와 함께 별도 항목으로 기록된다.","note":"심각도는 결함의 속성, 우선순위는 처리 정책 — 둘은 항상 같은 값이 아니며 독립적으로 부여된다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"결함의 구체화·고립화·일반화","en":"Specification, Isolation, Generalization of Defects","def":"테스트 실행으로 발견된 오류를 보고 가능한 형태로 다듬는 세 가지 작업이다. 구체화는 오류를 재연할 수 있을 정도로 상세히 기술하는 것, 고립화는 사용된 테스트 데이터·절차·환경 중 어떤 요소가 결함 발생에 영향을 미치는지 분석해 원인 범위를 좁히는 것, 일반화는 특정 케이스에 한정되지 않는 더 넓은 조건에서도 발생함을 확인하는 것이다. 이 세 작업을 거친 결과가 Open 상태의 결함으로 보고된다.","note":"고립화(Isolation)의 정의 문장은 O/X로 자주 출제되므로 어떤 요소가 결함에 영향을 미치는지 분석한다는 표현을 그대로 기억한다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"테스트 결함 보고서","en":"Defect Report","def":"테스트 수행 시 발생한 사건을 기록한 문서로 테스트 사건 보고서라고도 하며, 결함 요약, 오류 이해와 재현을 위한 테스트 절차·테스트 케이스·테스트 환경, 오류 발생 시간, 실제 결과와 예상 결과의 차이 분석, 결함의 심각도와 우선순위, 결함과 관련된 새로운 위험 요소 분석을 담는다. 결함을 구체화·고립화·일반화해 해결을 도울 수 있는 정보도 기술한다. 결함 수정 방법, 수정 예상 비용, 결함이 영향을 미칠 요구사항은 기재하지 않는다.","note":"미기재 3종 세트(수정 방법·수정 예상 비용·관련 요구사항)를 묶어서 외우면 오답 고르기가 쉬워진다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"테스트 로그","en":"Test Log","def":"테스트 수행 시 실제로 수행한 작업과 발생한 오류들을 시간대별로 기록한 문서로, 필요 시 테스트를 동일하게 재연할 수 있을 정도로 상세히 작성한다. 테스트 절차서와 달리 실행 중에 작성되는 산출물이며, 테스트 사건(결함) 보고서와 테스트 요약 보고서도 같은 시점 이후에 작성된다. 테스트 케이스를 생성하는 과정은 로그에 기록되지 않는다.","note":"작성 시점이 다른 문서를 고르는 문제에서는 테스트 절차서만 실행 이전(설계·구현 시점) 산출물이다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"테스트 실행","en":"Test Execution","def":"사전에 정의된 테스트 환경에서 테스트 절차에 따라 테스트 케이스를 실행하고 결과를 관찰·비교하는 활동으로, 테스트 프로세스 활동 중 일반적으로 가장 많은 시간이 소요된다. 수많은 테스트 케이스 중 무엇을 먼저 실행할지 결정해야 하고, 실행 중 발생한 일은 시간대별로 기록해 재연이 가능하게 한다. 테스트 레벨에 따라 실행 주체가 달라진다.","note":"실행 소요 시간이 가장 크다는 점, 그리고 테스트 완료 기준이 실행 중 절차 선택에도 쓰인다는 점이 함께 출제된다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"테스트 실행 주체","en":"Test Execution Roles","def":"테스트 레벨에 따라 실행 주체가 달라지며, 컴포넌트 테스트는 개발자와 테스터, 통합 테스트는 개발자와 테스터, 시스템 테스트는 개발자와 테스터 및 사용자, 인수 테스트는 테스터와 사용자가 주체가 된다. 인수 테스트의 일반적인 수행 주체는 고객 또는 사용자다. 레벨이 높아질수록 사용자의 참여 비중이 커진다.","note":"통합 테스트를 개발자와 사용자가 수행한다고 쓴 지문은 오답 — 통합 테스트는 개발자와 테스터다."},{"chapter":14,"chapterName":"테스트 실행 및 결함 보고","term":"테스트 절차 선택 기준","en":"Test Procedure Selection Criteria","def":"실행할 테스트 절차의 순서를 정하는 기준으로, 테스트 절차에 부여된 우선순위를 활용하거나 테스트 완료 기준 달성에 가장 크게 기여하는 절차를 먼저 실행한다. 회귀 테스트용 테스트 케이스를 선택할 때는 변경으로 영향받을 부분이 큰 것부터 먼저 실행한다. 테스트 완료 기준은 실행 후 평가만을 위한 것이 아니므로 절차 선택의 근거로도 쓰인다.","note":"회귀 테스트에서 영향이 작은 것부터 실행한다는 서술은 오답 — 영향이 큰 것이 먼저다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"모니터링 및 제어 단계","en":"Set up - Monitor - Control - Report","def":"테스트 모니터링 및 제어는 설정(Set up) → 모니터(Monitor) → 제어(Control) → 보고(Report)의 네 단계로 이루어진다. 설정 단계에서 측정할 메트릭과 수집 방법을 준비하고, 모니터 단계에서 진척과 품질을 측정하며, 제어 단계에서 계획과의 차이를 조정하고, 보고 단계에서 테스트 현황을 이해관계자에게 전달한다. 이 단계들은 동적 테스트가 진행되는 동안 반복 수행된다.","note":"네 단계 순서를 묻는 문제가 나오면 설정-모니터-제어-보고 순으로 답한다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"테스트 모니터링","en":"Test Monitoring","def":"테스트 계획에서 결정된 메트릭을 이용해 테스트 활동의 실제 진척도가 계획과 차이가 있는지 정량적으로 파악하는 활동이다. 차이가 있으면 테스트 진척을 지연시키는 원인을 분석하고, 동시에 새로운 위험 요소를 식별해 위험도 산정과 평가를 수행하여 제어에 반영한다. 계획된 일정에 따라 테스트가 진행되고 있는지 조사하고, 정기·비정기 회의를 통해 진행 상태를 확인한다.","note":"모니터링에서 위험 관리 작업을 생략한다는 서술은 오답 — 모니터링 중 위험 관리가 함께 수행된다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"테스트 모니터링 지표","en":"Test Monitoring Metrics","def":"테스트 진척과 품질을 정량적으로 파악하기 위해 수집하는 메트릭으로, 계획 일정 대비 테스트 수행 진척률, 테스트 케이스 실행률과 통과율, 커버리지 달성도, 결함 발견율·조치율·수정율과 결함 추이 등이 사용된다. 어떤 메트릭을 측정할지는 테스트 계획 단계의 테스트 전략에서 미리 결정된다. 측정·수집된 지표를 통해 계획 대비 진척도를 모니터링한다.","note":"측정할 메트릭을 결정하는 것은 계획(전략)이고, 그 값을 수집·해석하는 것이 모니터링이다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"테스트 제어","en":"Test Control","def":"모니터링 결과를 바탕으로 동적 테스트 활동의 시작과 종료를 결정하고, 테스트 계획과의 차이를 보완하기 위한 작업을 결정하는 활동이다. 계획 대비 차이가 발견되면 한 사이클을 그대로 유지하는 것이 아니라 계획된 테스트 활동을 즉시 조정해야 한다. 테스트 종료 기준을 만족하면 테스트 활동 종료를 승인한다.","note":"테스트 완료 기준을 바탕으로 완료 여부를 평가하는 것은 제어가 아니라 테스트 종료 활동에서 수행된다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"테스트 진척 보고","en":"Test Progress Reporting","def":"테스트 관리자가 정기적으로 검토 회의를 열어 수립된 일정 계획과 실제 테스트 상태·진행 상황을 비교하고, 차이가 있으면 원인과 파급 효과를 분석해 이해관계자에게 보고하는 활동이다. 산출물은 테스트 현황 보고서이며 여기에는 신규 및 변경 위험이 기록된다. 테스트 종료 보고서와 달리 테스트가 진행되는 동안 주기적으로 작성된다.","note":"신규·변경 위험은 현황 보고서, 잔존 위험은 종료 보고서에 기록된다는 대비를 기억한다."},{"chapter":15,"chapterName":"테스트 모니터링 및 제어","term":"편차 대응","en":"Deviation Handling","def":"모니터링으로 파악된 계획과 실제의 차이(편차)에 대해 원인을 분석하고 테스트 활동을 조정하는 제어 작업이다. 일정 지연, 결함 처리 정체, 커버리지 미달 같은 편차에 대해 리소스 재배치, 우선순위 재조정, 범위 조정, 위험 조치 등을 결정한다. 편차가 있어도 한 사이클 동안 계획을 그대로 유지하는 것은 올바른 대응이 아니다.","note":"편차 발견 → 원인 분석 → 파급 효과 분석 → 계획 조정의 흐름으로 답을 구성한다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"ISO/IEC 33063 프로세스 역량 레벨","en":"ISO/IEC 33063 Process Capability Levels","def":"테스트 프로세스를 평가하기 위한 표준으로, 역량 레벨은 수행(프로세스 목적을 달성하는 정도), 관리(수행된 프로세스와 작업 산출물이 적절하게 관리되는 정도), 확립(정의된 프로세스를 사용해 프로세스 성과를 달성하는 정도), 예측(정량적으로 관리되어 결과를 예측할 수 있는 정도), 혁신(예측 가능한 프로세스가 조직의 변경에 대응하기 위해 지속적으로 혁신 목적을 달성하는 정도)으로 구성된다. 각 레벨은 아래 레벨을 만족한 뒤에 달성된다. 평가 결과는 테스트 프로세스 개선 계획의 근거가 된다.","note":"최상위 레벨의 이름은 최적화(Optimizing)가 아니라 혁신(Innovating)이다 — 이름을 바꿔 놓은 보기가 오답이다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"결함 구속 효율성","en":"Defect Containment Efficiency","def":"특정 개발 단계에서 발생(도입)한 결함을 바로 그 단계에서 검출하는 비율을 나타내는 메트릭이다. 결함이 발생 단계를 넘어 다음 단계로 흘러가지 않도록 가두는 능력을 재기 때문에, 계산 시 분모는 해당 단계에서 도입된 결함의 총수이고 분자는 그중 해당 단계에서 검출된 결함 수다. 설계 단계에 도입된 결함이 70개이고 그중 설계 단계에서 검출된 것이 20개라면 20/70 = 약 28.6%다.","note":"결함 발생-검출 교차표 문제에서는 해당 단계의 열 합계를 분모로, 대각선 값(같은 단계 검출)을 분자로 쓴다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"결함 밀도","en":"Defect Density","def":"소프트웨어의 크기 단위당 검출된 결함의 개수를 나타내는 메트릭으로, 검출된 결함 수를 규모(KLOC, 기능 점수, 모듈 수 등)로 나눠 계산한다. 모듈 간 품질을 비교하거나 결함이 집중된 영역을 찾아 추가 테스트 대상을 선정하는 데 쓰인다. 특정 모듈에서 평균 이상의 결함 밀도가 나오면 그 모듈에 결함이 더 존재할 가능성이 높으므로 테스트 노력을 더 투입하고 설계·구조 문제를 조사해야 한다.","note":"결함 밀도는 규모로 나눈 값, 테스트 케이스 효율성은 테스트 케이스 수로 나눈 값 — 분모가 다르다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"결함 제거 효율성","en":"Defect Removal Efficiency (DRE)","def":"전체 결함 중에서 출하(릴리스) 전에 검출·제거된 결함의 비율을 나타내는 테스트 효과성 메트릭이다. 출하 전 검출 결함 수를 출하 전 검출 결함과 출하 후 발견 결함의 합으로 나눠 계산하며, 값이 높을수록 테스트가 효과적이었다는 뜻이다. 단계별로 계산하면 각 단계의 결함 걸러내기 능력을 비교할 수 있다.","note":"결함 제거 효율성은 전체 결함 대비 사전 제거 비율, 결함 구속 효율성은 해당 단계 발생 결함을 그 단계에서 잡은 비율이다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"교훈","en":"Lessons Learned","def":"수행한 테스트를 통해 얻은 경험과 개선점을 정리한 것으로, 재사용 가능한 테스트 자산과 함께 테스트 종료 보고서의 별개 항목으로 기술된다. 다음 프로젝트의 테스트 계획과 조직 테스트 프로세스 개선의 입력으로 활용되어 조직의 테스트 역량을 누적시킨다. 테스트 요약 항목에 포함되는 내용이 아니라는 점이 자주 출제된다.","note":"교훈과 재사용 가능한 산출물은 테스트 요약이 아닌 독립 항목 — 요약에는 대상·관련 문서·환경만 들어간다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 케이스 실패율","en":"Test Case Failure Rate","def":"실패한 테스트 케이스 수를 설계된 테스트 케이스 수로 나눈 값으로, 테스트 케이스가 결함을 얼마나 잘 드러내는지를 나타낸다. 실패율이 높으면 결함을 검출할 가능성이 높은 효과적인 테스트를 수행한 것이고, 낮으면 결함을 검출하지 못하고 통과되는 테스트 케이스가 많은 것이다. 결함을 발견한 테스트 케이스는 재사용 가능한 테스트 자산 후보로 볼 수 있다.","note":"7개 중 5개 실패면 실패율 71%, 중복 제외 결함 2개면 효율성 29% — 두 값을 같은 표에서 따로 계산하는 문제가 나온다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 케이스 효율성","en":"Test Case Efficiency","def":"검출된 전체 결함의 수를 생성된 전체 테스트 케이스 수로 나눈 값으로, 테스트 케이스 한 개가 얼마나 효율적으로 결함을 찾아내는지를 나타낸다. 결함 수를 셀 때 중복 결함은 제외하며, 예상 결과와 동일하게 통과한 테스트 케이스 수는 분자와 무관하다. 값이 낮으면 하나의 결함을 검출하는 데 많은 테스트 케이스가 사용된 것을 의미한다.","note":"테스트 케이스 10개에 결함 1개면 1/10 = 10% — 통과한 케이스 수(4개)는 계산에 넣지 않는 것이 함정이다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 평가 및 개선","en":"Test Evaluation and Improvement","def":"테스트 프로세스 자체에 대한 효율 향상과 개선을 목적으로 하는 활동으로, 테스트 종료 후 테스트 활동의 효과성과 효율성을 평가한다. 향후 수정되어야 할 테스트 프로세스 활동에 대한 검토·분석 의견을 제시하고, 새롭게 적용된 활동 및 도구·기법을 평가하며, 발견된 오류 유형을 통해 단계별 테스트 기법을 평가한다. 평가는 전체 테스트 활동이 완료된 후 모니터링으로 수집된 정보를 활용해 수행하는 것이 일반적이다.","note":"테스트 프로세스 효율성 평가를 테스트 활동 중 지속적으로 수행한다는 서술은 오답이다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 평가 보고서","en":"Test Evaluation Report","def":"테스트 프로세스의 마지막 단계에서 작성되는 문서로, 모든 테스트 활동과 결과를 요약하고 테스트 활동에 대한 평가 결과와 테스트 개선 방안을 기술한다. 테스트 결함 보고서, 테스트 현황 보고서, 테스트 종료 보고서와 달리 평가와 개선 방안이 핵심 내용이라는 점이 구별 포인트다. 테스트 평가 및 개선 활동의 산출물이다.","note":"마지막 단계 + 평가 + 개선방안 세 키워드가 함께 나오면 테스트 평가 보고서가 정답이다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 프로세스 개선 모델","en":"TMMi / TPI","def":"테스트 프로세스의 성숙도를 진단하고 개선 경로를 제시하는 모델로 TMMi와 TPI가 대표적이다. TMMi(Test Maturity Model integration)는 CMMI와 유사하게 조직 전체의 테스트 성숙도를 단계적 레벨로 평가하는 모델이고, TPI(Test Process Improvement)는 테스트 프로세스를 여러 핵심 영역으로 나누어 영역별 성숙도를 진단하는 모델이다. ISO/IEC 33063은 표준 기반 프로세스 평가 체계로서 이들과 함께 개선의 근거로 사용된다.","note":"TMMi=단계(레벨) 중심 성숙도, TPI=핵심 영역별 진단, 33063=국제 표준 기반 프로세스 평가로 구분한다."},{"chapter":16,"chapterName":"테스트 평가 및 개선","term":"테스트 효과성 평가 메트릭","en":"Test Effectiveness Metrics","def":"테스트가 목적을 얼마나 달성했는지 평가하는 메트릭 체계로, 커버리지 기반 기준(요구사항 커버리지, 설계 커버리지, 코드 커버리지), 개발 단계에서 생성된 결함을 해당 단계에서 검출하는 비율, 테스트 케이스 통과·실패율 기반 기준이 사용된다. 테스트 케이스의 실패율도 통과 기준으로 삼을 수 있다. 다만 테스트 케이스 통과 기반 기준에서 각 테스트 케이스의 심각도를 고려한다는 서술은 잘못된 것이다.","note":"심각도는 결함의 속성이지 테스트 케이스의 속성이 아니다 — 통과 기반 기준에서 케이스 심각도를 고려한다는 보기는 오답이다."}];        // CSTS 용어 사전
const FORMULAS = [{"group":"구조 기반 커버리지","name":"문장 커버리지","en":"Statement Coverage","formula":"문장 커버리지(%) = (테스트 케이스 집합에 의해 실행된 문장 수 ÷ 전체 실행 가능한 문장 수) × 100","vars":"실행된 문장 수: 테스트 경로가 지나간 노드(문장)의 개수. 전체 실행 가능한 문장 수: 선언문·주석을 제외한 실행 가능 문장. 제어 흐름 그래프 문제에서는 그래프의 노드 1개 = 문장 1개로 세는 것이 출제 관행이며, 판단문 노드도 1개의 문장으로 센다.","example":"노드가 A~J 10개인 제어 흐름 그래프에서 A → B → G → I → J 경로로 테스트한 경우. 실행 노드 = A, B, G, I, J의 5개. 5 ÷ 10 × 100 = 50%. (같은 유형: 노드 8개(A~H) 중 A, C, F, H 4개 실행 → 4 ÷ 8 × 100 = 50%)","tip":"가장 약한 커버리지로, 100%를 달성해도 거짓(False) 분기는 한 번도 실행되지 않을 수 있다."},{"group":"구조 기반 커버리지","name":"분기(결정) 커버리지","en":"Branch / Decision Coverage","formula":"분기 커버리지(%) = (실행된 결정의 결과 수 ÷ 전체 결정의 결과 수) × 100\n최소 테스트 케이스 수 = 결정에서 나가는 분기(결과)의 총 개수","vars":"결정의 결과 수: 판단문에서 뻗어 나가는 간선의 개수. 보통 if 1개 = 참/거짓 2개지만, 다중 분기(switch, 3갈래 판단)는 갈래 수만큼 센다. 전체 조건식(결정)의 T/F만 보고 개별 조건은 보지 않는다.","example":"A → 판단 B에서 C, D, E 세 갈래로 분기 → 모두 F로 합류하는 제어 흐름도. 결정의 결과가 B→C, B→D, B→E의 3개이므로 100% 달성에 필요한 최소 테스트 케이스는 3개. (분기 커버리지 90%란: 프로그램에 분기가 10개 있으면 그중 9개가 실행되었다는 뜻이다)","tip":"분기 커버리지 100%는 문장 커버리지 100%를 보장하지만(포함 관계), 그 역은 성립하지 않는다."},{"group":"구조 기반 커버리지","name":"조건 커버리지","en":"Condition Coverage","formula":"조건 커버리지(%) = (T/F가 실행된 기본 조건의 결과 수 ÷ (기본 조건 수 × 2)) × 100\n최소 테스트 케이스 수 = 2개 (모든 기본 조건이 한 TC에서 T, 다른 TC에서 F가 되게 짤 수 있으면)","vars":"기본 조건(atomic condition): AND/OR로 연결되기 전의 개별 비교식. (X>1) AND (Y==1)은 기본 조건 2개다. 전체 조건식(결정)의 T/F는 세지 않는 것이 조건 커버리지다. Short circuit evaluation이 없다고 가정하라는 지문이 붙으면 AND/OR 뒤쪽 조건도 항상 평가된 것으로 센다.","example":"IF ((X>1) AND (Y==1)) { Z=Z/X }  IF ((X==2) OR (Z>1)) { Z=Z+1 } 에서 기본 조건은 X>1, Y==1, X==2, Z>1의 4개(결과 8개).\nTC2(X=2,Y=1,Z=6): X>1=T, Y==1=T → Z=6/2=3, X==2=T, Z>1=T\nTC3(X=0,Y=0,Z=1): X>1=F, Y==1=F, X==2=F, Z>1=F\nTC2와 TC3만으로 8 ÷ 8 × 100 = 100%. 따라서 TC1(X=1,Y=2,Z=2)은 사용하지 않아도 된다.","tip":"조건 커버리지 100%가 결정(분기) 커버리지 100%를 보장하지 않는다 — 개별 조건은 다 뒤집혔는데 전체 결과는 한쪽만 나올 수 있다."},{"group":"구조 기반 커버리지","name":"결정/조건 커버리지 (조건/분기 커버리지)","en":"Decision/Condition Coverage","formula":"결정/조건 커버리지(%) = (실행된 (기본 조건 결과 + 전체 조건식 결과) 수 ÷ 전체 (기본 조건 결과 + 전체 조건식 결과) 수) × 100","vars":"각 기본 조건식의 T/F와 전체 조건식(결정)의 T/F를 모두 한 번 이상 실행시키는 기준. 분모 세는 법: 기본 조건이 2개인 IF는 기본 조건 4개 + 결정 2개 = 6. 기본 조건이 1개인 IF는 조건과 결정이 같으므로 중복해서 세지 않고 2로 센다.","example":"IF ((X>10) OR (Y==2)) Z=X+Y / IF ((X<Z) AND (Y>15)) Z=X / IF (X<=Z) PRINT(Z)\n분모 = (4+2) + (4+2) + 2 = 14\nTC1(X=15,Y=2,Z=0): X>10=T, Y==2=T, 결정1=T → Z=17 / X<Z=T, Y>15=F, 결정2=F / X<=Z=T\nTC2(X=10,Y=20,Z=0): X>10=F, Y==2=F, 결정1=F → Z=0 / X<Z=F, Y>15=T, 결정2=F / X<=Z=F\n달성: 결정1 관련 6개 전부, 결정2는 조건 4개 + 결정 F만 = 5개, 결정3은 2개. 합 13.\n13 ÷ 14 × 100 = 92.86 ≒ 93%","tip":"두 TC 모두 두 번째 IF의 결정이 F라서 '결정2 = T' 하나만 빠져 93%가 된다 — 분모를 14로 정확히 세는 것이 이 문제의 핵심이다."},{"group":"구조 기반 커버리지","name":"변형 조건/결정 커버리지 (MC/DC)","en":"Modified Condition/Decision Coverage","formula":"MC/DC 100% 조건 = 각 기본 조건이 '그 조건만 바뀌고 나머지는 고정'인 상태에서 전체 결정 결과를 T→F(또는 F→T)로 바꾸는 테스트 케이스 쌍을 하나씩 갖는 것\n기본 조건이 n개일 때 필요한 최소 테스트 케이스 수 = n + 1","vars":"독립 쌍(independence pair): 두 TC를 비교해 ① 해당 조건 1개만 값이 다르고 ② 나머지 조건은 모두 같고 ③ 전체 결과가 서로 다른 쌍. 조건 n개를 다중 조건으로 전부 조합하면 2ⁿ이지만, MC/DC는 n+1개로 줄인다.","example":"결정식 (A and B) or C, 진리표:\nID | A B C | 결과\n 1 | T T T |  T\n 2 | T T F |  T\n 3 | T F T |  T\n 4 | T F F |  F\n 5 | F T T |  T\n 6 | F T F |  F\n 7 | F F T |  T\n 8 | F F F |  F\n[풀이] 조건 A의 독립 쌍: TC2(T,T,F)=T ↔ TC6(F,T,F)=F → B,C는 T,F로 고정, A만 뒤집혀 결과가 바뀜.\n조건 B의 독립 쌍: TC2(T,T,F)=T ↔ TC4(T,F,F)=F → A,C 고정, B만 변화.\n조건 C의 독립 쌍: TC4(T,F,F)=F ↔ TC3(T,F,T)=T → A,B 고정, C만 변화.\n세 쌍에 쓰인 TC를 합집합하면 {2, 3, 4, 6} → 4개. 조건 3개이므로 3 + 1 = 4개와 일치한다. 정답: 2, 3, 4, 6","tip":"TC1(T,T,T)처럼 결과에 기여하는 조건을 특정할 수 없는 케이스는 최소 집합에서 빠진다 — '모두 T'인 행부터 지우고 시작하면 빠르다."},{"group":"구조 기반 커버리지","name":"MC/DC 테스트 데이터 판정법","en":"MC/DC Test Data Selection","formula":"각 TC의 입력값을 (기본 조건1, 기본 조건2, …)의 T/F 패턴으로 바꾼 뒤, 조건별 독립 쌍이 모두 존재하는 보기를 고른다","vars":"실제 값(score=91 등)을 먼저 T/F로 환산하는 것이 요령이다. score>90, period>2, membership=='gold' 세 조건 → 조건 3개이므로 TC 4개가 정답 후보의 개수가 된다.","example":"IF ((score>90 AND period>2) OR membership=='gold') fee=15000 ELSE fee=25000\nTC1(91, 3, basic) → (T, T, F) = T\nTC2(90, 3, gold)  → (F, T, T) = T\nTC3(89, 3, basic) → (F, T, F) = F\nTC4(91, 2, basic) → (T, F, F) = F\n[검증] score>90: TC1(T,T,F)=T ↔ TC3(F,T,F)=F ✔ / period>2: TC1(T,T,F)=T ↔ TC4(T,F,F)=F ✔ / membership: TC2(F,T,T)=T ↔ TC3(F,T,F)=F ✔ → MC/DC 100%","tip":"보기 중 (T,T,T)나 조건 2개가 동시에 바뀌는 쌍이 들어 있으면 독립 쌍이 깨지므로 오답이다."},{"group":"구조 기반 커버리지","name":"다중 조건 커버리지","en":"Multiple Condition Coverage","formula":"필요한 테스트 케이스 수 = 2ⁿ (n = 결정문 내 기본 조건 수)\n다중 조건 커버리지(%) = (실행된 기본 조건 조합 수 ÷ 2ⁿ) × 100","vars":"기본 조건식의 가능한 모든 논리 조합을 최소 한 번씩 실행. 결정문이 여러 개면 결정문별로 2^(그 결정의 조건 수)를 각각 구해 합산한다(곱하지 않는다).","example":"(A and B) or C는 기본 조건 3개 → 2³ = 8개 조합(TTT, TTF, TFT, TFF, FTT, FTF, FFT, FFF) 전부 필요 → 최소 8개 TC.\n같은 식을 MC/DC로 하면 3+1 = 4개면 되므로, 다중 조건은 MC/DC의 2배 비용이 든다.","tip":"구조 기반 커버리지 중 테스트 강도가 가장 높다 — '기본 조건식의 가능한 논리적 조합을 모두 테스트'라는 서술이 나오면 다중 조건이다."},{"group":"구조 기반 커버리지","name":"커버리지 강도 순서와 최소 TC 수 비교","en":"Coverage Strength Hierarchy","formula":"강도(약 → 강): 문장 < 분기(결정) < 결정/조건 < MC/DC < 다중 조건\n조건 n개인 결정문의 최소 TC 수: 분기 = 2, 조건 = 2, 결정/조건 = 2, MC/DC = n + 1, 다중 조건 = 2ⁿ","vars":"포함 관계: 분기 100% ⊃ 문장 100%, 다중 조건 100% ⊃ MC/DC 100% ⊃ 결정/조건 100% ⊃ 분기·조건 100%. 단 조건 커버리지 100%는 분기 커버리지 100%를 포함하지 않는다(별도 가지).","example":"기본 조건이 3개인 결정식 (A and B) or C 기준: 분기 2개 → 결정/조건 2개 → MC/DC 3+1 = 4개 → 다중 조건 2³ = 8개. 조건이 4개로 늘면 MC/DC는 5개, 다중 조건은 2⁴ = 16개로 벌어진다.","tip":"'테스트 강도가 가장 높은 것'은 다중 조건, '가장 약한 것'은 문장 커버리지로 고정 출제된다."},{"group":"구조 기반 커버리지","name":"기본 경로 커버리지","en":"Basis Path Coverage","formula":"기본 경로의 개수 = 순환 복잡도 V(G)\n기본 경로 커버리지(%) = (실행된 기본 경로 수 ÷ 전체 기본 경로 수) × 100","vars":"기본 경로(basis path): 서로 독립적인(다른 경로의 조합으로 만들 수 없는) 경로. 전체 경로를 다 도는 경로 커버리지와 달리, 독립 경로 V(G)개만 테스트하므로 루프가 있어도 개수가 폭발하지 않는다.","example":"순환 복잡도가 4인 computeBill 함수는 기본 경로도 4개이므로, 기본 경로 커버리지 100%에 필요한 최소 테스트 케이스는 4개다.","tip":"구조 기반 커버리지 기준의 예로 '모든 문장 / 모든 분기 / 모든 기본 경로'는 맞고, '모든 상태'는 명세 기반(상태 전이)이므로 오답이다."},{"group":"복잡도","name":"순환 복잡도 — 간선·노드 공식","en":"Cyclomatic Complexity V(G) = E − N + 2","formula":"V(G) = E − N + 2\n(E = 제어 흐름 그래프의 간선 수, N = 노드 수, 2 = 연결 요소가 1개인 그래프의 보정항)","vars":"E는 화살표 개수, N은 사각형·마름모 등 모든 노드 개수. 시작/종료 노드도 센다. 여러 개의 독립 프로시저를 한 그래프에 그렸다면 V(G) = E − N + 2P (P = 연결 요소 수).","example":"computeBill 코드의 제어 흐름도: 노드 = b=0, if(a>120), if(a<=240), b=(a-120)*2, b=(a-240)*2, if(b>=100), b=b*3, return b → N = 8.\n간선 = (b=0→if a>120), (a>120 T→a<=240), (a>120 F→return), (a<=240 T→b=(a-120)*2), (a<=240 F→b=(a-240)*2), (b=(a-120)*2→return), (b=(a-240)*2→if b>=100), (b>=100 T→b=b*3), (b>=100 F→return), (b=b*3→return) → E = 10.\nV(G) = 10 − 8 + 2 = 4","tip":"노드를 어떻게 묶느냐에 따라 E와 N이 같이 변해도 E − N은 일정하므로 값은 바뀌지 않는다 — 세다가 헷갈리면 분기문+1로 교차 검증하라."},{"group":"복잡도","name":"순환 복잡도 — 분기문 공식","en":"Cyclomatic Complexity = Decisions + 1","formula":"V(G) = 분기문(결정문) 수 + 1","vars":"2갈래 분기문(if, while, for, do-while) 1개 = +1. 기본 조건이 여러 개인 if는 논리 연산자 수만큼 더 세는 확장형도 있으나, 출제된 풀이는 판단 노드(마름모) 개수 기준이다. n갈래 case/switch는 (n − 1)개의 분기문으로 센다.","example":"computeBill 코드의 분기문은 if(a>120), if(a<=240), if(b>=100)의 3개.\nV(G) = 분기문 + 1 = 3 + 1 = 4","tip":"실기 단답형에서 가장 빠른 방법 — 코드에서 if/while/for 개수만 세고 1을 더하면 된다."},{"group":"복잡도","name":"순환 복잡도 — 영역 공식과 세 공식의 동치","en":"Cyclomatic Complexity = Regions","formula":"V(G) = 제어 흐름 그래프가 평면을 나누는 영역(region) 수 (닫힌 영역 + 바깥 영역 1개)\n→ E − N + 2 = 분기문 + 1 = 영역 수","vars":"동치인 이유: ① 오일러 공식에 의해 평면 그래프의 영역 수 = E − N + 2이므로 '영역 수 = E − N + 2'가 성립한다. ② 2갈래 분기문 1개가 추가되면 노드는 1개, 간선은 2개 늘어(E − N이 +1) 닫힌 영역도 정확히 1개 늘어난다. 분기문이 0개인 직선 코드는 닫힌 영역 0개 + 바깥 1개 = 1 = 0 + 1이므로 세 공식의 출발점이 같다.","example":"computeBill: 닫힌 영역 3개(if a>120 우회 경로, if a<=240 두 갈래, if b>=100 우회 경로) + 바깥 영역 1개 = 4. E − N + 2 = 10 − 8 + 2 = 4, 분기문 + 1 = 3 + 1 = 4 → 세 값 모두 4로 일치.","tip":"세 방법 중 하나로 구하고 다른 하나로 검산하면 계산 실수를 잡을 수 있다. 값의 의미는 '기본 경로 수 = 100% 분기 커버리지에 필요한 테스트 경로 수의 상한'이다."},{"group":"명세 기반 케이스 수","name":"동등 분할","en":"Equivalence Partitioning","formula":"최소 테스트 케이스 수 = 유효 동등 분할 수 + 비유효 동등 분할 수\n(단일 인자 구간 조건 1개는 보통 유효 1 + 비유효 2 = 3)","vars":"유효 분할(valid class)은 여러 개를 한 TC에 합쳐 넣을 수 있지만, 비유효 분할은 오류 처리가 서로를 가릴 수 있어 1개 TC에 1개씩 넣는다. 분할 수를 셀 때는 인자별로 나눈 뒤 합산한다.","example":"제약 조건 10 ≤ X ≤ 30인 입력 인자 X. 분할은 ① X < 10(비유효) ② 10 ≤ X ≤ 30(유효) ③ X > 30(비유효)의 3개 → 최소 3개 TC(예: X=5, X=20, X=35).\n인자가 여럿인 경우: 리스트 메뉴 M{m1,m2,m3}, 라디오 그룹{r1만, r2만}, r3{선택 안 됨, 선택} → 분할은 3 + 2 + 2 = 7개.","tip":"'모든 값을 다 테스트할 수 없어 대표값 1개로 줄인다'가 목적 — 대표값은 구간의 가운데 값을 쓰고, 경계는 경계값 분석에 맡긴다."},{"group":"명세 기반 케이스 수","name":"경계값 분석","en":"Boundary Value Analysis","formula":"경계 1개당 테스트 값 = 경계값, 경계값 − 1, 경계값 + 1 (3-value) 또는 경계 안쪽·바깥쪽 2개 (2-value)\n최소 테스트 값 개수 ≒ 경계 수 × 2 (2-value 기준)","vars":"유효 구간이 k개 붙어 있으면 경계는 구간 사이마다 생긴다. 구간이 정수 단위로 맞닿아 있으면 '한 구간의 최댓값'과 '다음 구간의 최솟값'이 한 쌍의 경계값이다. 구간의 중간값(25, 50 같은 값)은 경계값 분석의 입력으로 부적절하다.","example":"요구사항: 0~5cm는 후진, 10cm까지는 좌회전, 100cm까지는 전진.\n구간 = [0,5], [6,10], [11,100]. 경계 = 0, 5|6, 10|11, 100.\n선정 값 = −1(하한 미달), 0(하한), 5(1구간 상한), 6(2구간 하한), 10(2구간 상한), 11(3구간 하한), 100(상한), 101(상한 초과) → 8개.\n오답 유형: 0, 1, 2, 5, 25, 50, 100, 101처럼 1, 2, 25, 50 같은 구간 내부값이 섞인 것.","tip":"개발자가 X ≤ 30을 누락해 10 ≤ X로 구현한 결함은 경계 바로 바깥값 31에서만 드러난다 — '경계 누락 오류 검출 가능성이 가장 높은 값'은 상한 + 1이다."},{"group":"명세 기반 케이스 수","name":"결정 테이블","en":"Decision Table Testing","formula":"규칙(열) 수 = 2ⁿ (n = 조건 수, 각 조건이 참/거짓 2값일 때)\n최종 테스트 케이스 수 = 2ⁿ − (논리적으로 실현 불가능한 조합 수) − (병합 가능한 무관(don't care) 조합 수)","vars":"조건이 2값이 아니라 v값을 가지면 규칙 수는 v₁ × v₂ × … × vₙ이 된다. 서로 배타적인 조건(예: r1과 r2를 동시에 선택 불가)이 있으면 그 조합 열은 실현 불가로 제외한다. 결정 테이블은 '입력 조건의 모든 조합'을 보므로 모든 짝만 보는 페어와이즈와 혼동하면 안 된다.","example":"조건이 3개(A, B, C)면 규칙 = 2³ = 8개 열(TTT, TTF, TFT, TFF, FTT, FTF, FFT, FFF) → 최대 8개 TC.\n조건이 4개로 늘면 2⁴ = 16개. 여기서 'A가 F이면 B·C는 결과에 무관'인 열 4개를 하나로 병합하면 실제 TC는 더 줄어든다.\n배타 조건 예: 라디오 버튼 r1, r2가 동시 선택 불가 & 최소 1개 선택 필수라면 (r1=T, r2=T)와 (r1=F, r2=F) 조합은 실현 불가로 제외한다.","tip":"장점 서술은 '복잡한 논리 관계 표현에 좋다', '누락된 요구사항 검사에 좋다'가 정답이고, '모든 짝의 조합을 테스트한다'는 페어와이즈 설명이므로 오답이다."},{"group":"명세 기반 케이스 수","name":"상태 전이 테스트 — 커버리지별 케이스 수","en":"State Transition Testing","formula":"상태 테스트: 필요한 커버 대상 = 상태 수\n단일 전이 테스트(0-switch): 커버 대상 = 유효 전이 수\nAll-transitions 테스트: 커버 대상 = 유효 전이 수 + 무효 전이 수 = 상태 수 × 이벤트 수\n다중 전이 테스트(N-switch): 커버 대상 = 길이 N+1인 전이 시퀀스의 수","vars":"상태 테스트는 모든 상태를 최소 1회 방문, 0-switch는 모든 유효 전이를 최소 1회 실행, all-transitions는 무효(정의되지 않은) 전이까지 포함, N-switch는 연속된 N+1개 전이 시퀀스를 실행한다. '전이 수 기준'이면 0-switch 이상이다.","example":"상태 OFF/DIM/ON(3개), 이벤트 push/off/on(3개). 유효 전이는 OFF-push→DIM, OFF-on→ON, DIM-off→OFF, DIM-push→ON, ON-push→OFF, ON-off→OFF의 6개.\n상태 테스트: (가) OFF→push→DIM, (나) DIM→off→OFF, (다) OFF→on→ON 3개 TC로 OFF, DIM, ON 3개 상태를 모두 방문 → 상태 테스팅에 해당(0-switch는 아님, 전이 6개 중 3개만 커버).\n0-switch: 유효 전이 6개 모두 필요.\nAll-transitions: 3 × 3 = 9개 조합 중 유효 6 + 무효 3(OFF-off, DIM-on, ON-on)까지 전부 → 9개.\n1-switch: 길이 2인 전이 시퀀스(예: OFF-push→DIM-push→ON)를 모두 커버.","tip":"주어진 TC가 '모든 상태를 방문'만 했으면 상태 테스팅, '모든 유효 전이를 실행'했으면 0-switch다 — 개수를 세어 구분하라."},{"group":"명세 기반 케이스 수","name":"페어와이즈 조합 테스트 (직교배열)","en":"Pairwise / Orthogonal Array Testing","formula":"최소 테스트 케이스 수 ≥ (값 개수가 가장 많은 두 인자의 값 개수의 곱)\n= max(vᵢ × vⱼ)  (vᵢ = i번째 인자의 값 개수)\n커버 대상인 전체 쌍 수 = Σ(모든 인자 조합에 대한 vᵢ × vⱼ)","vars":"모든 인자의 전체 조합(v₁ × v₂ × … × vₙ)이 아니라, 두 인자씩의 모든 값 쌍(pair)만 최소 1회 포함하면 된다. 설계 순서: ① 값이 많은 두 인자의 모든 쌍을 나열해 기본 TC를 만든다 ② 전체 쌍 집합(AP)을 구한다 ③ 남은 인자 값으로 수평 확장하며 아직 커버 안 된 쌍을 가장 많이 덮는 값을 넣는다.","example":"전기밥솥: 인자 3개 — 모드{취사, 보온}, 설정{현미, 백미}, 전원{ON, OFF}. 각 2값.\n① 모드 × 설정의 모든 쌍 = (취사,현미), (취사,백미), (보온,현미), (보온,백미) → 4행\n② 전체 쌍(AP) = 모드·설정 4 + 모드·전원 4 + 설정·전원 4 = 12개\n③ 전원 값으로 수평 확장: (취사,현미,ON), (취사,백미,OFF), (보온,현미,OFF), (보온,백미,ON)\n검산: 이 4개 TC가 12개 쌍을 모두 커버한다(미커버 0). 하한도 2 × 2 = 4이므로 최소 테스트 케이스 = 4개.\n(전체 조합으로 하면 2 × 2 × 2 = 8개이므로 절반으로 줄었다)\n다른 사례: OS{Win7, Win8, Win10} × 권한{admin, user} × 브라우저{IE9, IE10, IE11} → 하한 = 3 × 3 = 9개, 실제 설계도 9행이 된다.","tip":"'인자 수'가 아니라 '값 개수가 많은 두 인자의 곱'이 최소 개수의 기준이다 — 인자가 4개, 5개로 늘어도 값이 2개씩이면 최소 TC는 여전히 4개 근처에 머문다."},{"group":"명세 기반 케이스 수","name":"Each Choice 조합","en":"Each Choice Coverage","formula":"최소 테스트 케이스 수 = max(v₁, v₂, …, vₙ)\n(vᵢ = i번째 인자의 (동등)분할된 값의 개수 → 가장 많은 값을 가진 인자의 값 개수)","vars":"각 인자의 각 값이 최소 1회만 등장하면 되므로, 값이 적은 인자는 값을 재사용해 채운다. 인자 간 조합(쌍)은 보장하지 않는다. 인자별 값 개수를 셀 때 제약 조건(배타 선택)을 먼저 반영해 분할해야 한다.","example":"UI에 3개 항목 리스트 메뉴(m1, m2, m3)와 라디오 버튼 r1, r2, r3. r1과 r2는 동시 선택 불가, 둘 중 하나는 반드시 선택.\n인자 분할: M = {m1, m2, m3}(3값), 라디오 그룹 = {r1만 선택, r2만 선택}(2값), r3 = {선택 안 됨, 선택}(2값).\n최소 TC = max(3, 2, 2) = 3개.\nTC1(M=m1, r1만, r3 선택 안 됨) / TC2(M=m2, r2만, r3 선택) / TC3(M=m3, r1만, r3 선택)\n검산: m1·m2·m3 각 1회, r1만·r2만 각 1회 이상, r3 선택/미선택 각 1회 이상 → 모든 값 커버.","tip":"같은 문제를 페어와이즈로 풀면 최소 3 × 2 = 6개가 되므로, 문제에서 'each choice'와 '페어와이즈'를 구분해 읽어야 답이 달라진다."},{"group":"테스트 메트릭","name":"결함 밀도","en":"Defect Density","formula":"결함 밀도 = 검출된 결함 수 ÷ 규모(KLOC 또는 FP, 모듈 수, 페이지 수 등)","vars":"규모 단위를 문제에서 준 것으로 통일해야 한다(KLOC = 1,000 라인). 모듈별 결함 밀도를 비교해 결함 집중 구역을 찾는 데 쓴다.","example":"40 KLOC 규모의 시스템에서 결함 120개가 검출된 경우. 120 ÷ 40 = 3.0 결함/KLOC.\n모듈 A(5 KLOC, 결함 30개)는 30 ÷ 5 = 6.0 결함/KLOC로 전체 평균 3.0의 2배 → 결함 집중 모듈이다.","tip":"특정 모듈에서 평균 이상의 결함이 나오면 '테스트가 충분하다'가 아니라 결함 집중(Defect Clustering) 원리에 따라 그 모듈에 테스트를 더 집중하고, 설계·구조 문제를 조사해 개선해야 한다."},{"group":"테스트 메트릭","name":"결함 제거 효율 (DRE)","en":"Defect Removal Efficiency","formula":"DRE(%) = (릴리스(인도) 전 검출된 결함 수 ÷ (릴리스 전 검출 결함 수 + 릴리스 후 검출 결함 수)) × 100\n= (전체 결함 − 운영 단계 검출 결함) ÷ 전체 결함 × 100","vars":"분모는 '전체 결함(개발 중 검출 + 운영 중 검출)'이다. 운영(고객) 단계에서 발견된 결함이 많을수록 DRE가 떨어진다. 100%면 고객이 발견한 결함이 0개라는 뜻.","example":"결함 발생/검출 단계 표에서 전체 도입 결함 = 요구사항분석 40 + 설계 70 + 구현 150 = 260개.\n운영 단계에서 검출된 결함 = 5 + 0 + 5 = 10개 → 릴리스 전 검출 = 260 − 10 = 250개.\nDRE = 250 ÷ 260 × 100 = 96.15%","tip":"DRE는 '전체 결함 중 출시 전에 잡은 비율'이고, 결함 구속 효율성은 '그 단계에서 만든 결함을 그 단계에서 잡은 비율'이다 — 분모가 다르다."},{"group":"테스트 메트릭","name":"결함 구속(억제) 효율성","en":"Defect Containment Efficiency","formula":"결함 구속 효율성(%) = (해당 단계에서 발생하고 그 단계에서 검출된 결함 수 ÷ 해당 단계에서 발생(도입)한 전체 결함 수) × 100","vars":"표에서 열 = 결함이 발생(도입)한 단계, 행 = 결함이 검출된 단계다. 분모는 해당 '열'의 합계, 분자는 그 열에서 '같은 단계 행'의 값. 행/열을 바꿔 읽으면 틀린다.","example":"결함 발생 단계(열) × 검출 단계(행) 표 — 설계 열: 설계 20, 구현/단위 20, 통합 20, 시스템 10, 인수 0, 운영 0, 합계 70.\n설계 단계의 결함 구속 효율성 = 20 ÷ 70 × 100 = 28.57 ≒ 28.6%\n(같은 표에서 요구사항분석 단계는 10 ÷ 40 × 100 = 25.0%, 구현 단계는 50 ÷ 150 × 100 = 33.3%)","tip":"'해당 단계에서 발생한 결함을 그 단계에서 검출하는 비율'이라는 정의문을 그대로 수식으로 옮기면 분모/분자를 헷갈리지 않는다."},{"group":"테스트 메트릭","name":"테스트 케이스 효율성","en":"Test Case Efficiency","formula":"테스트 케이스 효율성(%) = (검출된 전체 결함 수(중복 제외) ÷ 생성(설계)된 전체 테스트 케이스 수) × 100","vars":"분자는 '결함 수'이고 테스트 케이스 실패 건수가 아니다. 같은 결함을 여러 TC가 검출했다면 중복을 제외해 1개로 센다. '예상 결과와 동일한 결과가 나온 TC 수'는 계산에 쓰지 않는 함정 수치다.","example":"사례 1 — 개발된 TC 10개, 예상 결과와 동일한 결과가 나온 TC 4개, 디버깅으로 확인된 결함 1개.\n효율성 = 1 ÷ 10 × 100 = 10% (4는 계산에 쓰지 않는다)\n사례 2 — TC 7개 중 TC1·2·3·6이 결함 A, TC7이 결함 B, TC4·5는 통과. 중복 제외 결함 = A, B의 2개.\n효율성 = 2 ÷ 7 × 100 = 28.57 ≒ 29%","tip":"효율성이 낮다 = 하나의 결함을 검출하는 데 많은 테스트 케이스가 사용되었다는 뜻이다."},{"group":"테스트 메트릭","name":"테스트 케이스 실패율","en":"Test Case Failure Rate","formula":"테스트 케이스 실패율(%) = (실패한 테스트 케이스 수 ÷ 설계된 전체 테스트 케이스 수) × 100","vars":"분자는 '실패(Fail) 판정 TC 건수'로, 결함 중복을 제외하지 않는다 — 효율성과 달리 건수 기준이다.","example":"TC 7개 중 TC1, TC2, TC3, TC6, TC7이 실패, TC4·TC5는 통과.\n실패율 = 5 ÷ 7 × 100 = 71.4 ≒ 71%\n같은 데이터의 테스트 케이스 효율성은 2 ÷ 7 ≒ 29%로 값이 다르다.","tip":"실패율이 높으면 결함 검출 가능성이 높은 효과적인 테스트이며, 낮으면 통과만 하는 TC가 많다는 뜻이다 — 실패율과 효율성 수치를 한 문제에서 같이 묻는다."},{"group":"테스트 메트릭","name":"결함 나이","en":"Defect Age","formula":"결함 나이 = 결함 Closed 시점 − 결함 Open 시점","vars":"Open(결함 보고)부터 Closed(수정 확인 후 종료)까지의 기간만 계산한다. Assigned, Resolved, Verified 같은 중간 상태 날짜는 계산에 쓰지 않는 함정 수치다. 결함 생명 주기는 Open → Review → Assigned → Resolved → Verified → Closed 순이다.","example":"Open Date 1월 1일 / Assigned Date 1월 3일 / Resolved Date 1월 10일 / Verified Date 1월 15일 / Closed Date 1월 17일.\n결함 나이 = Open(1월 1일) ~ Closed(1월 17일) = 17일 (교재 정답)\n중간 날짜로 계산한 Assigned~Resolved 7일, Resolved~Verified 5일 등은 오답이다.","tip":"'결함 나이'는 Open~Closed 전체 구간 하나만 본다 — 표에 날짜가 5개 주어져도 첫 날짜와 마지막 날짜만 쓰면 된다."},{"group":"테스트 메트릭","name":"테스트 진척률","en":"Test Progress Rate","formula":"테스트 진척률(%) = (실행 완료된 테스트 케이스(절차) 수 ÷ 계획된 전체 테스트 케이스 수) × 100\n테스트 통과율(%) = (통과한 테스트 케이스 수 ÷ 실행된 테스트 케이스 수) × 100","vars":"진척률의 분모는 '계획된' 수, 통과율의 분모는 '실행된' 수다. 테스트 모니터링 및 제어 단계에서 계획 대비 진척도를 판단하는 메트릭이며, 차이가 있으면 계획된 테스트 활동을 조정한다.","example":"계획된 TC 200개 중 150개를 실행 완료 → 진척률 = 150 ÷ 200 × 100 = 75%.\n실행한 150개 중 135개 통과 → 통과율 = 135 ÷ 150 × 100 = 90% → '90%의 테스트 케이스가 통과되어야 한다'는 테스트 완료 기준을 충족.","tip":"테스트 완료 기준의 예시는 '95% 문장 커버리지 충족', '90% 테스트 케이스 통과', '2개 이하 결함만 허용'처럼 커버리지·통과율·잔존 결함 수 모두 사용된다."},{"group":"테스트 메트릭","name":"APFD (결함 검출 평균 백분율)","en":"Average Percentage of Faults Detected","formula":"APFD = 1 − ((TF₁ + TF₂ + … + TF_m) ÷ (n × m)) + 1 ÷ (2n)\n(n = 전체 테스트 케이스 수, m = 전체 결함 수, TF_i = i번째 결함을 처음 검출하는 테스트 케이스의 실행 순번)","vars":"테스트 케이스 수, 결함 수, 그리고 '실행 순서' 세 가지로 계산된다. 값이 클수록(1에 가까울수록) 적은 수의 테스트 케이스로 결함을 빨리 검출한 것 → 우선순위 배치가 좋은 것이다.","example":"TC 5개(n=5), 결함 4개(m=4). 각 결함을 처음 검출하는 TC 순번이 결함1=2번째, 결함2=3번째, 결함3=1번째, 결함4=5번째라면 TF 합 = 2+3+1+5 = 11.\nAPFD = 1 − (11 ÷ (5 × 4)) + (1 ÷ (2 × 5)) = 1 − 0.55 + 0.1 = 0.55 → 55%","tip":"리그레션(회귀) 테스트 케이스의 우선순위를 결정하는 데 쓰며, 'APFD가 낮으면 적은 TC로 빨리 결함을 검출한다'는 서술은 반대로 뒤집힌 오답이다."},{"group":"위험 관리","name":"위험도 (위험 노출도)","en":"Risk Exposure","formula":"위험도(Risk) = 발생 가능성(Probability) × 영향도(Impact)","vars":"Boehm의 위험 노출(Risk Exposure) 계산식. 발생 가능성은 확률(0~1) 또는 등급(1~5), 영향도는 손실 규모 또는 등급으로 준다. '복잡도 × 발생 가능성'이 아니라는 점이 O/X로 출제된다.","example":"발생 가능성 등급 4(높음), 영향도 등급 5(치명적)인 위험의 위험도 = 4 × 5 = 20.\n확률형으로 주면: 발생 가능성 0.3, 예상 손실 1,000만 원 → 위험 노출도 = 0.3 × 1,000 = 300만 원.\n위험도가 큰 항목부터 테스트 우선순위를 높인다.","tip":"'위험도는 장애 발생 가능성과 복잡도의 곱'은 X — 두 번째 인자는 반드시 영향도(impact)다."},{"group":"신뢰성 지표","name":"MTBF · MTTF · MTTR","en":"Mean Time Between Failures / To Failure / To Repair","formula":"MTTF = 총 정상 동작 시간 ÷ 고장 횟수 (평균 고장 전 시간)\nMTTR = 총 수리 시간 ÷ 고장 횟수 (평균 수리 시간)\nMTBF = MTTF + MTTR (평균 고장 간격)","vars":"MTTF는 '동작하다 고장 날 때까지'의 평균, MTTR은 '고장에서 복구까지'의 평균, MTBF는 한 고장에서 다음 고장까지의 전체 주기다. MTBF가 클수록, MTTR이 작을수록 신뢰성이 높다.","example":"1,000시간 운영 중 고장 10회, 총 수리 시간 100시간인 시스템.\nMTTF = (1,000 − 100) ÷ 10 = 90시간\nMTTR = 100 ÷ 10 = 10시간\nMTBF = 90 + 10 = 100시간","tip":"세 지표는 신뢰성(Reliability) 테스트 영역이며, 복구성(Recoverability)·가용성(Availability)도 신뢰성의 부특성이다 — 성능 효율성(시간 반응성·자원 활용성·수용성)과 섞이지 않게 구분하라."},{"group":"신뢰성 지표","name":"가용성","en":"Availability","formula":"가용성(%) = (MTTF ÷ (MTTF + MTTR)) × 100 = (MTTF ÷ MTBF) × 100\n(MTBF를 '정상 동작 시간'의 의미로 주는 문제에서는 가용성 = MTBF ÷ (MTBF + MTTR) × 100)","vars":"사용자가 원하는 시간에 사용·접근이 가능한 정도로, 신뢰성(Reliability)의 부특성이다(기능 적합성이 아니다). 문제에서 MTBF의 정의를 어떻게 주는지 먼저 확인해야 분모가 결정된다.","example":"MTTF = 90시간, MTTR = 10시간 → MTBF = 100시간.\n가용성 = 90 ÷ (90 + 10) × 100 = 90 ÷ 100 × 100 = 90%\n수리 시간을 1시간으로 줄이면 90 ÷ 91 × 100 = 98.9%로 올라간다.","tip":"가용성은 신뢰성의 부특성 — '사용자의 요구사항을 시스템이 얼마나 만족하는지'를 보는 기능 적합성(완전성·적절성·정확성)의 부특성으로 제시되면 오답이다."}];  // CSTS 수식·계산 정리

function buildBank(){
  const out = [];
  ISTQB_BANK.forEach(q => out.push({
    id: q.id, exam:"istqb", qtype:"mc",
    chapter: q.chapter, difficulty: q.difficulty,
    question: q.question, options: q.options,
    answer: q.answer, answerText: null,
    explanation: q.explanation, dupKey: null,
  }));
  CSTS_BANK.forEach(q => out.push({
    id: q.id, exam:"csts", qtype:q.qtype,
    chapter: q.chapter, part: q.part,
    question: q.question, options: q.options || [],
    answer: (q.answer === undefined ? null : q.answer),
    answerText: q.answerText || null,
    explanation: q.explanation, dupKey: q.dupKey || null,
  }));
  return out;
}
const BANK = buildBank();
const bankOf = exam => BANK.filter(q => q.exam === exam);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function byId(id){ return BANK.find(q => q.id === id); }
function isMulti(q){ return Array.isArray(q.answer); }
function answerSetEqual(sel, ans){
  const a = Array.isArray(ans) ? ans.slice().sort() : [ans];
  const b = sel.slice().sort();
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderQuestionText(text){
  return escapeHtml(text).replace(/```([\s\S]*?)```/g, (m,code)=>`<pre>${code.replace(/^\n+|\n+$/g,"")}</pre>`);
}
function fmtTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function pct(n,d){ return d===0?0:Math.round((n/d)*1000)/10; }

// 단답형 채점: 공백·문장부호·괄호 안 영문을 무시하고 비교한다.
function normalizeShort(s){
  return (s||"").toLowerCase()
    .replace(/[\s.,·()（）\[\]{}'"`~!?/\\-]/g, "")
    .replace(/입니다|이다|였다|합니다/g, "");
}
function shortIsCorrect(input, correct){
  const a = normalizeShort(input), b = normalizeShort(correct);
  if(!a) return false;
  if(a === b) return true;
  if(a.length >= 2 && (b.includes(a) || a.includes(b))) return true;
  // "4개" ↔ "4" 처럼 숫자만 일치하는 경우도 허용
  const na = a.replace(/[^0-9%]/g,""), nb = b.replace(/[^0-9%]/g,"");
  return !!na && na === nb;
}
function correctAnswerLabel(q){
  if(q.qtype === "short") return q.answerText;
  const arr = Array.isArray(q.answer) ? q.answer : [q.answer];
  if(q.qtype === "ox") return arr.map(i => i===0 ? "O" : "X").join(", ");
  return arr.map(i => String.fromCharCode(65+i) + ". " + (q.options[i]||"")).join(" / ");
}
function scoreOf(q){
  const cfg = EXAMS[q.exam];
  return cfg.scoring === "weighted" ? (cfg.weights[q.qtype] || 1) : 1;
}
function recordHistory(q, correct, mode){
  history.push({qId:q.id, exam:q.exam, chapter:q.chapter, difficulty:q.difficulty,
                qtype:q.qtype, correct, mode, ts:Date.now()});
  if(!correct) wrongSet.add(q.id);
}
// 같은 문제(교재 중복 수록분)가 한 세션에 두 번 나오지 않게 거른다.
function dedupeByKey(list){
  const seen = new Set(), out = [];
  for(const q of list){
    const k = q.dupKey;
    if(k){ if(seen.has(k)) continue; seen.add(k); }
    out.push(q);
  }
  return out;
}

function quizHtml(isExam){
  const q = quiz.questions[quiz.index];
  const total = quiz.questions.length;
  const graded = quiz.submitted[q.id] !== undefined;
  const sel = quiz.selected[q.id] || [];
  const typed = quiz.typed[q.id] || "";

  const timerHtml = isExam
    ? `<div class="timer ${quiz.remainSec<=300?'warn':''}">⏳ 남은 시간 ${fmtTime(quiz.remainSec)}</div>` : "";

  let answerArea;
  if(q.qtype === "short"){
    answerArea = `
      <input class="short-input" id="short-input" type="text" autocomplete="off"
             value="${escapeHtml(typed)}" placeholder="정답을 입력하세요" ${(!isExam && graded)?'disabled':''}>
      <div class="short-hint">단답형입니다. 띄어쓰기·괄호 안 영문은 무시하고 채점하며, 채점 후 직접 정정할 수 있습니다.</div>`;
  } else {
    answerArea = `<div class="options">` + q.options.map((opt,i)=>{
      let cls = "option" + (q.qtype==="ox" ? " ox" : "");
      const isSel = sel.includes(i);
      if(isSel) cls += " selected";
      if(!isExam && graded){
        const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
        if(ansArr.includes(i)) cls += " correct";
        else if(isSel) cls += " wrong";
      }
      return `<div class="${cls}" data-opt="${i}">
        <span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></div>`;
    }).join("") + `</div>`;
  }

  let explanationHtml = "";
  if(!isExam && graded){
    const correct = quiz.submitted[q.id];
    explanationHtml = `
    <div class="explanation-box ${correct?'':'wrong-border'}">
      <span class="result-tag ${correct?'ok':'no'}">${correct?'정답입니다':'오답입니다'}</span>
      <div class="answer-line">정답: ${escapeHtml(correctAnswerLabel(q))}</div>
      ${q.explanation ? `<b>해설.</b> ${escapeHtml(q.explanation)}` : ""}
      ${(q.qtype==="short" && !correct) ? `<div class="btn-row"><button class="btn btn-sm" id="self-correct-btn">내 답도 정답으로 처리</button></div>` : ""}
    </div>`;
  }

  let buttons;
  if(isExam){
    buttons = `
      <button class="btn" id="prev-btn" ${quiz.index===0?'disabled':''}>이전</button>
      <button class="btn" id="next-btn" ${quiz.index===total-1?'disabled':''}>다음</button>
      <button class="btn btn-accent" id="submit-exam-btn" style="margin-left:auto;">시험 종료 및 채점</button>`;
  } else if(!graded){
    const disabled = (q.qtype==="short") ? "" : (sel.length===0?'disabled':'');
    buttons = `<button class="btn btn-primary" id="submit-answer-btn" ${disabled}>정답 확인</button>`;
  } else {
    buttons = `<button class="btn btn-primary" id="next-question-btn">${quiz.index===total-1?'결과 보기':'다음 문제'}</button>`;
  }

  const palette = isExam ? `
    <div class="chip-row" style="margin:14px 0 4px;">
      ${quiz.questions.map((qq,i)=>{
        const done = (quiz.selected[qq.id]||[]).length>0 || (quiz.typed[qq.id]||"").trim().length>0;
        return `<span class="chip ${i===quiz.index?'active':''}" data-goto="${i}"
          style="min-width:34px;text-align:center;${done?'border-color:var(--ok);color:var(--ok);':''}">${i+1}</span>`;
      }).join("")}
    </div>` : "";

  return `
  <div class="link-back" data-action="${isExam?'confirm-exit-exam':'go-home'}">&larr; ${isExam?'모의고사 종료하고 홈으로':'홈으로'}</div>
  <div class="card">
    <div class="quiz-meta">
      <div class="left">${metaBadges(q)}<span>${quiz.index+1} / ${total}</span></div>
      ${timerHtml}
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${Math.round((quiz.index/total)*100)}%"></div></div>
    ${palette}
    <div class="question-text">${renderQuestionText(q.question)}${isMulti(q)?'<div style="font-size:13px;color:var(--text-dim);font-weight:400;margin-top:6px;">※ 복수 정답 문제입니다. 해당하는 보기를 모두 선택하세요.</div>':''}</div>
    ${answerArea}
    ${explanationHtml}
    <div class="btn-row">${buttons}</div>

}

/* ===================== 결과 ===================== */
function resultHtml(session, title, isExamMode, showRemoveOption){
  const qs = session.questions;
  const total = qs.length;
  const correctCount = qs.filter(q => session.submitted[q.id] === true).length;
  const cfg = EXAMS[session.exam];
  const weighted = isExamMode && cfg.scoring === "weighted";

  let heroNum, heroLabel, passed = null;
  if(weighted){
    const gained = qs.filter(q=>session.submitted[q.id]===true).reduce((s,q)=>s+scoreOf(q),0);
    const max = qs.reduce((s,q)=>s+scoreOf(q),0);
    const score = Math.round(gained*10)/10;
    passed = score >= cfg.passScore;
    heroNum = `${score}점`;
    heroLabel = `${max}점 만점 · ${correctCount}/${total}문항 정답 · 합격선 ${cfg.passScore}점`;
  } else {
    const p = pct(correctCount,total);
    if(isExamMode) passed = p >= cfg.passRatio*100;
    heroNum = `${correctCount} / ${total}`;
    heroLabel = `정답률 ${p}%` + (isExamMode ? ` · 합격선 ${cfg.passLabel}` : "");
  }

  // 범위별 정답률
  const groups = {};
  qs.forEach(q=>{
    const key = q.exam==="istqb" ? CHAPTER_NAMES[q.chapter] : (PART_LABEL[q.part]+" / "+QTYPE_LABEL[q.qtype]);
    groups[key] = groups[key] || {c:0,t:0};
    groups[key].t++;
    if(session.submitted[q.id]) groups[key].c++;
  });

  const wrongList = qs.filter(q => session.submitted[q.id] !== true);
  const rightList = qs.filter(q => session.submitted[q.id] === true);

  let removeSection = "";
  if(showRemoveOption && rightList.length>0){
    removeSection = `
    <h3 style="margin-top:26px;">이번에 맞힌 문제를 오답노트에서 제거할까요?</h3>
    <div class="card" style="padding:14px 16px;">
      ${rightList.map(q=>`<div class="checkbox-row">
        <input type="checkbox" class="nb-remove-cb" data-qid="${q.id}" checked>
        <span>${escapeHtml(q.question.slice(0,42))}${q.question.length>42?'...':''}</span></div>`).join("")}
      <div class="btn-row"><button class="btn btn-primary" id="apply-remove-btn">선택한 문제 오답노트에서 제거</button></div>
    </div>`;
  }

  return `
  <div class="card">
    <h2 class="screen-title">${title}</h2>
    <div class="score-hero">
      <div class="score-num ${passed===false?'fail':''}">${heroNum}</div>
      <div class="score-label">${heroLabel}</div>
      ${passed===null?"":`<div class="pass-pill ${passed?'pass':'fail'}">${passed?'합격 (PASS)':'불합격 (FAIL)'}</div>`}
    </div>
    <table class="stat-table">
      <thead><tr><th>범위</th><th>정답</th><th></th></tr></thead>
      <tbody>
      ${Object.keys(groups).sort().map(k=>{
        const s=groups[k], p=pct(s.c,s.t);
        return `<tr><td>${k}</td><td>${s.c}/${s.t}</td>
          <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>${p}%</td></tr>`;
      }).join("")}
      </tbody>
    </table>
    ${isExamMode ? `
      <h3 style="margin-top:26px;">문항별 정오표</h3>
      <div class="chip-row" style="margin-top:6px;">
        ${qs.map((q,i)=>{const ok=session.submitted[q.id]===true;
          return `<span class="chip" style="min-width:34px;text-align:center;border-color:${ok?'var(--ok)':'var(--accent)'};color:${ok?'var(--ok)':'var(--accent)'};">${i+1}</span>`;}).join("")}
      </div>` : ""}
    ${removeSection}
    <h3 style="margin-top:26px;">${isExamMode?"틀리거나 미응답한 문제":"틀린 문제"} (${wrongList.length})</h3>
    ${wrongList.length===0 ? '<p style="color:var(--text-dim);">틀린 문제가 없습니다. 완벽합니다!</p>'
      : wrongList.map(q=>reviewItemHtml(q, session)).join("")}
    <div class="btn-row">
      <button class="btn btn-primary" data-action="go-home">홈으로</button>
      <button class="btn" data-action="go-notebook">오답노트 보기</button>
    </div>
  </div>`;
}
function reviewItemHtml(q, session){
  const sel = session.selected[q.id] || [];
  const typed = (session.typed[q.id]||"").trim();
  const myAnswer = q.qtype === "short"
    ? (typed || "(미응답)")
    : (sel.length ? sel.map(i=>String.fromCharCode(65+i)).join(", ") : "(미응답)");
  return `
  <div class="review-item">
    <div class="badges">${metaBadges(q)}</div>
    <div class="rq">${renderQuestionText(q.question)}</div>
    <div class="ra wrong-line">내 답: ${escapeHtml(myAnswer)}</div>
    <div class="ra correct-line">정답: ${escapeHtml(correctAnswerLabel(q))}</div>
    ${q.explanation ? `<details class="review-details"><summary>해설 보기</summary>
      <div class="ra" style="margin-top:6px;">${escapeHtml(q.explanation)}</div></details>` : ""}
  </div>`;
}

function statsHtml(){
  const rows = history.filter(h => h.exam === exam);
  if(rows.length === 0){
    return `<div class="link-back" data-action="go-home">&larr; 홈으로</div>
    <div class="card"><h2 class="screen-title">통계</h2>
      <div class="empty-state"><div class="icon">📊</div>
        ${EXAMS[exam].name} 풀이 기록이 아직 없습니다.<br>퀴즈를 풀면 여기에 통계가 표시됩니다.</div></div>`;
  }
  const total = rows.length, correct = rows.filter(h=>h.correct).length;
  const g1 = {}, g2 = {};
  rows.forEach(h=>{
    const k1 = exam==="istqb" ? CHAPTER_NAMES[h.chapter] : (byId(h.qId) ? PART_LABEL[byId(h.qId).part] : "기타");
    const k2 = exam==="istqb" ? DIFF_LABEL[h.difficulty] : QTYPE_LABEL[h.qtype];
    g1[k1] = g1[k1] || {c:0,t:0}; g1[k1].t++; if(h.correct) g1[k1].c++;
    g2[k2] = g2[k2] || {c:0,t:0}; g2[k2].t++; if(h.correct) g2[k2].c++;
  });
  const tbl = g => Object.keys(g).sort().map(k=>{
    const s=g[k], p=pct(s.c,s.t);
    return `<tr><td>${k}</td><td>${s.c}/${s.t}</td>
      <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>${p}%</td></tr>`;
  }).join("");
  const wrongForExam = Array.from(wrongSet).map(byId).filter(q=>q && q.exam===exam).length;

  return `
  <div class="link-back" data-action="go-home">&larr; 홈으로</div>
  <div class="card">
    <h2 class="screen-title">${EXAMS[exam].name} 통계</h2>
    <div class="score-hero">
      <div class="score-num">${correct} / ${total}</div>
      <div class="score-label">누적 정답률 ${pct(correct,total)}% · 오답노트 ${wrongForExam}문항 보관 중</div>
    </div>
    <h3>${exam==="istqb"?"챕터별":"범위별"} 정답률</h3>
    <table class="stat-table"><thead><tr><th>구분</th><th>정답</th><th></th></tr></thead><tbody>${tbl(g1)}</tbody></table>
    <h3 style="margin-top:24px;">${exam==="istqb"?"난이도별":"유형별"} 정답률</h3>
    <table class="stat-table"><thead><tr><th>구분</th><th>정답</th><th></th></tr></thead><tbody>${tbl(g2)}</tbody></table>
  </div>`;
}

function matchQuery(hay){

/* ===================== 이벤트 ===================== */
function attachEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach(el=>
    el.addEventListener("click", ()=>handleAction(el.getAttribute("data-action"))));

  app.querySelectorAll("[data-exam]").forEach(el=>
    el.addEventListener("click", ()=>{ exam = el.getAttribute("data-exam"); screen="home"; render(); }));

  app.querySelectorAll("[data-chip]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const kind = el.getAttribute("data-chip"), raw = el.getAttribute("data-val");
      const s = setup[exam];
      const target = {chapter:s.chapters, diff:s.diffs, part:s.parts, qtype:s.types}[kind];
      const val = kind==="chapter" ? parseInt(raw) : raw;
      if(target.has(val)){ if(target.size>1) target.delete(val); }
      else target.add(val);
      render();
    });
  });

  const cs = document.getElementById("count-select");
  if(cs) cs.addEventListener("change", e => { setup[exam].count = parseInt(e.target.value); });

  const startBtn = document.getElementById("start-basic-btn");
  if(startBtn) startBtn.addEventListener("click", startBasicQuiz);

  app.querySelectorAll("[data-opt]").forEach(el=>
    el.addEventListener("click", ()=>selectOption(parseInt(el.getAttribute("data-opt")))));

  const shortInput = document.getElementById("short-input");
  if(shortInput){
    shortInput.addEventListener("input", e=>{ quiz.typed[quiz.questions[quiz.index].id] = e.target.value; });
    shortInput.addEventListener("keydown", e=>{
      if(e.key === "Enter"){
        e.preventDefault();
        if(screen === "exam"){ if(quiz.index < quiz.questions.length-1){ quiz.index++; render(); } }
        else if(quiz.submitted[quiz.questions[quiz.index].id] === undefined) submitAnswer();
        else nextQuestion();
      }
    });
    if(quiz && quiz.submitted[quiz.questions[quiz.index].id] === undefined) shortInput.focus();
  }

  const ids = {
    "submit-answer-btn": submitAnswer,
    "next-question-btn": nextQuestion,
    "prev-btn": ()=>{ quiz.index--; render(); },
    "next-btn": ()=>{ quiz.index++; render(); },
    "submit-exam-btn": ()=>finishExam(false),
    "retry-notebook-btn": startNotebookRetry,
    "self-correct-btn": selfCorrect,
  };
  Object.keys(ids).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("click", ids[id]);
  });

  app.querySelectorAll("[data-goto]").forEach(el=>
    el.addEventListener("click", ()=>{ saveTyped(); quiz.index = parseInt(el.getAttribute("data-goto")); render(); }));

  app.querySelectorAll("[data-remove-id]").forEach(el=>
    el.addEventListener("click", ()=>{ wrongSet.delete(el.getAttribute("data-remove-id")); render(); }));

  // 공부 모드
  app.querySelectorAll("[data-stab]").forEach(el=>
    el.addEventListener("click", ()=>{
      study.tab = el.getAttribute("data-stab");
      study.query = ""; study.limit = PAGE; study.chapter = "all"; study.group = "all";
      render();
    }));
  app.querySelectorAll("[data-schapter]").forEach(el=>
    el.addEventListener("click", ()=>{ study.chapter = el.getAttribute("data-schapter"); study.limit = PAGE; render(); }));
  app.querySelectorAll("[data-sgroup]").forEach(el=>
    el.addEventListener("click", ()=>{ study.group = el.getAttribute("data-sgroup"); render(); }));
  const moreBtn = document.getElementById("more-btn");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ study.limit += PAGE; render(); });
  const toggleAns = document.getElementById("toggle-answer-btn");
  if(toggleAns) toggleAns.addEventListener("click", ()=>{ study.hideAnswer = !study.hideAnswer; render(); });
  const searchEl = document.getElementById("study-search");
  if(searchEl){
    // 검색창은 매 입력마다 전체 렌더하면 포커스를 잃으므로 debounce 후 커서를 복원한다.
    searchEl.addEventListener("input", e=>{
      study.query = e.target.value; study.limit = PAGE;
      clearTimeout(window.__searchTimer);
      window.__searchTimer = setTimeout(()=>{
        render();
        const el = document.getElementById("study-search");
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }, 260);
    });
  }
  // 정답 가리기 상태에서 개별 항목을 클릭하면 그 항목만 드러낸다.
  app.querySelectorAll(".hidden-answer").forEach(el=>
    el.addEventListener("click", ()=>el.classList.remove("hidden-answer")));

  const applyBtn = document.getElementById("apply-remove-btn");
  if(applyBtn) applyBtn.addEventListener("click", ()=>{
    app.querySelectorAll(".nb-remove-cb:checked").forEach(cb => wrongSet.delete(cb.getAttribute("data-qid")));
    screen = "home"; render();
  });
}
function handleAction(a){
  if(a==="go-home"){ stopExamTimer(); screen="home"; render(); }
  else if(a==="go-basic-setup"){ screen="basic-setup"; render(); }
  else if(a==="go-notebook"){ screen="notebook"; render(); }
  else if(a==="go-stats"){ screen="stats"; render(); }
  else if(a==="go-study"){
    screen="study"; study.query=""; study.limit=PAGE; study.chapter="all"; study.group="all";
    render();
  }
  else if(a==="go-exam"){ startExam(); }
  else if(a==="confirm-exit-exam"){
    if(window.confirm("모의고사를 종료하고 홈으로 돌아갈까요? 진행 상황은 저장되지 않습니다.")){
      stopExamTimer(); screen="home"; render();
    }
  }
}

/* ===================== 퀴즈 로직 ===================== */
function newSession(questions, mode){
  return { exam, questions, index:0, selected:{}, typed:{}, submitted:{}, mode };
}
function startBasicQuiz(){
  const pool = filteredPool();
  const n = Math.min(setup[exam].count, pool.length);
  quiz = newSession(shuffle(pool).slice(0,n), "basic");
  screen = "basic-quiz"; render();
}
function saveTyped(){
  const el = document.getElementById("short-input");
  if(el && quiz) quiz.typed[quiz.questions[quiz.index].id] = el.value;
}
function selectOption(i){
  if(!quiz) return;
  const q = quiz.questions[quiz.index];
  const isExam = screen === "exam";
  if(!isExam && quiz.submitted[q.id] !== undefined) return;
  let sel = quiz.selected[q.id] || [];
  if(isMulti(q)) sel = sel.includes(i) ? sel.filter(x=>x!==i) : sel.concat([i]);
  else sel = [i];
  quiz.selected[q.id] = sel;
  render();
}
function gradeQuestion(session, q){
  if(q.qtype === "short") return shortIsCorrect(session.typed[q.id]||"", q.answerText);
  const sel = session.selected[q.id] || [];
  return sel.length > 0 && answerSetEqual(sel, q.answer);
}
function submitAnswer(){
  saveTyped();
  const q = quiz.questions[quiz.index];
  const correct = gradeQuestion(quiz, q);
  quiz.submitted[q.id] = correct;
  recordHistory(q, correct, quiz.mode);
  render();
}
// 단답형은 표기 차이로 오답 처리될 수 있어 사용자가 직접 정답으로 정정할 수 있게 한다.
function selfCorrect(){
  const q = quiz.questions[quiz.index];
  quiz.submitted[q.id] = true;
  for(let i=history.length-1;i>=0;i--){
    if(history[i].qId === q.id){ history[i].correct = true; break; }
  }
  wrongSet.delete(q.id);
  render();
}
function nextQuestion(){
  if(quiz.index < quiz.questions.length-1){ quiz.index++; render(); return; }
  if(quiz.mode === "notebook"){ retrySession = quiz; screen = "notebook-result"; }
  else screen = "basic-result";
  render();
}

/* ===================== 모의고사 ===================== */
function pickExamQuestions(){
  const cfg = EXAMS[exam];
  const pool = dedupeByKey(bankOf(exam));
  if(!cfg.examMix) return shuffle(pool).slice(0, Math.min(cfg.examCount, pool.length));
  // CSTS: 실제 시험 구성(4지선다 50 / O·X 10 / 단답 10)대로 뽑는다.
  let picked = [];
  Object.keys(cfg.examMix).forEach(t=>{
    const sub = shuffle(pool.filter(q=>q.qtype===t));
    picked = picked.concat(sub.slice(0, Math.min(cfg.examMix[t], sub.length)));
  });
  // 유형 순서(객관식 → O/X → 단답)는 실제 시험지와 같게 유지한다.
  const order = {mc:0, ox:1, short:2};
  return picked.sort((a,b)=>order[a.qtype]-order[b.qtype]);
}
function startExam(){
  quiz = newSession(pickExamQuestions(), "exam");
  quiz.remainSec = EXAMS[exam].examMinutes * 60;
  screen = "exam"; render();
  startExamTimer();
}
function startExamTimer(){
  stopExamTimer();
  examTimerHandle = setInterval(()=>{
    if(!quiz || quiz.mode !== "exam"){ stopExamTimer(); return; }
    quiz.remainSec--;
    if(quiz.remainSec <= 0){ quiz.remainSec = 0; finishExam(true); return; }
    // 타이머만 갱신해 입력 중인 단답형 포커스를 잃지 않게 한다.
    const t = document.querySelector(".timer");
    if(t){
      t.textContent = `⏳ 남은 시간 ${fmtTime(quiz.remainSec)}`;
      t.classList.toggle("warn", quiz.remainSec <= 300);
    } else render();
  }, 1000);
}
function stopExamTimer(){
  if(examTimerHandle){ clearInterval(examTimerHandle); examTimerHandle = null; }
}
function finishExam(){
  saveTyped();
  stopExamTimer();
  quiz.questions.forEach(q=>{
    if(quiz.submitted[q.id] === undefined){
      const correct = gradeQuestion(quiz, q);
      quiz.submitted[q.id] = correct;
      recordHistory(q, correct, "exam");
    }
  });
  screen = "exam-result"; render();
}

/* ===================== 오답노트 다시 풀기 ===================== */
function startNotebookRetry(){
  const items = Array.from(wrongSet).map(byId).filter(q => q && q.exam === exam);
  if(items.length === 0) return;
  quiz = newSession(shuffle(items), "notebook");
  screen = "basic-quiz"; render();
}

render();
</script>
